# =====================================================================
# CHRDK_Lottery — еженедельная лотерея за алмазы
# Игроки покупают билеты за обычные алмазы (DIAMOND из инвентаря),
# раз в неделю случайно выбирается победитель: он получает payout-percent
# банка алмазами, остальное сгорает (антиинфляционный сток экономики).
# =====================================================================

general:
  # Устаревший ключ совместимости: требовать активный ранг для покупки билетов.
  # С 1.4.167 вместо него работает min-rank.
  require-pass: false
  # Со ступени донатного ранга (1.4.167); 0 — лотерея доступна всем.
  min-rank: 0

tickets:
  # Цена одного билета в алмазах
  cost-diamonds: 2
  # Максимум билетов на игрока в одном розыгрыше (0 = без лимита)
  max-per-player: 64
  # Максимум билетов за одну команду /lottery buy <n>
  max-per-purchase: 32

draw:
  # День розыгрыша: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
  day-of-week: SUNDAY
  # Время розыгрыша (HH:mm, 24 часа)
  time: "20:00"
  # Таймзона розыгрыша
  timezone: "Europe/Moscow"
  # За сколько минут до розыгрыша напоминать всему серверу
  announce-minutes: [30, 5, 1]
  # Если сервер был выключен в момент розыгрыша — провести его при запуске (с паузой ~30 сек).
  # false = пропущенный слот пропускается, оплаченные билеты и банк сохраняются.
  catch-up-on-start: true

pot:
  # Процент банка, который забирает победитель; остальное сгорает (1..100)
  payout-percent: 80
