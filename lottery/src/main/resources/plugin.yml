name: CHRDK_Lottery
version: '${version}'
main: ru.cherdakmd.chrdklottery.LotteryPlugin
api-version: '26.3'
depend:
  - CHRDK_Core
description: Еженедельная лотерея за алмазы с объявлениями и сгоранием комиссии (аддон CHRDK_Core)
commands:
  lottery:
    aliases: [lot, loto]
    description: Лотерея недели — билеты, банк, результаты
    usage: /<command> [buy [n]|info|top|last|claim]
  lotteryadmin:
    aliases: [lotadmin]
    description: Администрирование лотереи
    usage: /<command> [reload|drawnow confirm|recover]
    permission: chrdklottery.admin
permissions:
  chrdklottery.use:
    description: Использование /lottery (покупка билетов, информация)
    default: true
  chrdklottery.admin:
    description: Управление /lotteryadmin
    default: op
