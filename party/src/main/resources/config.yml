# CHRDK_Party — группы игроков (1.4.158).
#
# Группа — это не клан и не приваты: до восьми человек, которые видят друг
# друга в списке, пишут в отдельный чат и получают небольшой бонус за игру
# рядом. Группы живут в parties.json и переживают перезапуск; приглашения —
# только в памяти, потому что у них есть срок.
#
# Бонус — это «мягкое» преимущество с жёстким потолком: он не даёт ни урона,
# ни брони, ни лишних алмазов. Потолок считается честно: сколько бы человек
# ни стояло рядом, процент не превысит bonus.max-percent.

general:
  # Главный выключатель: false — команды отвечают «выключено», группы не рвутся.
  enabled: true
  locale: ru

limits:
  # Сколько человек в группе (2..16). Пригласить сверх лимита нельзя.
  max-size: 8
  # Сколько секунд живёт приглашение (10..600). По истечении его нужно слать заново.
  invite-expire-seconds: 60
  # Сколько приглашений одна группа может держать одновременно (1..20).
  # Защита от спама приглашениями всему серверу.
  invite-max-pending: 5

bonus:
  # Бонус опыта за игру рядом. Выключается отдельно от групп.
  enabled: true
  # На каком расстоянии считается «рядом» (4..64 блока).
  radius: 24
  # Сколько процентов опыта добавляет каждый участник рядом (0..50).
  # Считаются только члены группы, а не случайные прохожие.
  per-member-percent: 5
  # Потолок бонуса (0..100). 15 — это семь участников рядом и дальше в потолок.
  max-percent: 15

protection:
  # Могут ли участники группы бить друг друга. По умолчанию нельзя:
  # случайный удар по своему — самая частая причина ссор в группах.
  friendly-fire: false
