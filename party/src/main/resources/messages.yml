# CHRDK_Party — тексты групп.
#
# Ключи без префикса: код обращается к ним как "party-full" и т.п.
# Разметка — MiniMessage, подстановки — %имя%.
party:
  # ------------------------------- служебные --------------------------------
  no-permission: "<red>Недостаточно прав.</red>"
  player-only: "<red>Эта команда только для игроков.</red>"
  disabled: "<red>Группы выключены в config.yml.</red>"
  unknown-subcommand: "<red>Неизвестная подкоманда «%sub%». Смотрите <yellow>/party help</yellow>.</red>"
  invalid-name: "<red>Ник «%name%» не похож на настоящий.</red>"

  # --------------------------------- справка --------------------------------
  help-header: "<gold>Группа</gold> <dark_gray>·</dark_gray> <gray>играть вместе выгоднее</gray>"
  help-create: "<yellow>/party create</yellow> <gray>— собрать группу</gray>"
  help-invite: "<yellow>/party invite <ник></yellow> <gray>— позвать игрока</gray>"
  help-accept: "<yellow>/party accept</yellow> <gray>— принять приглашение</gray>"
  help-leave: "<yellow>/party leave</yellow> <gray>— выйти из группы</gray>"
  help-kick: "<yellow>/party kick <ник></yellow> <gray>— исключить участника (лидер)</gray>"
  help-disband: "<yellow>/party disband</yellow> <gray>— распустить группу (лидер)</gray>"
  help-list: "<yellow>/party list</yellow> <gray>— состав и бонус</gray>"
  help-chat: "<yellow>/pc <текст></yellow> <gray>— чат только для группы</gray>"
  help-info: "<yellow>/party info [ник]</yellow> <gray>— группа другого игрока</gray>"
  help-footer: "<gray>Бонус опыта — до +%max%% за игру рядом. Своих не бьём: дружеский огонь выключен.</gray>"

  # -------------------------------- создание --------------------------------
  created: "<green>Группа создана.</green> <gray>Зовите игроков:</gray> <yellow>/party invite <ник></yellow>"
  already-in-party: "<red>Вы уже в группе. Сначала <yellow>/party leave</yellow>.</red>"
  not-in-party: "<red>Вы не в группе. Создайте: <yellow>/party create</yellow>.</red>"
  target-in-party: "<red>%player% уже в другой группе.</red>"

  # ------------------------------- приглашения ------------------------------
  invite-sent: "<green>Приглашение отправлено:</green> <white>%player%</white> <dark_gray>·</dark_gray> <gray>живёт %seconds% с</gray>"
  invite-received: "<gold>Вас зовут в группу</gold> <white>%player%</white><gray>.</gray> <yellow>/party accept</yellow> <gray>или</gray> <yellow>/party deny</yellow>"
  invite-broadcast: "<gray>%player% приглашён в группу.</gray>"
  invite-already-sent: "<red>%player% уже приглашён — приглашение ещё действует.</red>"
  invite-limit: "<red>Слишком много приглашений сразу (лимит %limit%). Дождитесь ответа.</red>"
  invite-self: "<red>Приглашать себя в группу не нужно.</red>"
  invite-target-in-party: "<red>%player% уже состоит в группе.</red>"
  party-full: "<red>В группе уже %max% человек — больше не влезет.</red>"
  invite-none: "<red>Действующих приглашений нет.</red>"
  invite-expired: "<red>Приглашение истекло. Попросите позвать заново.</red>"
  invite-denied-sender: "<gray>%player% отклонил приглашение.</gray>"
  invite-denied-target: "<gray>Приглашение отклонено.</gray>"
  invite-accepted-sender: "<green>%player% вступил в группу.</green> <gray>Состав: %size%/%max%</gray>"
  invite-accepted-target: "<green>Вы в группе.</green> <gray>Участников: %size%/%max%</gray>"

  # ---------------------------------- состав --------------------------------
  player-joined: "<green>%player% присоединился.</green> <gray>%size%/%max%</gray>"
  player-left: "<gray>%player% вышел из группы.</gray> <gray>%size%/%max%</gray>"
  you-left: "<gray>Вы вышли из группы.</gray>"
  party-disbanded: "<gray>Группа распущена.</gray>"
  you-disbanded: "<gray>Вы распустили группу.</gray>"
  leader-changed: "<gold>%player%</gold> <gray>теперь лидер группы.</gray>"
  kicked: "<gray>%player% исключён из группы.</gray>"
  you-kicked: "<red>Вас исключили из группы (%player%).</red>"
  not-leader: "<red>Это может только лидер группы.</red>"
  target-not-in-party: "<red>%player% не в вашей группе.</red>"
  target-not-found: "<red>Игрок «%player%» не найден.</red>"

  # ---------------------------------- список --------------------------------
  list-header: "<gold>Группа</gold> <gray>%size%/%max%</gray> <dark_gray>·</dark_gray> <gray>бонус опыта +%bonus%%</gray>"
  list-row: "<gray>%role%</gray> <white>%player%</white> <dark_red>%hp% ❤</dark_red>"
  list-row-offline: "<gray>%role%</gray> <dark_gray>%player% (не в сети)</dark_gray>"
  list-role-leader: "<gold>лидер</gold>"
  list-role-member: "<gray>участник</gray>"
  list-footer: "<dark_gray>Опыт рядом: +%percent%%. Дружеский огонь выключен.</dark_gray>"
  list-empty: "<gray>В группе пока только вы.</gray>"

  # ----------------------------------- чат ----------------------------------
  chat-format: "<dark_aqua>[Группа]</dark_aqua> <white>%player%</white><dark_gray>:</dark_gray> <gray>%message%</gray>"
  chat-usage: "<red>Напишите сообщение: <yellow>/pc привет</yellow></red>"

  # ---------------------------------- прочее --------------------------------
  bonus-xp: "<gray>Группа дала</gray> <green>+%percent%% опыта</green>"
  friendly-fire-blocked: "<gray>Свой — не цель. Дружеский огонь в группе выключен.</gray>"
  join-invites: "<gold>Вас ждут приглашения: %count%</gold><gray>.</gray> <yellow>/party accept</yellow>"
  profile-title: "Группа"
  profile-size: "<gray>Состав:</gray> <white>%size%/%max%</white> <dark_gray>·</dark_gray> <gray>бонус +%bonus%%</gray>"
  profile-leader: "<gray>Лидер:</gray> <white>%leader%</white>"
  profile-none: "<gray>Вы играете один. <yellow>/party create</yellow></gray>"

  # ------------------------------- админские --------------------------------
  admin-reloaded: "<green>Конфиг и тексты групп перечитаны.</green>"
  admin-info: "<gray>Групп:</gray> <white>%parties%</white> <dark_gray>·</dark_gray> <gray>участников:</gray> <white>%members%</white> <dark_gray>·</dark_gray> <gray>потолок:</gray> <white>%max%</white> <dark_gray>·</dark_gray> <gray>включено:</gray> <white>%enabled%</white>"
  admin-disbanded: "<gray>Группа игрока %player% распущена.</gray>"
  admin-usage: "<yellow>/partyadmin [reload|info|disband <ник>]</yellow>"
