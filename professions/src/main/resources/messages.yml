  work-complete: "<green>Готово: %item% ×%amount%. Опыт за применение приёма не начисляется.</green>"
  mastery.field-smith.name: "<gold>Полевой кузнец</gold>"
  mastery.field-smith.desc: "<gray>Ремонт предмета в основной руке: до 10% его максимальной прочности.</gray>"
  mastery.field-smith.cost: "<gray>Стоимость: 1 ремонтный материал предмета; не списывает уровни опыта.</gray>"
  mastery.restorer.name: "<gold>Реставратор</gold>"
