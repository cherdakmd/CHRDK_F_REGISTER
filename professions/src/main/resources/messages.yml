  mastery-chosen: "<green>Выбрана специализация: %specialization%. Меню приёма: /prof mastery.</green>"
  mastery-ready: "<green>Приём готов. Предмет — в основной руке, материалы — в рюкзаке.</green>"
  mastery-needed: "<yellow>Сначала выберите специализацию в /prof mastery.</yellow>"
  work-button: "<gold>Применить приём</gold>"
  work-survival: "<yellow>Приём доступен в выживании: закройте открытый контейнер и освободите курсор.</yellow>"
  work-invalid: "<yellow>Возьмите подходящий предмет в основную руку. Рецепты и затраты — в /prof mastery и вики.</yellow>"
  work-special: "<yellow>Особые, переименованные ресурсы и нестандартные зелья нельзя перерабатывать этим приёмом.</yellow>"
  work-materials: "<yellow>Не хватает обычных материалов для приёма. Проверьте затраты в /prof mastery.</yellow>"
