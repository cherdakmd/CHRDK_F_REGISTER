# CHRDK_Professions — профессии ремесленника (1.4.165).
#
# Профессия — не вторая прокачка и не класс: она не даёт ни урона, ни брони, ни
# монет. Она решает, за какую работу игрок получает опыт и какая тихая прибавка
# у него включена: скидка на наковальню, лишняя склянка, сытнее еда, второй
# блок при плавке. Сила по-прежнему только прокачивается.
#
# Таблицы опыта (что сколько даёт) и потолки прибавок живут в коде
# (ProfessionCatalog и ProfessionMath): это баланс, а не настройка темпа.
# Здесь настраиваются только темп, язык и выключатели.

general:
  # Полностью выключает профессии: команды и меню ответят «выключено», опыт
  # копиться не будет, прибавки снимутся. Файл прогресса при этом не стирается.
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Короткое сообщение над хотбаром при новом уровне профессии.
  actionbar: true
  # Подсказка при входе тем, кто ещё не выбрал ремесло.
  join-hint: true
  # 1.4.167: донатный ранг даёт множитель опыта и дополнительные уровни навыка
  # (ranks.bonuses в конфиге ядра). Профессии сами числа не задают — они приходят
  # из API ядра, а потолки контракта держит RankBonus.
  # Суточный потолок опыта одной профессии (0..100000; 0 — без потолка).
  # При 1200 и среднем крафте в 3 опыта это ~400 действий в день: хватает на
  # спокойную игру и не превращает профессию в бесконечную ферму.
  daily-xp-cap: 1200
  # Через сколько часов можно сменить профессию (0..720; 0 — в любой момент).
  # Опыт прежнего ремесла сохраняется: возвращение продолжает, а не начинает.
  choose-cooldown-hours: 24
  # Множитель опыта (0.1..5.0). 1.0 — как в таблице; 2.0 — вдвое быстрее.
  xp-multiplier: 1.0

perks:
  # Общий выключатель прибавок: опыт и уровни остаются, но скидки и шансы
  # молчат. Удобно, когда нужно проверить подозрительную добычу.
  enabled: true
  # Кузнец: скидка на работу в наковальне, 2 % за уровень (потолок 40 %).
  smith-anvil-discount: true
  # Алхимик: шанс получить лишнюю склянку при варке, 1 % за уровень (потолок 20 %).
  alchemist-extra-bottle: true
  # Повар: прибавка к насыщению, +1 с 10-го уровня и +2 с 20-го.
  cook-saturation: true
  # Камнерез: шанс получить второй блок при плавке, 1 % за уровень (потолок 15 %).
  mason-extra-block: true
