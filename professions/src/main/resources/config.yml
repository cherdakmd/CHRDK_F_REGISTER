# CHRDK_Professions — восемь ремёсел без выбора (1.4.282).
#
# Выбор профессии отменён. Все ремесла активны у каждого игрока с первого
# входа: опыт, тихие прибавки и заработок идут по всем восьми одновременно.
# Накопленный прогресс из старых файлов professions.json сохраняется.
#
# Таблицы опыта (крафт, плавка, варка, добыча, распил, рыбалка, наковальня)
# и потолки прибавок живут в коде (ProfessionCatalog и ProfessionMath): это
# баланс, а не настройка темпа. Здесь настраиваются темп, язык и выключатели.

general:
  # Полностью выключает ремесла: команды и меню ответят «выключено», опыт и
  # алмазы копиться не будут. Файл прогресса при этом не стирается.
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Короткое сообщение над хотбаром при новом уровне ремесла.
  actionbar: true
  # Подсказка при входе: все ремесла активны, за работу платят алмазы.
  join-hint: true
  # Строка «+N опыта» над хотбаром после каждого начисления.
  xp-feedback: true
  # Суточный потолок БАЗОВОГО опыта одного ремесла (0..100000; 0 — без потолка).
  # Бонус донатного ранга добавляется сверх потолка, поэтому ранг получает
  # больше опыта за день, а не просто быстрее упирается в тот же лимит.
  daily-xp-cap: 1200
  # Множитель опыта (0.1..5.0). 1.0 — как в таблице; 2.0 — вдвое быстрее.
  xp-multiplier: 1.0

# Заработок алмазов за профессиональные действия (1.4.282).
# 1 алмаз за каждые xp-per-diamond ФАКТИЧЕСКИ начисленного опыта. Опыт уже
# умножен на xpPercent донатного ранга (ranks.bonuses в конфиге ядра), поэтому
# тот же процент автоматически усиливает и выплату — второго умножения нет.
# Дробный остаток хранится в professions.json и не теряется между рестартами.
# Выплата идёт накопительным WAL ядра (creditEntitlement): повтор не удваивает.
income:
  enabled: true
  # При 100 и среднем действии в 3 опыта это ~1 алмаз за 30–35 действий.
  xp-per-diamond: 100
  # Верхняя граница алмазов в сутки на игрока (0..9999; 0 — без потолка).
  # 9999 — защита от ферм и ошибок, а не цель темпа: при дефолтах активная
  # игра даёт порядок десятков алмазов в день.
  daily-cap: 9999
  # false — считать доход из базового опыта без бонуса ранга.
  rank-bonus: true

perks:
  # Общий выключатель прибавок: опыт, уровни и заработок остаются, но скидки и
  # шансы молчат. Прибавки всех ремёсел работают одновременно.
  enabled: true
  # Кузнец: скидка на работу в наковальне, 2 % за уровень (потолок 40 %).
  smith-anvil-discount: true
  # Алхимик: шанс получить лишнюю склянку при варке, 1 % за уровень (потолок 20 %).
  alchemist-extra-bottle: true
  # Повар: прибавка к насыщению, +1 с 5-го уровня, +2 с 15-го и +3 с 30-го.
  cook-saturation: true
  # Камнерез: шанс получить лишний блок при плавке и распиле на камнерезе.
  mason-extra-block: true

# 1.4.200: специализация открывается с 5-го уровня без покупок. Выбор самого
# ремесла отменён, а выбор ветки внутри ремесла и её таймеры сохранены.
mastery:
  enabled: true
