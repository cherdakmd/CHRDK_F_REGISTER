# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_DailyRewards — ежедневные награды со стриком (аддон CHRDK_F_REGISTER)
# Сутки считаются по UTC. Стрик растёт ежедневно, пропуск дня — сброс в 1.
# Календарь — месячный (31 день): день 32 стрика = день 1, но стрик растёт дальше.
# Недели щедреют друг друга; юбилейные дни (7/14/21/28/30/31) — заметно жирнее,
# а для VIP с проходкой ещё и дни проходки через API ядра.
# Формат предметов: "MATERIAL количество"; vip-вариант — только при активной
# проходке (ядро ≥ 1.4.6), vip-pass-days — дни проходки.
# ═══════════════════════════════════════════════════════════════════════════

rewards:
