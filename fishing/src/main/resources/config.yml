# Вероятность замены обычной ванильной рыбы: 5000 = 50%.
custom-catch-permyriad: 5000
environment:
  # Ночь и дождь слегка повышают шанс отдельных видов.
  enabled: true
location:
  # По умолчанию место не влияет на улов.
  enabled: false
  # Ключ — vanilla ID биома, значения — ID рыб из каталога.
  biomes: {}
  # Прямоугольные зоны (границы включительно); зона имеет приоритет над биомом.
  # Пересекающиеся зоны выбираются по алфавиту имени.
  # zones:
  #   ladoga:
  #     world: world
  #     min-x: 0
  #     max-x: 100
  #     min-y: -64
  #     max-y: 320
  #     min-z: 0
  #     max-z: 100
  #     fish: [perch, pike, whitefish]
  zones: {}

# Включайте только после установки клиентского ресурс-пака CHRDK Fishing.
# Без него пользовательские модели будут отображаться как отсутствующие текстуры.
textures:
  enabled: false
  # Только виртуальные кнопки главного меню Fishing; отдельный выключатель.
  # Нужен актуальный Fishing-пак или общий пак с этими моделями.
  menu: false
  # Записи и кнопки альбома, независимо от моделей настоящего улова.
  # Нужен пак с моделями видов рыб и значками альбома.
  album-menu: false
  # Виртуальные кнопки покупки и выбора приманки; не изменяют сами предметы.
  bait-menus: false
  # Только новые купленные приманки, ранее выданные и снимки журнала не меняются.
  bait-items: false
  # Только новые блюда: старые предметы и снимки операций не меняются.
  dish-items: false
  # Только виртуальные значки в меню готовки; нужен актуальный Fishing-пак.
  cooking-menu: false
