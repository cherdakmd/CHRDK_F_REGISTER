plugins { id 'java' }

// Only dev and explicitly numbered RC builds are allowed until the release gates pass.
def fishingVersion = (findProperty('fishingVersion') ?: '0.0.0-dev').toString()
if (fishingVersion != '0.0.0-dev' && !(fishingVersion ==~ /\d+\.\d+\.\d+-rc\.[1-9]\d*/)) {
    throw new GradleException('Fishing only permits dev or numbered RC versions')
}
version = fishingVersion
base { archivesName = 'chrdk-fishing' }

// Compile the Skills service contract for development only; never shade a second copy into the plugin.
def skillsApiClasses = layout.buildDirectory.dir('skills-api-classes')
tasks.register('compileSkillsFishingApi', JavaCompile) {
    source files('../skills/src/main/java/ru/cherdakmd/chrdkskills/FishingCatchBonus.java', '../skills/src/main/java/ru/cherdakmd/chrdkskills/ChrdkSkillsApi.java', '../src/main/java/ru/cherdakmd/chrdkregister/api/VisualConfigMigration.java')
    classpath = configurations.compileClasspath
    destinationDirectory = skillsApiClasses
    options.encoding = 'UTF-8'
    options.release = 25
}
tasks.named('compileJava') { dependsOn tasks.named('compileSkillsFishingApi') }
tasks.named('compileTestJava') { dependsOn tasks.named('compileSkillsFishingApi') }

repositories {
    mavenCentral()
    maven { url = 'https://repo.purpurmc.org/snapshots' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly files(skillsApiClasses)
    testImplementation files(skillsApiClasses)
    compileOnly 'org.purpurmc.purpur:purpur-api:26.3.build.2647-experimental'
    testImplementation 'org.purpurmc.purpur:purpur-api:26.3.build.2647-experimental'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Keep the experimental descriptor out of root production module scans.
processResources {
    inputs.property 'version', fishingVersion
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml.in') { expand version: fishingVersion }
    rename 'plugin.yml.in', 'plugin.yml'
}
// Dev JAR includes the SQLite driver and its native binaries, but not a second SLF4J API.
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.runtimeClasspath.findAll { it.name.startsWith('sqlite-jdbc-') }.collect { zipTree(it) } }) {
        include 'org/sqlite/**'
        include 'META-INF/services/java.sql.Driver'
    }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Independent, opt-in client pack; no vanilla item definitions are overridden.
tasks.register('fishingResourcePack', Zip) {
    archiveFileName = 'chrdk-fishing-resource-pack.zip'
    destinationDirectory = layout.buildDirectory.dir('resource-packs')
    from('resource-pack')
}
tasks.named('build') { dependsOn tasks.named('fishingResourcePack') }
