name: CHRDK_Guilds
version: ${version}
main: ru.cherdakmd.chrdkguilds.GuildsPlugin
api-version: '26.3'
description: Гильдии с казной, рангами и войнами на ставку.
authors: [cherdakmd]
website: https://github.com/cherdakmd/CHRDK_F_REGISTER
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI, CHRDK_Claims]
commands:
  guild:
    description: Меню гильдии, состав, казна и войны.
    usage: /guild [menu|create|invite|deposit|war|info|top]
    aliases: [guilds, klan, gildiya]
    permission: chrdkguilds.use
  gchat:
    description: Написать в чат гильдии.
    usage: /gchat <текст>
    aliases: [gc]
    permission: chrdkguilds.use
  guildadmin:
    description: Управление гильдиями и войнами.
    usage: /guildadmin <reload|info|disband|endwar|cooldown|history>
    aliases: [guildsadmin, ga]
    permission: chrdkguilds.admin
permissions:
  chrdkguilds.use:
    description: Создавать гильдию, вступать, платить в казну и воевать.
    default: true
  chrdkguilds.admin:
    description: Перезагрузка, роспуск гильдий и завершение войн.
    default: op
