name: CHRDK_Guilds
version: ${version}
main: ru.cherdakmd.chrdkguilds.GuildsPlugin
api-version: '26.3'
description: Мирные и боевые кланы, казна, роли и войны на ставку.
authors: [cherdakmd]
website: https://github.com/cherdakmd/CHRDK_F_REGISTER
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI, CHRDK_Claims]
commands:
  guild:
    description: Меню гильдии, состав, казна и войны.
    usage: /guild [menu|gui|create|invite|deposit|war|info|top|mode <status|peaceful|battle|prepay>|dues [10+]|discipline [игрок]|style]
    aliases: [guilds, clan, clans, klan, klans, gildiya, gildii]
    permission: chrdkguilds.use
  gchat:
    description: Написать в чат гильдии.
    usage: /gchat <текст>
    aliases: [gc, clanchat, cc]
    permission: chrdkguilds.use
  guildadmin:
    description: Управление гильдиями и войнами.
    usage: /guildadmin <reload|info|disband|endwar|cooldown|history|finance|recover|discipline>
    aliases: [guildsadmin, clanadmin, clansadmin, ga]
    permission: chrdkguilds.admin
permissions:
  chrdkguilds.use:
    description: Создавать гильдию, вступать, платить в казну и воевать.
    default: true
  chrdkguilds.admin:
    description: Перезагрузка, роспуск гильдий и завершение войн.
    default: op
