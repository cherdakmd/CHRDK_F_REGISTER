guilds:
  style-help: "<gold>Оформление:</gold> <white>/clan style [name|emblem|frame|animation] [вариант]</white><gray> · off [тип] — снять своё · clear [тип] — убрать в клане (глава) · accept [ник] — принять предложение.</gray>"
  style-rules: "<gray>Личные лицензии на 30 дней: цвет названия, значок и рамка; в комплекте — бонусная анимация. Один свой клан, перенос не чаще раза в 24 часа. Участнику нужно согласие главы; действует только пока покупатель состоит в клане. Не меняет силу, состав, землю и мирный/боевой режим.</gray>"
  style-binding: "<gray>Личное оформление: <white>%clan%</white> · перенос в другой клан после <white>%move%</white>.</gray>"
  style-license-missing: "<red>У покупателя нет действующей личной лицензии на это оформление. Ранг её не заменяет.</red>"
  style-saved: "<green>Настройки оформления сохранены. Эффект действует только при активной личной лицензии и членстве покупателя.</green>"
  style-gui-boundary: "<gray>Личные лицензии · один свой клан · перенос раз в 24 ч.</gray>"
  style-gui-apply: "<yellow>Нажмите: применить / предложить главе (нужна лицензия).</yellow>"
  style-gui-transfer-warning: "<red>ВНИМАНИЕ: весь ваш выбор будет перенесён из прежнего клана.</red>"
  style-animation-inactive: "не активна — выберите бонусную анимацию; нужны лицензия и привязка к этому клану"
