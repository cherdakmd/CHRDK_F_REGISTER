# CHRDK_Guilds — гильдии, казна и войны (1.4.163).
#
# Гильдия — это не чат с тегом, а общая казна и общая война. Взносы идут
# сначала из /bal, обычными алмазами из storage — только недостача. Сдача и
# личные снятия идут в /bal; именные вещи и offhand не затрагиваются. Уровень
# покупается из общей казны и поднимает потолок состава. Войны — это ставки и время: обе стороны
# кладут равную ставку, победитель по очкам забирает обе.
#
# Силы в бою гильдия не даёт: ни урона, ни брони, ни множителей опыта. Иначе
# гильдия превратилась бы в способ купить преимущество, а экономика сервера
# держится на том, что преимущество покупается только косметикой.

# Военная выплата сверх потолка казны сохраняется как общее обязательство.
# guilds.json импортируется однократно; source и журнал нельзя откатывать отдельно от банка.
general:
  # Полностью выключает гильдии. Команды и меню останутся, но всё будет
  # отвечать «выключено».
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Короткие сообщения над хотбаром (очки войны).
  actionbar: true
  # Тег гильдии перед ником в чате (оформляется через API ядра).
  chat-prefix: true
  # Сколько алмазов стоит создание гильдии. 0 — бесплатно.
  creation-cost: 270
  # Сколько секунд живёт приглашение (30..3600).
  invite-seconds: 120
  # Потолок числа гильдий на сервере.
  max-guilds: 200
  # Длина названия и тега; тег приводится к заглавным буквам и цифрам.
  min-name: 3
  max-name: 16
  min-tag: 2
  max-tag: 5

# Войны. Ставка списывается из казны объявившего при объявлении и у второй
# стороны при согласии; победитель по очкам забирает обе ставки.
# Очки: 1 за убийство участника вражеской гильдии, 2 — если жертва погибла на
# приватах (wars.claimed-bonus). Пара «убийца — жертва» даёт очки не чаще
# kill-window-seconds, чтобы счёт нельзя было накрутить, убивая друг друга.
wars:
  enabled: true
  # Минимальная и максимальная ставка в алмазах.
  min-wager: 320
  max-wager: 10240
  # Сколько длится бой после согласия (300..86400 секунд).
  duration-seconds: 3600
  # Сколько времени даётся на ответ второй стороне (30..3600 секунд).
  accept-seconds: 300
  # Пауза после войны: и победитель, и проигравший отдыхают.
  cooldown-seconds: 3600
  # Окно защиты от накрутки очков одной парой игроков.
  kill-window-seconds: 300
  # Учитывать приваты: бой на занятой территории даёт вдвое больше очков.
  claimed-bonus: true
  # Сколько войн (включая ожидание ответа) может идти одновременно.
  max-active: 2

# Уровни гильдии. Цена берётся из казны, потолок состава растёт вместе с уровнем.
# Здесь только подсказка: настоящие числа — в коде (GuildMath), чтобы меню и
# проверка не могли разойтись.
levels:
  max: 5
  # 1 → 2: 640 алмазов, состав до 10
  # 2 → 3: 1920 алмазов, состав до 14
  # 3 → 4: 3840 алмазов, состав до 18
  # 4 → 5: 7680 алмазов, состав до 22
  # 5: состав до 26
