name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Purpur 1.21.11 / Java 21
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Messages contract check
        shell: bash
        run: python3 .github/scripts/check_messages.py

      - name: Build plugin
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: TEMP publish compiler errors to branch
        if: failure()
        shell: bash
        run: |
          grep -m 30 -B1 -A3 "error:" build.log > ci-errors.txt || true
          if [ -s ci-errors.txt ]; then
            git config user.name "arena-ci-bot"
            git config user.email "ci@arena.local"
            git add ci-errors.txt
            git commit -m "ci: snapshot compiler errors" || true
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" || true
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-f-register-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
