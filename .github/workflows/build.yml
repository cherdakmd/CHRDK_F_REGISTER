name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Приложить полный ZIP TradeMC к релизу с этим тегом (пусто — обычная сборка)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Purpur 26.3 / Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Messages contract check
        shell: bash
        run: python3 .github/scripts/check_messages.py

      - name: Test release archive validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_release.py' -v

      - name: Verify TradeMC kit and regression tests
        run: |
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --check
          python3 -m unittest discover -s tools/trademc -p 'test_*.py' -v

      - name: Build plugin
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-f-register-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Снапшот всей сборки: ядро и все аддоны одним архивом. Нужен, чтобы
      # промежуточную версию (например, 1.4.109-SNAPSHOT) можно было поставить
      # на тестовый сервер, не собирая репозиторий локально и не создавая релиз.
      - name: Upload all module JARs
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-plugins-${{ github.sha }}
          path: |
            build/libs/*.jar
            */build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # Ручная повторная загрузка полного комплекта, только к совпадающему тегу.
  shop-images:
    name: Attach complete TradeMC kit to the release
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify and pack the storefront
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          [[ "$TAG" == "v$version" ]] || { echo "Tag/version mismatch" >&2; exit 1; }
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --zip
          echo "kit=build/trademc/chrdk-trademc-${version}.zip" >> "$GITHUB_ENV"

      - name: Upload the storefront ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "${{ env.kit }}" --clobber
