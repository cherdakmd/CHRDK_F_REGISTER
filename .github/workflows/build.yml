name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Один канонический сайт из main. Не отменяем начатую публикацию.
concurrency:
  group: build-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Purpur 26.3 / Java 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check retired addon residues
        run: |
          python3 .github/scripts/check_retired_addons.py
          python3 -m unittest discover -s .github/scripts -p 'test_retired_addons.py' -v

      - name: Messages contract check
        shell: bash
        run: python3 .github/scripts/check_messages.py

      - name: Test release archive validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*release.py' -v

      - name: Verify TradeMC kit and regression tests
        run: |
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --check
          python3 -m unittest discover -s tools/trademc -p 'test_*.py' -v

      - name: Verify separate clan product kit
        run: |
          python3 -m pip install -r tools/clan_shop/requirements.txt
          python3 tools/clan_shop/build.py --check
          python3 tools/clan_shop/build_bundle.py --check
          python3 -m unittest discover -s tools/clan_shop -p 'test_*.py' -v

      - name: Build plugin
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build --continue 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-f-register-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Снапшот всей сборки: ядро и все аддоны одним архивом. Нужен, чтобы
      # промежуточную версию (например, 1.4.109-SNAPSHOT) можно было поставить
      # на тестовый сервер, не собирая репозиторий локально и не создавая релиз.
      - name: Upload all module JARs
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-plugins-${{ github.sha }}
          path: |
            build/libs/*.jar
            */build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.sha }}
          path: |
            build/test-results/test/*.xml
            */build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: ignore

  wiki:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/wiki/package-lock.json
      - name: Install documentation tools
        run: |
          python3 -m pip install -r tools/wiki/requirements.txt
          npm ci --prefix tools/wiki
          cd tools/wiki && npx playwright install --with-deps chromium
      - name: Check wiki freshness, data and links
        run: |
          python3 tools/wiki/build.py --check
          python3 -m unittest discover -s tools/wiki -p 'test_*.py' -v
          node --test tools/wiki/test_search.cjs
      - name: Test desktop, mobile and accessibility
        run: npm test --prefix tools/wiki
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, wiki]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source revision
        run: echo "Published wiki from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  social:
    name: Social automation (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and fonts
        run: |
          python3 -m pip install -r tools/social/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate sources and test without external publication
        run: |
          python3 tools/social/run.py --check
          python3 -m unittest discover -s tools/social -p 'test_*.py' -v
          version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          if [[ "$version" != *-rc.* ]]; then
            python3 tools/social/run.py --news-version "$version"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-${{ github.sha }}
          path: social-preview/
          retention-days: 14
