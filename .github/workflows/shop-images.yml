name: Shop images

# Прикладывает картинки витрины рангов к уже опубликованному релизу.
# Запуск вручную: Actions → Shop images → Run workflow.
# Из песочницы загрузка ассетов недоступна (uploads.github.com закрыт),
# поэтому файлы прикрепляет раннер GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Релиз, к которому приложить картинки (например, v1.4.169)
        required: true
        default: v1.4.169
      ref:
        description: Ветка или коммит, откуда брать картинки
        required: true
        default: main

permissions:
  contents: write

jobs:
  upload:
    name: Attach shop images to the release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the images
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Verify files and release exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for file in \
            docs/ranks/chrdk-shop-images.zip \
            docs/ranks/shop/00-vse-ranki.png \
            docs/ranks/shop/1-strannik.png \
            docs/ranks/shop/2-sledopyt.png \
            docs/ranks/shop/3-khranitel.png \
            docs/ranks/shop/4-metsenat.png \
            docs/ranks/shop/5-pokrovitel.png
          do
            if [[ ! -f "$file" ]]; then
              echo "Нет файла $file" >&2
              exit 1
            fi
          done
          ls -l docs/ranks/chrdk-shop-images.zip docs/ranks/shop/*.png
          gh release view "$TAG" --json tagName --jq '.tagName'

      - name: Upload images to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            docs/ranks/chrdk-shop-images.zip \
            docs/ranks/shop/00-vse-ranki.png \
            docs/ranks/shop/1-strannik.png \
            docs/ranks/shop/2-sledopyt.png \
            docs/ranks/shop/3-khranitel.png \
            docs/ranks/shop/4-metsenat.png \
            docs/ranks/shop/5-pokrovitel.png \
            --clobber

      - name: Show the resulting assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) байт"'
