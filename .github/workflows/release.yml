name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build plugins and attach the archive
    # Самостоятельные релизы датапаков не являются релизами плагинов.
    if: startsWith(github.event.release.tag_name, 'v1.')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag matches plugin version
        id: verify-version
        shell: bash
        run: |
          plugin_version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match plugin version $plugin_version" >&2
            exit 1
          fi
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Check messages and release validation tests
        run: |
          python3 .github/scripts/check_messages.py
          python3 -m unittest discover -s .github/scripts -p 'test_verify_release.py' -v

      - name: Verify TradeMC kit and regression tests
        run: |
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --check
          python3 -m unittest discover -s tools/trademc -p 'test_*.py' -v

      - name: Build plugins
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Pack all plugin JARs and the update memo into one ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-version.outputs.version }}"
          mkdir -p release
          find . -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp '{}' release/ \;
          count="$(find release -maxdepth 1 -name '*.jar' | wc -l)"
          echo "Собрано JAR: $count"
          find release -maxdepth 1 -name '*.jar' -printf '%f\n' | sort
          if [[ "$count" -lt 1 ]]; then
            echo 'Не найден ни один JAR — архив не собран.' >&2
            exit 1
          fi
          cat > 'release/ОБНОВЛЕНИЕ.txt' <<'MEMO'
          CHRDK — обновление плагинов
          ===========================

          Что в архиве
          ------------
          Все JAR-ы CHRDK одной версии: ядро CHRDK_Core и аддоны
          (DiamondShop, Referrals, DailyRewards, Teleports, Enchants, TierForge,
          Artifacts, Achievements, Skills, Treasures, CommonGoals, Claims, Ranks,
          Cosmetics, BattlePass, Queue, Streams, Lottery, Auction, Pets, Orders, Hunt, Party,
          Events, Quests, Bosses, Guilds, Classes, Professions).
          Отдельные JAR-ы к релизу больше не прикладываются — только этот архив.

          Порядок обновления
          ------------------
          1. Остановите сервер командой stop и дождитесь полной остановки.
          2. Сделайте резервную копию папки plugins/ (достаточно копии целиком)
             и мира. Это обязательный шаг: откат без копии невозможен.
          3. Удалите из plugins/ старые JAR-ы CHRDK (файлы *.jar этой сборки).
             Папки плагинов (plugins/CHRDK_*/) НЕ удаляйте: в них конфиги,
             сообщения, loot.yml, chances.yml и данные игроков.
          4. Распакуйте все JAR-ы из этого архива в plugins/ (без подпапок).
          5. Запустите сервер и дождитесь строки «CHRDK_... включён» в консоли.
          6. Проверьте /plugins: ядро и все аддоны должны быть зелёными (не red).
             Красный аддон = нет ядра нужной версии или он не загрузился.
          7. Проверьте консоль на предупреждения CHRDK: битый YAML или
             неизвестный ключ видны сразу.

          Мобы и книги (1.4.202)
          ------------------------
          Уровни природных мобов 1–30, редкая элита; спавнеры/питомцы/боссы исключены.
          Hunt: mob-progression.enabled/hud/elite-chance-percent, huntadmin reload.
          Enchants: sources.mobs.enabled/regular-chance-percent/elite-chance-percent.
          Стол работает с книгой; наковальня сохраняет ванильные чары и их цену.
          Каталог прежний: 60 чар. Новые эффекты — отдельная следующая волна.
          PDC книг и XP сохранены; все JAR обновлять вместе. Данные не удалять.

          Активные навыки (1.4.201)
          -------------------------
          /skills use <навык>, /skills energy и кнопка в карточке навыка.
          Шесть приёмов с 10-го уровня, общая выносливость 100, +2/сек онлайн.
          Цена и таймеры сохраняются в новом abilities.json рядом со skills.json.
          XP не обнуляется. Не удаляйте abilities.json: это не кэш.
          Ошибка чтения блокирует приёмы без перезаписи повреждённого файла.
          Для отключения: abilities.enabled: false и skillsadmin reload.
          Новые боевые эффекты только против враждебных мобов, не игроков.

          Профессии: мастерские (1.4.200)
          -------------------------------
          С 5-го уровня ремесла: /prof mastery, выбор с подтверждением.
          /prof work применяет приём к предмету в основной руке и списывает
          реальные материалы. Две специализации на ремесло, смена раз в 24 ч.
          Выбор и перезарядки хранятся в professions.json версии 2; старый опыт
          сохраняется. Перед обновлением обязательно сделайте копию данных.
          Ключ mastery.enabled отсутствует в старом конфиге — включено.
          При необходимости выключить: mastery.enabled: false и profadmin reload.
          Активные навыки добавлены отдельным этапом 1.4.201; XP сохраняется.

          Клады без спама (1.4.199)
          ------------------------
          Автоматические сообщения о находках в чат/консоль отключены.
          Новый feedback.find-notifications отсутствует в старом конфиге?
          Это тоже false: удалять конфиг или данные игроков не нужно.
          Добыча, статистика, звук, частицы, титры и actionbar сохранены.
          Предупреждения об ошибках и ответы на команды не фильтруются.

          Новый товар 1.4.198: «Всё включено»
          -----------------------------------
          899 ₽ / 30 дней: V, +8 домов, все каталожные шлейфы и цвета,
          эффект входа и премиум-трек. Одна команда доставки:
          pass shopbuy %username% all-inclusive
          В существующий shop.products добавьте блок из docs/releases/1.4.198.md.
          Все дополнения набора на 30 дней; отдельный премиум-трек остаётся 90.
          Постоянный V — ручная сверка без выдачи; shoprevoke гибрид не отзывает.

          Магазин: важные изменения 1.4.197
          --------------------------------
          Продления не урезают оплаченные дни: если полный срок не помещается
          в горизонт 365 дней, доставка не выполняется и идёт в pass pending
          для сверки с кабинетом/ручного решения. То же для младшего ранга
          и битого набора. Набор проверяется целиком до выдачи первой части.
          Не подтверждайте pending вслепую: approve не повторяет выдачу SKU.
          Цвет ника выбирается /labels color <id>; эффект входа автоматический.
          Старое право набора не открывает ранговые эксклюзивы IV/V.
          Постоянный базовый ранг не обнуляет срок временного старшего.

          Что происходит с конфигами
          --------------------------
          Не удаляйте старые конфиги без резервной копии. Не все списки
          обновляются автоматически: сравните свои значения с config.yml из JAR.
          Особенно важны CHRDK_Core: shop.products и labels.colors.list,
          CHRDK_Cosmetics: cosmetics.join-effect.product и определения шлейфов,
          CHRDK_BattlePass: задания/награды сезона, часы отдельного XP-буста.
          Игровые награды больше не выдают платные товары/ранги. Старые списки
          premium-products не возвращайте: прогресс даёт только отдельный буст.
          Проверьте reward-boost и надписи: ник первый, явные слоты без автоподмены.
          Исторические смешанные платные права сверяйте вручную: pass paidaudit.
          RCON включённого магазина работает без номера заказа; локальная консоль
          требует реальное подтверждение оплаты. Без id/API нет проверки денег
          или защиты от повторной доставки; один платёж — одна команда.
          Новые цены TradeMC должны точно совпасть с shop.products[].price;
          дубликаты цен недопустимы. Для настройки групп выполните из консоли
          pass luckperms setup, если используются LP-группы. Для дополнительных
          домов LP не нужен: теперь каждый пакет добавляет места на собственный
          срок; сохранённые точки при истечении пакета не удаляются.
          Часть стандартного оформления мигрирует автоматически; собственные
          изменения не перезаписываются. Обновление конфигов не требует
          удаления данных игроков. Полный порядок — в описании релиза.

          Откат
          -----
          Верните старые JAR-ы из резервной копии на место, верните папку
          plugins/CHRDK_*/ из копии и запустите сервер. Данные, записанные
          новой версией, старые сборки могут не прочитать — поэтому копия
          делается до запуска.

          Полный список изменений и инструкция — в описании релиза на GitHub
          и в README репозитория.
          MEMO
          printf '\nВерсия: %s\nПлатформа: Purpur 26.3 / Java 25\n' "$version" >> 'release/ОБНОВЛЕНИЕ.txt'
          for notes in docs/releases/1.4.{200,201}.md; do
            printf '\n\n' >> 'release/ОБНОВЛЕНИЕ.txt'
            cat "$notes" >> 'release/ОБНОВЛЕНИЕ.txt'
          done
          python3 .github/scripts/verify_release.py release "$version"
          zip -j -9 "chrdk-plugins-${version}.zip" release/*.jar 'release/ОБНОВЛЕНИЕ.txt'
          unzip -l "chrdk-plugins-${version}.zip"
          echo "zip=chrdk-plugins-${version}.zip" >> "$GITHUB_ENV"

      - name: Pack the complete TradeMC storefront
        run: python3 tools/trademc/build.py --zip

      - name: Attach the plugin ZIP and separate storefront ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.zip }}" "build/trademc/chrdk-trademc-${{ steps.verify-version.outputs.version }}.zip" --clobber
