name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build JAR and attach to release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Verify release tag matches mod version
        id: verify-version
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$mod_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match mod version $mod_version" >&2
            exit 1
          fi
          echo "jar=build/libs/chrdk-f-register-${mod_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Attach the Fabric mod JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.verify-version.outputs.jar }}" --clobber
