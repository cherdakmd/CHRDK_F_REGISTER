name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия из gradle.properties для dry-run (например, 2.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Verify and package plugins
    # Самостоятельные релизы датапаков не являются релизами плагинов.
    # Ручной запуск собирает те же ассеты, но ничего не публикует в Release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged or candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag or dry-run confirmation
        id: verify-version
        shell: bash
        env:
          CONFIRM_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$plugin_version" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match plugin version $plugin_version" >&2
              exit 1
            fi
            if [[ "$plugin_version" == *-rc.* && "$RELEASE_PRERELEASE" != true ]]; then
              echo 'RC can only be published as a GitHub prerelease' >&2; exit 1
            fi
          else
            if [[ "$CONFIRM_VERSION" != "$plugin_version" ]]; then
              echo "Dry-run confirmation $CONFIRM_VERSION does not match plugin version $plugin_version" >&2
              exit 1
            fi
            echo "Dry-run only: $plugin_version will not be published"
          fi
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate explicit release manifest
        id: release-spec
        run: python3 .github/scripts/release_spec.py "${{ steps.verify-version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify published release kind matches manifest
        if: github.event_name == 'release'
        shell: bash
        env:
          PUBLISHED_PRERELEASE: ${{ github.event.release.prerelease }}
          MANIFEST_PRERELEASE: ${{ steps.release-spec.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISHED_PRERELEASE" != "$MANIFEST_PRERELEASE" ]]; then
            echo 'GitHub prerelease flag does not match the versioned release manifest' >&2
            exit 1
          fi

      - name: Check messages, patched Mine Treasure and release validation tests
        run: |
          python3 .github/scripts/check_retired_addons.py
          python3 -m unittest discover -s .github/scripts -p 'test_retired_addons.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_*release.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_release_spec.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_gradle_build.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_prepare_papi.py' -v
          python3 .github/scripts/check_messages.py
          python3 tools/datapacks/build_mine_treasure.py --check

      - name: Verify TradeMC kit and regression tests
        run: |
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --check
          python3 -m unittest discover -s tools/trademc -p 'test_*.py' -v
          python3 tools/shop/build_social_access_card.py --check
          python3 -m pip install -r tools/wiki/requirements.txt
          python3 tools/wiki/build.py --check
          python3 -m unittest discover -s tools/wiki -p 'test_*.py' -v

      - name: Verify clan product cards without publication
        run: |
          python3 -m pip install -r tools/clan_shop/requirements.txt
          python3 tools/clan_shop/build.py --check
          python3 tools/clan_shop/build_bundle.py --check
          python3 -m unittest discover -s tools/clan_shop -p 'test_*.py' -v

      - name: Build plugins
        shell: bash
        run: |
          set +e
          python3 .github/scripts/gradle_build.py
          status=$?
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs-${{ github.sha }}
          path: build*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack manifest-selected standalone plugin
        if: steps.release-spec.outputs.kind == 'standalone'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-version.outputs.version }}"
          source="${{ steps.release-spec.outputs.source }}"
          jar="${{ steps.release-spec.outputs.jar }}"
          plugin="${{ steps.release-spec.outputs.plugin }}"
          checksums="${{ steps.release-spec.outputs.checksums }}"
          cp "$source" "$jar"
          python3 .github/scripts/verify_release.py --standalone "$jar" "$plugin" "$version"
          sha256sum "$jar" > "$checksums"
          sha256sum -c "$checksums"
          echo "standalone_jar=$jar" >> "$GITHUB_ENV"
          echo "standalone_checksums=$checksums" >> "$GITHUB_ENV"

      - name: Pack full plugin ZIP and separate add-ons
        if: steps.release-spec.outputs.kind == 'full'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-version.outputs.version }}"
          mkdir -p release
          find . -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            ! -name 'chrdk-vk-*.jar' ! -name 'chrdk-disasters-*.jar' \
            -exec cp '{}' release/ \;
          count="$(find release -maxdepth 1 -name '*.jar' | wc -l)"
          echo "Собрано JAR общего комплекта: $count"
          find release -maxdepth 1 -name '*.jar' -printf '%f\n' | sort
          cp docs/releases/update-memo.txt 'release/ОБНОВЛЕНИЕ.txt'
          printf '\nВерсия: %s\nПлатформа: Purpur 26.3 / Java 25\n' "$version" >> 'release/ОБНОВЛЕНИЕ.txt'
          for notes in docs/releases/1.4.{200,201,{220..289}}.md; do
            printf '\n\n' >> 'release/ОБНОВЛЕНИЕ.txt'
            cat "$notes" >> 'release/ОБНОВЛЕНИЕ.txt'
          done
          if [[ "$version" != 1.4.* ]]; then
            printf '\n\n' >> 'release/ОБНОВЛЕНИЕ.txt'
            cat "docs/releases/${version}.md" >> 'release/ОБНОВЛЕНИЕ.txt'
          fi
          python3 .github/scripts/verify_release.py release "$version"
          python3 .github/scripts/pack_release.py release "$version" "chrdk-plugins-${version}.zip"
          unzip -t "chrdk-plugins-${version}.zip"
          unzip -l "chrdk-plugins-${version}.zip"
          cp "vk/build/libs/chrdk-vk-${version}.jar" "chrdk-vk-${version}.jar"
          python3 .github/scripts/verify_release.py --standalone "chrdk-vk-${version}.jar" CHRDK_VK "$version"
          cp "disasters/build/libs/chrdk-disasters-${version}.jar" "chrdk-disasters-${version}.jar"
          python3 .github/scripts/verify_release.py --standalone "chrdk-disasters-${version}.jar" CHRDK_Disasters "$version"
          cp "datapacks/mine-treasure-ru/mine-treasure-1.6.5-ru.zip" "mine-treasure-1.6.5-ru.zip"
          checksums="chrdk-${version}-SHA256SUMS.txt"
          sha256sum "chrdk-plugins-${version}.zip" "chrdk-vk-${version}.jar" \
            "chrdk-disasters-${version}.jar" "mine-treasure-1.6.5-ru.zip" > "$checksums"
          sha256sum -c "$checksums"
          echo "zip=chrdk-plugins-${version}.zip" >> "$GITHUB_ENV"
          echo "vk_jar=chrdk-vk-${version}.jar" >> "$GITHUB_ENV"
          echo "disasters_jar=chrdk-disasters-${version}.jar" >> "$GITHUB_ENV"
          echo "datapack=mine-treasure-1.6.5-ru.zip" >> "$GITHUB_ENV"
          echo "checksums=$checksums" >> "$GITHUB_ENV"

      - name: Upload standalone dry-run candidate
        if: github.event_name == 'workflow_dispatch' && steps.release-spec.outputs.kind == 'standalone'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.verify-version.outputs.version }}-${{ github.sha }}
          path: |
            ${{ env.standalone_jar }}
            ${{ env.standalone_checksums }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload full dry-run release candidate
        if: github.event_name == 'workflow_dispatch' && steps.release-spec.outputs.kind == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.verify-version.outputs.version }}-${{ github.sha }}
          path: |
            ${{ env.zip }}
            ${{ env.vk_jar }}
            ${{ env.disasters_jar }}
            ${{ env.datapack }}
            ${{ env.checksums }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach manifest-verified release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.release-spec.outputs.kind }}" == 'standalone' ]]; then
            gh release upload "${{ github.event.release.tag_name }}" "${{ env.standalone_jar }}" "${{ env.standalone_checksums }}" --clobber
          else
            gh release upload "${{ github.event.release.tag_name }}" "${{ env.zip }}" "${{ env.vk_jar }}" \
              "${{ env.disasters_jar }}" "${{ env.datapack }}" "${{ env.checksums }}" --clobber
          fi
