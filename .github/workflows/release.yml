name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build plugins and attach the archive
    # Самостоятельные релизы датапаков не являются релизами плагинов.
    if: startsWith(github.event.release.tag_name, 'v1.')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag matches plugin version
        id: verify-version
        shell: bash
        run: |
          plugin_version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match plugin version $plugin_version" >&2
            exit 1
          fi
          echo "version=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Check messages and release validation tests
        run: |
          python3 .github/scripts/check_messages.py
          python3 -m unittest discover -s .github/scripts -p 'test_verify_release.py' -v

      - name: Verify TradeMC kit and regression tests
        run: |
          python3 -m pip install -r tools/trademc/requirements.txt
          python3 tools/trademc/build.py --check
          python3 -m unittest discover -s tools/trademc -p 'test_*.py' -v

      - name: Build plugins
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            grep -A 4 -E 'error:|Could not find|Could not resolve|What went wrong|Execution failed|FAILURE:' build.log \
              | head -n 50 \
              | while IFS= read -r line; do
                  printf '::error title=Gradle build output::%s\n' "$line"
                done
          fi
          exit "$status"

      - name: Report test failures
        if: always()
        shell: bash
        run: python3 .github/scripts/report_tests.py

      - name: Pack all plugin JARs and the update memo into one ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-version.outputs.version }}"
          mkdir -p release
          find . -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp '{}' release/ \;
          count="$(find release -maxdepth 1 -name '*.jar' | wc -l)"
          echo "Собрано JAR: $count"
          find release -maxdepth 1 -name '*.jar' -printf '%f\n' | sort
          if [[ "$count" -lt 1 ]]; then
            echo 'Не найден ни один JAR — архив не собран.' >&2
            exit 1
          fi
          cat > 'release/ОБНОВЛЕНИЕ.txt' <<'MEMO'
          CHRDK — обновление плагинов
          ===========================

          Что в архиве
          ------------
          Все JAR-ы CHRDK одной версии: ядро CHRDK_Core и аддоны
          (DiamondShop, Referrals, DailyRewards, Teleports, Enchants, TierForge,
          Artifacts, Achievements, Skills, Treasures, CommonGoals, Claims, Ranks,
          Cosmetics, BattlePass, Queue, Streams, Lottery, Auction, Pets, Orders, Hunt, Party,
          Events, Quests, Bosses, Guilds, Classes, Professions).
          Отдельные JAR-ы к релизу больше не прикладываются — только этот архив.

          Порядок обновления
          ------------------
          1. Остановите сервер командой stop и дождитесь полной остановки.
          2. Сделайте резервную копию папки plugins/ (достаточно копии целиком)
             и мира. Это обязательный шаг: откат без копии невозможен.
          3. Удалите из plugins/ старые JAR-ы CHRDK (файлы *.jar этой сборки).
             Папки плагинов (plugins/CHRDK_*/) НЕ удаляйте: в них конфиги,
             сообщения, loot.yml, chances.yml и данные игроков.
          4. Распакуйте все JAR-ы из этого архива в plugins/ (без подпапок).
          5. Запустите сервер и дождитесь строки «CHRDK_... включён» в консоли.
          6. Проверьте /plugins: ядро и все аддоны должны быть зелёными (не red).
             Красный аддон = нет ядра нужной версии или он не загрузился.
          7. Проверьте консоль на предупреждения CHRDK: битый YAML или
             неизвестный ключ видны сразу.

          Осторожная элита (1.4.219)
          ----------------------------------------
          N13: восьмой вариант в прежнем общем шансе элиты 2% (потолок 5%).
          Реальная потеря HP от преследуемого Survival-игрока, остаток HP не выше 25%.
          После подтверждения 10 тиков на приземление, затем временный MOVE-goal Paper:
          до 30 тиков, точка примерно в 4 блоках, обычная скорость без бонуса.
          Без TP/velocity/смены цели/удаления ванильного AI/ломания блоков.
          Ровный безопасный полный пол и воздух, исходный чанк/высота; нет пути — нет рывка.
          До двух попыток за жизнь, cooldown 15 секунд; PDC расходуется до поиска,
          включая заблокированный/отменённый путь. Бюджет не сбрасывается lifecycle.
          До 16 целей, 4 планирований/8 native-поисков за тик, до 8 точек маршрута.
          Временный goal снимается при потере условий, смене цели, unload/TP/transform,
          выходе/смерти игрока, успешном reload/disable. Чужие goals не удаляются.
          Ставить комплектом Core + Hunt + Enchants: общий MAX_ELITE увеличен до 8.
          Награды, книги, XP-множители, приваты/аренда и добровольная 2FA прежние.
          План 25/25 + 29/35 = 54/60; осталось 6 функций, каталог 74 чары.
          Перед установкой backup; отдельно проверить native AI, отдачу/приземление,
          двери/ступени/лаву/границу чанка, чужой путь/AI, отмену поиска и lifecycle.
          Тег, публикация и установка только по отдельной команде.

          Тактическая элита (1.4.218)
          ----------------------------------------
          N12: седьмой вариант в прежнем общем шансе элиты 2% (потолок 5%).
          Фактическая потеря HP от игрока подготавливает одно окно на 3 секунды.
          Один повтор того же типа (ближний/снаряд) от того же Survival-игрока:
          минус 10% БАЗОВОГО урона, native-броня/поглощение пересчитываются Bukkit.
          Без иммунитета/обнуления базы/ручного setHealth/постоянной брони.
          Cooldown 12 секунд от реакции, до трёх реакций за жизнь, бюджет в PDC.
          Поздняя отмена/перезапись урона соблюдается, но не возвращает реакцию.
          Окно не продлевается, другой тип/игрок не получает снижения.
          До 128 подготовленных окон; авторизация/permission/Survival/LOS/32 блока.
          Выход/смерть/TP игрока, unload/смерть/TP/transform моба, reload/disable
          очищают только временные окна; бюджет и cooldown не удаляются.
          Ставить комплектом Core + Hunt + Enchants: общий MAX_ELITE увеличен до 7.
          Награды, книги, XP-множители, приваты/аренда, пароль/добровольная 2FA прежние.
          План 25/25 + 28/35 = 53/60; остаётся 7 функций, каталог 74 чары.
          Перед установкой backup; отдельно проверить смешанные атаки/владельцев,
          позднюю отмену, поглощение/броню/чужие modifiers, три реакции и lifecycle.
          Тег, публикация и установка только по отдельной команде.

          Короткий рывок элиты (1.4.217)
          ----------------------------------------
          N11: шестой вариант в прежнем общем шансе элиты 2% (потолок 5%).
          Только допустимые наземные типы: без криперов, летунов и водного рывка.
          Подтверждённое native-агро / реальное попадание преследуемого Survival-игрока.
          Всплеск 20 тиков, cooldown 12 секунд в PDC; уровень + всплеск CHRDK ≤1.10x.
          Без TP/velocity/смены цели, только земля, видимость, 2–12 блоков, без транспорта.
          Native transient-модификатор не пишется в NBT; снятие при нарушении условий,
          выходе/смерти/TP игрока, смене цели, unload/смерти/TP/transform моба, reload/disable.
          Повторы не продлевают эффект; до 128 активных всплесков, без обходов миров.
          Настройки mob-progression.dash с жёсткими пределами; cooldown не удаляется.
          Ставить комплектом Core + Hunt + Enchants: общий MAX_ELITE увеличен до 6.
          Награды, книги, XP-множители, приваты/аренда, пароль/добровольная 2FA не изменены.
          План 25/25 + 27/35 = 52/60, остаётся 8 функций; каталог по-прежнему 74 чары.
          Перед установкой backup; отдельно проверить native-путь, позднюю отмену агро/урона,
          потолок с уровнем/чужими усилениями, землю/воду, смену цели, unload/reload/restart.
          Тег, публикация и установка только по отдельной команде.

          Восстанавливающаяся элита (1.4.216)
          ----------------------------------------
          N10: пятый природный вариант в прежнем общем шансе элиты 2%, потолок 5%.
          После подтверждённого урона Survival-игрока: задержка 2 секунды, лечение
          не более 3 HP и 8% максимума, только недостающее здоровье.
          До трёх попыток за жизнь, cooldown от 10 секунд, бюджет/cooldown в PDC.
          Отмена лечения другими плагинами соблюдается и расходует попытку.
          Выход/смерть/телепорт игрока, выгрузка/смерть/превращение/телепорт моба,
          успешный reload и disable отменяют старые таймеры, но не возвращают бюджет.
          Параметры mob-progression.recovery имеют жёсткие пределы; enabled=false
          отключает способность и выбор новых мобов этого варианта, не удаляя наблюдения.
          Ставить комплектом Core + Hunt + Enchants: общий MAX_ELITE увеличен до 5.
          Награды, шансы книг, XP-множители, приваты и аренда не изменены.
          План 25/25 + 26/35 = 51/60; осталось 9 функций. Чар по-прежнему 74.
          Перед установкой backup данных мира/плагинов. После установки отдельно
          проверить реальный удар, отменённый урон/лечение, cooldown, три попытки,
          unload/reload/restart и отсутствие влияния на XP/добычу/приваты.
          2FA остаётся добровольной; пароли и защищённая TOTP не менялись.

          Единые территории и аренда чанков (1.4.215)
          ----------------------------------------
          Свои чанки по общей стороне сливаются в одну территорию: общие участники,
          роли, приветствие, продажа и передача; в меню одна карточка и размер.
          Лимит и серверная рента по-прежнему по числу чанков. Между разными
          владельцами минимум один свободный чанк, включая диагональ.
          Старые чужие приваты не удаляются. Данные приватов переходят на схему 3:
          резервная копия обязательна. Не понижайте версию поверх новых договоров.
          При разных правах объединяются только общие участники с меньшей ролью;
          старые лоты объединяемых территорий снимаются, а не продают весь участок
          за прежнюю цену одного чанка. Приветствие из прежнего чанка с меньшими координатами.
          Аренда только текущего чанка: /claim rent offer <алмазов/сутки>, take <цена>,
          stop (арендатор), off (владелец), /claim rent — условия.
          Оплата из казны арендатора; без долга и без тарификации простоя сервера.
          Цена действующего договора не повышается без нового принятия предложения.
          Оплаченные сутки не отзываются; серверная рента покрывается до их конца.
          Нельзя продать/передать/удалить оплаченный арендованный чанк обычными
          командами плагина; аренда не даёт прав на остальную территорию.
          Перед установкой backup всего claims-data.json и конфигов; после установки
          проверить слияние/разделение, права, отступ, аренду/казну/сутки и перезапуск.
          План мобов/чар остаётся 50/60; 2FA добровольная; товары и цены не менялись.

          Цена кастомной наковальни (1.4.214)
          ----------------------------------------
          I14: CHRDK-книга больше не обходит предыдущие работы и Too Expensive.
          Доплата 3 + сумма(вес редкости * итоговый уровень) усиленных чар,
          веса 2/4/7/10. При цене >= native maximum вне Creative результата нет.
          Смешанная книга сохраняет native-результат/цену; конфликт не оживляется.
          Чистая книга учитывает оба prior-work штрафа и обычное изменение имени.
          Без native-результата имя только текстовое; форматирование Purpur делайте
          отдельным штатным переименованием после переноса книги.
          Повторный preview не увеличивает цену/уровень; получение сверяет окно,
          входы, результат, цену, расход одной книги, maximum и generation настроек.
          Нештатные стаки >1 и бесплатный Purpur bypassCost отклоняются.
          XP, книгу и выдачу обрабатывает native; ручной выдачи/списания XP нет.
          Учитывается Purpur settings.blocks.anvil.cumulative-cost; новые ключи
          не обязательны. Обычная починка/переименование без CHRDK-книги не менялись.
          План 25/25 + 25/35 = 50/60; осталось 10 функций. Каталог прежний: 74 чары.
          Перед установкой backup папок плагинов/мира. После установки отдельно
          проверить цену 39/40, чистые/смешанные книги, имена, XP, shift-click,
          отмену другим плагином и reload с открытой наковальней.
          2FA остаётся добровольной; товары, награды и экономика не менялись.

          Безопасный reload мобов и чар (1.4.213)
          ----------------------------------------
          I25: /huntadmin reload и /enchantsadmin reload подготавливают целый снимок
          YAML + разобранных настроек + сообщений, не меняя рабочий модуль заранее.
          Ошибка YAML/типа/чтения/parser: остаётся прежний снимок, GUI и очереди;
          команда сообщает отказ. Исправьте файл и повторите reload.
          Отсутствующий файл на reload не заменяется молча стоком. На первом старте
          шаблоны создаются обычным образом; невалидные начальные файлы отключают
          только соответствующий аддон. Это не меняет /pass reload или 2FA.
          Успешная смена настроек сохраняет прежний cleanup старых GUI/операций.
          PDC-cooldown, книги, кошельки, наблюдения и история охоты не стираются.
          План 24/25 + 25/35 = 49/60, осталось 1 + 10. Каталог прежний: 74 чары.
          Ядро и аддоны обновлять вместе: общий загрузчик снимка находится в CHRDK_Core.
          Сделайте backup конфигов/сообщений и папок плагинов перед установкой.
          Проверки на живом сервере отдельно после разрешённой установки.

          Групповые мобы и история охоты (1.4.212)
          -----------------------------------------
          N18/N21: план 23/25 + 25/35 = 48/60, осталось 2 + 10. Каталог прежний: 74 чары.
          CHRDK_Hunt: mob-progression.group.enabled:false по умолчанию.
          При включении: среднее Skills до 8 видимых авторизованных Survival-игроков,
          радиус 24 (3D), минимум двое; иначе прежний ближайший. Только новый спавн.
          Диапазон региона/шанс элиты прежние; защита новичка имеет приоритет.
          /hunt history [страница]: свои последние 20 природных уровневых убийств,
          по 5 строк, время UTC. Только прямой удар/снаряд, финальная смерть.
          История в hunt.json, без наград/автообъявлений/заднего заполнения.
          mob-progression.history.enabled:false останавливает запись, не удаляет старую.
          Сделайте backup hunt.json и папок плагинов. Файлы аккаунтов/PDC не чистить.
          2FA остаётся добровольной, включённые аккаунты по-прежнему требуют код.
          Проверки на живом сервере отдельно после разрешённой установки.

          Добровольная 2FA и защита новичков (1.4.211)
          --------------------------------------------
          Пароль обязателен, приложение добровольно: totp.enabled:true, required:false.
          Старый config.yml: один раз бэкап config-before-optional-2fa-1.4.211.yml,
          required:false и auth.session-skips-2fa:false. Аккаунты/секреты не стираются.
          Код уже привязанного аккаунта по-прежнему нужен, в том числе по IP-сессии.
          После полного входа: /2fa disable <код_или_пароль>; подключение /2fa setup.
          Не удаляйте migrations.optional-totp-1-4-211; позднейший выбор админа сохраняется.
          Ошибка записи миграции видна в консоли; прежний конфиг и ядро сохраняются.
          N19: newcomer-protection в CHRDK_Hunt, по умолчанию выключена.
          Видимый авторизованный Survival-новичок рядом: минимум зоны, без элиты.
          По умолчанию сумма Skills 10-20, радиус 16 (3D); NPC/неуязвимость исключены.
          Только новый природный спавн, без изменения существующих мобов или наград.
          План 23/25 + 23/35 = 46/60, осталось 2 + 12. Каталог прежний: 74 чары.
          Проверки на живом сервере выполняются отдельно после разрешённой установки.

          PvE-тактика: этап 6 плана (1.4.210)
          ----------------------------------
          N29/N31/N35: всего 23/25 + 22/35 = 45/60, осталось 2 + 13.
          74 чары: 59 светлых + 15 проклятий. Новые боевые эффекты только PvE.
          Провоцирующий удар I/II: 15/20% сменить цель Monster на себя, 6 блоков/видимость.
          Событие цели CUSTOM с отменой, без фиксации агро, включения AI или телепорта.
          Сигнальный заслон I/II: 15/20% свечение атакующего моба на 2/3 сек.
          /enchants guard [auto|id]: приоритет надетой защиты, не сбрасывает общий cooldown.
          Общая перезарядка 15 сек. только после успеха; без суммирования брони/награды.
          Backup playerdata/миров/папок плагинов; PDC и сохранённые cooldown не чистить.

          Книги и библиотека: этап 5 плана (1.4.209)
          ----------------------------------------
          I16/N22/N23: всего 23/25 + 19/35 = 42/60. Осталось 2 + 16.
          Отменённая смерть не расходует книжный бросок моба; дроп остаётся native.
          Новые книги: источник стол/житель/моб/клад/осколки/админ/API в PDC и лоре.
          Старые книги принимаются без метки; метка не подпись подлинности или платежа.
          /enchants library [страница]: лучшие уровни из настоящих книг своего инвентаря.
          Нет выдачи копий, валюты, XP, бонусов силы или платных прав.
          library.enabled: false выключает без удаления открытий library_v1 в playerdata.
          Backup playerdata/миров/папок плагинов обязателен; данные PDC не чистить.

          Инструменты и холод: этап 4 плана (1.4.208)
          -----------------------------------------
          I09-I12/N33-N34: всего 22/25 + 17/35 = 39/60, осталось 3 + 18.
          Жилы/области: native break каждого блока, приват, износ, XP, без загрузки чанков.
