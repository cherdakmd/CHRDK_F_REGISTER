name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build JAR and attach to release
    # Only plugin releases are tagged `v1.4.x`. Skip unrelated releases
    # (e.g. the translated datapack), otherwise the version check fails.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew --no-daemon build

      - name: Verify release tag matches plugin version
        id: verify-version
        shell: bash
        run: |
          plugin_version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match plugin version $plugin_version" >&2
            exit 1
          fi
          echo "jar=build/libs/chrdk-f-register-${plugin_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Attach the Purpur plugin JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.verify-version.outputs.jar }}" --clobber
