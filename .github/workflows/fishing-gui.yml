        run: |
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :custom-items:prototypeResourcePack
          python3 - <<'PYTEST'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('custom-items/resource-pack')
          expected = {p.relative_to(root).as_posix(): p.read_bytes() for p in (root / 'assets/chrdk_cosmetics').rglob('*') if p.is_file()}
          assert len(expected) == 156
          with ZipFile('custom-items/build/resource-packs/chrdk-custom-items-prototype.zip') as pack:
              for path, data in expected.items(): assert pack.read(path) == data, path
              assert 'pack.mcmeta' in pack.namelist()
              assert any(p.startswith('assets/chrdk_fishing/') for p in pack.namelist())
