name: 2.0.12 announcement retry (VK chat)

# Одноразовый повтор анонса v2.0.12, если штатный vk-news снова упадёт на
# загрузке карточки/сети (VK с раннера нестабилен: сбои 15–16.11). Триггер —
# push в рабочую ветку с маркером [announce-2.0.12] в сообщении коммита;
# случайный push без маркера ничего не шлёт. Журнал публикаций (prepared/
# posting) и поиск маркера в беседе исключают двойной пост; шаг публикации
# повторяет run.py до трёх раз с паузами. Workflow из ветки, код — только
# доверенного main (как в vk-news).
on:
  push:
    branches: ['arena/82b4cb60-chrdk-f-register']

permissions:
  contents: read
  issues: write

concurrency:
  group: vk-publication-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  announce:
    name: Retry the v2.0.12 announcement in the VK chat
    if: contains(github.event.head_commit.message, '[announce-2.0.12]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/social/requirements.txt

      - name: Install card renderer
        run: |
          python3 -m pip install -r tools/social/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

      - name: Check the published release and its five assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.12 --json isDraft,assets \
            --jq '"draft: \(.isDraft), ассетов: \(.assets | length)"' | tee /tmp/release-check.txt
          grep -q 'draft: false' /tmp/release-check.txt
          for asset in chrdk-plugins-2.0.12.zip chrdk-vk-2.0.12.jar chrdk-disasters-2.0.12.jar \
                       mine-treasure-1.6.5-ru.zip chrdk-2.0.12-SHA256SUMS.txt; do
            gh release view v2.0.12 --json assets --jq '.assets[].name' | grep -Fxq "$asset"
          done
          echo 'Все пять ассетов на месте.'

      - name: Publish the release news with durable deduplication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VK_AUTOPUBLISH_ENABLED: 'true'
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_PEER_ID: ${{ vars.VK_NEWS_PEER_ID }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
          MAX_AUTOPUBLISH_ENABLED: ${{ vars.MAX_AUTOPUBLISH_ENABLED }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_NEWS_CHAT_ID: ${{ vars.MAX_NEWS_CHAT_ID }}
        run: |
          for attempt in 1 2 3; do
            if python3 - <<'PY'
          import os, runpy, sys
          sys.path.insert(0, 'tools/social')
          os.environ['GITHUB_EVENT_NAME'] = 'workflow_dispatch'
          os.environ['GITHUB_REF'] = 'refs/heads/main'
          sys.argv = ['run.py', '--publish', '--kind', 'news', '--release-tag', 'v2.0.12']
          runpy.run_path('tools/social/run.py', run_name='__main__')
          PY
            then
              exit 0
            fi
            echo "::warning title=VK publication::попытка $attempt не удалась; журнал и маркер в беседе делают повтор безопасным"
            if [ "$attempt" != 3 ]; then sleep 90; fi
          done
          exit 1

      - name: Save text and PNG preview (no tokens or API responses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-post-preview-2.0.12-retry-${{ github.run_id }}
          path: social-preview/
          if-no-files-found: ignore
          retention-days: 14
