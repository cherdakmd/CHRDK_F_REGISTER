name: VK news and server tips

on:
  schedule:
    # UTC: ежедневно 12:00 и 18:00 Europe/Moscow (UTC+3).
    - cron: '0 9,15 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview — картинка; check_connection — без отправки; test_post — один настоящий пост'
        type: choice
        options: [preview, check_connection, test_post]
        default: preview
      publish:
        description: 'Реально отправить в ВК (по умолчанию только превью)'
        type: boolean
        default: false
      kind:
        description: 'Тип публикации'
        type: choice
        options: [tip, news]
        default: tip
      release_tag:
        description: 'Для новости: опубликованный тег, например v1.4.272'
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: vk-publication-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Prepare and optionally publish
    # Никогда не исполняем код из тега/PR с секретами. Checkout только доверенного main.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && !inputs.publish) ||
       (vars.VK_AUTOPUBLISH_ENABLED == 'true' &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'release' &&
          github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/social/requirements.txt
      - name: Install card renderer
        run: |
          python3 -m pip install -r tools/social/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Validate all public content and cards
        run: python3 tools/social/run.py --check
      - name: Validate manual mode
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode || 'preview' }}
          PUBLISH: ${{ inputs.publish }}
          POST_KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ "$MODE" != "preview" && ( "$PUBLISH" == "true" || "$POST_KIND" != "tip" || -n "$RELEASE_TAG" ) ]]; then
            echo '::error::Для check_connection/test_post: publish выключен, kind=tip, release_tag пустой.'
            exit 1
          fi
      - name: Check VK connection without publication
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check_connection' && !inputs.publish
        env:
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
        run: python3 tools/social/run.py --check-connection
      - name: Publish one explicit test post (schedule unchanged)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test_post' && !inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
        run: python3 tools/social/run.py --test-post
      - name: Prepare preview
        if: github.event_name == 'workflow_dispatch' && !inputs.publish && (inputs.mode == 'preview' || inputs.mode == '')
        env:
          GH_TOKEN: ${{ github.token }}
          POST_KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/social/run.py --kind "$POST_KIND" --release-tag "$RELEASE_TAG"
      - name: Publish with durable deduplication
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VK_AUTOPUBLISH_ENABLED: ${{ vars.VK_AUTOPUBLISH_ENABLED }}
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
          POST_KIND: ${{ inputs.kind || 'tip' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/social/run.py --publish --kind "$POST_KIND" --release-tag "$RELEASE_TAG"
      - name: Save text and PNG preview (no tokens or API responses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-post-preview-${{ github.run_id }}
          path: social-preview/
          if-no-files-found: ignore
          retention-days: 14
