name: Pages source

# Одноразовый помощник: переключает источник GitHub Pages на GitHub Actions.
# Нужен, если Pages включён «Deploy from a branch» — тогда сайт собирается
# Jekyll-ом из README, а не нашим pages.yml. Запуск: Actions → Pages source →
# push (workflow_dispatch доступен только с основной ветки). Файл можно
# удалить после переключения.

on:
  push:
    paths:
      - '.github/workflows/pages-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  switch:
    name: Use GitHub Actions as the Pages source
    runs-on: ubuntu-latest
    steps:
      - name: Switch source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          response="$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>&1)" \
            || { echo "::error::PUT /pages: ${response}"; }
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)" \
            || { echo "::error::GET /pages: ${state}"; exit 1; }
          echo "$state" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f"build_type={d.get(chr(98)+chr(117)+chr(105)+chr(108)+chr(100)+chr(95)+chr(116)+chr(121)+chr(112)+chr(101))} status={d.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115))} url={d.get(chr(104)+chr(116)+chr(109)+chr(108)+chr(95)+chr(117)+chr(114)+chr(108))}")'
          if echo "$response" | grep -q '"message"'; then
            echo "::error::Ответ API: ${response}"
          fi
