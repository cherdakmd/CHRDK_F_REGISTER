name: 2.0.8 announcement retry (VK chat)

# Разовая повторная отправка анонса v2.0.8 после сетевого сбоя vk-news
# (запуск от workflow_run нельзя перезапустить, workflow_dispatch из песочницы
# закрыт токеном). Тег и релиз уже опубликованы и не пересоздаются, поэтому
# триггер — обычный push в рабочую ветку с маркером [announce-2.0.8] в
# сообщении коммита. Workflow из ветки, случайный push без маркера ничего не шлёт.
on:
  push:
    branches: ['arena/20252dfc-chrdk-f-register']

permissions:
  contents: read
  issues: write

concurrency:
  group: vk-publication-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  announce:
    name: Retry the v2.0.8 announcement in the VK chat
    if: contains(github.event.head_commit.message, '[announce-2.0.8]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Код только доверенного main (как в vk-news): релиз уже слит в main.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/social/requirements.txt

      - name: Install card renderer
        run: |
          python3 -m pip install -r tools/social/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

      - name: Check the published release and its five assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.8 --json isDraft,assets \
            --jq '"draft: \(.isDraft), ассетов: \(.assets | length)"' | tee /tmp/release-check.txt
          grep -q 'draft: false' /tmp/release-check.txt
          for asset in chrdk-plugins-2.0.8.zip chrdk-vk-2.0.8.jar chrdk-disasters-2.0.8.jar \
                       mine-treasure-1.6.5-ru.zip chrdk-2.0.8-SHA256SUMS.txt; do
            gh release view v2.0.8 --json assets --jq '.assets[].name' | grep -Fxq "$asset"
          done
          echo 'Все пять ассетов на месте.'

      - name: Publish the release news with durable deduplication
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Канонический путь run.py (как у штатного workflow_dispatch на main):
          # журнал с дедупликацией и поиск маркера в беседе защищают от двойного
          # поста, если первая попытка успела отправить сообщение. GITHUB_REF и
          # GITHUB_EVENT_NAME раннер переопределять не даёт, поэтому выставляются
          # внутри процесса; код и релиз — доверенный main.
          VK_AUTOPUBLISH_ENABLED: 'true'
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_PEER_ID: ${{ vars.VK_NEWS_PEER_ID }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
          MAX_AUTOPUBLISH_ENABLED: ${{ vars.MAX_AUTOPUBLISH_ENABLED }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_NEWS_CHAT_ID: ${{ vars.MAX_NEWS_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, runpy, sys
          sys.path.insert(0, 'tools/social')
          os.environ['GITHUB_EVENT_NAME'] = 'workflow_dispatch'
          os.environ['GITHUB_REF'] = 'refs/heads/main'
          sys.argv = ['run.py', '--publish', '--kind', 'news', '--release-tag', 'v2.0.8']
          runpy.run_path('tools/social/run.py', run_name='__main__')
          PY

      - name: Save text and PNG preview (no tokens or API responses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-post-preview-2.0.8-retry-${{ github.run_id }}
          path: social-preview/
          if-no-files-found: ignore
          retention-days: 14
