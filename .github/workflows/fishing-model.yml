name: Fishing model
on:
  push:
    branches: [main, 'arena/**']
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew', 'skills/src/main/java/ru/cherdakmd/chrdkskills/FishingCatchBonus.java', 'skills/src/main/java/ru/cherdakmd/chrdkskills/ChrdkSkillsApi.java']
  pull_request:
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew', 'skills/src/main/java/ru/cherdakmd/chrdkskills/FishingCatchBonus.java', 'skills/src/main/java/ru/cherdakmd/chrdkskills/ChrdkSkillsApi.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test fishing model
        shell: bash
        run: |
          set +e
          ./gradlew -p fishing clean test jar > fishing-build.log 2>&1
          result=$?
          tail -n 80 fishing-build.log
          if [[ $result -ne 0 ]]; then
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('fishing/build/test-results/test/TEST-*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      message = f"{case.get('name')}: {failure.get('message')}".replace('%', '%25').replace('\n', '%0A')
                      print(f"::error::{message}")
          PYTEST
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              echo "::error::$escaped"
            done < <(tail -n 35 fishing-build.log)
            find fishing/build/test-results -name '*.xml' -print -exec cat {} \; 2>/dev/null | head -c 10000 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Verify experimental JAR contents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path('fishing/build/libs').glob('*.jar'))
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one fishing JAR, got {jars}')
          with ZipFile(jars[0]) as jar:
              names = set(jar.namelist())
              required = {
                  'plugin.yml',
                  'ru/cherdakmd/chrdkfishing/bukkit/FishingPlugin.class',
                  'org/sqlite/JDBC.class',
                  'META-INF/services/java.sql.Driver',
              }
              if missing := required - names:
                  raise SystemExit(f'Missing JAR entries: {sorted(missing)}')
              forbidden = [name for name in names if name.startswith(('ru/cherdakmd/chrdkskills/', 'org/slf4j/'))]
              if forbidden:
                  raise SystemExit(f'Unexpected shaded API classes: {forbidden[:10]}')
              descriptor = jar.read('plugin.yml').decode('utf-8')
              for expected in ('name: CHRDK_Fishing', 'version: 0.0.0-dev', "api-version: '26.3'", 'depend: [CHRDK_Core, CHRDK_Skills]'):
                  if expected not in descriptor.splitlines():
                      raise SystemExit(f'Unexpected descriptor: missing {expected!r}')
          print(f'Verified dev artifact: {jars[0]}')
          PY
          sha256sum fishing/build/libs/*.jar
      - name: Upload experimental staging JAR (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: fishing-dev-${{ github.sha }}
          path: fishing/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
