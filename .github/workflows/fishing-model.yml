name: Fishing model
on:
  push:
    branches: [main, 'arena/**']
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew']
  pull_request:
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test fishing model
        shell: bash
        run: |
          set +e
          ./gradlew -p fishing test > fishing-build.log 2>&1
          result=$?
          tail -n 80 fishing-build.log
          if [[ $result -ne 0 ]]; then
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              echo "::error::$escaped"
            done < <(tail -n 35 fishing-build.log)
            find fishing/build/test-results -name '*.xml' -print -exec cat {} \; 2>/dev/null | head -c 10000 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
