name: Fishing model
on:
  push:
    branches: [main, 'arena/**']
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew', 'skills/src/main/java/ru/cherdakmd/chrdkskills/FishingCatchBonus.java']
  pull_request:
    paths: ['fishing/**', '.github/workflows/fishing-model.yml', 'gradle/**', 'gradlew', 'skills/src/main/java/ru/cherdakmd/chrdkskills/FishingCatchBonus.java']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test fishing model
        shell: bash
        run: |
          set +e
          ./gradlew -p fishing test > fishing-build.log 2>&1
          result=$?
          tail -n 80 fishing-build.log
          if [[ $result -ne 0 ]]; then
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('fishing/build/test-results/test/TEST-*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      message = f"{case.get('name')}: {failure.get('message')}".replace('%', '%25').replace('\n', '%0A')
                      print(f"::error::{message}")
          PYTEST
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              echo "::error::$escaped"
            done < <(tail -n 35 fishing-build.log)
            find fishing/build/test-results -name '*.xml' -print -exec cat {} \; 2>/dev/null | head -c 10000 >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
