name: PvP skill damage checks
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/pvp-skills-check.yml', 'src/**', 'skills/src/**', 'claims/src/**', 'guilds/src/**', 'enchants/src/**', 'battlepass/**', 'common-goals/**', 'artifacts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 .github/scripts/prepare_papi.py
      - name: Test area protection and combat in each module
        run: |
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :test --tests 'ru.cherdakmd.chrdkregister.api.AreaPvpGateTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :skills:test --tests 'ru.cherdakmd.chrdkskills.PvpSkillDamageTest' --tests 'ru.cherdakmd.chrdkskills.AttributeMathTest' --tests 'ru.cherdakmd.chrdkskills.BranchAreaDamageTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :claims:test --tests 'ru.cherdakmd.chrdkclaims.AreaClaimPvpPolicyTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :guilds:test --tests 'ru.cherdakmd.chrdkguilds.AreaGuildPvpPolicyTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :enchants:test --tests 'ru.cherdakmd.chrdkenchants.ArrowExplosionGuardTest' --tests 'ru.cherdakmd.chrdkenchants.AreaAbilityEnchantTest' --tests 'ru.cherdakmd.chrdkenchants.DeferredPvpEffectsTest' --tests 'ru.cherdakmd.chrdkenchants.PvpMeleeEffectsTest' --tests 'ru.cherdakmd.chrdkenchants.PvpArrowEffectsTest' --tests 'ru.cherdakmd.chrdkenchants.BowProtectionTest' --tests 'ru.cherdakmd.chrdkenchants.MeleeProtectionTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :battlepass:test --tests 'ru.cherdakmd.chrdkbp.PvpNotMobRewardTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :common-goals:test --tests 'ru.cherdakmd.chrdkgoals.PvpNotMobRewardTest'
          ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :artifacts:test --tests 'ru.cherdakmd.chrdkartifacts.PvpNotMobRewardTest'
      - name: Surface test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').glob('**/build/test-results/test/TEST-*.xml'):
              for case in ET.parse(path).getroot().findall('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      message = (failure.text or failure.get('message', 'failure'))[:10000]
                      message = message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                      print(f'::error title={case.get("classname")}.{case.get("name")}::{message}')
          PY
