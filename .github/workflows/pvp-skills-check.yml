name: PvP skill damage checks
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/pvp-skills-check.yml', 'skills/src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 .github/scripts/prepare_papi.py
      - run: ./gradlew --no-daemon --no-configuration-cache -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar :skills:test --tests 'ru.cherdakmd.chrdkskills.PvpSkillDamageTest' --tests 'ru.cherdakmd.chrdkskills.AttributeMathTest'
