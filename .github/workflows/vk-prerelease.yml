name: VK plugin prerelease

# Пререлиз ТОЛЬКО модуля CHRDK_VK: один JAR, без полного комплекта.
# Тег намеренно начинается с vk-v, поэтому общий Release workflow
# (if: startsWith(tag_name, 'v1.')) его не собирает и не прикладывает
# chrdk-plugins-*.zip + chrdk-disasters-*.jar. plugin_version в
# gradle.properties не меняется: версию получает только этот JAR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия CHRDK_VK, например 1.5.2-rc.5'
        required: true
        default: '1.5.2-rc.5'
        type: string
      announce:
        description: 'Отправить новость о пререлизе в беседу ВК'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Build CHRDK_VK and publish a single-asset prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and check that the tag is free
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "Нужен RC-формат вида 1.5.2-rc.5, получено: $version" >&2
            exit 1
          fi
          tag="vk-v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Тег $tag уже существует: перевыпуск запрещён" >&2
            exit 1
          fi
          if [[ ! -f "docs/releases/vk-$version.md" ]]; then
            echo "Нет заметок docs/releases/vk-$version.md" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Собираем CHRDK_VK $version → $tag из $GITHUB_SHA"

      - name: Build only :vk:jar
        shell: bash
        run: ./gradlew :vk:jar -Pplugin_version='${{ steps.meta.outputs.version }}' --no-daemon

      - name: Verify standalone JAR and bundled poster assets
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          jar="vk/build/libs/chrdk-vk-$version.jar"
          test -f "$jar"
          python3 .github/scripts/verify_release.py --standalone "$jar" CHRDK_VK "$version"
          listing="$(unzip -Z1 "$jar")"
          for entry in 'ru/cherdakmd/chrdkvk/WallDigestCard.class' \
                       'ru/cherdakmd/chrdkvk/VkWallPublisher.class' \
                       'assets/DejaVuSans.ttf' 'assets/DejaVuSans-Bold.ttf' \
                       'assets/world-background.jpg'; do
            grep -Fxq "$entry" <<< "$listing" || { echo "В JAR нет $entry" >&2; exit 1; }
          done
          echo "JAR проверен: имя, версия, CRC и ресурсы постера на месте."

      - name: Install social renderer dependencies
        run: |
          python3 -m pip install -r tools/social/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core

      - name: Offline preview of the prerelease announcement
        run: |
          python3 tools/social/prerelease.py --check \
            --tag '${{ steps.meta.outputs.tag }}' \
            --version '${{ steps.meta.outputs.version }}'

      - name: Create prerelease with exactly one asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          tag='${{ steps.meta.outputs.tag }}'
          jar="vk/build/libs/chrdk-vk-$version.jar"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "CHRDK_VK $version — дайджест стены (пререлиз)" \
            --notes-file "docs/releases/vk-$version.md" \
            --prerelease "$jar"
          count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [[ "$count" != "1" ]]; then
            echo "Ожидался ровно один ассет, получено: $count" >&2
            exit 1
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'

      - name: Announce the prerelease in the VK chat
        # Отдельный явно включаемый контур: штатный vk-news по дизайну
        # готовит новости только по стабильному тегу с основным ZIP.
        if: inputs.announce
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_ANNOUNCE: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          VK_NEWS_ACCESS_TOKEN: ${{ secrets.VK_NEWS_ACCESS_TOKEN }}
          VK_NEWS_GROUP_ID: ${{ vars.VK_NEWS_GROUP_ID }}
          VK_NEWS_PEER_ID: ${{ vars.VK_NEWS_PEER_ID }}
        run: |
          python3 tools/social/prerelease.py --publish \
            --tag '${{ steps.meta.outputs.tag }}' \
            --version '${{ steps.meta.outputs.version }}'
