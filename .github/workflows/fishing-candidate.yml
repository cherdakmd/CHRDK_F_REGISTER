name: Fishing closed-server candidate

# Builds a disposable candidate, never a tag or GitHub Release.
# Fishing remains experimental even when its RC version matches the bundle; run its GUI tests too.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/fishing-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified compile-only API
        run: python3 .github/scripts/prepare_papi.py
      - name: Build and test the numbered Core and module candidate
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --no-configuration-cache -Pplugin_version=2.0.26-rc.47 \
            -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar build --continue > core-build.log 2>&1
          result=$?
          tail -n 100 core-build.log
          if [[ $result -ne 0 ]]; then
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              echo "::error::$escaped"
            done < <(grep -E 'error:|FAILED|FAILURE:|What went wrong|Execution failed|Caused by:|Could not|tests completed|AssertionFailedError' core-build.log | tail -n 35)
            python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in list(Path('artifacts/build/test-results/test').glob('TEST-*.xml')) + list(Path('enchants/build/test-results/test').glob('TEST-*.xml')):
              for case in ET.parse(report).getroot().findall('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      text = (failure.text or '')[:12000].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                      print(f"::error title={case.get('name')}::{text}")
          PYTEST
          fi
          exit "$result"
      - name: Verify menu visual tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('build/test-results/test/TEST-ru.cherdakmd.chrdkregister.ServerMenuVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Menu visual tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'onlyKnownCategoriesWithTheirDefaultMaterialGetModels', 'optInAndExistingModelsAreRespected'}
          if not required.issubset(names):
              raise SystemExit(f'Menu visual tests missing: {sorted(required - names)}')
          path = Path('build/test-results/test/TEST-ru.cherdakmd.chrdkregister.ServerMenuEntryVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Menu entry visual tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'allStockEntriesIncludingHintsHaveDistinctSemanticModels',
                      'changedOwnerFieldsRemainConfiguredButMovedStockEntryIsRecognized',
                      'invalidOrAmbiguousExamplesFailClosed'}
          if not required.issubset(names):
              raise SystemExit(f'Menu entry visual tests missing: {sorted(required - names)}')
          PYTEST
      - name: Verify artifact visual tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('artifacts/build/test-results/test/TEST-ru.cherdakmd.chrdkartifacts.ArtifactVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Artifact visual tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'everyRegisteredArtifactGetsAUniqueModel', 'disabledOrForeignModelAndCustomDataAreUntouched', 'creationOnlyIsOptInAndDoesNotRefreshOldItems'}
          if not required.issubset(names):
              raise SystemExit(f'Artifact visual tests missing: {sorted(required - names)}')
          PYTEST
      - name: Verify collection menu visual tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('artifacts/build/test-results/test/TEST-ru.cherdakmd.chrdkartifacts.CollectionVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Collection menu tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'hiddenEntriesStayIdenticalAndForeignMetadataIsPreserved', 'guiStillProtectsSlotsAndPagesWithBothSettings'}
          if not required.issubset(names):
              raise SystemExit(f'Collection menu tests missing: {sorted(required - names)}')
          PYTEST
      - name: Verify book visual policy tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('enchants/build/test-results/test/TEST-ru.cherdakmd.chrdkenchants.BookVisualPolicyTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Book visual policy tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'everySingleCustomAndVanillaEnchantmentGetsItsOwnKey', 'mixedCombinationsHaveStableMeaningIndependentOfOrdering', 'emptyMalformedUnknownAndForeignKeysAreNeverReinterpreted'}
          if not required.issubset(names):
              raise SystemExit(f'Book visual policy tests missing: {sorted(required - names)}')
          PYTEST
      - name: Verify book runtime tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tests = {
              'BookVisualsTest': {'transitionsFollowActualCustomVanillaAndMixedContents', 'foreignAndInvalidDataFailClosedWithoutDamagingIt', 'disabledOnlyMaintainsAlreadyOwnedModelsAndNeverAdoptsNewOnes', 'combineIgnoresOnlyOurModelAndNeverModifiesInputs', 'runtimeHooksRecalculateAfterTheActualContentChanges'},
          }
          for name, required in tests.items():
              path = Path(f'enchants/build/test-results/test/TEST-ru.cherdakmd.chrdkenchants.{name}.xml')
              suite = ET.parse(path).getroot()
              if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
                  raise SystemExit(f'{name} failed or was skipped')
              names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
              if not required.issubset(names): raise SystemExit(f'{name} missing: {sorted(required - names)}')
          PYTEST
      - name: Verify skill crystal model tests executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('skills/build/test-results/test/TEST-ru.cherdakmd.chrdkskills.SkillCrystalVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Crystal visual tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          expected = {'eachSkillHasOwnModelAndOptInIsRequired', 'existingOtherModelsAndCustomModelDataAreNotOverwritten'}
          if not expected.issubset(names):
              raise SystemExit(f'Crystal visual tests missing: {sorted(expected - names)}')
          PY
      - name: Verify mob loot visual tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('mobs/build/test-results/test/TEST-ru.cherdakmd.chrdkmobs.MobLootVisualsTest.xml')
          suite = ET.parse(path).getroot()
          if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
              raise SystemExit('Mob loot visual tests failed or were skipped')
          names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
          required = {'everyLootKindHasItsOwnOptInModelAndForeignMetadataIsPreserved', 'newLootPreservesIdentityAndOldItemsRemainReadableWithEitherSetting'}
          if not required.issubset(names): raise SystemExit(f'Mob loot tests missing: {sorted(required - names)}')
          PYTEST
      - name: Exercise real Core bank with Fishing journal on temporary files
        shell: bash
        run: |
          ./gradlew --no-daemon --no-configuration-cache -Pplugin_version=2.0.26-rc.47 \
            -Pchrdk.papiJar=build/dependencies/PlaceholderAPI-2.12.3.jar fishingRecoveryTest
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('build/test-results/fishingRecoveryTest/TEST-*.xml')
          required = {
              'mixedSaleSurvivesUncertainInventoryAndRealBankCreditWithoutSecondPayout',
              'conflictingInventoryDoesNotCreditBank',
              'olderJournalSnapshotIsRejectedAgainstRealNewerBankHistory',
              'fullBankWaitsAfterRemovalAndCreditsOnceWhenRoomIsAvailable',
              'offlineAuditorReconcilesRealCoreAndFishingFilesAndDetectsOldJournal',
          }
          names = set()
          for path in paths:
              suite = ET.parse(path).getroot()
              if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
                  raise SystemExit('Recovery integration tests failed or were skipped')
              names.update(case.get('name', '').removesuffix('()') for case in suite.findall('testcase'))
          if not required.issubset(names):
              raise SystemExit(f'Recovery tests missing: {sorted(required - names)}')
          print(f'Verified {len(names)} executed recovery integration tests')
          PY
      - name: Verify complete numbered module set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/plugins candidate/extras
          find . -path '*/build/libs/*.jar' -type f \
            ! -path './fishing/*' ! -path './vk/*' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            -exec cp -t candidate/plugins '{}' +
          printf 'Закрытая проверка; не стабильный релиз.\n' > candidate/plugins/ОБНОВЛЕНИЕ.txt
          python3 .github/scripts/verify_release.py candidate/plugins 2.0.26-rc.47
          cp vk/build/libs/chrdk-vk-2.0.26-rc.47.jar candidate/plugins/
          python3 .github/scripts/verify_release.py --standalone \
            candidate/plugins/chrdk-vk-2.0.26-rc.47.jar CHRDK_VK 2.0.26-rc.47
      - name: Build and test experimental Fishing
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew -p fishing --no-daemon -PfishingVersion=2.0.26 help > /dev/null 2>&1; then
            echo 'Stable Fishing version was unexpectedly accepted' >&2
            exit 1
          fi
          python3 -m unittest discover -s fishing/tests -p 'test_*.py' -v
          python3 -m unittest discover -s custom-items/tests -p 'test_resource_pack.py' -v
          ./gradlew -p fishing --no-daemon -PfishingVersion=2.0.26-rc.47 clean test jar fishingResourcePack
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path('fishing/build/libs').glob('*.jar'))
          if len(jars) != 1:
              raise SystemExit(f'Expected one Fishing JAR: {jars}')
          with ZipFile(jars[0]) as jar:
              names = set(jar.namelist())
              required = {'plugin.yml', 'org/sqlite/JDBC.class', 'META-INF/services/java.sql.Driver',
                          'ru/cherdakmd/chrdkfishing/bukkit/FishingPlugin.class'}
              if required - names or any(n.startswith(('org/slf4j/', 'ru/cherdakmd/chrdkskills/')) for n in names):
                  raise SystemExit('Invalid Fishing JAR contents')
              descriptor = jar.read('plugin.yml').decode('utf-8').splitlines()
              if not {'name: CHRDK_Fishing', 'version: 2.0.26-rc.47', "api-version: '26.3'", 'depend: [CHRDK_Core, CHRDK_Skills]'}.issubset(descriptor):
                  raise SystemExit('Unexpected Fishing descriptor')
          PY
          cp fishing/build/libs/*.jar candidate/plugins/
      - name: Verify Fishing navigation visual tests executed
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = {
              'FishMenuVisualsTest': {'eachSectionAndUnavailableStateHasAUniqueModel', 'offAndForeignModelsOrCustomDataAreNeverOverwritten'},
              'FishMainGuiVisualsTest': {'visualFlagDoesNotChangeNavigationOrInventoryGuards', 'unavailableSectionsReceiveSeparateModelsWithoutEnablingThem'},
              'FishAlbumVisualsTest': {'allButtonsAndFoundSpeciesHaveModelsAndUnknownIsIdentical', 'flagAndForeignMetadataRemainUntouched'},
              'FishAlbumGuiVisualsTest': {'flagsKeepPageNavigationOwnerGuardsAndVirtualEntries', 'readyRewardKeepsTheExistingClaimPath'},
              'BaitMenuVisualsTest': {'allKindsAndSelectionsHaveDistinctModels', 'disabledAndForeignModelsOrDataArePreserved'},
              'BaitMenusGuiTest': {'shopRetainsQuoteAndConfirmationGuardsWithBothVisualSettings', 'equipRechecksSelectedTokenBeforeActionWithBothVisualSettings'},
              'BaitItemVisualsTest': {'modelsCoverAllKindsWithoutOverwritingForeignMetadata', 'newAndLegacyDeliveriesKeepTheSameSignatureAndRemainReadable'},
              'FishCookingVisualsTest': {'recipeStatesAndControlsHaveDistinctModels', 'disabledOrForeignMetadataIsNotOverwritten'},
              'FishCookingGuiVisualsTest': {'visualFlagPreservesSelectionQuoteAndConfirmationGuards'},
              'DishItemVisualsTest': {'modelsCoverRecipesAndRespectTheOptInAndForeignMetadata', 'planningOnlyModelsTheNewDishAndKeepsTheInputSnapshot'},
              'RodUpgradeGuiTest': {'openingMenuNeverRewritesExistingRods'},
              'RodItemCodecTest': {'upgradesApplyEachLevelModelOnlyToTheClonedResult'},
          }
          for cls, expected in required.items():
              path = Path(f'fishing/build/test-results/test/TEST-ru.cherdakmd.chrdkfishing.bukkit.{cls}.xml')
              suite = ET.parse(path).getroot()
              if any(int(suite.get(k, '0')) for k in ('errors', 'failures', 'skipped')):
                  raise SystemExit(f'{cls} failed or was skipped')
              names = {case.get('name', '').removesuffix('()') for case in suite.findall('testcase')}
              if not expected.issubset(names):
                  raise SystemExit(f'{cls} missing: {sorted(expected - names)}')
          PYTEST
      - name: Verify Fishing's exact Core and Skills capabilities
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_verify_fishing_bundle.py' -v
          python3 .github/scripts/verify_fishing_bundle.py candidate/plugins 2.0.26-rc.47
      - name: Verify and package all CHRDK plugins and extras
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from verify_release import expected_plugins, verify
          from pack_release import pack
          root = Path.cwd()
          expected = expected_plugins(root) | {'CHRDK_Fishing', 'CHRDK_VK'}
          plugins = Path('candidate/plugins')
          verify(plugins, '2.0.26-rc.47', expected)
          pack(plugins, '2.0.26-rc.47', Path('candidate/chrdk-all-2.0.26-rc.47.zip'), expected)
          PY
          cp datapacks/mine-treasure-ru/mine-treasure-1.6.5-ru.zip candidate/extras/
          cp custom-items/build/resource-packs/chrdk-custom-items-prototype.zip candidate/extras/
          cp fishing/build/resource-packs/chrdk-fishing-resource-pack.zip candidate/extras/
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          custom = Path('custom-items/resource-pack')
          fishing = Path('fishing/resource-pack')
          with ZipFile('candidate/extras/chrdk-custom-items-prototype.zip') as combined:
              names = [entry.filename for entry in combined.infolist() if not entry.is_dir()]
              if len(names) != len(set(names)):
                  raise SystemExit('Combined resource pack has duplicate entries')
              for source, prefix in ((custom, ''), (fishing, 'assets/chrdk_fishing/')):
                  for f in source.rglob('*'):
                      if not f.is_file(): continue
                      name = f.relative_to(source).as_posix()
                      if prefix and not name.startswith(prefix): continue
                      if name not in names or combined.read(name) != f.read_bytes():
                          raise SystemExit(f'Combined resource pack missing or changed: {name}')
              print('Verified combined CustomItems + Fishing pack')
          PY
          python3 .github/scripts/pack_grim_configs.py anticheat/grim candidate/extras/chrdk-grim-configs.zip
          for file in candidate/extras/*.zip candidate/chrdk-all-2.0.26-rc.47.zip; do unzip -t "$file"; done
          (cd candidate/extras && sha1sum chrdk-custom-items-prototype.zip > chrdk-custom-items-prototype.sha1)
      - name: Rehearse Fishing Horizons packaging without publication
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_fishing_release_dry_run.py' -v
          python3 .github/scripts/fishing_release_dry_run.py \
            candidate/plugins candidate/extras/chrdk-custom-items-prototype.zip \
            2.0.26-rc.47 "$GITHUB_SHA" fishing-horizons-dry-run-2.0.26-rc.47.zip
          sha256sum fishing-horizons-dry-run-2.0.26-rc.47.zip > fishing-horizons-dry-run-2.0.26-rc.47.zip.sha256
          sha256sum -c fishing-horizons-dry-run-2.0.26-rc.47.zip.sha256
      - name: Upload dry-run artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: fishing-horizons-dry-run-2.0.26-rc.47-${{ github.sha }}
          path: |
            fishing-horizons-dry-run-2.0.26-rc.47.zip
            fishing-horizons-dry-run-2.0.26-rc.47.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Describe and checksum candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > candidate/README.txt <<'TEXT'
          КАНДИДАТ ДЛЯ ЗАКРЫТОГО СЕРВЕРА, НЕ СТАБИЛЬНЫЙ РЕЛИЗ.
          Плагины Core, общие модули и экспериментальная рыбалка: 2.0.26-rc.47.
          Purpur 26.3 / Java 25. Не открывать игрокам до проверки.
          Core, Skills, Fishing и CHRDK_VK собраны из одного коммита и лежат в plugins/.
          /fish sell: нажмите рыбу в нижнем инвентаре, затем кнопку продажи.
          /fish rod: нажмите удочку в инвентаре снизу, проверьте её значок и цену,
          подготовьте и подтвердите сделку; оригинал остаётся в инвентаре.
          /fish rod check: диагностика без оплаты; данные инвентаря не выводятся.
          Новый режим чистого поколения экспериментальный, не применять на сервере.
          Оплата Fishing использует сверку исходного снимка с обновлённым Core; не отменяет ожидающие операции.
          Финансовые награды восстанавливаются из банка; это не проверяет неоплаченные требования.
          Перед переключением обязательны полная сверка старых журналов и тесты восстановления.
          Ожидающие неоплаченные улучшения и покупки приманки не списываются автоматически.
          Для отмены неоплаченного намерения: /fish rod cancel или /fish bait cancel.
          Оплаченные операции могут восстановиться при входе владельца. Сначала бэкап и сверка.
          Рыбалка: 92 вида, индивидуальные текстуры новых уловов и улучшенные удочки.
          Автоматический садок ещё не реализован: рыба занимает инвентарь.
          Общая проверка вики и аварийного восстановления ещё не пройдена.
          CHRDK_VK обязателен для аккаунтов с включённой VK-2FA; сохранить его настройки.
          Сторонние LuckPerms, Vault, PlaceholderAPI и GrimAC в комплект не входят.
          Читайте CLOSED-SERVER-CHECKLIST.md и STABLE-RELEASE-GATE.md в корне комплекта.
          extras/chrdk-custom-items-prototype.zip — общий пак CustomItems и Fishing.
          extras/chrdk-fishing-resource-pack.zip — только Fishing для ручной установки.
          Инструкция по пакам и сохранению собственных ресурсов: FISHING-README.md.
          Не заменяйте существующий изменённый пак без его слияния и бэкапа.
          Дополнительно в extras/: Mine Treasure и конфиги Grim.
          Не меняйте настройки и файлы данных без согласованной резервной копии.
          TEXT
          cp fishing/STABLE-RELEASE-GATE.md fishing/CLOSED-SERVER-CHECKLIST.md candidate/
          cp fishing/README.md candidate/FISHING-README.md
          (cd candidate && find plugins extras -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum chrdk-all-2.0.26-rc.47.zip README.txt FISHING-README.md CLOSED-SERVER-CHECKLIST.md STABLE-RELEASE-GATE.md >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Pack full candidate for installation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('candidate')
          destination = Path('chrdk-closed-server-2.0.26-rc.47.zip')
          with ZipFile(destination, 'w', ZIP_DEFLATED) as out:
              for path in sorted(root.rglob('*')):
                  if path.is_file(): out.write(path, path.relative_to(root))
          with ZipFile(destination) as archive:
              bad = archive.testzip()
              if bad: raise SystemExit(f'Corrupt candidate: {bad}')
          PY
          sha256sum chrdk-closed-server-2.0.26-rc.47.zip > chrdk-closed-server-2.0.26-rc.47.zip.sha256
      - name: Upload closed-server candidate ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chrdk-closed-server-2.0.26-rc.47-${{ github.sha }}
          path: |
            chrdk-closed-server-2.0.26-rc.47.zip
            chrdk-closed-server-2.0.26-rc.47.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload closed-server candidate
        uses: actions/upload-artifact@v4
        with:
          name: fishing-closed-server-2.0.26-rc.47-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
