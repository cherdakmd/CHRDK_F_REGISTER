name: Backup diagnostic
on:
  push:
    branches: [arena/3fffd525-chrdk-f-register]
    paths:
      - '.github/workflows/backup-diagnostic.yml'
      - 'src/main/java/ru/cherdakmd/chrdkregister/storage/**'
      - 'src/test/java/ru/cherdakmd/chrdkregister/storage/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          cat > /tmp/test-events.gradle <<'EOF'
          gradle.projectsEvaluated { allprojects { tasks.withType(Test).configureEach { testLogging { events 'started', 'passed', 'failed', 'skipped' } } } }
          EOF
          set -o pipefail
          set +e
          timeout 90 ./gradlew :test --tests 'ru.cherdakmd.chrdkregister.storage.BackupArchiveTest' -I /tmp/test-events.gradle --info --console=plain | tee /tmp/backup-test.log
          status=$?
          if [[ $status -ne 0 ]]; then
            grep -E 'BackupArchiveTest >|expected:|AssertionFailedError|STARTED|PASSED|FAILED' /tmp/backup-test.log | tail -20 | sed 's/^/::error::/'
            exit $status
          fi
