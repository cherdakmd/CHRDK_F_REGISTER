# TEMPORARY transport workflow. Removed right after the local kit is fetched.
# Builds the last committed prerelease (1.4.282-rc.14 in
# arena/c99ef3d4-chrdk-f-register) with the official Java 25 CI toolchain,
# packs it with the repository's own pack_release.py, and pushes the resulting
# ZIP/JAR into a short-lived tag so this sandbox (whose egress cannot reach
# GitHub release assets or Actions artifact blobs) can fetch it over git.
name: Arena local ZIP

on:
  push:
    branches:
      - arena/49bc75f7-chrdk-f-register
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rc14-kit:
    name: Build and pack RC14 kit for local download
    runs-on: ubuntu-latest
    steps:
      - name: Check out last committed prerelease source
        uses: actions/checkout@v5
        with:
          ref: arena/c99ef3d4-chrdk-f-register
          fetch-depth: 1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full build and JUnit tests of all modules (workflow runner)
        run: python3 .github/scripts/gradle_build.py

      - name: Pack ZIP and standalone VK addon
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          echo "Building kit for ${version}"
          mkdir -p release
          find . -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' \
            ! -name 'chrdk-vk-*.jar' \
            -exec cp '{}' release/ \;
          count="$(find release -maxdepth 1 -name '*.jar' | wc -l)"
          echo "Собрано JAR общего комплекта: $count"
          find release -maxdepth 1 -name '*.jar' -printf '%f\n' | sort
          if [[ "$count" -lt 1 ]]; then
            echo 'Не найден ни один JAR — архив не собран.' >&2
            exit 1
          fi
          cp docs/releases/update-memo.txt 'release/ОБНОВЛЕНИЕ.txt'
          printf '\nВерсия: %s\nПлатформа: Purpur 26.3 / Java 25\n' "$version" >> 'release/ОБНОВЛЕНИЕ.txt'
          for notes in docs/releases/1.4.{200,201,{220..282}}.md; do
            if [[ -f "$notes" ]]; then
              printf '\n\n' >> 'release/ОБНОВЛЕНИЕ.txt'
              cat "$notes" >> 'release/ОБНОВЛЕНИЕ.txt'
            fi
          done
          printf '\n\nВНИМАНИЕ: комплект собран из закоммиченного состояния %s (ветка arena/c99ef3d4-chrdk-f-register).\nИзменения RC16 (раздел /shop → Кузня, восемь PDC-расходников, ForgeMarketCatalog, frozen grant) в него НЕ входят.\nИгровой smoke-тест и серверная проверка не проводились; установка на сервер не выполнялась.\n' "$version" >> 'release/ОБНОВЛЕНИЕ.txt'
          python3 .github/scripts/verify_release.py release "$version"
          python3 .github/scripts/pack_release.py release "$version" "chrdk-plugins-${version}.zip"
          unzip -t "chrdk-plugins-${version}.zip"
          unzip -l "chrdk-plugins-${version}.zip"
          cp "vk/build/libs/chrdk-vk-${version}.jar" "chrdk-vk-${version}.jar"
          python3 .github/scripts/verify_release.py --standalone "chrdk-vk-${version}.jar" CHRDK_VK "$version"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Keep a normal downloadable CI artifact as well
        uses: actions/upload-artifact@v4
        with:
          name: arena-local-kit-${{ github.run_id }}
          path: |
            chrdk-plugins-${{ env.version }}.zip
            chrdk-vk-${{ env.version }}.jar
          if-no-files-found: error
          retention-days: 7

      - name: Push kit into a short-lived transport tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ env.version }}"
          tag="arena-local-zip-${{ github.run_id }}"
          mkdir -p /tmp/kit
          cp "chrdk-plugins-${version}.zip" "chrdk-vk-${version}.jar" /tmp/kit/
          cd /tmp/kit
          git init -q
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git checkout -q -b transport
          git add "chrdk-plugins-${version}.zip" "chrdk-vk-${version}.jar"
          git commit -qm "Temporary transport of ${version} plugin kit"
          git tag "$tag"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q origin "refs/tags/$tag"
          echo "Transport tag pushed: $tag"
