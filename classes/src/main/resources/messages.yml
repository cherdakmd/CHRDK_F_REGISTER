# CHRDK_Classes — тексты классов, дерева талантов и меню (1.4.164).
#
# Ключи без префикса: код обращается к ним как "class-required" и т.п.
# Разметка — MiniMessage, подстановки — %имя%.
# Имена классов, веток и талантов лежат здесь же: class.<ид>.name, branch.<ид>,
# talent.<ид>.name|desc, effect.<вид>. Числа живут в ClassCatalog.
classes:

  # ------------------------------- служебные --------------------------------
  no-permission: "<red>Недостаточно прав.</red>"
  player-only: "<red>Эта команда только для игроков.</red>"
  disabled: "<red>Классы выключены в config.yml.</red>"
  # 1.4.182: обязательный выбор класса — меню, напоминание и закрытие без выбора.
  onboarding-start: "<gold>Класс</gold> <dark_gray>·</dark_gray> <white>Выбери стиль игры</white> <dark_gray>—</dark_gray> <gray>меню откроется через пару секунд. Это бесплатно.</gray>"
  onboarding-remind: "<gold>Выбери класс</gold> <dark_gray>·</dark_gray> <yellow>/class</yellow>"
  onboarding-closed: "<gold>Класс</gold> <dark_gray>·</dark_gray> <white>Без класса не работают умения, таланты и прибавки.</white> <gray>Меню откроется снова — или выбери сам: <yellow>/class</yellow></gray>"
  unknown-subcommand: "<red>Неизвестная подкоманда «%sub%». Смотрите <yellow>/class help</yellow>.</red>"

  # -------------------------------- справка ---------------------------------
  help-header: "<gold>Классы</gold> <dark_gray>·</dark_gray> <gray>стиль игры и дерево талантов</gray>"
  help-menu: "<yellow>/class</yellow> <gray>— паспорт развития или первый выбор класса</gray>"
  help-choose: "<yellow>/class choose <класс></yellow> <gray>— выбрать или сменить класс</gray>"
  help-info: "<yellow>/class info [класс]</yellow> <gray>— карточка класса и таланты</gray>"
  help-talents: "<yellow>/class talents</yellow> <gray>— дерево талантов</gray>"
  help-learn: "<yellow>/class learn <талант></yellow> <gray>— выучить талант за очки</gray>"
  help-respec: "<yellow>/class respec</yellow> <gray>— посмотреть возврат и подтвердить пересборку</gray>"
  help-points: "<yellow>/class points</yellow> <gray>— уровень, очки и сколько до следующего</gray>"
  help-ability: "<yellow>/class ability [1|2]</yellow> <gray>— умение класса (то же делает <yellow>/ability [1|2]</yellow>)</gray>"
  help-top: "<yellow>/class top</yellow> <gray>— сколько игроков в каждом классе</gray>"
  help-footer: "<gray>Уровень класса растёт от навыков: один уровень за каждые %per% уровней навыков.</gray>"

  # ------------------------------ выбор класса ------------------------------
  choose-usage: "<gray>/class choose <yellow><warrior|archer|mage|cleric></yellow></gray>"
  choose-actionbar: "<gold>Класс: %class%</gold>"
  class-unknown: "<red>Неизвестный класс «%class%». Доступны: warrior, archer, mage, cleric.</red>"
  class-same: "<gray>Этот класс уже выбран.</gray>"
  class-cooldown: "<red>Класс можно сменить через <white>%time%</white>.</red>"
  class-choose-ready: "<green>Класс «%class%» можно выбрать.</green>"
  class-change-ready: "<gray>Смена класса «%from%» → «%to%» вернёт все очки талантов.</gray>"
  class-chosen: "<green>Класс выбран: <white>%class%</white>. Откройте <yellow>/class talents</yellow>.</green>"
  class-changed: "<green>Класс сменён на <white>%class%</white>; очки вернулись, талантов сброшено: %talents%.</green>"
  class-required: "<red>Сначала выберите класс: <yellow>/class choose <класс></yellow>.</red>"

  # -------------------------------- таланты ---------------------------------
  learn-usage: "<gray>/class learn <yellow><талант></yellow> <dark_gray>·</dark_gray> <gray>ид таланта виден в <yellow>/class talents</yellow></gray>"
  talent-unknown: "<red>Неизвестный талант «%talent%».</red>"
  talent-foreign: "<red>Талант «%talent%» принадлежит другому классу, а не «%class%».</red>"
  talent-known: "<gray>Этот талант уже изучен.</gray>"
  talent-locked: "<red>Сначала изучите предыдущий талант: <white>%talent%</white>.</red>"
  talent-skill: "<red>Нужен навык <white>%skill%</white> до уровня <white>%level%</white> (сейчас %have%).</red>"
  talent-points: "<red>Нужно очков: <white>%cost%</white>, свободно <white>%points%</white>.</red>"
  talent-ready: "<green>Талант можно изучить.</green>"
  talent-learned: "<green>Талант изучен: <white>%talent%</white>. Свободных очков: %points%.</green>"
  talent-actionbar: "<gold>+ %talent%</gold>"

  # --------------------------- пересборка дерева ----------------------------
  respec-empty: "<gray>Изученных талантов нет — возвращать нечего.</gray>"
  respec-cooldown: "<red>Пересборка будет доступна через <white>%time%</white>.</red>"
  respec-done: "<green>Таланты сброшены: %talents%. Очки вернулись, свободно <white>%points%</white>.</green>"

  # ------------------------------ умения класса ------------------------------
  # %ability% — имя умения из ability.<ид>.name, %time% — остаток кулдауна.
  ability-disabled: "<red>Умения классов выключены в config.yml.</red>"
  ability-dead: "<red>Умение недоступно: вы мертвы.</red>"
  ability-cooldown: "<red>Умение будет готово через <white>%time%</white>.</red>"
  ability-used: "<green>Умение «%ability%» сработало.</green>"
  ability-actionbar: "<gold>%ability%</gold>"

  # ---------------------------- карточка и очки -----------------------------
  info-header: "<gold>Класс: <white>%class%</white></gold>"
  info-none: "<gray>Класс не выбран.</gray>"
  info-none-hint: "<gray>Выберите бесплатно: <yellow>/class choose <warrior|archer|mage|cleric></yellow>. Сменить класс можно раз в неделю.</gray>"
  info-level: "<gray>Уровень <white>%level%</white> · уровней навыков <white>%total%</white> · до следующего <white>%next%</white></gray>"
  info-points: "<gray>Очки талантов: свободно <white>%points%</white>, вложено <white>%spent%</white></gray>"
  # 1.4.175: бонус очков за достижения и плюшки донатного ранга в /class points.
  info-achievements: "<gray>Достижения: открыто <white>%count%</white> · очков за них <white>+%bonus%</white> из %max%</gray>"
  info-achievements-none: "<gray>Достижения: аддон CHRDK_Achievements не найден — очки идут только за уровни навыков</gray>"
  info-rank: "<gold>Ранг: ступень %level% из 5</gold> <gray>· порог узлов −%skill% · шаг уровня −%step% · откат умений −%cooldown%% · смена класса −%change% дн. · пересборка −%respec% ч.</gray>"
  info-rank-none: "<gray>Донатного ранга нет — пороги, откаты и шаг уровня базовые.</gray>"
  info-rank-off: "<gray>Плюшки рангов выключены в config.yml — правила базовые.</gray>"
  info-passive-header: "<gray>Пассив класса:</gray>"
  info-branch-header: "<gold>Ветка «%branch%»</gold>"
  info-talent-line: "<gray>· <white>%talent%</white> <dark_gray>(%cost% очк.)</dark_gray> — %effect%</gray>"
  info-talent-own: "<green>✓ <white>%talent%</white></green> <dark_gray>—</dark_gray> <gray>%effect%</gray>"
  info-talents-header: "<gray>Изучено талантов: <white>%count%/%max%</white></gray>"
  info-talents-empty: "<gray>Талантов пока нет: очки появятся вместе с уровнями навыков.</gray>"
  info-cooldown: "<dark_gray>Смена класса будет доступна через %time%</dark_gray>"
  info-footer: "<dark_gray>Учить таланты: /class talents · очки: /class points</dark_gray>"

  # --------------------------- уровень класса -------------------------------
  # Уровень выводится из навыков: пульс сравнивает его с прошлым и сообщает рост.
  level-up: "<gold>Уровень класса %level%</gold> <gray>· свободных очков талантов: <white>%points%</white> · </gray><yellow>/class talents</yellow>"
  level-up-actionbar: "<gold>Уровень класса %level%</gold>"

  # ------------------------ распределение по классам ------------------------
  top-header: "<gold>Классы на сервере</gold> <dark_gray>·</dark_gray> <gray>выбрали %count% игроков</gray>"
  top-line: "<gray>%place%. <white>%class%</white> — %count%</gray>"

  # --------------------------- администрирование ----------------------------
  admin-usage: "<gray>/classadmin <yellow>reload</yellow> | <yellow>info <ник></yellow> | <yellow>set <ник> <класс></yellow> | <yellow>reset <ник></yellow> | <yellow>respec <ник></yellow></gray>"
  admin-reloaded: "<green>Конфиг классов перечитан: классов %classes%, талантов %talents%.</green>"
  admin-info-header: "<gold>Класс игрока <white>%player%</white></gold>"
  admin-info-line: "<gray>%class% · уровень <white>%level%</white> · свободно очков <white>%points%</white> · талантов <white>%talents%</white></gray>"
  admin-info-none: "<gray>У игрока %player% класс не выбран.</gray>"
  admin-set: "<green>Игроку <white>%player%</white> выдан класс <white>%class%</white>.</green>"
  admin-set-notice: "<gold>Ваш класс изменён администратором: <white>%class%</white>.</gold>"
  admin-reset-ok: "<green>Данные классов игрока <white>%player%</white> сброшены.</green>"
  admin-respec: "<green>Таланты игрока <white>%player%</white> сброшены: %talents%.</green>"
  admin-target-none: "<red>Игрок «%player%» не найден.</red>"
  admin-class-set: "<green>Класс выдан: %class%.</green>"
  admin-reset: "<green>Данные классов сброшены.</green>"
  admin-reset-none: "<gray>Сбрасывать нечего: класса нет.</gray>"

  # ---------------------------------- меню ----------------------------------
  menu-title: "<gold>Классы</gold>"
  info-title: "<gold>%class%</gold>"
  talents-title: "<gold>Таланты</gold> <dark_gray>·</dark_gray> <white>%class%</white>"
  menu-close: "<red>Закрыть</red>"
  menu-back: "<gray>Назад</gray>"
  menu-info-none: "<gray>Класс не выбран</gray>"
  menu-talents-name: "<gold>Дерево талантов</gold>"
  menu-talents-none: "<gray>Сначала выберите класс</gray>"
  menu-talents-lore: "<gray>Свободных очков: <white>%points%</white></gray>"
  menu-talents-nodes: "<gray>Изучено узлов: <white>%count%/%max%</white></gray>"
  menu-class-passive: "<gray>Пассив класса:</gray>"
  menu-class-current: "<green>Это ваш класс — клик откроет дерево</green>"
  menu-class-click: "<aqua>Клик — карточка класса</aqua>"
  menu-branch-preview-line: "<gray>%cost% очк. — %effect%</gray>"
  menu-branch-preview-hint: "<dark_gray>Полное описание — в /class info</dark_gray>"
  menu-talent-skill: "<gray>Нужен навык %skill%: <white>%have%</white>/%level%</gray>"
  menu-talent-known: "<green>Изучен</green>"
  menu-talent-locked: "<red>Нужен %talent%</red>"
  menu-talent-skill-locked: "<red>Нужен уровень навыка %level%</red>"
  menu-talent-no-points: "<red>Не хватает очков (свободно %points%)</red>"
  menu-talent-no-class: "<red>Сначала выберите класс</red>"
  menu-talent-ready: "<green>Клик — изучить</green>"
  menu-talent-cost: "<dark_gray>Цена: %cost% очк.</dark_gray>"
  menu-talent-mastery: "<light_purple>Мастерский узел · пятый ярус</light_purple>"
  menu-confirm-name: "<gold>Подтвердить</gold>"
  menu-confirm-same: "<gray>Этот класс уже выбран</gray>"
  menu-confirm-cooldown: "<red>Смена будет доступна через %time%</red>"
  menu-confirm-choose-lore: "<gray>Выбор бесплатный. Сменить класс можно раз в неделю, таланты при смене сгорают.</gray>"
  menu-confirm-change-lore: "<gray>Текущий класс: %class%. Все таланты сгорят, очки вернутся.</gray>"
  menu-respec-name: "<gold>Пересобрать дерево</gold>"
  menu-respec-lore: "<gray>Вернуть все очки и собрать таланты заново.</gray>"
  menu-respec-cooldown: "<red>Доступно через %time%</red>"
  menu-respec-empty: "<gray>Изученных талантов нет</gray>"
  menu-respec-ready: "<green>Вернётся очков: %cost%</green>"
  menu-ability-name: "<gold>Умение класса</gold>"
  menu-ability-second-name: "<gold>Второе умение</gold>"
  menu-ability-ready: "<green>Клик — применить</green>"
  menu-ability-cooldown: "<red>Откат: %time%</red>"
  menu-ability-none: "<gray>Сначала выберите класс</gray>"
  menu-summary-name: "<gold>Ваш класс</gold>"
  menu-summary-class: "<gray>Класс: <white>%class%</white></gray>"
  menu-summary-level: "<gray>Уровень: <white>%level%</white> · уровней навыков %total%</gray>"
  menu-summary-points: "<gray>Очки: свободно <white>%points%</white>, вложено %spent%</gray>"
  menu-summary-talents: "<gray>Талантов: <white>%count%/%max%</white></gray>"
  menu-summary-achievements: "<light_purple>+%bonus% очк. за достижения</light_purple>"
  menu-summary-rank: "<gold>Ранг %level%</gold> <gray>· шаг уровня −%step%, откат умений −%cooldown%%</gray>"

  # -------------------------------- профиль ---------------------------------
  profile-title: "Класс"
  profile-none: "<gray>Класс не выбран</gray>"
  profile-none-hint: "<gray>/class choose <warrior|archer|mage|cleric></gray>"
  profile-class: "<gray>Класс: <white>%class%</white></gray>"
  profile-level: "<gray>Уровень: <white>%level%</white> · навыков %total%</gray>"
  profile-points: "<gray>Очки: свободно <white>%points%</white>, вложено %spent%</gray>"
  profile-talents: "<gray>Талантов: <white>%count%/%max%</white></gray>"
  profile-change: "<dark_gray>Смена класса через %time%</dark_gray>"

  # ------------------- эффекты (ClassCatalog/EffectKind) --------------------
  effect.max-health: "<red>+%amount% ♥ к здоровью</red>"
  effect.armor: "<blue>+%amount% к броне</blue>"
  effect.movement-speed: "<aqua>+%amount% % к скорости</aqua>"
  effect.knockback-resistance: "<gold>+%amount% % к стойкости от отбрасывания</gold>"
  effect.melee-damage: "<dark_red>+%amount% % к ближнему урону</dark_red>"
  effect.arrow-damage: "<yellow>+%amount% % к урону стрел</yellow>"
  effect.damage-reduction: "<green>-%amount% % входящего урона</green>"
  effect.fall-reduction: "<aqua>-%amount% % урона от падения</aqua>"
  effect.regen: "<light_purple>+%amount% ♥ за пульс вне боя</light_purple>"
  effect.saturation: "<gold>+%amount% к насыщению</gold>"

  # -------------------------- классы (PlayerClass) --------------------------
  class.warrior.name: "Воин"
  class.warrior.desc: "<gray>Держит удар: здоровье, броня и ближний бой.</gray>"
  class.archer.name: "Стрелок"
  class.archer.desc: "<gray>Бьёт с дистанции: урон стрел, скорость и мягкое падение.</gray>"
  class.mage.name: "Маг"
  class.mage.desc: "<gray>Оберег вместо меча: броня, стойкость и скорость.</gray>"
  class.cleric.name: "Жрец"
  class.cleric.desc: "<gray>Милость и дорога: регенерация, сытость и запас здоровья.</gray>"

  # метка класса в нике (ClassTag): полная MiniMessage-строка, ставится перед ником
  tag.warrior: "<red>[Воин]</red>"
  tag.archer: "<green>[Стрелок]</green>"
  tag.mage: "<light_purple>[Маг]</light_purple>"
  tag.cleric: "<gold>[Жрец]</gold>"

  # умения классов (ClassAbility): имя и что делает.
  # Ключ первого умения — ид класса, второго — ид класса с «-2».
  ability.warrior.name: "Боевой рывок"
  ability.warrior.desc: "<gray>Короткий рывок; PvE-щит до 3 базового урона на 3 с.</gray>"
  ability.warrior-2.name: "Боевой клич"
  ability.warrior-2.desc: "<gray>PvE-щит союзникам до 4 базового урона до брони, на 8 с. Не даёт поглощения в PvP.</gray>"
  ability.archer.name: "Залп"
  ability.archer.desc: "<gray>Три стрелы веером по 3,5 урона.</gray>"
  ability.archer-2.name: "Прицельный выстрел"
  ability.archer-2.desc: "<gray>Одна пробивающая стрела на 6 урона.</gray>"
  ability.mage.name: "Ледяная вспышка"
  ability.mage.desc: "<gray>Мороз по врагам вокруг: лёгкий урон и замедление.</gray>"
  ability.mage-2.name: "Испепеление"
  ability.mage-2.desc: "<gray>Конус пламени впереди: 4 урона и три секунды огня.</gray>"
  ability.cleric.name: "Исцеление"
  ability.cleric.desc: "<gray>Лечит до 5 союзников в 8 блоках на 6 HP. Без дополнительных зелий.</gray>"
  ability.cleric-2.name: "Оберег"
  ability.cleric-2.desc: "<gray>PvE-щит до 4 базового урона на 12 с. Не снимает чужие эффекты и не защищает в PvP.</gray>"

  # ------------------------------ ветки дерева ------------------------------
  branch.stoyka: "Стойкость"
  branch.natisk: "Натиск"
  branch.zemlya: "Земля"
  branch.metkost: "Меткость"
  branch.skorost: "Скорость"
  branch.vyzhivanie: "Выживание"
  branch.chary: "Чары"
  branch.shchit: "Щит"
  branch.potok: "Поток"
  branch.milost: "Милость"
  branch.svet: "Свет"
  branch.doroga: "Дорога"

  # навыки — только для текстов требований
  skill.mining.name: "Горное дело"
  skill.woodcutting.name: "Лесорубство"
  skill.digging.name: "Землекопство"
  skill.farming.name: "Земледелие"
  skill.fishing.name: "Рыбалка"
  skill.combat.name: "Ближний бой"
  skill.archery.name: "Стрельба"
  skill.defense.name: "Оборона"
  skill.alchemy.name: "Алхимия"
  skill.enchanting.name: "Зачарование"

  # таланты: имена и описания (ClassCatalog)
  talent.warrior-stoyka-1.name: "Толстая кожа"
  talent.warrior-stoyka-1.desc: "<gray>Броня растёт от закалки, а не от нагрудника.</gray>"
  talent.warrior-stoyka-2.name: "Второе дыхание"
  talent.warrior-stoyka-2.desc: "<gray>Тяжёлый удар уже не сбивает с ног.</gray>"
  talent.warrior-stoyka-3.name: "Каменная стойка"
  talent.warrior-stoyka-3.desc: "<gray>Часть входящего урона уходит в землю.</gray>"
  talent.warrior-stoyka-4.name: "Несокрушимость"
  talent.warrior-stoyka-4.desc: "<gray>Вершина стойкости: здоровья хватает на целый бой.</gray>"
  talent.warrior-natisk-1.name: "Тяжёлый замах"
  talent.warrior-natisk-1.desc: "<gray>Удар всем корпусом — чуть больнее обычного.</gray>"
  talent.warrior-natisk-2.name: "Ярость"
  talent.warrior-natisk-2.desc: "<gray>Чем дольше бой, тем сильнее рука.</gray>"
  talent.warrior-natisk-3.name: "Рывок"
  talent.warrior-natisk-3.desc: "<gray>Шаг к врагу быстрее, чем он ждёт.</gray>"
  talent.warrior-natisk-4.name: "Сокрушение"
  talent.warrior-natisk-4.desc: "<gray>Вершина натиска: один удар решает много.</gray>"
  talent.warrior-zemlya-1.name: "Устойчивый шаг"
  talent.warrior-zemlya-1.desc: "<gray>Падение с высоты больше не пугает.</gray>"
  talent.warrior-zemlya-2.name: "Корни"
  talent.warrior-zemlya-2.desc: "<gray>Толпа не сдвинет с места.</gray>"
  talent.warrior-zemlya-3.name: "Горная поступь"
  talent.warrior-zemlya-3.desc: "<gray>Камень под ногами знаком настолько, что падение мягче.</gray>"
  talent.warrior-zemlya-4.name: "Хребет"
  talent.warrior-zemlya-4.desc: "<gray>Вершина земли: держит и удар, и отброс.</gray>"
  talent.archer-metkost-1.name: "Точный глаз"
  talent.archer-metkost-1.desc: "<gray>Стрела находит щель в броне.</gray>"
  talent.archer-metkost-2.name: "Натянутая тетива"
  talent.archer-metkost-2.desc: "<gray>Сила выстрела растёт с опытом.</gray>"
  talent.archer-metkost-3.name: "Пробивание"
  talent.archer-metkost-3.desc: "<gray>Стрела не вязнет в коже и ткани.</gray>"
  talent.archer-metkost-4.name: "Смертельный выстрел"
