  ability.mage-3.desc: "<gray>До 3 ближайших PvE-врагов в 7 блоках получают по 3 HP урона.</gray>"
  ability.mage-4.name: "<gold>Печать холода</gold>"
  ability.mage-4.desc: "<gray>До 3 PvE-врагов: 2 HP, слабость и замедление на 4 с.</gray>"
