# CHRDK_Classes — классы и деревья талантов (1.4.164).
#
# Класс — это стиль игры, а не вторая прокачка. Уровень класса считается из
# суммы уровней десяти навыков CHRDK_Skills, очки талантов — «выданные минус
# потраченные». Отдельного счётчика прогресса нет: класс и навыки не могут
# разъехаться, а смена кривой не требует миграции файла.
#
# Силы класс не продаёт: все прибавки пассивные и с потолками (здоровье не выше
# 10 полусердец, броня — 12 очков, урон — 35 %, снижение урона — 35 %). Потолки
# живут в коде (EffectKind), потому что это баланс, а не настройка темпа.

general:
  # Полностью выключает классы. Команды и меню останутся, но всё будет
  # отвечать «выключено».
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Короткие сообщения над хотбаром (выбор класса, изученный талант).
  actionbar: true
  # Сколько уровней навыков нужно на один уровень класса (5..100).
  # При 30 и десяти навыках по 100 уровней потолок — 34-й уровень класса.
  levels-per-level: 30
  # Сколько очков талантов даёт каждый уровень класса (0..5).
  points-per-level: 1
  # Сколько очков даётся сразу, до всякой прокачки (0..10).
  starting-points: 1
  # Через сколько дней можно сменить класс (0..365; 0 — можно в любой момент).
  change-cooldown-days: 7
  # Через сколько часов можно пересобрать дерево (0..720; 0 — без ограничений).
  respec-cooldown-hours: 24
  # Как часто пульс проверяет лечение и насыщение (1..60 секунд).
  pulse-seconds: 5
  # Сколько секунд после урона считается «в бою»: в бою регенерация молчит.
  regen-out-of-combat-seconds: 8
  # Сообщать о повышении уровня класса (чат + строка над хотбаром + звук).
  # Уровень выводится из навыков, поэтому поймать его можно только сравнением:
  # без этого игрок узнаёт о новых очках таланта случайно.
  level-notice: true

points:
  # Очки талантов за достижения: каждые N открытых достижений дают +1 очко.
  # Потолок нужен, чтобы дерево оставалось выбором: даже с бонусом очков
  # хватает ровно на все 36 (полное дерево).
  achievement-every: 15
  achievement-max: 2

ranks:
  # Плюшки донатных рангов: ниже пороги навыков для узлов, короче откаты
  # умений и пересборки дерева, быстрее растёт уровень класса. Силу ранг не
  # продаёт: потолки эффектов и цена дерева общие для всех.
  enabled: true

abilities:
  # Активные умения классов (/class ability, кнопка в меню). Выключение
  # оставляет классы и таланты как есть — пропадает только умение.
  enabled: true
  # Множитель кулдауна (0.5..3): 0.5 — умение вдвое чаще, 3 — втрое реже.
  # Сами кулдауны (18–25 секунд) живут в коде: это баланс, а не темп.
  cooldown-multiplier: 1.0

tag:
  # Метка класса в нике: [Воин] Ник — в чате, личных сообщениях и TAB.
  # Текст и цвет — в messages.yml (tag.<ид класса>); выключение убирает метку
  # у всех сразу, ничего не переписывая в данных игроков.
  enabled: true

effects:
  # Атрибутные эффекты (здоровье, броня, скорость, сопротивление отбрасыванию).
  # Выключение оставляет таланты и очки, но снимает прибавки — удобно для
  # проверки, откуда взялся урон, не удаляя прогресс игроков.
  enabled: true
