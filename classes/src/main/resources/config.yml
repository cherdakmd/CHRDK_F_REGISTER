# CHRDK_Classes — собственный PvE-XP, 45 талантов на класс и три сборки.
# Баланс новой кривой/рангов/испытаний находится в ClassDevelopmentRules/ClassTrees.
# Старые levels-per-level, points-per-level, starting-points и points.achievement-*
# читаются ТОЛЬКО при первой заморозке старых правил для безопасного переноса.
# Не меняйте их ради новой выдачи: на новую прогрессию они не влияют.
# classes-legacy-rules.json сохранять вместе с classes.json; не удалять при обновлении.
# Общие и прежние достижимые потолки классов не повышаются.

general:
  # Полностью выключает классы. Команды и меню останутся, но всё будет
  # отвечать «выключено».
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Короткие сообщения над хотбаром (выбор класса, изученный талант).
  actionbar: true
  # Старый шаг (5..100): только исходная основа переноса.
  levels-per-level: 30
  # Старые очки за уровень (0..5): только основа переноса.
  points-per-level: 1
  # Старые стартовые очки (0..10): только основа переноса.
  starting-points: 1
  # Через сколько дней можно сменить класс (0..365; 0 — можно в любой момент).
  change-cooldown-days: 7
  # Через сколько часов можно пересобрать дерево (0..720; 0 — без ограничений).
  respec-cooldown-hours: 24
  # Как часто пульс проверяет лечение и насыщение (1..60 секунд).
  pulse-seconds: 5
  # Сколько секунд после урона считается «в бою»: в бою регенерация молчит.
  regen-out-of-combat-seconds: 8
  # Сообщать о повышении уровня класса (чат + строка над хотбаром + звук).
  # Уровень вычисляется из собственного XP; пульс сообщает об изменении.
  level-notice: true

points:
  # Только старые правила для миграции; новые награды дают шесть испытаний.
  achievement-every: 15
  achievement-max: 2

ranks:
  # Плюшки донатных рангов: ниже пороги навыков для узлов, короче откаты
  # умений и пересборки дерева. Собственный XP ранг не умножает. Силу ранг не
  # продаёт: потолки эффектов и цена дерева общие для всех.
  enabled: true

abilities:
  # Активные умения классов (/class ability, кнопка в меню). Выключение
  # оставляет классы и таланты как есть — пропадает только умение.
  enabled: true
  # Множитель кулдауна (0.5..3): 0.5 — умение вдвое чаще, 3 — втрое реже.
  # Базовые кулдауны 16 умений живут в коде: это баланс, а не темп.
  cooldown-multiplier: 1.0

tag:
  # Метка класса в нике: [Воин] Ник — в чате, личных сообщениях и TAB.
  # Текст и цвет — в messages.yml (tag.<ид класса>); выключение убирает метку
  # у всех сразу, ничего не переписывая в данных игроков.
  enabled: true

effects:
  # Атрибутные эффекты (здоровье, броня, скорость, сопротивление отбрасыванию).
  # Выключение оставляет таланты и очки, но снимает прибавки — удобно для
  # проверки, откуда взялся урон, не удаляя прогресс игроков.
  enabled: true

onboarding:
  # 1.4.182: выбор класса обязателен. Меню открывается само после входа и
  # переоткрывается, пока класс не выбран; в экшен-баре висит напоминание.
  # Геймплей при этом не блокируется: ломать, ставить и получать награды можно.
  required: true
  # Задержка первого открытия после входа, тики (20 = 1 сек; 0..600).
  open-delay-ticks: 40
  # Через сколько секунд переоткрыть меню, если его закрыли без выбора (3..600).
  reopen-seconds: 10
  # Напоминание в экшен-баре, секунды (0 — выключить; до 3600).
  remind-seconds: 30
