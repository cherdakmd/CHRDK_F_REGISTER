name: CHRDK_Classes
version: ${version}
main: ru.cherdakmd.chrdkclasses.ClassesPlugin
api-version: '26.3'
description: "Четыре класса с собственным PvE-XP, по 45 ранговых талантов и четыре умения на выбор, два активных слота, три сборки; без валюты"
authors: [cherdakmd]
website: https://github.com/cherdakmd/CHRDK_F_REGISTER
depend: [CHRDK_Core]
softdepend: [CHRDK_Skills, CHRDK_Achievements, PlaceholderAPI]
commands:
  class:
    description: "Класс, дерево талантов и очки"
    usage: "/class [menu|passport|choose <класс>|info [класс]|talents|learn <талант>|respec|points|top|abilities|builds|ability [1|2]]"
    aliases: [classes, klass, klassy]
    permission: chrdkclasses.use
  ability:
    description: "Умение своего класса: /ability — первое, /ability 2 — второе"
    usage: "/<command> [1|2]"
    aliases: [sposobnost, umenie]
    permission: chrdkclasses.ability
  classadmin:
    description: "Администрирование классов"
    usage: "/classadmin <reload|info <ник>|set <ник> <класс>|reset <ник>|respec <ник>>"
    aliases: [classesadmin, clsadmin]
    permission: chrdkclasses.admin
permissions:
  chrdkclasses.use:
    description: "Выбрать класс, учить таланты и смотреть дерево"
    default: true
  chrdkclasses.ability:
    description: "Применять умение своего класса"
    default: true
  chrdkclasses.admin:
    description: "Перезагрузка, выдача класса и сброс талантов"
    default: op
