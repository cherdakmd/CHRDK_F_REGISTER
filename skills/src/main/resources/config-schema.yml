# CHRDK_Skills — версии схемы эталонных YAML.
# v2: база дневного лимита diamonds.daily-cap выросла 64 → 256, добавлена
#     аддитивная секция diamonds.cap.* (ранг, престиж, уровни, Pass, буст,
#     entitlement, потолок) и строка профиля profile-diamond-cap.
# v3: зелья опыта — дроп с серийным pity: xp-potions.base-chance,
#     xp-potions.streak-step и xp-potions.pity-kills вместо mob-drop-chance;
#     покупка в меню /skills: xp-potions.shop-enabled и xp-potions.price.
#     Тексты finance.service-* и potion-*.
# v4: пауза между зельями xp-potions.cooldown-seconds — секунды, 0 без паузы.
#     Сообщения: messages.xp-potion-used переписывается эталоном без
#     «Сегодня осталось зелий: %left%» (суточного остатка больше нет),
#     messages.xp-potion-daily-limit удалён — remove-миграция вычищает
#     старые значения из файлов владельцев (backup, повторный старт
#     идемпотентен).
# v5: зелья опыта заменены кристаллами опыта — стакуемые предметы с
#     использованием правым кликом (ключи xp-potions.* и покупка в /skills
#     сохранены). Старые зелья остаются рабочими и конвертируются в кристаллы
#     при входе. Тексты вкладки, покупки и паузы переписываются эталоном:
#     формулировки про зелья вычищаются remove-миграцией v5 из файлов
#     владельцев (backup, повторный старт идемпотентен).
# v6: престиж заменён перерождениями (п.30) — команды /skills rebirth и
#     /skills rebirthtop, вкладка «Перерождение». Старые тексты престижа,
#     баланса прокачки и /skills balance вычищаются remove-миграцией из
#     файлов владельцев (backup, повторный старт идемпотентен).
# v7 (config v5): потолок навыка поднят до 150 уровней. leveling.max-level
#     переписывается эталоном (remove + дописывание): файлы владельцев со
#     старым значением 100 получают 150 автоматически. Кристаллы опыта на
#     максимуме навыка дают +1 уровень шкалы опыта Minecraft вместо мёртвого
#     опыта навыка (новый текст xp-potion-vanilla дописывается). menu-guide
#     переписывается эталоном — правила уровней и перерождения изменились.
# v8 (config v6): кристалл на максимуме навыка приносит деньги в /bal, а не
#     ванильный уровень (ванильные уровни на высоких цифрах бесполезны).
#     Новый ключ xp-potions.money-reward дописывается эталоном, текст
#     xp-potion-vanilla вычищается remove-миграцией, на его место
#     дописывается xp-potion-money (backup, повторный старт идемпотентен).
# v9: кристалл на максимуме навыка даёт И уровень шкалы опыта Minecraft, И
#     деньги в /bal (оба бонуса). Текст xp-potion-money переписывается
#     эталоном (remove + дописывание), xp-potion-vanilla дописывается для
#     отключённых денег (money-reward: 0).
# Удалён только устаревший xp-potions.mob-drop-chance (замён на три новых
# ключа дропа); владельческие значения и комментарии остальных ключей
# сохраняются, перед записью создаётся backup.
# v11: отказы кристалла разделены на причины. Ключ xp-potion-unavailable
#     переписывается эталоном (remove + дописывание) — он остался только за
#     входом/выживанием/выключенным переключателем; повреждённое хранилище
#     расходников и приостановленный источник наград получили свои тексты
#     xp-potion-storage-broken и xp-potion-awards-paused (дописываются эталоном).
#     Повторяющиеся отказы не спамят в чат (одинаковое сообщение не чаще раза
#     в 3 секунды), причина отказа пишется в консоль для администрации.
# v7 / v10: покупка кристаллов стаками (Shift+клик) и задержка между кликами
# магазина. Новые ключи xp-potions.shop-stack-size и
# xp-potions.shop-click-cooldown-ms дописываются эталоном (remove-запись
# вычищает ручные эксперименты). Тексты xp-potion-used (прогресс-бар уровня),
# potion-shop-price, potion-buy-hint и potion-bought переписываются эталоном,
# новый xp-potion-used-max дописывается (backup, повторный старт идемпотентен).
# v12: повторная зачистка эпохи суточного остатка зелий. Скриншот с сервера
#     снова показал «Сегодня осталось зелий: %left%» в xp-potion-used: remove
#     исполняется только на переходе через номер шага, и файлы владельцев,
#     штампованные до ретро-правок старых шагов, их не переигрывают. v12 —
#     новый шаг (не правка v4): remove + дописывание эталоном вычищает %left%
#     у всех файлов ниже 12. Правило: remove-списки старых шагов никогда не
#     редактировать — только новый шаг с новой версией.
config-version: 7
messages-version: 12
migrations:
  config:
    5:
      remove: [leveling.max-level]
    6:
      remove: [xp-potions.money-reward]
    7:
      remove: [xp-potions.shop-stack-size, xp-potions.shop-click-cooldown-ms]
  messages:
    12:
      remove: [messages.xp-potion-daily-limit, messages.xp-potion-used]
    11:
      remove: [messages.xp-potion-unavailable]
    4:
      remove: [messages.xp-potion-daily-limit, messages.xp-potion-used]
    5:
      remove: [messages.menu-tab-potions, messages.xp-potion-unavailable,
               messages.xp-potion-cooldown, messages.potion-shop-info,
               messages.potion-shop-price, messages.potion-shop-closed,
               messages.potion-buy-hint, messages.potion-bought]
    6:
      remove: [messages.prestige-usage, messages.prestige-disabled,
               messages.prestige-not-max, messages.prestige-at-cap,
               messages.prestige-confirm, messages.prestige-done,
               messages.prestige-tier-announce, messages.prestige-top-header,
               messages.prestige-top-line, messages.prestige-top-empty,
               messages.prestige-balance-bar, messages.prestige-balance-bar-stop,
               messages.prestige-balance-state, messages.prestige-balance-state-stop,
               messages.balance-header, messages.balance-line,
               messages.balance-line-full, messages.balance-line-stop,
               messages.balance-line-off, messages.balance-footer,
               messages.menu-summary-prestige, messages.profile-prestige,
               messages.menu-tab-prestige, messages.menu-prestige-tier-name,
               messages.menu-prestige-total, messages.menu-prestige-progress,
               messages.menu-prestige-next, messages.menu-prestige-cap,
               messages.menu-prestige-bonus-xp, messages.menu-prestige-skill-name,
               messages.menu-prestige-skill-level, messages.menu-prestige-skill-bonus,
               messages.menu-prestige-skill-ready, messages.menu-prestige-skill-hint,
               messages.menu-prestige-skill-cap, messages.menu-prestige-top-button,
               messages.menu-prestige-top-line, messages.menu-prestige-top-empty,
               messages.menu-prestige-back, messages.menu-prestige-line,
               messages.prestige-ability-upgraded, messages.prestige-ability-master,
               messages.prestige-master-title, messages.prestige-master-subtitle]
    7:
      remove: [messages.menu-guide]
    8:
      remove: [messages.xp-potion-vanilla]
    9:
      remove: [messages.xp-potion-money]
    10:
      remove: [messages.xp-potion-used, messages.xp-potion-used-max,
               messages.potion-shop-price, messages.potion-buy-hint,
               messages.potion-bought]
