# CHRDK_Skills — тексты навыков и перков: имена и описания (skill.<ид>,
# perk.<ид>), витрина, уведомления и админские команды. Иды перков приходят
# из SkillRegistry, здесь меняются только подписи.
messages:
  player-only: "<red>Эта команда только для игроков.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  unknown-skill: "<red>Неизвестный навык. Доступны: <white>mining, woodcutting, digging, farming, fishing, combat, archery, defense, alchemy, enchanting</white>.</red>"
  skills-disabled: "<red>Навыки выключены в config.yml.</red>"

  # ------------------------------ уведомления ------------------------------
  level-up: "<gold>✦ <white>%skill%</white> — уровень <yellow>%level%</yellow>!</gold>"
  actionbar-level: "<gold>%skill% → %level%</gold>"
  milestone: "<green>Награда за уровень <white>%level%</white>: <aqua>%diamonds% алмазов в /bal</aqua>. При полном/недоступном банке выплата сохранена.</green>"

  # ---------------------- престиж и физический дроп ----------------------
  prestige-usage: "<yellow>Использование: /skills prestige [<навык>|all] · без аргумента — меню престижа.</yellow>"
  prestige-disabled: "<red>Престиж выключен в config.yml.</red>"
  prestige-not-max: "<red>Для престижа нужен %level% уровень выбранных навыков.</red>"
  prestige-at-cap: "<red>Потолок престижа достигнут: не более %cap% ступеней на навык.</red>"
  prestige-confirm: "<gold>Внимание: выбранные навыки будут сброшены до 1 уровня, ступени престижа сохранятся. Повторите команду в течение 30 секунд, чтобы подтвердить.</gold>"
  prestige-done: "<green>✦ Новый цикл! Серверный престиж %total% · звание %title%. Алмазы выданы предметом.</green>"
  prestige-tier-announce: "<gold>✦ %player% достиг звания %title% (престиж %count%) и получил %diamonds% алмазов!</gold>"
  prestige-top-header: "<gold>✦ Топ престижа сервера</gold>"
  prestige-top-line: "<gray>%place%. <white>%name%</white> — %total%</gray>"
  prestige-top-empty: "<gray>Пока никто не брал престиж.</gray>"
  extra-catch: "<aqua>Рыбалка: лишний улов!</aqua>"
  arrow-kept: "<gray>Стрельба: стрела сохранена.</gray>"
  extra-potion: "<light_purple>Алхимия: вторая порция ингредиента.</light_purple>"
  enchant-bonus: "<light_purple>Зачарование: чара усилена на уровень.</light_purple>"
  enchant-refund: "<green>Зачарование: возвращено <white>%levels%</white> уровней опыта.</green>"

  # -------------------------------- профиль ----------------------------------
  profile-title: "Навыки"
  profile-level: "<gray>Суммарный уровень: </gray><white>%level%</white> <dark_gray>·</dark_gray> <gray>опыт </gray><white>%xp%</white>"
  profile-best: "<gray>Лучший навык: </gray><white>%skill%</white> <gray>(ур. %level%)</gray>"

  # -------------------------------- витрина --------------------------------
  menu-title: "<gold>Навыки и дерево перков</gold>"
  # ---------------------------------- вкладки ------------------------------------
  # Один инвентарь /skills: верхний ряд переключает разделы без второго окна.
  menu-tab-skills: "<gold>Навыки</gold>"
  menu-tab-tree: "<aqua>Дерево перков</aqua>"
  menu-tab-selected: "<green>▸ Открытая вкладка</green>"
  menu-tab-hint: "<gray>Клик — переключить раздел</gray>"
  menu-tab-domain: "<gold>%domain%</gold> <gray>· стр. %page%/%pages%</gray>"
  menu-tab-domain-hint: "<gray>Клик — сменить домен дерева</gray>"
  menu-guide-button: "<yellow>Как качать навыки и дерево</yellow>"
  menu-guide:
    - '<gold>Как всё прокачивается</gold>'
    - '<gray>1. Навыки растут от честных действий: копать, рубить, сражаться, ловить рыбу, варить и чаровать.</gray>'
    - '<gray>2. Уровень навыка 1..100. На каждом навыке 12 ступеней перков: %steps%.</gray>'
    - '<gray>3. Ступени открываются сами по уровню, покупать их не нужно; сумма бонусов на 100 уровне прежняя.</gray>'
    - '<gray>4. Вкладка «Дерево перков» ведёт к отдельному дереву за токены и пыль: уровень домена = уровень класса × 2.</gray>'
    - '<gray>5. Пыль даётся только за подтверждённую смерть естественного моба: +5 за моба, дневной потолок 2000.</gray>'
    - '<gray>6. /perktree открывает это же окно сразу на вкладке дерева; /perktree info [домен] — сводка.</gray>'
    - '<gray>7. На 100 уровне доступен престиж: /skills prestige [<навык>|all], вкладка «Престиж» показывает звания и бонусы.</gray>'
    - '<gray>8. Алмазы падают предметом из блоков и мобов: шанс зависит от уровня, престижа и ранга, а выплата и дневной лимит жёстко ограничены. Престиж ускоряет набор лимита, не увеличивая дроп за блок.</gray>'
    - '<dark_gray>Все вкладки — одно меню: клик по верхнему ряду только перерисовывает слоты.</dark_gray>'
  menu-top-hint: "<gray>Суммарный опыт всех навыков</gray>"
  menu-tree-unavailable: "<red>Дерево перков недоступно: установите CHRDK_Classes.</red>"
  menu-tree-no-tree: "<yellow>Выберите класс командой /class, чтобы открыть дерево перков.</yellow>"
  menu-steps-title: "<gold>Двенадцать ступеней</gold>"
  menu-top: "<gold>Топ игроков</gold>"
  menu-close: "<red>Закрыть</red>"
  menu-skill-name: "<gold>%name%</gold> <dark_gray>·</dark_gray> <white>уровень %level%</white>"
  menu-skill-progress: "<gray>%bar%</gray> <white>%current%/%need%</white> <dark_gray>(%percent%%)</dark_gray>"
  # На 100 уровне опыта «до следующего» нет: показываем МАКС и накопленный XP,
  # а не бессмысленное «305332/0 (100%)».
  menu-skill-progress-max: "<gray>%bar%</gray> <green>МАКС · %xp% опыта</green>"
  menu-skill-steps: "<gray>Ступени: <white>%steps%</white></gray>"
  menu-skill-next: "<gray>Следующая ступень: <white>%perk%</white> на %level% уровне</gray>"
  menu-skill-max: "<green>Все ступени открыты.</green>"
  menu-skill-click: "<aqua>Клик — карточка навыка с 12 ступенями</aqua>"
  menu-summary-name: "<gold>Всего уровней: %total%</gold>"
  menu-summary-perks: "<gray>Ступеней открыто: <white>%unlocked%/%all%</white></gray>"
  menu-summary-xp: "<gray>Опыта накоплено: <white>%xp%</white></gray>"
  menu-summary-prestige: "<gray>Престиж: </gray><white>%count%</white>"
  profile-prestige: "<gray>Престиж: </gray><white>%total%/%max%</white> <dark_gray>·</dark_gray> <light_purple>%title%</light_purple>"

