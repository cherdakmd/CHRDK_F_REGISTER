  menu-prestige-skill-cap: "<dark_gray>Потолок ступеней достигнут.</dark_gray>"
  menu-prestige-top-button: "<gold>Топ престижа сервера</gold>"
  menu-prestige-top-line: "<gray>%place%. <white>%name%</white> — %total%</gray>"
