# CHRDK_Skills — тексты навыков и перков: имена и описания (skill.<ид>,
# perk.<ид>), витрина, уведомления и админские команды. Иды перков приходят
# из SkillRegistry, здесь меняются только подписи.
messages:
  player-only: "<red>Эта команда только для игроков.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  unknown-skill: "<red>Неизвестный навык. Доступны: <white>mining, woodcutting, digging, farming, fishing, combat, archery, defense, alchemy, enchanting</white>.</red>"
  skills-disabled: "<red>Навыки выключены в config.yml.</red>"

  # ------------------------------ уведомления ------------------------------
  level-up: "<gold>✦ <white>%skill%</white> — уровень <yellow>%level%</yellow>!</gold>"
  actionbar-level: "<gold>%skill% → %level%</gold>"
  milestone: "<green>Награда за уровень <white>%level%</white>: <aqua>%diamonds% алмазов в /bal</aqua>. При полном/недоступном банке выплата сохранена.</green>"
  extra-catch: "<aqua>Рыбалка: лишний улов!</aqua>"
  arrow-kept: "<gray>Стрельба: стрела сохранена.</gray>"
  extra-potion: "<light_purple>Алхимия: вторая порция ингредиента.</light_purple>"
  enchant-bonus: "<light_purple>Зачарование: чара усилена на уровень.</light_purple>"
  enchant-refund: "<green>Зачарование: возвращено <white>%levels%</white> уровней опыта.</green>"

  # -------------------------------- профиль ----------------------------------
  profile-title: "Навыки"
  profile-level: "<gray>Суммарный уровень: </gray><white>%level%</white> <dark_gray>·</dark_gray> <gray>опыт </gray><white>%xp%</white>"
  profile-best: "<gray>Лучший навык: </gray><white>%skill%</white> <gray>(ур. %level%)</gray>"

  # -------------------------------- витрина --------------------------------
  menu-title: "<gold>Навыки</gold>"
  menu-top: "<gold>Топ игроков</gold>"
  menu-close: "<red>Закрыть</red>"
  menu-skill-name: "<gold>%name%</gold> <dark_gray>·</dark_gray> <white>уровень %level%</white>"
  menu-skill-progress: "<gray>%bar%</gray> <white>%current%/%need%</white> <dark_gray>(%percent%%)</dark_gray>"
  menu-skill-next: "<gray>Следующий перк: <white>%perk%</white> на %level% уровне</gray>"
  menu-skill-max: "<green>Все перки открыты.</green>"
  menu-skill-click: "<aqua>Клик — карточка навыка</aqua>"
  menu-summary-name: "<gold>Всего уровней: %total%</gold>"
  menu-summary-perks: "<gray>Перков открыто: <white>%unlocked%/%all%</white></gray>"
  menu-summary-xp: "<gray>Опыта накоплено: <white>%xp%</white></gray>"
  detail-title: "<gold>%name%</gold>"
  detail-progress: "<gray>%bar%</gray> <dark_gray>(%percent%%)</dark_gray>"
  detail-xp: "<gray>Опыт: <white>%into%/%need%</white></gray>"
  detail-back: "<yellow>Назад к навыкам</yellow>"
  perk-name-active: "<green>%name%</green> <dark_gray>· %level%</dark_gray>"
  perk-name-locked: "<dark_gray>%name% · %level%</dark_gray>"
  perk-desc: "<gray>%text%</gray>"
  perk-active: "<green>✦ Работает</green>"
  perk-locked: "<dark_gray>Откроется позже</dark_gray>"

  # ------------------------------- текстовая --------------------------------
  list-header: "<gold>Навыки · суммарный уровень %total%</gold>"
  list-line: "<gold>%name%</gold> <dark_gray>·</dark_gray> <white>%level%</white> <gray>%bar%</gray> <dark_gray>%current%/%need%</dark_gray>"
  list-footer: "<gray>Карточка навыка: <yellow>/skills <навык></yellow> · витрина: <yellow>/skills</yellow></gray>"
  card-header: "<dark_gray>────</dark_gray> <gold>%name%</gold> <dark_gray>· уровень %level% ────</dark_gray>"
  card-desc: "<gray>%text%</gray>"
  card-progress: "<gray>%bar%</gray> <white>%current%/%need%</white> <dark_gray>(%percent%%)</dark_gray>"
  card-perk-active: "<green>✔ %level% — %name%</green> <gray>%desc%</gray>"
  card-perk-locked: "<dark_gray>✖ %level% — %name% · %desc%</dark_gray>"
  card-footer: "<dark_gray>Вехи наград: 10, 25, 50, 75 и 100 уровни.</dark_gray>"
  top-header: "<gold>Топ навыков</gold> <dark_gray>(суммарный опыт)</dark_gray>"
  top-empty: "<gray>Пока никто не качал навыки.</gray>"
  top-line: "<gold>%place%.</gold> <white>%name%</white> <dark_gray>·</dark_gray> <yellow>%level% ур.</yellow> <dark_gray>(%xp% опыта)</dark_gray>"

  # ------------------------------- админские --------------------------------
  admin-reloaded: "<green>Конфиг навыков перечитан.</green>"
  admin-player-not-found: "<red>Игрок не найден в сети.</red>"
  admin-usage: "<yellow>/skillsadmin reload|givexp <ник> <навык> <опыт>|setlevel <ник> <навык> <уровень>|reset <ник></yellow>"
  admin-reset: "<green>Навыки игрока <white>%player%</white> сброшены.</green>"
  admin-gave-xp: "<green>%player%: +%xp% опыта навыка %skill%, теперь уровень %level%.</green>"
  admin-set-level: "<green>%player%: навык %skill% установлен на уровень %level%.</green>"

