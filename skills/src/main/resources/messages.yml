  ability-energy: "<gray>Выносливость: <aqua>%energy%/%max%</aqua> · восстановление +2/сек онлайн</gray>"
  ability-hud: "<aqua>%energy%/100</aqua> <dark_gray>·</dark_gray> %name% <gray>· %seconds% сек.</gray>"
  ability-card: "<gray>Уровень: %level% · цена: %cost% · окно: %seconds% сек. · пауза: %cooldown% сек.</gray>"
  ability-card-ready: "<gray>Остаток перезарядки: %time% сек.</gray>"
  ability-card-click: "<yellow>Нажмите для подготовки. Цена списывается сразу; неиспользованное окно не возвращает ресурс.</yellow>"
  ability.mining.name: "<gold>Бережная кирка</gold>"
  ability.mining.desc: "<gray>8 секунд: не расходует 1 единицу износа кирки при каждом обычном разрушении подходящего блока. Без ускорения и дополнительного дропа.</gray>"
  ability.woodcutting.name: "<gold>Бережный замах</gold>"
  ability.woodcutting.desc: "<gray>8 секунд: экономит 1 единицу износа топора при обычной рубке подходящего дерева. Не срубает дерево целиком.</gray>"
  ability.digging.name: "<gold>Точная лопата</gold>"
  ability.digging.desc: "<gray>8 секунд: экономит 1 единицу износа лопаты при обычном копании подходящих блоков. Чужие приваты не обходятся.</gray>"
  ability.combat.name: "<gold>Сбивающий удар</gold>"
  ability.combat.desc: "<gray>Следующий успешный прямой удар мечом/топором по враждебному мобу: Слабость I на 3 секунды. Без дополнительного урона. Только PvE.</gray>"
  ability.archery.name: "<gold>Метка охотника</gold>"
  ability.archery.desc: "<gray>Следующая успешная стрела, выпущенная после подготовки: подсвечивает враждебного моба на 8 секунд. Только PvE, без прибавки урона.</gray>"
  ability.defense.name: "<gold>Сдерживание</gold>"
  ability.defense.desc: "<gray>Следующий полученный удар враждебного моба: Замедление I атакующему на 3 секунды. Нужен щит. Урон не отменяется. Только PvE.</gray>"

