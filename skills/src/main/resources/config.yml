# Денежные награды вех поступают в /bal, без предметной выдачи и drops.
# При cap/недоступном банке долг сохраняется в milestone-awards.json; не удаляйте ledger.
# CHRDK_Skills — 10 навыков с уровнями 1..150 и 120 ступенями перков. Опыт живёт в
# Автопосадка с 1.4.220 расходует одно реальное обычное семя на зрелую культуру;
# с чарой мотыги использует одну общую очередь Core, уважает приваты и отмены.
# skills.json (по UUID), уровень выводится из опыта: менять кривую можно без
# миграции, но уже набранные уровни пересчитаются.
#
# Кривая: опыт за уровень = (base-xp + xp-growth * (уровень - 1)) × ступень
# тира. Тир — каждые 10 уровней: 1–10, 11–20 …; ступень = 1 + xp-tier-step *
# тир. По умолчанию (100 + 25 × (уровень - 1)) × (1 + 0.5 × тир): 1-й переход
# стоит 100 опыта, с 11-го уровня — 525, переход 99→100 — 14 025, весь путь
# 1..100 — 523 662 опыта, 1..150 — 1 644 105 опыта. После каждого тира прокачка
# заметно сложнее; xp-tier-step: 0 возвращает прежнюю линейную кривую
# (131 175 опыта до 100-го).
leveling:
  # Максимальный уровень навыка (20..500).
  max-level: 150
  # Опыт за переход с 1-го на 2-й уровень.
  base-xp: 100
  # Прибавка опыта за каждый следующий уровень.
  xp-growth: 25
  # Ступени тиров: каждые 10 уровней стоимость уровней умножается на
  # (1 + xp-tier-step × тир), тир = (уровень - 1) / 10 (0..14). 0 — прежняя
  # линейная кривая без ступеней.
  xp-tier-step: 0.5
  # Общий множитель опыта сервера (0..100). 0.5 — вдвое медленнее, 2 — вдвое
  # быстрее. Полезно для тестовых и сезонных серверов.
  xp-rate: 1.0

general:
  locale: ru
  # Главный выключатель: false — опыт не начисляется, витрина закрыта,
  # атрибутные перки снимаются. Данные игроков сохраняются.
  enabled: true
  # Раз в сколько тиков обновляются атрибутные перки (10..200). Модификаторы
  # живут недолго и переставляются этим пульсом, поэтому потеря после
  # перезахода лечится сама.
  refresh-ticks: 40

feedback:
  # Писать в чат поздравление при новом уровне.
  announce: true
  # Дублировать уровень короткой строкой над хотбаром.
  actionbar: true
  # Звук повышения уровня.
  sounds: true

limits:
  # Сколько секунд помнить поставленный блок: сломанный в этом окне блок не
  # даёт ни опыта, ни двойной добычи. Защита от «поставь-сломай».
  placed-block-seconds: 300
  # Сколько блоков помнить на весь сервер (64..1000000).
  placed-block-max: 20000
  # Потолок опыта за одно действие события: урон, дроп и зелья не могут
  # выдать больше. Для админских команд не действует.
  max-xp-per-action: 100
  # Считать разрушение блоков и бой в креативе и спектаторе. false — честная
  # игра: креатив не качает навыки.
  count-creative: false
  # Сколько строк в /skills top (3..50).
  leaderboard-size: 10

# Опыт за одно действие по навыкам. xp — единицы действия: один блок, одна
# рыба, один пункт урона (не больше 10 за удар), одно зачарование, одна
# варка. Отдельный множитель навыка — для точечного баланса.
skills:
  mining:
    enabled: true
    xp: 3
    xp-multiplier: 1.0
  woodcutting:
    enabled: true
    xp: 4
    xp-multiplier: 1.0
  digging:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  farming:
    enabled: true
    xp: 4
    xp-multiplier: 1.0
  fishing:
    enabled: true
    xp: 8
    xp-multiplier: 1.0
  combat:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  archery:
    enabled: true
    xp: 3
    xp-multiplier: 1.0
  defense:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  alchemy:
    enabled: true
    xp: 12
    xp-multiplier: 1.0
  enchanting:
    enabled: true
    xp: 20
    xp-multiplier: 1.0

# Награды за уровни-вехи. Каждая веха любого навыка выдаётся один раз на
# игрока: деньги приходят в /bal через MilestoneAwards (не предметом в
# инвентарь), при недоступном банке обязательство сохраняется в ledger.
# Не перечисляйте уровни выше max-level — они будут пропущены с предупреждением в логе.
milestones:
  10:
    diamonds: 4
  25:
    diamonds: 8
  50:
    diamonds: 16
  75:
    diamonds: 24
  100:
    diamonds: 40

# Перерождение (10 ноября 2026, п.30): когда все десять навыков на
# максимальном уровне (max-level), игрок командой /skills rebirth confirm
# (дважды, с подтверждением)
# полностью сбрасывает персонажа — уровни навыков, атрибуты и ветки — и
# получает постоянные награды. Перерождение повторяется многократно: титул
# растёт (Перерождение I, II, ...), множитель опыта накапливается с убывающей
# отдачей (потолок +50%), каждый раз выдаются алмазы и случайный уникальный
# предмет из пула без повторов, на вехах 5/10/25/50 (далее каждые 25) —
# особые награды и анонс. Старый престиж конвертирован при загрузке:
# каждые 10 ступеней суммарно — одно перерождение.
rebirth:
  enabled: true
  # Процент опыта за первое перерождение; каждое следующее добавляет
  # percent * decay^n — отдача убывает, суммарный бонус не пробивает
  # xp-bonus-cap-percent (5.0 и 0.9: 10 перерождений ≈ +32.5%).
  xp-percent-per-rebirth: 5.0
  xp-decay: 0.9
  xp-bonus-cap-percent: 50.0
  # Физические алмазы предметом за каждое перерождение (0..256).
  diamonds-per-rebirth: 32
  # Доплата алмазами за веху перерождения (0..2048).
  milestone-diamonds: 128
  # Объявлять веху перерождения в общий чат.
  announce-milestones: true
  # Пул уникальных предметов: каждый id выдаётся игроку один раз, потом
  # вместо предмета падают удвоенные алмазы. material — Bukkit-материал,
  # name/lore — подписи предмета.
  unique-items:
    - id: heart_of_the_sea
      material: HEART_OF_THE_SEA
      name: "Сердце перерождения"
      lore:
        - "Талисман тех, кто начинал заново."
    - id: nether_star
      material: NETHER_STAR
      name: "Звезда возрождения"
      lore:
        - "Свет на месте сгоревшей жизни."
    - id: dragon_egg
      material: DRAGON_EGG
      name: "Яйцо дракона перерождений"
      lore:
        - "Из него вылупится то, чем ты станешь."

# Физические алмазы из блоков и мобов вместо «вехи закончились — заработок
# встал». Ранг осознанно влияет и на шанс, и на количество (решение владельца);
# потолки зашиты в DiamondDrops, конфиг их не пробьёт. Дневной лимит считается
# по календарной дате Europe/Moscow и режет фермы/авто-майнеры.
diamonds:
  enabled: true
  # Шанс на блок: base + level-bonus * доля пути 1..100 + ранг + престиж.
  base-chance: 0.01
  level-chance-bonus: 0.04
  rank-chance-per-level: 0.01
  rank-xp-chance-bonus: 0.03
  prestige-chance: 0.01
  max-chance: 0.20
  # Количество за один выпад (до потолка): база + уровень + ранг + престиж.
  base-amount: 1
  level-amount-bonus: 2
  prestige-amount-bonus: 1
  max-amount: 4
  # База персонального дневного лимита. Сверху прибавляются надбавки из cap.*:
  # ранг, престиж, суммарный уровень, Pass, буст наград и донатный entitlement.
  daily-cap: 256
  # Мобы реже блоков, но щедрее: отдельные множители.
  mob-chance-factor: 1.5
  mob-amount-bonus: 1
  # Ванильная руда уже даёт алмазы — бонусный дроп с неё не добавляем.
  excluded-materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]

  # Персональный дневной лимит: аддитивные надбавки за прокачку игрока.
  # Всё в алмазах в сутки; день считается по Europe/Moscow, счётчик в skills.json.
  # Итог зажимается в 1..min(cap.max, MAX_DAILY_CAP=4096 из кода).
  # Прокачка меняет ТОЛЬКО дневной бюджет: шанс и стак за выпадение не растут.
  cap:
    # За каждую ступень платного ранга (0..5).
    per-rank-level: 32
    # За каждый процент бонуса опыта ранга (0..50).
    per-rank-xp-percent: 1
    # За каждый процент бонуса добычи ранга (0..25).
    per-rank-drop-percent: 2
    # За каждый дополнительный уровень навыков ранга (0..10).
    per-rank-extra-skill: 4
    # За каждую ступень престижа по всем навыкам (0..100).
    per-prestige: 4
    # За каждые полные 10 суммарных уровней навыков (0..1000).
    per-ten-levels: 2
    # Действующий Pass / ранг ядра.
    pass-bonus: 64
    # Активный буст наград ядра (reward boost).
    reward-boost-bonus: 64
    # Действующий донатный entitlement с этим productId.
    entitlement-bonus: 32
    entitlement-id: "diamond-cap-boost"
    # Мягкий потолок конфига; жёсткий предел 4096 зашит в DiamondDrops.
    max: 4096

# Активные приёмы после первого престижа навыка: ПКМ инструментом.
# Каждая ступень I..X продлевает окно, снижает цену/паузу и усиливает эффект.
# X «Совершенная форма» не расходует выносливость и имеет особый анонс/эффект.
# 100 выносливости, +2 за секунду авторизованного онлайна в выживании.
# Офлайн не восстанавливает ресурс. Таймеры/запас: abilities.json; XP не меняется.
# Нет ключей в старом конфиге — включено. Значения стоимости/потолков — в коде.
abilities:
  enabled: true
  # Короткая строка раз в секунду только пока приём подготовлен. Без чат-спама.
  hud: true

# PDC-кристаллы опыта по 250 базовых XP: редкий дроп с игровых действий и
# покупка в меню /skills (Кузня /shop кристаллы не продаёт). Каждому навыку
# свой кристалл: шахтёрству — горное дело, лесорубству — лесорубство,
# земледелию — земледелие, рыбалке — рыбалка; с мобов падают боевые (ближний
# бой/стрельба), защита — с ударов мобов, алхимия и зачарование — со своих
# действий. Кристаллы стакуются до 64 и используются правым кликом без
# суточного лимита; пауза между кристаллами настраивается (cooldown-seconds,
# по умолчанию 0 — без паузы); сила зависит от престижа и ранга. Старые
# зелья опыта остаются рабочими и конвертируются в кристаллы при входе.
xp-potions:
  # Выключите полностью: без дропа, без использования, без покупки.
  enabled: true
  # Покупка кристаллов в меню /skills.
  shop-enabled: true
  # Цена одного кристалла в алмазах; при неверной цене покупка закрывается.
  price: 96
  # Стак при Shift+покупке в меню /skills: 1–64 штук за одну оплату.
  shop-stack-size: 64
  # Задержка между кликами по кристаллам магазина, миллисекунды (0 — без задержки).
  shop-click-cooldown-ms: 750
  # Шанс дропа за действие: (base-chance + серия × streak-step) × тир × ранг,
  # с потолком 5%. Серия — действия без дропа, сбрасывается при дропе.
  # Тир моба: 2,0 босс/больше 60 HP; 1,5 больше 20 HP; 1,0 обычный и действия.
  base-chance: 0.02
  streak-step: 0.002
  # Жёсткий pity: серия в 25 действий без дропа гарантирует кристалл.
  pity-kills: 25
  # Пауза между кристаллами, секунды (0 и больше). 0 — использование без паузы.
  cooldown-seconds: 0
  # Награда за кристалл, когда навык уже на потолке: опыт навыка некуда,
  # кристалл приносит деньги в /bal. Держите значение меньше цены магазина
  # (price), иначе покупка и обратный обмен образуют бесконечную монету.
  # 0 — на максимуме награды нет.
  money-reward: 48
