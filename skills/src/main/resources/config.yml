# Денежные награды вех поступают в /bal, без предметной выдачи и drops.
# При cap/недоступном банке долг сохраняется в milestone-awards.json; не удаляйте ledger.
# CHRDK_Skills — 10 навыков с уровнями 1..100 и 120 ступенями перков. Опыт живёт в
# Автопосадка с 1.4.220 расходует одно реальное обычное семя на зрелую культуру;
# с чарой мотыги использует одну общую очередь Core, уважает приваты и отмены.
# skills.json (по UUID), уровень выводится из опыта: менять кривую можно без
# миграции, но уже набранные уровни пересчитаются.
#
# Кривая: опыт за уровень = base-xp + xp-growth * (уровень - 1).
# По умолчанию 1-й переход стоит 100 опыта, последний (99-й) — 2 550, весь
# путь 1..100 — 131 175 опыта. Это линейный рост: первые уровни берутся за
# вечер, сотое место в навыке — за долгую игру.
leveling:
  # Максимальный уровень навыка (20..500).
  max-level: 100
  # Опыт за переход с 1-го на 2-й уровень.
  base-xp: 100
  # Прибавка опыта за каждый следующий уровень.
  xp-growth: 25
  # Общий множитель опыта сервера (0..100). 0.5 — вдвое медленнее, 2 — вдвое
  # быстрее. Полезно для тестовых и сезонных серверов.
  xp-rate: 1.0

general:
  locale: ru
  # Главный выключатель: false — опыт не начисляется, витрина закрыта,
  # атрибутные перки снимаются. Данные игроков сохраняются.
  enabled: true
  # Раз в сколько тиков обновляются атрибутные перки (10..200). Модификаторы
  # живут недолго и переставляются этим пульсом, поэтому потеря после
  # перезахода лечится сама.
  refresh-ticks: 40

feedback:
  # Писать в чат поздравление при новом уровне.
  announce: true
  # Дублировать уровень короткой строкой над хотбаром.
  actionbar: true
  # Звук повышения уровня.
  sounds: true

limits:
  # Сколько секунд помнить поставленный блок: сломанный в этом окне блок не
  # даёт ни опыта, ни двойной добычи. Защита от «поставь-сломай».
  placed-block-seconds: 300
  # Сколько блоков помнить на весь сервер (64..1000000).
  placed-block-max: 20000
  # Потолок опыта за одно действие события: урон, дроп и зелья не могут
  # выдать больше. Для админских команд не действует.
  max-xp-per-action: 100
  # Считать разрушение блоков и бой в креативе и спектаторе. false — честная
  # игра: креатив не качает навыки.
  count-creative: false
  # Сколько строк в /skills top (3..50).
  leaderboard-size: 10

# Опыт за одно действие по навыкам. xp — единицы действия: один блок, одна
# рыба, один пункт урона (не больше 10 за удар), одно зачарование, одна
# варка. Отдельный множитель навыка — для точечного баланса.
skills:
  mining:
    enabled: true
    xp: 3
    xp-multiplier: 1.0
  woodcutting:
    enabled: true
    xp: 4
    xp-multiplier: 1.0
  digging:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  farming:
    enabled: true
    xp: 4
    xp-multiplier: 1.0
  fishing:
    enabled: true
    xp: 8
    xp-multiplier: 1.0
  combat:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  archery:
    enabled: true
    xp: 3
    xp-multiplier: 1.0
  defense:
    enabled: true
    xp: 2
    xp-multiplier: 1.0
  alchemy:
    enabled: true
    xp: 12
    xp-multiplier: 1.0
  enchanting:
    enabled: true
    xp: 20
    xp-multiplier: 1.0

# Награды за уровни-вехи. Каждая веха любого навыка выдаётся один раз на
# игрока: деньги приходят в /bal через MilestoneAwards (не предметом в
# инвентарь), при недоступном банке обязательство сохраняется в ledger.
# Не перечисляйте уровни выше max-level — они будут пропущены с предупреждением в логе.
milestones:
  10:
    diamonds: 4
  25:
    diamonds: 8
  50:
    diamonds: 16
  75:
    diamonds: 24
  100:
    diamonds: 40

# Престиж (6 ноября 2026): потолок уровня остаётся 100, но игрок добровольно
# сбрасывает навык командой /skills prestige <навык> (дважды, с подтверждением)
# или все готовые навыки разом — /skills prestige all. Ступень престижа
# сохраняется по каждому навыку; сумма по 10 навыкам даёт серверный уровень
# и звание. Пороги и звания зашиты в PrestigeMath: 0 Странник, 5 Подмастерье,
# 15 Ветеран, 30 Мастер, 60 Легенда сервера, 100 Миф сервера. Потолок — 10
# ступеней на навык, 100 на игрока: бесконечного разгона нет.
prestige:
  enabled: true
  # Множитель опыта на повторную прокачку за каждую ступень (итого ≤ ×1.5).
  xp-per-step: 0.03
  # Прибавка к профильному перку за ступень (доля ≤ 0.15, броня ≤ 3.0).
  perk-per-step: 0.01
  # Физические алмазы за каждую новую ступень; за звание — из PrestigeMath.
  diamonds-per-step: 4
  # Объявлять новое звание в общий чат.
  announce-tiers: true
  # Баланс прокачки: майнинг дешевле остальных, поэтому игроки сбрасывали
  # только его. Отрыв ступени от минимальной среди ВКЛЮЧЁННЫХ навыков даёт
  # три зоны: полный XP до allowance, убывающий XP в мягкой зоне, стоп с
  # hard-cap. Правило общее для всех десяти навыков: запрет только майнинга
  # переехал бы на рыбалку. Дроп алмазов и перки не затрагиваются.
  balance:
    enabled: true
    # База разрешённого отрыва для ВСЕХ игроков (0..10). Профиль с отрывом 2
    # после обновления JAR получает полный XP — амнистия без миграции данных.
    # Ослабший (>0) старый max-lead из чужого config.yml читается как фолбэк
    # для base-max-lead; новые значения владельца не перезаписываются. Штатный
    # 0 из rc.6 был строгим паритетом, а не правкой владельца, поэтому он не
    # отменяет новую базу 2: обновление JAR сразу амнистирует отрыв 2.
    base-max-lead: 2
    # Аддитивка сверх базы по эффективной ступени ранга 0..5 (особые звания
    # входят). Итого: без ранга 2, L1/L2 3, L3/L4 4, L5 5. Ранг расширяет
    # только зону без штрафа; пол XP и hard-cap одинаковы для всех.
    rank-max-lead: [0, 1, 1, 2, 2, 3]
    # Отрыв, с которого опыт останавливается у всех, включая топ-ранг (1..10).
    hard-cap: 8
    # Падение множителя за каждую ступень сверх разрешённой: 1.0 → 0.75 →
    # 0.50 → пол. При factor > 0 за действие начисляется хотя бы 1 XP.
    soft-step: 0.25
    # Пол множителя в мягкой зоне (0..1).
    min-xp-factor: 0.25
    # Кулдаун actionbar-подсказки, секунды (1..3600). В чат уходит только
    # одно короткое сообщение при смене состояния, а не на каждое действие.
    # Штатные 60 из rc.6 были кулдауном чата и при замене JAR читаются как 5;
    # владельческие значения, отличные от 60, сохраняются.
    notice-seconds: 5

# Физические алмазы из блоков и мобов вместо «вехи закончились — заработок
# встал». Ранг осознанно влияет и на шанс, и на количество (решение владельца);
# потолки зашиты в DiamondDrops, конфиг их не пробьёт. Дневной лимит считается
# по календарной дате Europe/Moscow и режет фермы/авто-майнеры.
diamonds:
  enabled: true
  # Шанс на блок: base + level-bonus * доля пути 1..100 + ранг + престиж.
  base-chance: 0.01
  level-chance-bonus: 0.04
  rank-chance-per-level: 0.01
  rank-xp-chance-bonus: 0.03
  prestige-chance: 0.01
  max-chance: 0.20
  # Количество за один выпад (до потолка): база + уровень + ранг + престиж.
  base-amount: 1
  level-amount-bonus: 2
  prestige-amount-bonus: 1
  max-amount: 4
  # База персонального дневного лимита. Сверху прибавляются надбавки из cap.*:
  # ранг, престиж, суммарный уровень, Pass, буст наград и донатный entitlement.
  daily-cap: 256
  # Мобы реже блоков, но щедрее: отдельные множители.
  mob-chance-factor: 1.5
  mob-amount-bonus: 1
  # Ванильная руда уже даёт алмазы — бонусный дроп с неё не добавляем.
  excluded-materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]

  # Персональный дневной лимит: аддитивные надбавки за прокачку игрока.
  # Всё в алмазах в сутки; день считается по Europe/Moscow, счётчик в skills.json.
  # Итог зажимается в 1..min(cap.max, MAX_DAILY_CAP=4096 из кода).
  # Прокачка меняет ТОЛЬКО дневной бюджет: шанс и стак за выпадение не растут.
  cap:
    # За каждую ступень платного ранга (0..5).
    per-rank-level: 32
    # За каждый процент бонуса опыта ранга (0..50).
    per-rank-xp-percent: 1
    # За каждый процент бонуса добычи ранга (0..25).
    per-rank-drop-percent: 2
    # За каждый дополнительный уровень навыков ранга (0..10).
    per-rank-extra-skill: 4
    # За каждую ступень престижа по всем навыкам (0..100).
    per-prestige: 4
    # За каждые полные 10 суммарных уровней навыков (0..1000).
    per-ten-levels: 2
    # Действующий Pass / ранг ядра.
    pass-bonus: 64
    # Активный буст наград ядра (reward boost).
    reward-boost-bonus: 64
    # Действующий донатный entitlement с этим productId.
    entitlement-bonus: 32
    entitlement-id: "diamond-cap-boost"
    # Мягкий потолок конфига; жёсткий предел 4096 зашит в DiamondDrops.
    max: 4096

# Активные приёмы после первого престижа навыка: ПКМ инструментом.
# Каждая ступень I..X продлевает окно, снижает цену/паузу и усиливает эффект.
# X «Совершенная форма» не расходует выносливость и имеет особый анонс/эффект.
# 100 выносливости, +2 за секунду авторизованного онлайна в выживании.
# Офлайн не восстанавливает ресурс. Таймеры/запас: abilities.json; XP не меняется.
# Нет ключей в старом конфиге — включено. Значения стоимости/потолков — в коде.
abilities:
  enabled: true
  # Короткая строка раз в секунду только пока приём подготовлен. Без чат-спама.
  hud: true

# PDC-зелья по 250 базовых XP: редкий дроп с враждебных мобов и дорогой /shop forge.
# Суточный лимит 2..8 и сила зависят от прокачки, престижа и платного ранга.
xp-potions:
  enabled: true
  mob-drop-chance: 0.002
