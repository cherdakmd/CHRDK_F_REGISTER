name: CHRDK_Skills
version: ${version}
main: ru.cherdakmd.chrdkskills.SkillsPlugin
api-version: '26.3'
description: "10 навыков 1..100, 12 ступеней перков, престиж после потолка, физический дроп алмазов с потолками, единое меню с вкладками и деревом перков, антинакрутка и транзитные атрибуты"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  skills:
    description: "Единое меню: навыки, дерево перков, топ и престиж; звания, бонусы и топ престижа"
    usage: "/skills [menu|list|top|rating|tree [домен]|perks|energy|prestige [<навык>|all]|prestigetop|balance|use <навык>|<навык>]"
  skillsadmin:
    description: "Администрирование навыков"
    permission: chrdkskills.admin
    usage: "/skillsadmin <reload|givexp <ник> <навык> <опыт>|setlevel <ник> <навык> <уровень>|reset <ник>>"
permissions:
  chrdkskills.use:
    description: "Смотреть навыки, список и топ"
    default: true
  chrdkskills.admin:
    description: "Администрирование навыков"
    default: op
