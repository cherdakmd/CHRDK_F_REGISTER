name: CHRDK_VK
version: '${version}'
main: ru.cherdakmd.chrdkvk.VkPlugin
api-version: '26.3'
depend:
  - CHRDK_Core
# Счётчики TAB (%chrdksocial_*) регистрируются как PlaceholderExpansion: PAPI
# должен включиться ДО CHRDK_VK, иначе expansion не зарегистрируется и в TAB
# останется сырой текст плейсхолдеров.
softdepend:
  - PlaceholderAPI
description: "Единый социальный плагин: обязательная привязка через ВКонтакте или MAX, защита сессий, мосты чата и новости релизов"
commands:
  vk:
    aliases: [vkontakte, вк]
    description: "Интерактивное меню, привязка аккаунта, мост беседы ВКонтакте и уведомления"
    usage: "/<command> [menu|status|link|notify|chat|mentions|unlink|2fa]"
    permission: chrdkvk.use
  vkadmin:
    description: "Администрирование интеграции и беседы ВКонтакте"
    usage: "/<command> [status|lookup|chatban|unlink|setchat|testchat|sync|reload]"
    permission: chrdkvk.admin
  link:
    description: "Показать одноразовый код входа (ВК или MAX)"
    usage: "/<command>"
    permission: chrdksocial.use
  social:
    aliases: [socialadmin]
    description: "Управление обязательной привязкой, чатами MAX и доступом по донату"
    usage: "/<command> [status [ник]|unlink <ник>|emergency <минуты|off>|setchat <bot|news|bridge> <id>|chats|donor|testnews|reload]"
    permission: chrdksocial.use
  max:
    description: "MAX: статус привязки, код входа и известные чаты"
    usage: "/<command> [status|link|chats]"
    permission: chrdksocial.use
permissions:
  chrdksocial.use:
    description: "Просмотр своего кода входа и статуса привязки"
    default: true
  chrdksocial.admin:
    description: "Отвязка игроков, аварийный режим, донат-доступ, настройка чатов MAX и перезагрузка"
    default: op
  chrdksocial.bypass:
    description: "Вход без обязательной привязки к мессенджеру"
    default: op
  chrdkvk.use:
    description: "Использование команды /vk"
    default: true
  chrdkvk.admin:
    description: "Управление CHRDK_VK через /vkadmin"
    default: op
