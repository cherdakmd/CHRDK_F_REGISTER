# Локализация аддона CHRDK_VK (MiniMessage)

vk:
  no-api: "<red>Модуль авторизации CHRDK_Core недоступен.</red>"
  disabled: "<yellow>Интеграция ВКонтакте временно отключена на сервере.</yellow>"
  player-only: "<red>Эта команда доступна только игрокам в игре.</red>"
  need-auth: "<red>Сначала войдите в аккаунт на сервере.</red>"
  not-linked: "<yellow>Ваш аккаунт ещё не привязан к ВКонтакте. Введите <white>/vk link</white>.</yellow>"
  usage: "<gray>Использование: <aqua>/vk</aqua> <dark_gray>|</dark_gray> <white>/vk [status|link|notify|chat|mentions|unlink]</white></gray>"

  state-yes: "<green>да</green>"
  state-no: "<gray>нет</gray>"
  state-on: "<green>вкл</green>"
  state-off: "<red>выкл</red>"
  state-frozen: "<red>заморожен</red>"
  state-active: "<green>разрешён</green>"

  status-header: "<aqua>━━━ Сообщество ВКонтакте CHRDK ━━━</aqua>"
  status-community: "<gray>Группа: <click:open_url:'<url>'><hover:show_text:'<aqua>Открыть группу ВКонтакте</aqua>'><underlined><aqua><url></aqua></underlined></hover></click></gray>"
  status-unlinked: "<yellow>Статус: аккаунт ещё не привязан (<click:run_command:'/vk link'><hover:show_text:'<green>Нажмите, чтобы получить код</green>'><green>/vk link</green></hover></click>).</yellow>"
  status-linked: "<gray>Профиль ВК: <white>id<vk_id></white> <dark_gray>(привязан)</dark_gray></gray>"
  status-membership: "<gray>Подписка на группу: <member> <dark_gray>·</dark_gray> VK Donut: <donut></gray>"
  status-security: "<gray>Оповещения о входах: <notify> <dark_gray>·</dark_gray> Вход в аккаунт: <frozen></gray>"
  status-group-chat: "<gray>Мост беседы ВК: <chat_bridge> <dark_gray>·</dark_gray> Видимость: <receive> <dark_gray>·</dark_gray> Пинг @ник в ВК: <mentions></gray>"
  status-rewards-hint: "<dark_gray>Подсказка: <white>/vk</white> — интерактивное меню · <white>/labels</white> — значок [ВК] у ника.</dark_gray>"

  link-already: "<yellow>Ваш аккаунт уже привязан к профилю <white>id<vk_id></white>. Для смены сначала выполните <white>/vk unlink</white>.</yellow>"
  link-not-configured: "<yellow>Бот сообщества ВКонтакте сейчас не настроен администратором.</yellow>"
  link-cooldown: "<yellow>Подождите ещё <white><seconds> сек.</white> перед запросом нового кода.</yellow>"
  link-code-issued:
    - "<aqua>Одноразовый код привязки ВКонтакте:</aqua> <click:copy_to_clipboard:'<code>'><hover:show_text:'<green>Нажмите, чтобы скопировать код</green>'><bold><gold><code></gold></bold></hover></click> <dark_gray>(действует <minutes> мин.)</dark_gray>"
    - "<gray>Откройте сообщения группы <click:open_url:'<url>'><underlined><aqua><url></aqua></underlined></click> и отправьте туда этот код.</gray>"
  linked-ingame: "<green>✔ Аккаунт успешно привязан к ВКонтакте (<white>id<vk_id></white>)! Настроить уведомления и мост чата: <white>/vk</white>.</green>"

  unlink-confirm-prompt: "<gold>⚠ Вы уверены, что хотите отвязать <white>id<vk_id></white>?</gold> <gray>Повторите <click:run_command:'/vk unlink confirm'><hover:show_text:'<red>Подтвердить отвязку</red>'><underlined><red>/vk unlink confirm</red></underlined></hover></click> в течение 30 сек. (повторная выдача одноразовых XP-бустов невозможна).</gray>"
  unlink-ok: "<yellow>Привязка к профилю ВКонтакте (<white>id<vk_id></white>) снята.</yellow>"
  notify-toggled: "<gray>Уведомления о входах в личные сообщения ВК: <state>.</gray>"
  chat-toggled: "<gray>Отображение сообщений беседы <aqua>[ВК-чат]</aqua> и записей стены: <state>.</gray>"
