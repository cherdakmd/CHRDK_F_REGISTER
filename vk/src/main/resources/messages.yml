messages:
  "vk":
    "no-api": "<red>Ядро CHRDK_Core не найдено — интеграция ВКонтакте недоступна.</red>"
    "disabled": "<yellow>Интеграция ВКонтакте сейчас отключена в настройках сервера.</yellow>"
    "player-only": "<red>Команда доступна только игроку в сети.</red>"
    "need-auth": "<red>Сначала завершите вход в аккаунт (/login), чтобы управлять привязкой ВКонтакте.</red>"
    "usage": "<gray>Использование: <yellow>/vk</yellow> — статус · <yellow>/vk link</yellow> — код привязки · <yellow>/vk notify</yellow> — уведомления · <yellow>/vk unlink</yellow> — отвязать</gray>"
    "status-header": "<gold>=== Интеграция ВКонтакте ===</gold>"
    "status-community": "<gray>Сообщество сервера: </gray><click:open_url:'%url%'><hover:show_text:'<green>Открыть группу ВКонтакте</green>'><aqua><underlined>%url%</underlined></aqua></hover></click>"
    "status-unlinked": "<gray>Статус: <yellow>не привязан</yellow>. Введите </gray><click:run_command:'/vk link'><yellow>/vk link</yellow></click><gray>, чтобы получить код для личных сообщений группы.</gray>"
    "status-linked": "<gray>Статус: <green>привязан</green> (VK ID: <white>id%vk_id%</white>)</gray>"
    "status-membership": "<gray>Подписка на группу: %member% <dark_gray>·</dark_gray> VK Donut: %donut%</gray>"
    "status-security": "<gray>Уведомления о входах: %notify% <dark_gray>·</dark_gray> Заморозка входа: %frozen%</gray>"
    "status-group-chat": "<gray>Мост с беседой группы ВК: %chat_bridge%</gray>"
    "status-rewards-hint": "<dark_gray>Награды без преимущества в бою: XP-буст (+10% опыта), значок в /labels и бонус к сроку покупок для VK Donut. Пароли через ВК не меняются.</dark_gray>"
    "state-yes": "<green>да</green>"
    "state-no": "<gray>нет</gray>"
    "state-on": "<green>вкл</green>"
    "state-off": "<red>выкл</red>"
    "state-frozen": "<red>включена</red>"
    "state-active": "<green>нет</green>"
    "link-already": "<yellow>Ваш аккаунт уже привязан к профилю ВКонтакте (id%vk_id%). Для смены сначала выполните /vk unlink.</yellow>"
    "link-not-configured": "<yellow>Бот сообщества ВКонтакте ещё не настроен администратором (не указан group-id или ключ доступа).</yellow>"
    "link-cooldown": "<yellow>Подождите ещё %seconds% сек. перед запросом нового кода.</yellow>"
    "link-code-issued": |-
      <gold>Код привязки ВКонтакте:</gold> <click:copy_to_clipboard:'%code%'><hover:show_text:'<green>Скопировать код</green>'><yellow><bold>%code%</bold></yellow></hover></click> <gray>(действует %minutes% мин.)</gray>
      <gray>Откройте сообщения группы </gray><click:open_url:'%url%'><aqua><underlined>%url%</underlined></aqua></click><gray> и отправьте боту этот код одним сообщением.</gray>
    "unlink-none": "<yellow>У вашего аккаунта нет активной привязки ВКонтакте.</yellow>"
    "unlink-ok": "<green>✔ Привязка к профилю ВКонтакте (id%vk_id%) снята.</green>"
    "notify-toggled": "<gray>Уведомления в ВК о входах в аккаунт: %state%.</gray>"
    "linked-ingame": "<green>✔ Профиль ВКонтакте (id%vk_id%) успешно привязан к аккаунту!</green>"
    "boost-link-granted": "<gold>✔ Бонус за привязку ВКонтакте: +%hours% ч. игрового XP-буста!</gold>"
    "boost-member-granted": "<gold>✔ Бонус за подписку на группу ВКонтакте: +%hours% ч. игрового XP-буста!</gold>"
    "wall-broadcast": "<dark_gray>[<aqua>ВК</aqua>]</dark_gray> <white>Новая запись в группе:</white> <gray>%preview%</gray> <click:open_url:'%post_url%'><hover:show_text:'<aqua>Открыть запись ВКонтакте</aqua>'><aqua><underlined>[Открыть]</underlined></aqua></hover></click>"
    "profile-title": "<aqua>ВКонтакте</aqua>"
    "profile-linked": "<gray>Профиль: <white>id%vk_id%</white> <dark_gray>·</dark_gray> группа: %member%</gray>"
    "profile-donut": "<gray>VK Donut: %donut% <dark_gray>·</dark_gray> метка: <white>/labels vk</white></gray>"
    "profile-unlinked": "<gray>Не привязан — <white>/vk link</white> (защита входа и XP-буст)</gray>"
  "admin":
    "usage": "<yellow>/vkadmin [status|lookup <ник>|unlink <ник>|setchat <peer_id|off>|testchat [текст]|sync|reload]</yellow>"
    "status": "<gold>[CHRDK_VK]</gold> <gray>API: %configured% · Long Poll: %worker% · беседа: <white>%chat_peer%</white> · привязок: <white>%links%</white> · донов: <white>%donuts%</white> · посл. пост: <white>%last_post%</white></gray>"
    "setchat-ok": "<green>✔ Мост глобального чата привязан к беседе ВКонтакте peer_id=%peer_id%.</green>"
    "setchat-off": "<yellow>Привязка беседы ВКонтакте сброшена (используется значение group-chat.peer-id из config.yml: %config_peer%).</yellow>"
    "setchat-invalid": "<red>Неверный peer_id беседы ВК. Укажите число >= 2000000001 (узнать в беседе: /chatid) или off.</red>"
    "testchat-not-ready": "<red>Мост беседы ВК не готов: проверьте group-id, access-token и привязку беседы (/vkadmin setchat).</red>"
    "testchat-queued": "<green>Тестовое сообщение поставлено в очередь отправки в беседу peer_id=%peer_id%.</green>"
    "lookup-found": "<gold>[CHRDK_VK]</gold> <gray>%player% → VK <white>id%vk_id%</white> · подписчик: %member% · Donut: %donut% · уведомления: %notify% · заморожен: %frozen%</gray>"
    "lookup-none": "<yellow>Игрок %player% не привязан к ВКонтакте.</yellow>"
    "unlink-ok": "<green>Привязка ВКонтакте для %player% снята администратором.</green>"
    "sync-started": "<gray>Запущена внеочередная сверка подписок, VK Donut и стены сообщества...</gray>"
    "sync-done": "<green>Сверка ВКонтакте завершена: проверено %checked% привязок, активных донов: %donuts%.</green>"
    "reloaded": "<green>Конфигурация и тексты CHRDK_VK успешно перезагружены.</green>"
    "reload-failed": "<red>Не удалось перезагрузить конфигурацию CHRDK_VK — оставлены прежние настройки. Подробности в консоли.</red>"
