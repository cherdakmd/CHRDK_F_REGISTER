  wall-broadcast: "<#0077FF>[ВК]</#0077FF> <white>Новая запись в группе:</white> <gray><preview></gray> <click:open_url:'<post_url>'><hover:show_text:'<aqua>Открыть запись ВКонтакте</aqua>'><aqua>[Читать ↗]</aqua></hover></click>"

  profile-title: "ВКонтакте"
  profile-unlinked: "<gray>Не привязан <dark_gray>(/vk)</dark_gray></gray>"
  profile-linked: "<gray>Профиль: <white>id<vk_id></white> · Группа: <member></gray>"
  profile-donut: "<gray>Поддержка VK Donut: <donut></gray>"

  gui-title: "<dark_aqua>Сообщество ВКонтакте</dark_aqua>"
  gui-link-unlinked-name: "<!italic><aqua>Привязать ВКонтакте</aqua>"
  gui-link-unlinked-lore:
    - "<!italic><gray>Статус: <yellow>не привязан</yellow></gray>"
    - "<!italic><gray>Награды: <gold>+<link_hours> ч.</gold> и <gold>+<member_hours> ч. x2 XP</gold></gray>"
    - "<!italic><dark_gray>▸ Нажмите, чтобы получить одноразовый код</dark_gray>"
  gui-link-linked-name: "<!italic><green>Профиль ВК: <white>id<vk_id></white></green>"
  gui-link-linked-lore:
    - "<!italic><gray>Подписка на группу: <member></gray>"
    - "<!italic><gray>Поддержка VK Donut: <donut></gray>"
    - "<!italic><dark_gray>▸ Нажмите для вывода карточки в чат</dark_gray>"
  gui-notify-name: "<!italic><gold>Оповещения о входах в ЛС ВК</gold>"
  gui-notify-lore:
    - "<!italic><gray>Текущий режим: <state></gray>"
    - "<!italic><gray>Экстренные тревоги подбора пароля</gray>"
    - "<!italic><gray>остаются активными всегда.</gray>"
    - "<!italic><dark_gray>▸ Нажмите, чтобы переключить</dark_gray>"
  gui-chat-name: "<!italic><#0077FF>Мост беседы ВК и анонсы стены</#0077FF>"
  gui-chat-lore:
    - "<!italic><gray>Мост на сервере: <bridge></gray>"
    - "<!italic><gray>Показывать вам [ВК-чат]: <receive></gray>"
    - "<!italic><gray>Пинговать вас по @нику в ВК: <mentions></gray>"
    - "<!italic><dark_gray>▸ ЛКМ — видимость чата · ПКМ — @упоминания</dark_gray>"
  gui-badge-name: "<!italic><aqua>Косметический значок у ника</aqua>"
  gui-badge-lore:
    - "<!italic><gray>Ваш значок: <badge></gray>"
    - "<!italic><dark_gray>▸ Нажмите, чтобы открыть меню /labels</dark_gray>"
  gui-security-name: "<!italic><yellow>Самозащита аккаунта</yellow>"
  gui-security-lore:
    - "<!italic><gray>Доступ ко входу: <frozen></gray>"
    - "<!italic><gray>В боте ВК доступны кнопки <white>/выход</white></gray>"
    - "<!italic><gray>и <white>/заморозить</white> в одно касание.</gray>"
    - "<!italic><dark_gray>▸ Shift + клик — отвязать страницу ВК</dark_gray>"
  gui-unlink-confirm-name: "<!italic><red><bold>Подтвердите отвязку ВК</bold></red>"
  gui-unlink-confirm-lore:
    - "<!italic><gray>Повторная выдача одноразовых XP-бустов</gray>"
    - "<!italic><gray>после отвязки невозможна.</gray>"
    - "<!italic><red>▸ Нажмите ещё раз в течение 15 сек. для отвязки</red>"
  gui-close-name: "<!italic><red>Закрыть</red>"

admin:
  usage: "<gray>Использование: <aqua>/vkadmin <status|lookup|chatban|unlink|setchat|testchat|sync|reload></aqua></gray>"
  status: "<aqua>[CHRDK_VK]</aqua> <gray>API: <configured> · Long Poll: <worker> · Беседа: <white><chat_peer></white> · Привязок: <white><links></white> · VK Donut: <gold><donuts></gold> · Банов чата: <white><chatbans></white> · Пост: <white>#<last_post></white></gray>"
  setchat-ok: "<green>Мост глобального чата подключён к беседе ВК <white>peer_id=<peer_id></white>.</green>"
  setchat-off: "<yellow>Оперативная привязка беседы сброшена (значение из config.yml: <white><config_peer></white>).</yellow>"
  setchat-invalid: "<red>Укажите корректный peer_id беседы ВКонтакте (число >= 2000000001, узнать в беседе: /chatid) или off.</red>"
  testchat-not-ready: "<yellow>Мост беседы ВК не активен: проверьте токен группы и peer_id (/vkadmin setchat <peer_id>).</yellow>"
  testchat-queued: "<green>Тестовое сообщение отправлено в беседу ВК (<white>peer_id=<peer_id></white>).</green>"
  lookup-none: "<yellow>Привязка ВКонтакте для <white><player></white> не найдена.</yellow>"
  lookup-vk-unlinked: "<yellow>Профиль <white>id<vk_id></white> сейчас не привязан ни к одному игроку <dark_gray>(бан моста чата: <chatban>)</dark_gray>.</yellow>"
  lookup-found: "<aqua>[CHRDK_VK]</aqua> <white><player></white> <gray>→ <white>id<vk_id></white> · группа: <member> · Donut: <donut> · оповещения: <notify> · вход: <frozen> · бан моста: <chatban></gray>"
  chatban-invalid: "<red>Не удалось распознать игрока или профиль ВК: <white><target></white> (укажите ник или id12345).</red>"
  chatban-added: "<yellow>Профиль <white><target></white> заблокирован в мосте беседы <aqua>[ВК-чат]</aqua>.</yellow>"
  chatban-removed: "<green>Блокировка моста беседы снята для <white><target></white>.</green>"
  unlink-ok: "<green>Привязка ВКонтакте игрока <white><player></white> сброшена администратором.</green>"
  sync-started: "<gray>Запущена внеочередная сверка подписок, стены и VK Donut…</gray>"
  sync-done: "<green>Сверка завершена: проверено привязок <white><checked></white>, активных VK Donut: <gold><donuts></gold>.</green>"
  reloaded: "<green>Конфигурация и сообщения CHRDK_VK перезагружены.</green>"
  reload-failed: "<red>Ошибка при перезагрузке CHRDK_VK — подробности в консоли сервера.</red>"
