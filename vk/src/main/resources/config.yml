# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_VK — интеграция с сообществом ВКонтакте (аддон CHRDK_Core)
# Исходящий Bots Long Poll API (api.vk.com): серверу Minecraft не нужен
# внешний вебхук или белый порт. Пароли через ВК никогда не сбрасываются.
# ═══════════════════════════════════════════════════════════════════════════

enabled: true

community:
  # Числовой ID группы ВКонтакте (положительное число, без минуса; 0 = опрос API выключен)
  group-id: 0
  # Публичный адрес сообщества для кликабельных ссылок в игре
  url: "https://vk.ru/chrdk_reborn"
  # Ключ доступа сообщества с правами manage, messages, wall (хранить в секрете!)
  access-token: ""
  # Версия VK API и базовый адрес методов
  api-version: "5.199"
  api-base-url: "https://api.vk.com/method/"

long-poll:
  # Слушать входящие сообщения, подписки, VK Donut и записи стены через Bots Long Poll
  enabled: true
  # Время удержания одного запроса Long Poll на стороне ВК (секунды, 5..25)
  wait-seconds: 25
  # Пауза перед переподключением после сетевого сбоя (секунды, 2..60)
  reconnect-seconds: 5

linking:
  # Длина одноразового кода привязки (/vk link → отправить код в ЛС группы)
  code-length: 6
  # Срок жизни одноразового кода (секунды, 60..1800)
  code-ttl-seconds: 300
  # Пауза между генерациями нового кода одним игроком (секунды, 0..300)
  cooldown-seconds: 15
  # Максимум игровых аккаунтов на один профиль ВК (1 = защита от мультиаккаунтов)
  max-accounts-per-vk: 1

rewards:
  # Одноразовый XP-буст (+10% опыта, в часах) за первую привязку аккаунта к ВК (0 = выкл)
  link-boost-hours: 3
  # Одноразовый XP-буст (в часах) за подтверждённую подписку на группу ВК (0 = выкл)
  member-boost-hours: 3
  # Периодическая фоновая сверка подписки на группу и статуса VK Donut (минуты, 5..720)
  recheck-minutes: 30
  # Бонус к длительности покупок каталога (в процентах, до 50%) для активных донов VK Donut
  donut-shop-bonus-percent: 10
  # Льготное окно сохранения бонуса VK Donut при временной недоступности API ВК (часы, 1..720)
  donut-grace-hours: 72

labels:
  # Показывать значок сообщества или VK Donut в /labels (секция vk)
  enabled: true
  # Требовать активную подписку на группу для показа обычного значка [ВК]
  require-membership: false
  # Значок привязанного участника и значок активного подписчика VK Donut (MiniMessage)
  member-tag: "<aqua>[ВК]</aqua>"
  donut-tag: "<gold>[VK Donut]</gold>"

notifications:
  # Личные сообщения игроку в ВК о входах в аккаунт (игрок может переключить через /vk notify)
  login-alerts: true
  # Экстренные уведомления игроку в ВК о попытках подбора пароля
  bruteforce-alerts: true
  # Напоминания игроку в ВК о скором окончании срока ранга
  expiry-alerts: true
  # peer_id беседы или администратора ВК для пересылки уведомлений ядра (например 2000000001; 0 = выкл)
  admin-peer-id: 0

group-chat:
  # Двусторонний мост между глобальным чатом сервера и беседой сообщества ВКонтакте.
  # Подключение: добавьте бота в беседу, выдайте доступ ко всей переписке, напишите в беседе /chatid
  # и выполните на сервере: /vkadmin setchat <peer_id> (либо укажите peer-id ниже).
  enabled: true
  # peer_id беседы ВКонтакте (>= 2000000001; 0 = не задана или задаётся через /vkadmin setchat)
  peer-id: 0
  # Пересылать принятые сообщения глобального чата Minecraft в беседу ВК
  minecraft-to-vk: true
  # Пересылать сообщения участников из беседы ВК в глобальный чат Minecraft
  vk-to-minecraft: true
  # Принимать сообщения из беседы ВК в игру только от участников с привязанным аккаунтом (/vk link)
  require-linked: true
  # Разрешать в беседе ВК справочные команды (/онлайн, /chatid)
  allow-info-commands: true
  # Пересылать в беседу ВК уведомления о входе и выходе авторизованных игроков
  relay-join-quit: false
  # Пауза между сообщениями одного участника беседы ВК в игровой чат (секунды, 0..60)
  vk-sender-cooldown-seconds: 3
  # Максимальная длина одного сообщения из беседы ВК в игровой чат (символы, 40..400)
  max-message-length: 220
  # Префикс сообщений из беседы ВК в глобальном чате игры (MiniMessage)
  mc-badge: "<#0077FF>[ВК-чат]</#0077FF>"
  # Шаблон сообщений из глобального чата игры в беседу ВК ({player}, {message})
  vk-format: "[MC] {player}: {message}"

wall:
  # Автоматически объявлять новые записи стены сообщества в игровой чат
  announce-new-posts: true
  # Резервный интервал проверки wall.get в минутах (0 = только мгновенный Long Poll)
  poll-minutes: 10
  # Пропускать закреплённые, рекламные записи и репосты без собственного текста
  ignore-pinned: true
  ignore-ads: true
  ignore-reposts: true
  # Максимальная длина краткого анонса текста поста в чате (символы, 40..300)
  preview-length: 140

security:
  # Разрешать сброс активных сессий (/выход в ЛС группы ВК)
  allow-remote-logout: true
  # Разрешать заморозку и разморозку входа (/заморозить и /разморозить в ЛС группы ВК)
  # Смена и сброс пароля через ВК принципиально запрещены.
  allow-remote-freeze: true

general:
  locale: "ru"
