# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_VK — интеграция с сообществом ВКонтакте (аддон CHRDK_Core)
# Исходящий Bots Long Poll API (api.vk.com): серверу Minecraft не нужен
# внешний вебхук или белый порт. Пароли через ВК никогда не сбрасываются.
# ═══════════════════════════════════════════════════════════════════════════

enabled: true

community:
  # Числовой ID группы ВКонтакте (положительное число, без минуса; 0 = опрос API выключен)
  group-id: 0
  # Публичный адрес сообщества для кликабельных ссылок в игре
  url: "https://vk.ru/chrdk_reborn"
  # Публичный адрес полевого справочника сервера (для команды /вики в боте и беседе)
  wiki-url: "https://cherdakmd.github.io/CHRDK_F_REGISTER/"
  # Ключ сообщества для сообщений, подписок, Bots Long Poll и финального wall.post.
  # Хранить в секрете! Права: wall + photos, бот — администратор сообщества.
  access-token: ""
  # Отдельный ПОЛЬЗОВАТЕЛЬСКИЙ ключ администратора сообщества ТОЛЬКО для
  # photos.getWallUploadServer / photos.saveWallPhoto. Ключ сообщества вызывает
  # у этих методов VK API error 27 ("method is unavailable with group auth"),
  # поэтому без этого ключа стена автоматически работает в текстовом режиме.
  # Нужен классический токен вида vk1.a.* со scopes wall,photos,offline,
  # полученный администратором; это НЕ Callback secret, НЕ MAX-токен и НЕ ключ
  # сообщества. Хранить в секрете, не коммитить и не отправлять в чат.
  # Пусто = по умолчанию text (PNG уходят в беседу); для photo задайте ключ.
  photo-user-token: ""
  # Версия VK API и базовый адрес методов
  api-version: "5.199"
  api-base-url: "https://api.vk.com/method/"

keyboard:
  # Показывать удобное кнопочное меню в личных сообщениях бота ВКонтакте
  enabled: true
  # Добавлять встроенные кнопки экстренной защиты («Сбросить сессии» / «Заморозить вход»)
  # прямо под уведомлениями о входах и переборе пароля
  inline-security-buttons: true

long-poll:
  # Слушать входящие сообщения, подписки, VK Donut и записи стены через Bots Long Poll
  enabled: true
  # Время удержания одного запроса Long Poll на стороне ВК (секунды, 5..25)
  wait-seconds: 25
  # Пауза перед переподключением после сетевого сбоя (секунды, 2..60)
  reconnect-seconds: 5

linking:
  # Длина одноразового кода привязки (/vk link → отправить код в ЛС группы)
  code-length: 6
  # Срок жизни одноразового кода (секунды, 60..1800)
  code-ttl-seconds: 300
  # Пауза между генерациями нового кода одним игроком (секунды, 0..300)
  cooldown-seconds: 15
  # Максимум игровых аккаунтов на один профиль ВК (1 = защита от мультиаккаунтов)
  max-accounts-per-vk: 1

rewards:
  # Одноразовый XP-буст (+10% опыта, в часах) за первую привязку аккаунта к ВК (0 = выкл)
  link-boost-hours: 3
  # Одноразовый XP-буст (в часах) за подтверждённую подписку на группу ВК (0 = выкл)
  member-boost-hours: 3
  # Периодическая фоновая сверка подписки на группу и статуса VK Donut (минуты, 5..720)
  recheck-minutes: 30
  # Бонус к длительности покупок каталога (в процентах, до 50%) для активных донов VK Donut
  donut-shop-bonus-percent: 10
  # Льготное окно сохранения бонуса VK Donut при временной недоступности API ВК (часы, 1..720)
  donut-grace-hours: 72

labels:
  # Показывать значок сообщества или VK Donut в /labels (секция vk)
  enabled: true
  # Требовать активную подписку на группу для показа обычного значка [ВК]
  require-membership: false
  # Значок привязанного участника и значок активного подписчика VK Donut (MiniMessage)
  member-tag: "<aqua>[ВК]</aqua>"
  donut-tag: "<gold>[VK Donut]</gold>"

notifications:
  # Личные сообщения игроку в ВК о входах в аккаунт (игрок может переключить через /vk notify)
  login-alerts: true
  # Экстренные уведомления игроку в ВК о попытках подбора пароля
  bruteforce-alerts: true
  # Напоминания игроку в ВК о скором окончании срока ранга
  expiry-alerts: true
  # peer_id беседы или администратора ВК для пересылки уведомлений ядра (например 2000000001; 0 = выкл)
  admin-peer-id: 0

group-chat:
  # Двусторонний мост между глобальным чатом сервера и беседой сообщества ВКонтакте.
  # Подключение: добавьте бота в беседу, выдайте доступ ко всей переписке, напишите в беседе /chatid
  # и выполните на сервере: /vkadmin setchat <peer_id> (либо укажите peer-id ниже).
  enabled: true
  # peer_id беседы ВКонтакте (>= 2000000001; 0 = не задана или задаётся через /vkadmin setchat)
  peer-id: 0
  # Пересылать принятые сообщения глобального чата Minecraft в беседу ВК
  minecraft-to-vk: true
  # Пересылать сообщения участников из беседы ВК в глобальный чат Minecraft
  vk-to-minecraft: true
  # Принимать сообщения из беседы ВК в игру только от участников с привязанным аккаунтом (/vk link)
  require-linked: true
  # Разрешать в беседе ВК справочные команды (/онлайн, /вики, /chatid)
  allow-info-commands: true
  # Преобразовывать @Ник привязанных игроков в нативные упоминания ВК [id...|@Ник] (если игрок не выключил /vk mentions)
  resolve-linked-mentions: true
  # Окно склейки быстрых сообщений чата перед отправкой в ВК (мс, 0..3000; защита от Flood control)
  batch-window-ms: 500
  # Пересылать в беседу ВК уведомления о входе и выходе авторизованных игроков
  relay-join-quit: false
  # Пауза между сообщениями одного участника беседы ВК в игровой чат (секунды, 0..60)
  vk-sender-cooldown-seconds: 3
  # Максимальная длина одного сообщения из беседы ВК в игровой чат (символы, 40..400)
  max-message-length: 220
  # Префикс сообщений из беседы ВК в глобальном чате игры (MiniMessage)
  mc-badge: "<#0077FF>[ВК-чат]</#0077FF>"
  # Шаблон сообщений из глобального чата игры в беседу ВК ({player}, {message})
  vk-format: "[MC] {player}: {message}"

wall:
  # Автоматически объявлять новые записи стены сообщества в игровой чат
  announce-new-posts: true
  # Устаревший параметр: игнорируется. wall.get не поддерживает ключ сообщества.
  # Анонсы стены поступают только из wall_post_new через Bots Long Poll.
  # Новости в беседу отправляет отдельный workflow GitHub Actions, не этот модуль.
  poll-minutes: 0
  # Пропускать закреплённые, рекламные записи и репосты без собственного текста
  ignore-pinned: true
  ignore-ads: true
  ignore-reposts: true
  # Максимальная длина краткого анонса текста поста в чате (символы, 40..300)
  preview-length: 140
  # Режим стены (rc.9): text — wall.post без PNG, PNG-карточки уходят в беседу;
  # photo — PNG на стену, нужен community.photo-user-token. Без пользовательского
  # ключа режим photo автоматически откатывается на text, постеры не отключаются.
  post-mode: text
  # Подпись под каждым текстовым постом стены: «обсудить — <ссылка>».
  # Пустая discuss-url = не добавлять подпись. Ссылка только для стены,
  # в сообщения беседы она не добавляется.
  discuss-label: "обсудить"
  discuss-url: "https://vk.me/join/IAYORcZm0ZVtjPdoDazBHP5yymulHst4fxM="
  # Отправлять PNG дайджеста и четырёх карточек в беседу ВК. Работает на ключе
  # сообщества через photos.getMessagesUploadServer → photos.saveMessagesPhoto →
  # messages.send; пользовательский ключ здесь не нужен.
  chat-cards: true

# Ежедневный дайджест на СТЕНУ сообщества. Владелец стены — только этот плагин:
# он сам собирает события, рисует PNG для беседы и вызывает wall.post текстом.
# GitHub Actions, служебный чат и внешний ledger в рантайме не участвуют.
# Советы и оперативные события по-прежнему уходят в беседу, а не на стену.
wall-digest:
  # Один оформленный пост в сутки. По умолчанию text: нужен только
  # community.access-token, PNG уходит в беседу. Режим photo дополнительно
  # требует community.photo-user-token (иначе авто-fallback на text).
  enabled: true
  # Время публикации в часовом поясе владельца (21:00 МСК).
  hour: 21
  minute: 0
  timezone: "Europe/Moscow"
  # Блоки постера: прирост престижа, поддержка сервера, пик онлайна/новички
  # и игровая активность за сутки. На стену уходят только обезличенные числа.
  include-prestige: true
  include-donations: true
  include-online: true
  # Сломанные игроками блоки, поднятые алмазы, победы над враждебными мобами.
  # Считаются Bukkit-событиями на сервере. В САМОМ дайджесте уходят только
  # обезличенные суммы; ники остаются локально для карточек ниже.
  include-blocks: true
  include-diamonds: true
  include-mobs: true
  # На публичной стене по умолчанию только обезличенные цифры. Если включить
  # имена, уважается opt-out игрока из /vk (скрытие сообщений беседы).
  show-player-names: false
  max-names: 3
  # Не публиковать «пустой» день; 0 = публиковать даже тихий день.
  min-events: 1
  # Как часто сравнивать престиж онлайн-игроков (минуты, 1..60).
  poll-minutes: 5
  title: "Итоги дня"
  footer: "ТВОЙ МИР. ТВОЯ ИСТОРИЯ."

# Четыре персональные карточки игроков. Вместе с дайджестом выше (21:00)
# получается ровно 5 постов на стене за сутки. На каждой карточке — ник
# победителя и его результат; UUID, IP, координаты и суммы платежей не уходят.
# Владелец стены тот же — CHRDK_VK: community.access-token для wall.post,
# PNG уходят в беседу на том же ключе; community.photo-user-token нужен только
# если wall.post-mode: photo вернёт картинки на стену.
wall-daily-cards:
  # Выключить все четыре карточки разом (дайджест при этом остаётся).
  enabled: true
  timezone: "Europe/Moscow"
  # Показывать ли величину результата на картинке и в тексте записи.
  show-values: true
  # Часы публикации: самый богатый / самый прокачанный / шахтёр / охотник.
  richest-hour: 9
  prestige-hour: 12
  miner-hour: 15
  hunter-hour: 18
  # Окно повторов после своего часа и максимум попыток на карточку.
  retry-minutes: 5
  footer: "ТВОЙ МИР. ТВОЯ ИСТОРИЯ."

security:
  # Разрешать сброс активных сессий (/выход в ЛС группы ВК)
  allow-remote-logout: true
  # Разрешать заморозку и разморозку входа (/заморозить и /разморозить в ЛС группы ВК)
  # Смена и сброс пароля через ВК принципиально запрещены.
  allow-remote-freeze: true

general:
  locale: "ru"

# Приглашение к сообществу без запрета игры. Проверяется только после авторизации.
onboarding:
  enabled: true
  interval-seconds: 180
  # 0 = использовать беседу игрового моста. Для независимой проверки укажите ботовый peer_id.
  peer-id: 0
  # Настоящая HTTPS-ссылка приглашения в нужную беседу. Не публикуйте закрытую ссылку в Git.
  chat-invite-url: ""

# ═══════════════════════════════════════════════════════════════════════════
# Единый социальный плагин: обязательная привязка Minecraft ↔ ВК / MAX.
# Один JAR (chrdk-vk-*.jar), один реестр привязок, одно пространство кодов.
# ═══════════════════════════════════════════════════════════════════════════

social:
  # Выключить всю социальную подсистему (ВК-интеграция при этом продолжает работать)
  enabled: true
  # Требовать привязку к ВК или MAX до начала игры
  require-link: true
  # Гибридный переходный период. Общий дедлайн отсчитывается от первого запуска
  # плагина (для уже игравших аккаунтов), личный — от первого входа конкретного
  # игрока (для новичков и вернувшихся). Действует БОЛЕЕ ПОЗДНЯЯ из двух дат,
  # поэтому пришедший на 15-й день новичок не оказывается в лобби без срока.
  # 0 = сразу всем обязательно.
  grace-days: 14
  newcomer-grace-days: 14
  # Третий путь для игроков без ВК и MAX: доступ по УЖЕ ПОДТВЕРЖДЁННОЙ оплате
  # на сайте донатов. Плагин сам ничего не принимает от игрока и не выдает покупки:
  # он читает data.json ядра (TradeMC -> RCON `/pass shoppay` / `/pass shopbuy`).
  donate-access:
    enabled: true
    # any-rank       — любой активный донатный ранг/проходка
    # product-list   — только товары из product-ids (отдельная платная «проходка»)
    # either         — ранг ИЛИ любой товар из списка (текущая настройка)
    # off            — платного доступа нет
    # Ранги стоят от 300 ₽ и дороже карточки проходки (150 ₽), поэтому любой
    # активный донатный ранг/проходка тоже снимают ограничение. Отдельная
    # карточка social-access остаётся для игроков без ВК/MAX, которым ранг не нужен,
    # а social-access-day (15 ₽ / 1 день) — короткий пробный тариф на сутки.
    mode: either
    product-ids: [social-access, social-access-day]
    # false — доступ действует, пока активна покупка; true — фиксируется навсегда
    permanent: false
    url: "https://chrdk.trademc.org/"
  bypass-permission: "chrdksocial.bypass"
  code-length: 6
  code-ttl-seconds: 300
  code-cooldown-seconds: 20
  max-attempts: 5
  max-accounts-per-profile: 1
  # Напоминание показывается ВСЕМ непривязанным игрокам без прохода, включая
  # переходный период (grace), а не только уже замороженным. Инструкция в чате
  # ориентирована ТОЛЬКО на ВКонтакте: модуль MAX сейчас в разработке и игрокам
  # как рабочий способ входа не предлагается (техническая привязка сохраняется).
  # ВСЕ показы делят ОДИН общий кулдаун на игрока: полный блок при входе,
  # периодическое напоминание, пинг при действиях, строка над хотбаром и звук.
  # По умолчанию раз в час (3600 с); кулдаун переживает перезаход, поэтому
  # релог в течение часа не повторяет пять строк инструкции. Потолок — 86400 с
  # (сутки), минимум — 10 с.
  reminder-seconds: 3600
  reminder:
    # false — только блок при входе (при каждом входе, без общего кулдауна),
    # без action bar, пингов, периодических сообщений и звука напоминаний.
    nagging: true
    # Строка над хотбаром показывается при входе и обновляется раз в N секунд,
    # а не висит перед глазами постоянно. Раз в час по умолчанию.
    action-bar-seconds: 3600
    # Минимальная пауза между пингами при любом игровом действии (движение,
    # команда, чат, ломание блока). Игра в grace НЕ блокируется. Общая пауза
    # для чата = max(reminder-seconds, action-nag-seconds).
    action-nag-seconds: 3600
    # Крупный заголовок на экране при входе (только когда кулдаун разрешил показ).
    title-on-join: true
    # Короткий звук при входе и при каждом напоминании в чате — теперь раз в час.
    sound: true
  # Одноразовая награда за первую привязку (0 = выключено)
  reward-xp-levels: 0
  emergency-minutes: 30
  # Повреждённый social-links.json или players/social.yml: true — аварийный
  # режим вместо тотального кика. Привязки, firstSeen, донатный доступ и
  # награда хранятся в редактируемом players/social.yml; rollout, emergency,
  # чаты и новости — в social-links.json с SHA-256. При первом запуске этой
  # версии старые поля переносятся автоматически, исходный JSON уходит в .bak.
  fail-open-on-corruption: true
  vk-community-url: "https://vk.ru/chrdk_reborn"
  # Публичная ссылка на бота MAX (диплинк), показывается в игре
  max-bot-url: ""

max:
  enabled: true
  # Актуальный домен MAX Bot API с 19 июля 2026 года
  api-base-url: "https://platform-api2.max.ru/"
  # Токен бота: ТОЛЬКО заголовок Authorization, никогда не URL. Хранить в секрете.
  access-token: ""
  # webhook (production) | polling (разработка / fallback)
  transport: webhook
  update-types: [message_created, message_callback, bot_started, bot_added, bot_removed]
  # chat_id канала/чата: GET /chats не поддерживается, id приходит из bot_added/bot_started
  chat-id: 0

  webhook:
    enabled: true
    # Внутренний порт плагина на хостинге. Публичный URL для MAX должен быть HTTPS
    # с доверенным сертификатом; для production используйте 443 (или reverse-proxy
    # на 443 -> этот порт). MAX с 25 мая не принимает HTTP и самоподписные сертификаты.
    port: 8443
    bind-address: "0.0.0.0"
    path: "/max/webhook"
    # Публичный HTTPS-адрес, который записывается в POST /subscriptions.
    # Домен должен совпадать с CN/SAN сертификата и отдавать полную цепочку.
    public-url: ""
    # Секрет из POST /subscriptions: ТОЛЬКО A-Z a-z 0-9 _ и дефис, 5..256 символов.
    # MAX присылает его в заголовке X-Max-Bot-Api-Secret, плагин сверяет constant-time.
    secret: ""
    # PKCS12-keystore с сертификатом и ключом в папке плагина. Без него HTTPS не поднимется.
    keystore: "max-webhook.p12"
    keystore-password: ""
    require-tls: true

  polling:
    # Исходящий GET /updates без белого порта; официально — режим разработки.
    enabled: true
    wait-seconds: 25
    reconnect-seconds: 5
    limit: 100

  group-chat:
    enabled: true
    minecraft-to-max: true
    max-to-minecraft: true
    require-linked: true
    mc-badge: "<#00C3FF>[MAX]</#00C3FF>"
    max-format: "[MC] {player}: {message}"
    sender-cooldown-seconds: 3
    max-message-length: 220

news:
  # Автопостинг релиза из плагина: GET GitHub Releases latest → MAX + ВК + чат игры.
  # Дублирует, но не заменяет публикацию из GitHub Actions (tools/social).
  enabled: true
  poll-minutes: 30
  announce-in-game: true
  template: "🚀 CHERDAK — выпуск %tag%: %title%\nПодробности и скачивание: %url%"
  release-api-url: "https://api.github.com/repos/cherdakmd/CHRDK_F_REGISTER/releases/latest"

# ═══════════════════════════════════════════════════════════════════════════
# События сервера в сообщество (смерть, старт/стоп, приветствие новичков).
# ВСЕ выключены по умолчанию: владелец сам решает, что публиковать в беседу.
# В сообщество уходит только ник и нейтральный текст из messages.yml —
# без координат, IP, UUID, причины смерти и содержимого инвентаря.
# ═══════════════════════════════════════════════════════════════════════════
events:
  # Общий выключатель: при false ни одно событие не публикуется.
  enabled: false
  # Смерть персонажа (не путать с relay-join-quit: у событий свои флаги).
  player-death: false
  # Запуск сервера — анонс уходит через 5 с после включения плагина.
  server-start: false
  # Остановка сервера — best effort, до shutdown сетевых клиентов.
  server-stop: false
  # Первый вход игрока (hasPlayedBefore() == false), один раз за сессию.
  welcome-new-player: false
  # Каналы: ВК использует уже настроенную беседу моста group-chat.peer-id.
  to-vk: true
  # MAX требует явно заданный chat-id; 0 = в MAX не отправляем.
  to-max: false
  max-chat-id: 0
  # Дублировать событие в игровой чат (по умолчанию тихо).
  announce-in-game: false
  # Пауза между однотипными событиями одного игрока (секунды, 0..3600).
  # Защита от спама при серии смертей и от двойного старта при /reload.
  cooldown-seconds: 30
  # Максимальная длина одного сообщения (символы, 40..400).
  max-length: 220

# ═══════════════════════════════════════════════════════════════════════════
# Интерактив сообщества: callback-кнопки (VK message_event + MAX message_callback),
# диалоги подтверждения, опросы, тикеты и реакции стены. Один SocialInteractionHub
# на оба мессенджера; все флаги ВЫКЛЮЧЕНЫ по умолчанию.
# В сообщество не уходят IP, UUID, координаты и пароли.
# ═══════════════════════════════════════════════════════════════════════════
interactive:
  # Общий выключатель: при false ни одно из действий не обрабатывается.
  enabled: false
  # Настоящие callback-кнопки. Для ВК дополнительно включите тип события
  # message_event в настройках Bots Long Poll сообщества (вне этого файла).
  callbacks: false
  # Двухшаговое подтверждение опасных действий (сессии, заморозка, отвязка).
  dialogs: false
  # Голосования в беседе: один голос на пользователя, TTL, итог.
  polls: false
  # Кнопка «Позвать администратора» → заявка staff, с кулдауном и аудитом.
  tickets: false
  # Дайджест комментариев и лайков стены в беседу (только с кулдауном).
  wall-reactions: false
  # Дублировать интерактивные события в игровой чат.
  in-game-digest: false
  # peer_id администратора для тикетов; 0 = использовать беседу моста.
  admin-peer-id: 0
  # Пауза между однотипными нажатиями одного пользователя (секунды, 0..3600).
  cooldown-seconds: 15
  # Время жизни незавершённого диалога (секунды, 30..3600).
  dialog-ttl-seconds: 120
  # Длительность опроса (секунды, 30..86400).
  poll-duration-seconds: 300
  # Максимальная длина одного сообщения (символы, 40..400).
  max-length: 220
  # Вопрос опроса по умолчанию (не игровая механика, только текст).
  poll-question: "Что улучшить на сервере в следующий раз?"
