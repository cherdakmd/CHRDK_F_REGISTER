# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_VK — интеграция с сообществом ВКонтакте (аддон CHRDK_Core)
# Исходящий Bots Long Poll API (api.vk.com): серверу Minecraft не нужен
# внешний вебхук или белый порт. Пароли через ВК никогда не сбрасываются.
# ═══════════════════════════════════════════════════════════════════════════

enabled: true

community:
  # Числовой ID группы ВКонтакте (положительное число, без минуса; 0 = опрос API выключен)
  group-id: 0
  # Публичный адрес сообщества для кликабельных ссылок в игре
  url: "https://vk.ru/chrdk_reborn"
  # Публичный адрес полевого справочника сервера (для команды /вики в боте и беседе)
  wiki-url: "https://cherdakmd.github.io/CHRDK_F_REGISTER/"
  # Ключ сообщества для сообщений, подписок и Bots Long Poll (хранить в секрете!)
  access-token: ""
  # Версия VK API и базовый адрес методов
  api-version: "5.199"
  api-base-url: "https://api.vk.com/method/"

keyboard:
  # Показывать удобное кнопочное меню в личных сообщениях бота ВКонтакте
  enabled: true
  # Добавлять встроенные кнопки экстренной защиты («Сбросить сессии» / «Заморозить вход»)
  # прямо под уведомлениями о входах и переборе пароля
  inline-security-buttons: true

long-poll:
  # Слушать входящие сообщения, подписки, VK Donut и записи стены через Bots Long Poll
  enabled: true
  # Время удержания одного запроса Long Poll на стороне ВК (секунды, 5..25)
  wait-seconds: 25
  # Пауза перед переподключением после сетевого сбоя (секунды, 2..60)
  reconnect-seconds: 5

linking:
  # Длина одноразового кода привязки (/vk link → отправить код в ЛС группы)
  code-length: 6
  # Срок жизни одноразового кода (секунды, 60..1800)
  code-ttl-seconds: 300
  # Пауза между генерациями нового кода одним игроком (секунды, 0..300)
  cooldown-seconds: 15
  # Максимум игровых аккаунтов на один профиль ВК (1 = защита от мультиаккаунтов)
  max-accounts-per-vk: 1

rewards:
  # Одноразовый XP-буст (+10% опыта, в часах) за первую привязку аккаунта к ВК (0 = выкл)
  link-boost-hours: 3
  # Одноразовый XP-буст (в часах) за подтверждённую подписку на группу ВК (0 = выкл)
  member-boost-hours: 3
  # Периодическая фоновая сверка подписки на группу и статуса VK Donut (минуты, 5..720)
  recheck-minutes: 30
  # Бонус к длительности покупок каталога (в процентах, до 50%) для активных донов VK Donut
  donut-shop-bonus-percent: 10
  # Льготное окно сохранения бонуса VK Donut при временной недоступности API ВК (часы, 1..720)
  donut-grace-hours: 72

labels:
  # Показывать значок сообщества или VK Donut в /labels (секция vk)
  enabled: true
  # Требовать активную подписку на группу для показа обычного значка [ВК]
  require-membership: false
  # Значок привязанного участника и значок активного подписчика VK Donut (MiniMessage)
  member-tag: "<aqua>[ВК]</aqua>"
  donut-tag: "<gold>[VK Donut]</gold>"

notifications:
  # Личные сообщения игроку в ВК о входах в аккаунт (игрок может переключить через /vk notify)
  login-alerts: true
  # Экстренные уведомления игроку в ВК о попытках подбора пароля
  bruteforce-alerts: true
  # Напоминания игроку в ВК о скором окончании срока ранга
  expiry-alerts: true
  # peer_id беседы или администратора ВК для пересылки уведомлений ядра (например 2000000001; 0 = выкл)
  admin-peer-id: 0

group-chat:
  # Двусторонний мост между глобальным чатом сервера и беседой сообщества ВКонтакте.
  # Подключение: добавьте бота в беседу, выдайте доступ ко всей переписке, напишите в беседе /chatid
  # и выполните на сервере: /vkadmin setchat <peer_id> (либо укажите peer-id ниже).
  enabled: true
  # peer_id беседы ВКонтакте (>= 2000000001; 0 = не задана или задаётся через /vkadmin setchat)
  peer-id: 0
  # Пересылать принятые сообщения глобального чата Minecraft в беседу ВК
  minecraft-to-vk: true
  # Пересылать сообщения участников из беседы ВК в глобальный чат Minecraft
  vk-to-minecraft: true
  # Принимать сообщения из беседы ВК в игру только от участников с привязанным аккаунтом (/vk link)
  require-linked: true
  # Разрешать в беседе ВК справочные команды (/онлайн, /вики, /chatid)
  allow-info-commands: true
  # Преобразовывать @Ник привязанных игроков в нативные упоминания ВК [id...|@Ник] (если игрок не выключил /vk mentions)
  resolve-linked-mentions: true
  # Окно склейки быстрых сообщений чата перед отправкой в ВК (мс, 0..3000; защита от Flood control)
  batch-window-ms: 500
  # Пересылать в беседу ВК уведомления о входе и выходе авторизованных игроков
  relay-join-quit: false
  # Пауза между сообщениями одного участника беседы ВК в игровой чат (секунды, 0..60)
  vk-sender-cooldown-seconds: 3
  # Максимальная длина одного сообщения из беседы ВК в игровой чат (символы, 40..400)
  max-message-length: 220
  # Префикс сообщений из беседы ВК в глобальном чате игры (MiniMessage)
  mc-badge: "<#0077FF>[ВК-чат]</#0077FF>"
  # Шаблон сообщений из глобального чата игры в беседу ВК ({player}, {message})
  vk-format: "[MC] {player}: {message}"

wall:
  # Автоматически объявлять новые записи стены сообщества в игровой чат
  announce-new-posts: true
  # Устаревший параметр: игнорируется. wall.get не поддерживает ключ сообщества.
  # Анонсы стены поступают только из wall_post_new через Bots Long Poll.
  # Новости в беседу отправляет отдельный workflow GitHub Actions, не этот модуль.
  poll-minutes: 0
  # Пропускать закреплённые, рекламные записи и репосты без собственного текста
  ignore-pinned: true
  ignore-ads: true
  ignore-reposts: true
  # Максимальная длина краткого анонса текста поста в чате (символы, 40..300)
  preview-length: 140

security:
  # Разрешать сброс активных сессий (/выход в ЛС группы ВК)
  allow-remote-logout: true
  # Разрешать заморозку и разморозку входа (/заморозить и /разморозить в ЛС группы ВК)
  # Смена и сброс пароля через ВК принципиально запрещены.
  allow-remote-freeze: true

general:
  locale: "ru"

# Приглашение к сообществу без запрета игры. Проверяется только после авторизации.
onboarding:
  enabled: true
  interval-seconds: 180
  # 0 = использовать беседу игрового моста. Для независимой проверки укажите ботовый peer_id.
  peer-id: 0
  # Настоящая HTTPS-ссылка приглашения в нужную беседу. Не публикуйте закрытую ссылку в Git.
  chat-invite-url: ""

# ═══════════════════════════════════════════════════════════════════════════
# Единый социальный плагин: обязательная привязка Minecraft ↔ ВК / MAX.
# Один JAR (chrdk-vk-*.jar), один реестр привязок, одно пространство кодов.
# ═══════════════════════════════════════════════════════════════════════════

social:
  # Выключить всю социальную подсистему (ВК-интеграция при этом продолжает работать)
  enabled: true
  # Требовать привязку к ВК или MAX до начала игры
  require-link: true
  # Гибридный переходный период. Общий дедлайн отсчитывается от первого запуска
  # плагина (для уже игравших аккаунтов), личный — от первого входа конкретного
  # игрока (для новичков и вернувшихся). Действует БОЛЕЕ ПОЗДНЯЯ из двух дат,
  # поэтому пришедший на 15-й день новичок не оказывается в лобби без срока.
  # 0 = сразу всем обязательно.
  grace-days: 14
  newcomer-grace-days: 14
  # Третий путь для игроков без ВК и MAX: доступ по УЖЕ ПОДТВЕРЖДЁННОЙ оплате
  # на сайте донатов. Плагин сам ничего не принимает от игрока и не выдает покупки:
  # он читает data.json ядра (TradeMC -> RCON `/pass shoppay` / `/pass shopbuy`).
  donate-access:
    enabled: true
    # any-rank       — любой активный донатный ранг/проходка
    # product-list   — только товары из product-ids (отдельная платная «проходка»)
    # either         — ранг ИЛИ любой товар из списка
    # off            — платного доступа нет
    mode: product-list
    product-ids: [social-access]
    # false — доступ действует, пока активна покупка; true — фиксируется навсегда
    permanent: false
    url: "https://chrdk.trademc.org/"
  bypass-permission: "chrdksocial.bypass"
  code-length: 6
  code-ttl-seconds: 300
  code-cooldown-seconds: 20
  max-attempts: 5
  max-accounts-per-profile: 1
  # Напоминание показывается ВСЕМ непривязанным игрокам без прохода, включая
  # переходный период (grace), а не только уже замороженным. Новый аккаунт
  # должен сразу понять: либо привязка к ВК/MAX, либо покупка прохода на сайте.
  reminder-seconds: 30
  reminder:
    # Выключить всё назойливое информирование (останется только блок при входе).
    nagging: true
    # Постоянная строка над хотбаром, обновляется каждые N секунд.
    action-bar-seconds: 5
    # Минимальная пауза между пингами при любом игровом действии (движение,
    # команда, чат, ломание блока). Игра в grace НЕ блокируется.
    action-nag-seconds: 20
    # Крупный заголовок на экране при входе.
    title-on-join: true
    # Короткий звук при входе и каждом напоминании в чате.
    sound: true
  # Одноразовая награда за первую привязку (0 = выключено)
  reward-xp-levels: 0
  emergency-minutes: 30
  # Повреждённый social-links.json: true — аварийный режим вместо тотального кика
  fail-open-on-corruption: true
  vk-community-url: "https://vk.ru/chrdk_reborn"
  # Публичная ссылка на бота MAX (диплинк), показывается в игре
  max-bot-url: ""

max:
  enabled: true
  # Актуальный домен MAX Bot API с 19 июля 2026 года
  api-base-url: "https://platform-api2.max.ru/"
  # Токен бота: ТОЛЬКО заголовок Authorization, никогда не URL. Хранить в секрете.
  access-token: ""
  # webhook (production) | polling (разработка / fallback)
  transport: webhook
  update-types: [message_created, message_callback, bot_started, bot_added, bot_removed]
  # chat_id канала/чата: GET /chats не поддерживается, id приходит из bot_added/bot_started
  chat-id: 0

  webhook:
    enabled: true
    # Внутренний порт плагина на хостинге. Публичный URL для MAX должен быть HTTPS
    # с доверенным сертификатом; для production используйте 443 (или reverse-proxy
    # на 443 -> этот порт). MAX с 25 мая не принимает HTTP и самоподписные сертификаты.
    port: 8443
    bind-address: "0.0.0.0"
    path: "/max/webhook"
    # Публичный HTTPS-адрес, который записывается в POST /subscriptions.
    # Домен должен совпадать с CN/SAN сертификата и отдавать полную цепочку.
    public-url: ""
    # Секрет из POST /subscriptions: ТОЛЬКО A-Z a-z 0-9 _ и дефис, 5..256 символов.
    # MAX присылает его в заголовке X-Max-Bot-Api-Secret, плагин сверяет constant-time.
    secret: ""
    # PKCS12-keystore с сертификатом и ключом в папке плагина. Без него HTTPS не поднимется.
    keystore: "max-webhook.p12"
    keystore-password: ""
    require-tls: true

  polling:
    # Исходящий GET /updates без белого порта; официально — режим разработки.
    enabled: true
    wait-seconds: 25
    reconnect-seconds: 5
    limit: 100

  group-chat:
    enabled: true
    minecraft-to-max: true
    max-to-minecraft: true
    require-linked: true
    mc-badge: "<#00C3FF>[MAX]</#00C3FF>"
    max-format: "[MC] {player}: {message}"
    sender-cooldown-seconds: 3
    max-message-length: 220

news:
  # Автопостинг релиза из плагина: GET GitHub Releases latest → MAX + ВК + чат игры.
  # Дублирует, но не заменяет публикацию из GitHub Actions (tools/social).
  enabled: true
  poll-minutes: 30
  announce-in-game: true
  template: "🚀 CHERDAK — выпуск %tag%: %title%\nПодробности и скачивание: %url%"
  release-api-url: "https://api.github.com/repos/cherdakmd/CHRDK_F_REGISTER/releases/latest"
