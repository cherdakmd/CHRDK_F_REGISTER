plugins {
    id 'java'
}

group = project.maven_group
version = project.plugin_version

base {
    archivesName = 'chrdk-vk'
}

repositories {
    mavenCentral()
    maven {
        name = 'purpurmc'
        url = 'https://repo.purpurmc.org/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    compileOnly project(':')
    // Публичный ChrdkSkillsApi.totalPrestige(Player) нужен дайджесту стены.
    // compileOnly + softdepend: без CHRDK_Skills плагин просто не показывает престиж.
    compileOnly project(':skills')
    compileOnly "com.google.code.gson:gson:2.11.0"
    // Счётчики TAB (%chrdksocial_*%) реализованы как PlaceholderExpansion.
    // Тот же pinned jar, что и в корневом проекте; compileOnly, в JAR не упаковывается.
    compileOnly(rootProject.findProperty('chrdk.papiJar')
            ? files(rootProject.file(rootProject.property('chrdk.papiJar')))
            : "me.clip:placeholderapi:2.12.3")

    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    testImplementation project(':')
    testImplementation project(':skills')
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation(rootProject.findProperty('chrdk.papiJar')
            ? files(rootProject.file(rootProject.property('chrdk.papiJar')))
            : "me.clip:placeholderapi:2.12.3")
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def pluginVersion = project.version
    inputs.property "version", pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand "version": pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
    }
}
