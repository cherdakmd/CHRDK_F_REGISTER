# CHRDK_Teleports — RTP / TPA / точки дома за алмазы.
# L4-хранилище: plugins/CHRDK_Teleports/teleports-data.json (дома), конфиг — тут.

general:
  # Локаль сообщений.
  locale: ru

# В каких мирах разрешена телепортация. Пусто — во всех.
allowed-worlds: []

teleport:
  # Задержка перед телепортом, секунд (отмена движением/уроном).
  delay-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

costs:
  # Скидка на ВСЕ телепорты по ступени донатного ранга (1.4.167), проценты.
  # Индекс — уровень ранга: [без ранга, I, II, III, IV, V]. Пустой список —
  # работает старое правило vip-discount-percent для любого ранга.
  # Скидка режет цену, но не обнуляет её: платный телепорт стоит минимум 1 алмаз.
  rank-discount-percent: [0, 10, 20, 30, 40, 50]
  # Старое правило для совместимости: если rank-discount-percent не задан.
  vip-discount-percent: 50
  # Стоимость 0 делает услугу бесплатной — это осознанный выбор администратора.
  # Скидка ранга так не работает: она режет цену, но всегда оставляет
  # хотя бы один алмаз, поэтому «бесплатно по скидке» не бывает.
  rtp-diamonds: 5
  tpa-diamonds: 2
  home-diamonds: 1
  sethome-diamonds: 0

rtp:
  # Радиус случайной телепортации в блоках (окружность равномерно по площади).
  radius-blocks: 10000
  # Минимальная дистанция от центра (0 — от самого центра).
  min-radius-blocks: 250
  # Центр: true — точка спавна целевого мира; false — координаты ниже.
  use-world-spawn-center: true
  center-x: 0
  center-z: 0
  # Мир RTP: пусто — текущий мир игрока.
  world: world
  # Сколько раз подбирать кандидата до «не нашлось безопасного места».
  max-attempts: 24
  cooldown-seconds: 300

tpa:
  # Срок жизни запроса, секунд.
  request-timeout-seconds: 60
  cooldown-seconds: 30

homes:
  # Лимит точек по ступени ранга (1.4.167): [без ранга, I, II, III, IV, V].
  # Пустой список — старое правило: max-normal / max-vip.
  rank-limits: [3, 4, 6, 8, 10, 12]
  # Лимит точек: обычный игрок / владелец активного ранга (совместимость).
  max-normal: 3
  max-vip: 8
  # Каждая оплаченная покупка homes-plus: +extra-limit домов на собственный срок.
  # Количество активных пакетов читается из ядра (API v13), не из LP-права.
  # Ранг V + два пакета = 12 + 8 + 8 = 28. Старые точки не удаляются при истечении.
  # Устаревший ключ для совместимости, не источник оплаченных пакетов.
  extra-permission: "chrdktele.homes.plus"
  extra-limit: 8
  # 0 — без дополнительного потолка базы. Старое значение 12 ограничит только
  # базу ранга, но никогда не обрежет оплаченные дополнительные места.
  hard-cap: 0
  # Кровать — дом и точка возрождения. Когда игрок ложится спать, сервер
  # запоминает кровать под именем bed: /home bed работает как обычный дом,
  # а смерть возвращает игрока к кровати даже после того, как её сломали.
  # Точка бесплатная и не занимает слот из лимита домов.
  bed-spawn: true
