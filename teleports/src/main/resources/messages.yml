# Сообщения CHRDK_Teleports — структура: tp/rtp/tpa/home/admin.
tp:
  no-api: "<red>Ядро CHRDK_F_REGISTER не найдено или сломано.</red>"
  need-auth: "<red>Телепортация — только после авторизации (/login).</red>"
  player-only: "<red>Команда доступна только игрокам.</red>"
  permission: "<red>Недостаточно прав.</red>"
  usage-tpa: "<gray>Используйте: <yellow>/tpa <ник></yellow> или <yellow>/tpahere <ник></yellow>.</gray>"
  usage-home: "<gray>Используйте: <yellow>/home [имя]</yellow>, <yellow>/sethome <имя></yellow>, <yellow>/delhome <имя></yellow>. Без имени — ближайший дом или кровать.</gray>"
  cooldown: "<red>Подождите ещё %seconds% сек.</red>"
  world-denied: "<red>В этом мире телепортация отключена.</red>"
  in-progress: "<red>Сначала дождитесь текущей телепортации (или отойдите для отмены).</red>"
  warmup-start: "<yellow>Не двигайтесь %seconds% сек — телепортируем…</yellow>"
  warmup-cancelled-move: "<red>Телепортация отменена: вы двигались.</red>"
  warmup-cancelled-damage: "<red>Телепортация отменена: вы получили урон.</red>"
  insufficient: "<red>Нужно столько алмазов: <yellow>%cost%</yellow> (при себе: %have%).</red>"
  teleported: "<green>Телепортируем. Списано: <yellow>%cost%</yellow> алмазов%vip-suffix%.</green>"
  vip-suffix: " <gray>(скидка проходки %percent%%)</gray>"
  vip-suffix-empty: ""
rtp:
  searching: "<yellow>Ищем безопасное место в радиусе <gold>%radius%</gold> блоков…</yellow>"
  failed: "<red>Не нашлось безопасного места — попробуйте позже.</red>"
  done: "<green>Вы в случайной точке (%x%, %z%). Списано %cost% алмазов%vip-suffix%.</green>"
  world-missing: "<red>Мир RTP не найден (%world%).</red>"
tpa:
  self: "<red>Нельзя отправлять запрос самому себе.</red>"
  offline: "<red>Игрок %player% не в сети.</red>"
  target-unverified: "<red>Игрок %player% не авторизован.</red>"
  outgoing-exists: "<red>У вас уже есть активный запрос — сначала <yellow>/tpcancel</yellow>.</red>"
  incoming-exists: "<red>Игрок %player% уже рассматривает другой запрос.</red>"
  sent: "<green>Запрос игроку %player% отправлен. При принятии спишется %cost% алмазов.</green>"
  sent-here: "<green>Игрок %player% приглашён к вам. При принятии спишется %cost% алмазов.</green>"
  received: "<yellow>%player%</yellow> хочет телепортироваться к вам. <green>/tpaccept</green> или <red>/tpdeny</red> — <gray>%seconds% сек.</gray>"
  received-here: "<yellow>%player%</yellow> зовёт вас телепортироваться к нему. <green>/tpaccept</green> или <red>/tpdeny</red> — <gray>%seconds% сек.</gray>"
  no-request: "<red>Входящих запросов нет.</red>"
  accepted-requester: "<green>Запрос принят — готовим телепортацию.</green>"
  accepted-target: "<green>Вы приняли запрос %player%.</green>"
  denied-requester: "<red>Игрок %player% отклонил ваш запрос.</red>"
  denied-target: "<yellow>Вы отклонили запрос %player%.</yellow>"
  expired-requester: "<gray>Ваш запрос игроку %player% истёк.</gray>"
  expired-target: "<gray>Запрос от %player% истёк.</gray>"
  cancelled: "<yellow>Ваш исходящий запрос отозван.</yellow>"
  payer-offline: "<red>Заявитель отключился — телепортация отменена.</red>"
home:
  saved: "<green>Точка дома <yellow>%name%</yellow> сохранена (%used%/%max%).</green>"
  saved-paid: "<green>Точка дома <yellow>%name%</yellow> сохранена (%used%/%max%). Списано %cost% алмазов.</green>"
  limit: "<red>Достигнут лимит точек дома (%max%). Удалите лишние: <yellow>/delhome</yellow>.</red>"
  bad-name: "<red>Имя — буквы, цифры и «_», 1–16 знаков.</red>"
  not-found: "<red>Точка дома <yellow>%name%</yellow> не найдена.</red>"
  world-missing: "<red>Мир точки дома недоступен (%world%).</red>"
  deleted: "<yellow>Точка дома <white>%name%</white> удалена.</yellow>"
  list: "<gray>Ваши дома (%used%/%max%): <yellow>%homes%</yellow></gray>"
  list-empty: "<yellow>Точек дома пока нет — <green>/sethome <имя></green></yellow>"
  here: "<green>Вы дома. Списано %cost% алмазов%vip-suffix%.</green>"
  # Кровать: точка ставится сама, когда игрок ложится спать.
  bed-saved: "<green>Кровать запомнена как дом. Теперь <yellow>/home bed</yellow> вернёт вас сюда, а смерть — возродит рядом.</green>"
  bed-reserved: "<red>Имя <yellow>bed</yellow> занято кроватью: точку ставит сервер, когда вы ложитесь спать.</red>"
  bed-none: "<yellow>Кровать ещё не запомнена — просто лягте спать, и точка появится сама.</yellow>"
  bed-here: "<green>Вы у своей кровати. Списано %cost% алмазов%vip-suffix%.</green>"
  bed-deleted: "<yellow>Кровать больше не дом: возрождение вернётся к ванильному. Точка удалена.</yellow>"
  default-none: "<yellow>Дома ещё нет. <green>/sethome &lt;имя&gt;</green> или лягте спать.</yellow>"
  default-many: "<gray>Домов несколько — выберите: <yellow>%homes%</yellow>. Кровать — <yellow>/home bed</yellow>.</gray>"
admin:
  reloaded: "<green>Конфигурация телепортов перезагружена.</green>"
  usage:
    - "<gray><yellow>/tpadmin reload</yellow> — перечитать конфиг</gray>"
