name: CHRDK_Teleports
version: ${version}
main: ru.cherdakmd.chrdkteleports.TeleportsPlugin
api-version: '26.3'
description: "Телепортация CHRDK: случайная точка (RTP), запросы игрок-игрок (TPA), точки дома — за алмазы"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  rtp:
    description: Случайная телепортация в радиусе
  tpa:
    description: Запрос телепорта к игроку
  tpahere:
    description: Запрос телепорта игрока к себе
  tpaccept:
    description: Принять запрос на телепортацию
  tpdeny:
    description: Отклонить запрос на телепортацию
  tpcancel:
    description: Отозвать свой исходящий запрос
  home:
    description: "Телепорт в точку дома (без имени — кровать или единственный дом)"
    usage: "/home [имя]"
  sethome:
    description: Установить точку дома
  delhome:
    description: Удалить точку дома
  homes:
    description: Список точек дома
  tpadmin:
    description: Управление телепортами
    permission: chrdktele.admin
permissions:
  chrdktele.use:
    description: Телепортация (RTP/TPA/дома)
    default: true
  chrdktele.homes.plus:
    description: Дополнительные точки дома (товар каталога «Дополнительные дома»)
    default: false
  chrdktele.admin:
    description: Администрирование телепортов
    default: op
