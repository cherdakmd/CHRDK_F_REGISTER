# ================================================================
#  CHRDK_Queue — очередь входа на переполненный сервер
#
#  Модель: regular-limit — сколько слотов ДЛЯ ОБЫЧНЫХ игроков.
#  Игроки из LuckPerms-групп vip-groups могут зайти ВЫШЕ этого
#  лимита (до жёсткого max-players сервера в server.properties).
#  Обычные игроки при полном сервере не кикаются навсегда, а
#  встают в очередь (по нику): когда слот освобождается, первому
#  из очереди даётся reservation-seconds секунд на вход — в это
#  время слот для остальных закрыт.
#
#  ВАЖНО: выставьте server.properties → max-players БОЛЬШЕ вашего
#  regular-limit (например regular-limit: 10 при max-players: 20) —
#  иначе VIP физически некуда захоить на переполненный сервер.
# ================================================================
queue:
  enabled: true

  # Сколько слотов доступно обычным игрокам (без VIP-группы)
  regular-limit: 10

  # LuckPerms-группы, которые заходят на переполненный сервер
  # (регистр не важен). Без LuckPerms-а все игроки — обычные.
  vip-groups:
    - vip
    - mvp

  # Дополнительно можно дать вход в обход очереди по RAW-праву
  # pазрешения (LuckPerms-ноду) — удобнее, чем группа, временами
  vip-permission: "chrdkqueue.vip"
  use-vip-permission: false

  # Окно брони: сколько секунд первого из очереди ждём с его слотом
  reservation-seconds: 30

  # Максимальная длина очереди (дальше — отказ без номера места)
  max-queue: 100

  # Запись в очереди живёт, пока игрок подключается/пере-подключается:
  # игнор дольше N минут → место отдаётся следующим
  expire-minutes: 15

  # Подробное логирование в консоль (каждый отказ/бронирование)
  debug-log: false
