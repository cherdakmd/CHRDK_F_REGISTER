name: CHRDK_Queue
version: ${version}
main: ru.cherdakmd.chrdkqueue.QueuePlugin
api-version: '26.3'
description: "Очередь входа: игроки LuckPerms-VIP-групп заходят на переполненный сервер, обычные встают в очередь с бронированием слота (аддон CHRDK_F_REGISTER)"
author: cherdakmd
depend: [CHRDK_F_REGISTER]
softdepend: [LuckPerms]
commands:
  queue:
    description: "Очередь входа: состояние и управление"
    aliases: [qjoin, ochered]
    usage: "/queue <info | clear | reload>"
permissions:
  chrdkqueue.use:
    description: "Смотреть состояние очереди (/queue info)"
    default: true
  chrdkqueue.admin:
    description: "Управление очередью (clear/reload)"
    default: op
