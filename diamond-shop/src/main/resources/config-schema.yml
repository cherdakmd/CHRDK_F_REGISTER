# CHRDK_DiamondShop — версии схемы эталонных YAML.
# v2 (7 ноября 2026): панцирь шалкера выведен из продажи (catalog.retired-materials),
#     дневной лимит оборота включён и стал персональным (pricing.daily-cap.*),
#     лоты гарантированно стоят от 2 целых алмазов, добавлен административный
#     редактор каталога (/shopadmin edit|set|remove|restore|cap) и его тексты.
# Переименований и удалений нет: миграция чисто аддитивная, владельческие
# значения, каталог и комментарии сохраняются, перед записью создаётся backup.
# pricing.daily-turnover-limit: 0 теперь означает «жёсткий ручной потолок не
# задан», а не «без лимита»; выключается лимит ключом daily-cap.enabled.
config-version: 2
messages-version: 2
