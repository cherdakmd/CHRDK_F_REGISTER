# CHRDK_DiamondShop — версии схемы эталонных YAML.
# v5 (13 ноября 2026): книги чар сняты с продажи. Секция books: и тарифы
#     pricing.purchase-multipliers.books-* удалены из эталона и вычищаются из
#     файлов владельцев миграцией remove (с backup, повторный старт идемпотентен).
#     Разделы «Книги чар: наши/ванильные» исчезают из витрины /shop; прежние
#     бэкапы конфига с books: не вернут книги: парсер книг удалён из каталога.
# v4 (13 ноября 2026): одноразовый welcome-gift 10000 ⛁ и тексты главной витрины.
# v3 (8 ноября 2026): дневные акции /shop. В config.yml добавлена секция
#     promotions: (пул, товары дня, три награды и потолки), в messages.yml —
#     trading.promo-bonus-paid, trading.gui.promo-line и trading.gui.promo-tag.
#     При первом запуске ConfigUpgrader аддитивно дописывает отсутствующие
#     ключи вместе с комментариями эталона, сохраняет значения владельца и
#     форматирование, создаёт backup и проставляет маркер. Повторный старт
#     файл не трогает: намеренно удалённый ключ после v3 уже не вернётся.
#     Переименований и удалений в v3 нет — устаревших ключей изменение не
#     вводило; вывод товара из продажи делается catalog.retired-materials.
# v2 (7 ноября 2026): панцирь шалкера выведен из продажи (catalog.retired-materials),
#     дневной лимит оборота включён и стал персональным (pricing.daily-cap.*),
#     лоты гарантированно стоят от 2 целых алмазов, добавлен административный
#     редактор каталога (/shopadmin edit|set|remove|restore|cap) и его тексты.
# Переименований и удалений нет: миграция чисто аддитивная, владельческие
# значения, каталог и комментарии сохраняются, перед записью создаётся backup.
# pricing.daily-turnover-limit: 0 теперь означает «жёсткий ручной потолок не
# задан», а не «без лимита»; выключается лимит ключом daily-cap.enabled.
config-version: 5
messages-version: 4
migrations:
  config:
    5:
      remove: [books, pricing.purchase-multipliers.books-custom, pricing.purchase-multipliers.books-vanilla]
