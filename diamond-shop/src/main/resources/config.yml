# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_DiamondShop — магазин обмена ресурсов с динамическими ценами
# Аддон к CHRDK_F_REGISTER. Валюта — алмаз во всех видах (см. currency).
# ═══════════════════════════════════════════════════════════════════════════

# 1.4.221: отдельного кошелька магазина нет. Сначала /bal, недостача — предметами.
# Только обычные предметы без метаданных из 36 storage-слотов. Сдача целая на /bal.
# Старые остатки shop-data.json — замороженный вход миграции, ceil один раз в банк.
# Торговля поштучная (1..2304): эталонная партия — только единица котировки.
# Итог покупки округляется вверх, продажи вниз до целого алмаза. Нулевая выплата запрещена.
# Партия учитывает нижнюю цену и рецептурный потолок; после 1.4.245 она может измениться.
# Проверенные цепочки ограничивают скупку по минимальной стоимости получения из магазина.
# sell-enabled: false — товар только покупается игроком; отсутствие ключа означает true.
# Не хватает места — вся покупка отклоняется без оплаты и выбрасывания предметов.
# Курс предметов в физических алмазах; ручное пополнение/снятие теперь через /bal.
currency:
  DIAMOND: 1
  DIAMOND_ORE: 1
  DEEPSLATE_DIAMOND_ORE: 1
  DIAMOND_BLOCK: 9

pricing:
  # Насколько быстро запас товара возвращается к эталону (доля от разницы в час).
  # 0.05 = за час запас восстанавливается на 5% разницы с эталонным.
  stock-recovery-per-hour: 0.05
  # Устаревший ключ для совместимости конфига. Снятие теперь /bal withdraw,
  # его лимиты задаются в настройках банка Core, а не этим значением.
  max-withdraw: 6400
  # Спред между ценой покупки (ask) и продажи (bid), % от средней цены. При 10% игрок
  # внутренняя ask на 5% выше mid, bid на 5% ниже. Затем целая партия:
  # ask округляется вверх, bid вниз. Даже при 0% округление может дать разницу.
  spread-percent: 10.0
  # Дневной лимит оборота игрока в алмазах (покупки+продажи вместе, окно — сутки UTC).
  # 0 = без лимита. Лимит дополняет, но не заменяет ограничения рецептурной скупки.
  daily-turnover-limit: 0
  # Сколько точек истории цен хранить на товар (спарклайн в /shop price и витрине)
  history-points: 24
  # Шаг истории в минутах (сделки дополнительно обновляют последнюю точку)
  history-interval-minutes: 60

# Товары магазина. Цена = base-price * clamp(ref-stock / stock, min-mult, max-mult):
# игроки продают товар → запас растёт → цена падает; скупают → запас падает → цена растёт.
# category — вкладка витрины: blocks, wood, minerals, mobs, food, utility, misc.
# Пустое поле = misc (старые конфиги работают без миграции); all — служебный раздел.
# Дубликаты материалов и валюта (DIAMOND* ) пропускаются с предупреждением.
# Полный каталог, разделы и правила цен — docs/SHOP_CATALOG.md.
