messages:
  "shop":
    "no-api": "<red>Ядро CHRDK_F_REGISTER не найдено — магазин недоступен.</red>"
    "need-auth": "<red>Сначала войдите на сервер (/login), потом используйте магазин.</red>"
    "usage": "<gray>/shop — открыть магазин; /shop balance | deposit [hand|all] | withdraw <n> | price <товар> | find <текст> | buy <товар> <партий> | sell <товар> [партий|all] | stats</gray>"
    "balance": "<gray>Личный счёт /bal: <aqua>%balance% ⛁</aqua>. В инвентаре: <aqua>%physical% ⛁</aqua>. Сначала счёт, затем недостача предметами.</gray>"
    "bank-commands": "<yellow>Отдельного счёта магазина больше нет. Пополнение: /bal deposit [all|hand|сумма]; снятие: /bal withdraw <сумма>. Для покупки заранее пополнять счёт не обязательно.</yellow>"
    "unavailable": "<red>Сделка недоступна: проверьте авторизацию, Survival, право магазина и актуальное ядро с включённым банком. Возможен предел счёта или неперенесённый старый остаток — деньги сохранены. Некорректная котировка также отклоняется.</red>"
    "price-changed": "<yellow>Цена, партия или каталог изменились. Витрина обновлена; ничего не списано. Проверьте новые условия и нажмите ещё раз.</yellow>"
    "no-space": "<red>Недостаточно места в обычном инвентаре. Покупка отменена, деньги не списаны; товар на землю не выбрасывается.</red>"
    "payment-detail": "<gray>Оплачено со счёта: %account% ⛁; предметами: %physical% ⛁; целая сдача на /bal: %change% ⛁.</gray>"
    "deposit-done": "<green>Принято предметов на </green><aqua>%amount% ⛁</aqua><green>. Личный /bal: %balance% ⛁</green>"
    "deposit-none": "<yellow>В инвентаре нет алмазов, их руд и блоков (%materials%).</yellow>"
    "withdraw-done": "<green>Выдано алмазных предметов на </green><aqua>%amount% ⛁</aqua><green>. Личный /bal: %balance% ⛁</green>"
    "withdraw-invalid": "<red>Выводить можно целое число алмазов от 1 до %max%.</red>"
    "withdraw-too-little": "<red>На личном счету меньше алмаза — выводить нечего.</red>"
    "price-info": "<gray>%material%, партия %batch% шт.: продать </gray><green>%bid% ⛁</green><gray>, купить </gray><red>%ask% ⛁</red><gray> (запас %stock% из %ref%)</gray>"
    "price-history": "<gray>Тренд (%trend%): <aqua>%history%</aqua></gray>"
    "buy-done": "<green>Куплено %material% ×%units% за </green><gold>%cost% ⛁</gold><green>. Личный /bal: %balance% ⛁</green>"
    "sell-done": "<green>Продано %material% ×%units% за </green><gold>%income% ⛁</gold><green>. Личный /bal: %balance% ⛁</green>"
    "not-enough-balance": "<red>Не хватает средств /bal и обычных алмазных предметов в инвентаре: нужно %cost% ⛁; на личном счету %balance% ⛁.</red>"
    "not-enough-items": "<red>Недостаточно обычных предметов для полных партий %material%. Размер партии: /shop price %material%.</red>"
    "unknown-item": "<red>Товар %material% не торгуется в магазине.</red>"
    "invalid-number": "<red>Некорректное число: %value%</red>"
    "sell-none": "<yellow>В инвентаре нет такого товара в продаже.</yellow>"
    "sellall-done": "<green>Распродано %kinds% видов товара (%units% шт.) на </green><gold>%income% ⛁</gold><green>. Личный /bal: %balance% ⛁</green>"
    "sellall-none": "<yellow>Нет полных партий обычных товаров для продажи либо достигнут дневной лимит/предел личного счёта. Неполные остатки не забираются.</yellow>"
    "daily-limit": "<red>Дневной лимит оборота исчерпан (%limit% ⛁ в день). Сумма сделки: %cost% ⛁.</red>"
    "stats-header": "<gold>=== Статистика магазина ===</gold>"
    "stats-turnover": "<gray>Оборот за всё время: </gray><aqua>%turnover% ⛁</aqua>"
    "stats-line": "<gray>%material%: продано игроками %sold% шт., куплено %bought% шт.</gray>"
    "stats-empty": "<yellow>Сделок пока не было.</yellow>"
    "find-header": "<gold>=== Поиск: %query% ===</gold> <gray>найдено: %count%</gray>"
    "find-line": "<gray>%material% ×%batch% <dark_gray>(%category%)</dark_gray> — купить </gray><red>%ask% ⛁</red><gray>, продать </gray><green>%bid% ⛁</green>"
    "find-empty": "<yellow>По запросу «%query%» ничего не найдено. Ищите часть английского названия: iron, log, apple.</yellow>"
    "find-more": "<gray>Показаны первые %shown% из %count% — уточните запрос или откройте /shop.</gray>"
    "gui":
      "title": "<gold>Алмазный магазин</gold>"
      "title-suffix": "<dark_gray> · </dark_gray><yellow>%category%</yellow> <gray>%page%/%pages%</gray>"
      "tab-all": "<yellow>Все товары</yellow>"
      "tab-blocks": "<yellow>Блоки</yellow>"
      "tab-wood": "<yellow>Дерево</yellow>"
      "tab-minerals": "<yellow>Руды и металлы</yellow>"
      "tab-mobs": "<yellow>Добыча мобов</yellow>"
      "tab-food": "<yellow>Еда и ферма</yellow>"
      "tab-utility": "<yellow>Полезное</yellow>"
      "tab-misc": "<yellow>Прочее</yellow>"
      "tab-lore": "<gray>Товаров: %count%</gray>"
      "tab-current": "<green>▶ Открыто</green>"
      "close-name": "<red>Закрыть</red>"
      "empty": "<yellow>В этом разделе пока нет товаров.</yellow>"
      "item-id": "<dark_gray>/shop buy %id%</dark_gray>"
      "prev-name": "<yellow>← Назад</yellow>"
      "next-name": "<yellow>Далее →</yellow>"
      "balance-name": "<aqua>Личный /bal: %balance% ⛁</aqua>"
      "balance-lore": "<gray>В инвентаре: %physical% ⛁. Сначала /bal, затем предметы. Оборот: %turnover% ⛁</gray>"
      "item-lore":
        - "<gray>Продать: </gray><green>%bid% ⛁</green><gray>, купить: </gray><red>%ask% ⛁</red><gray> /партию (%batch% шт.)</gray>"
        - "<gray>Запас: %stock% / %ref%   Тренд: %trend% <aqua>%history%</aqua></gray>"
        - "<yellow>ЛКМ — купить 1 партию | Shift+ЛКМ — 16 партий</yellow>"
        - "<yellow>ПКМ — продать 1 партию | Shift+ПКМ — 16 партий</yellow>"
  # Новая схема финансов: старые пользовательские shop.* не подменяют цену за партию.
