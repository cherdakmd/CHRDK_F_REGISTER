messages:
  "shop":
    "no-api": "<red>Ядро CHRDK_F_REGISTER не найдено — магазин недоступен.</red>"
    "need-auth": "<red>Сначала войдите на сервер (/login), потом используйте магазин.</red>"
    "usage": "<gray>/shop — открыть магазин; /shop balance | deposit [hand|all] | withdraw <n> | price <товар> | find <текст> | buy <товар> <n> | sell <товар> [n|all] | stats</gray>"
    "balance": "<gray>Алмазный счёт: </gray><aqua>%balance% ⛁</aqua>"
    "deposit-done": "<green>Принято предметов на </green><aqua>%amount% ⛁</aqua><green>. Баланс: %balance% ⛁</green>"
    "deposit-none": "<yellow>В инвентаре нет алмазов, их руд и блоков (%materials%).</yellow>"
    "withdraw-done": "<green>Выдано алмазных предметов на </green><aqua>%amount% ⛁</aqua><green>. Баланс: %balance% ⛁</green>"
    "withdraw-invalid": "<red>Выводить можно целое число алмазов от 1 до %max%.</red>"
    "withdraw-too-little": "<red>На счету меньше алмаза — выводить нечего.</red>"
    "price-info": "<gray>%material%: продать </gray><green>%bid% ⛁</green><gray>, купить </gray><red>%ask% ⛁</red><gray> (запас %stock% из %ref%)</gray>"
    "price-history": "<gray>Тренд (%trend%): <aqua>%history%</aqua></gray>"
    "buy-done": "<green>Куплено %material% ×%units% за </green><gold>%cost% ⛁</gold><green>. Баланс: %balance% ⛁</green>"
    "sell-done": "<green>Продано %material% ×%units% за </green><gold>%income% ⛁</gold><green>. Баланс: %balance% ⛁</green>"
    "not-enough-balance": "<red>Не хватает средств: нужно %cost% ⛁, на счету %balance% ⛁.</red>"
    "not-enough-items": "<red>У вас нет %material% ×%units%.</red>"
    "unknown-item": "<red>Товар %material% не торгуется в магазине.</red>"
    "invalid-number": "<red>Некорректное число: %value%</red>"
    "sell-none": "<yellow>В инвентаре нет такого товара в продаже.</yellow>"
    "sellall-done": "<green>Распродано %kinds% видов товара (%units% шт.) на </green><gold>%income% ⛁</gold><green>. Баланс: %balance% ⛁</green>"
    "sellall-none": "<yellow>В инвентаре нет торгуемых товаров (или исчерпан дневной лимит).</yellow>"
    "daily-limit": "<red>Дневной лимит оборота исчерпан (%limit% ⛁ в день). Сумма сделки: %cost% ⛁.</red>"
    "stats-header": "<gold>=== Статистика магазина ===</gold>"
    "stats-turnover": "<gray>Оборот за всё время: </gray><aqua>%turnover% ⛁</aqua>"
    "stats-line": "<gray>%material%: продано игроками %sold% шт., куплено %bought% шт., цена %price% ⛁</gray>"
    "stats-empty": "<yellow>Сделок пока не было.</yellow>"
    "find-header": "<gold>=== Поиск: %query% ===</gold> <gray>найдено: %count%</gray>"
    "find-line": "<gray>%material% <dark_gray>(%category%)</dark_gray> — купить </gray><red>%ask% ⛁</red><gray>, продать </gray><green>%bid% ⛁</green>"
    "find-empty": "<yellow>По запросу «%query%» ничего не найдено. Ищите часть английского названия: iron, log, apple.</yellow>"
    "find-more": "<gray>Показаны первые %shown% из %count% — уточните запрос или откройте /shop.</gray>"
    "gui":
      "title": "<gold>Алмазный магазин</gold>"
      "title-suffix": "<dark_gray> · </dark_gray><yellow>%category%</yellow> <gray>%page%/%pages%</gray>"
      "tab-all": "<yellow>Все товары</yellow>"
      "tab-blocks": "<yellow>Блоки</yellow>"
      "tab-wood": "<yellow>Дерево</yellow>"
      "tab-minerals": "<yellow>Руды и металлы</yellow>"
      "tab-mobs": "<yellow>Добыча мобов</yellow>"
      "tab-food": "<yellow>Еда и ферма</yellow>"
      "tab-utility": "<yellow>Полезное</yellow>"
      "tab-misc": "<yellow>Прочее</yellow>"
      "tab-lore": "<gray>Товаров: %count%</gray>"
      "tab-current": "<green>▶ Открыто</green>"
      "close-name": "<red>Закрыть</red>"
      "empty": "<yellow>В этом разделе пока нет товаров.</yellow>"
      "item-id": "<dark_gray>/shop buy %id%</dark_gray>"
      "prev-name": "<yellow>← Назад</yellow>"
      "next-name": "<yellow>Далее →</yellow>"
      "balance-name": "<aqua>Ваш счёт: %balance% ⛁</aqua>"
      "balance-lore": "<gray>Оборот магазина: %turnover% ⛁</gray>"
      "item-lore":
        - "<gray>Продать: </gray><green>%bid% ⛁</green><gray>, купить: </gray><red>%ask% ⛁</red><gray> /шт</gray>"
        - "<gray>Запас: %stock% / %ref%   Тренд: %trend% <aqua>%history%</aqua></gray>"
        - "<yellow>ЛКМ — купить 1 | Shift+ЛКМ — 64</yellow>"
        - "<yellow>ПКМ — продать 1 | Shift+ПКМ — 64</yellow>"
  "admin":
    "usage": "<gray>/shopadmin stock <товар> [значение] | top | reload</gray>"
    "stock-info": "<gray>%material%: запас %stock%, цена %price% ⛁</gray>"
    "stock-set": "<green>%material%: запас установлен %stock%.</green>"
    "top-header": "<gold>=== Самые движимые товары ===</gold>"
    "top-line": "<gray>%index%. %material% — сделок: %trades% шт., цена %price% ⛁</gray>"
    "top-empty": "<yellow>Сделок пока не было.</yellow>"
    "reloaded": "<green>Конфигурация магазина перечитана.</green>"
