name: CHRDK_Events
version: '${version}'
main: ru.cherdakmd.chrdkevents.EventsPlugin
api-version: '26.3'
description: Мировые события — таймер, объявления и мягкие бонусы на время.
authors: [cherdakmd]
website: https://github.com/cherdakmd/CHRDK_F_REGISTER
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI]
commands:
  events:
    description: Что идёт сейчас и когда следующее событие.
    usage: /events [info|next|list]
    aliases: [event, sobytiya]
    permission: chrdkevents.use
  eventsadmin:
    description: Запуск, остановка и перезагрузка мировых событий.
    usage: /eventsadmin <force|stop|next|reload|list>
    permission: chrdkevents.admin
permissions:
  chrdkevents.use:
    description: Видеть события и смотреть расписание.
    default: true
  chrdkevents.admin:
    description: Запускать и останавливать события вручную.
    default: op
