# CHRDK_Events — мировые события (1.4.160).
#
# Событие — это объявление на весь сервер и мягкий бонус на время: надбавка к
# опыту, лишний кусок руды, лишний дроп с мобов или общие эффекты. Событие не
# выдаёт монеты и не заменяет игру: игрок всё равно должен добывать и драться.
#
# Что настраивается здесь:
#   general  — включено ли, язык, bossbar и порог онлайна;
#   schedule — пауза между событиями (случайная в диапазоне);
#   events   — список событий с весами и данными своего вида.
#
# С 1.4.176 у события может быть вторая половина — она включается отдельной
# секцией внутри события:
#   meteors  — падающие звёзды: огненный блок летит с неба и рассыпается добычей;
#   horde    — нашествие: множитель естественного спавна и волны мобов.

general:
  # Полностью выключает события. Уже запущенное событие при перезагрузке
  # конфига заканчивается сразу.
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Полоса сверху экрана с именем события и обратным отсчётом.
  bossbar: true
  # Сколько игроков должно быть в сети, чтобы событие началось.
  # 1 — событие может случиться и для одного, 0 — даже на пустом сервере.
  min-players: 2

schedule:
  # Пауза между событиями: сервер выбирает случайное число в этом диапазоне.
  # 600..1800 — событие раз в 10–30 минут.
  min-delay-seconds: 600
  max-delay-seconds: 1800

# Каждое событие — отдельная секция. id (ключ секции) используется в
# командах и плейсхолдерах, поэтому не меняйте его без нужды.
#
# type        XP     — надбавка к опыту в процентах;
#             MINING — шанс получить лишний предмет за сломанную руду;
#             LOOT   — шанс получить лишний предмет за убитого моба;
#             EFFECT — общие эффекты на время события.
# weight      вес в случайном выборе; 0 — событие только вручную.
# cooldown-seconds  пауза после окончания, чтобы не повторялось подряд.
# percent     процент надбавки или шанса (для EFFECT не используется).
events:
  knowledge:
    name: "Час знаний"
    description: "Опыт за любое дело идёт с надбавкой — время качаться."
    type: XP
    duration-seconds: 600
    weight: 14
    cooldown-seconds: 2700
    percent: 50
    icon: EXPERIENCE_BOTTLE

  golden_fair:
    name: "Золотая ярмарка"
    description: "Долгая и спокойная надбавка к опыту — успеете и в шахту, и на охоту."
    type: XP
    duration-seconds: 900
    weight: 10
    cooldown-seconds: 3600
    percent: 30
    icon: GOLD_INGOT

  starfall:
    name: "Звездопад"
    description: "С неба падают звёзды, а из руды выпадает лишняя крошка — успевайте за обеими."
    type: MINING
    duration-seconds: 480
    weight: 10
    cooldown-seconds: 3600
    percent: 40
    icon: AMETHYST_SHARD
    # С какими блоками работает бонус.
    blocks:
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - COPPER_ORE
      - DEEPSLATE_COPPER_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - AMETHYST_CLUSTER
    # Что именно падает сверху.
    items:
      - RAW_IRON
      - RAW_GOLD
      - RAW_COPPER
      - REDSTONE
      - LAPIS_LAZULI
      - AMETHYST_SHARD
    # Падающие звёзды. Звезда — светящийся блок, который летит с высоты 26
    # блоков, тянет огненный след, а на земле рассыпается добычей.
    # Блоки в точке падения не ломаются и не появляются.
    meteors:
      enabled: true
      # Пауза между звёздами и сколько их может лететь одновременно.
      interval-seconds: 20
      max-active: 3
      # На каком расстоянии от случайного игрока падает звезда.
      radius: 28
      # Из чего состоит звезда (случайный блок из списка).
      blocks:
        - AMETHYST_BLOCK
        - GLOWSTONE
      # Что остаётся на земле: количество от min-loot до max-loot.
      loot:
        - AMETHYST_SHARD
        - GLOWSTONE_DUST
        - GLOW_INK_SAC
      min-loot: 1
      max-loot: 3
      # Показывать координаты падения игрокам в 64 блоках.
      announce: true

  blood_moon:
    name: "Кровавая луна"
    description: "Мобы лезут гуще и волнами, а добыча с них щедрее — ночь, которую слышно."
    type: LOOT
    duration-seconds: 600
    weight: 10
    cooldown-seconds: 3600
    percent: 35
    icon: REDSTONE_BLOCK
    items:
      - SPIDER_EYE
      - BONE
      - GUNPOWDER
      - STRING
      - ROTTEN_FLESH
    # Нашествие мобов. Множитель — «эхо» естественного спавна: на каждого
    # заспавненного сервером моба рядом появляется ещё столько же.
    # Дробная часть множителя — шанс (2.5 = один всегда и второй в половине
    # случаев). Волны — отдельные группы мобов вокруг случайного игрока.
    horde:
      enabled: true
      multiplier: 2.0
      wave-interval-seconds: 40
      wave-size: 4
      # Потолки: больше этого числа враждебных мобов рядом с игроком не будет.
      max-near-player: 32
      # Кольцо расстояний для волны (блоки от игрока).
      min-distance: 10
      max-distance: 26
      # true — нашествие работает только ночью в обычном мире (днём тихо).
      only-at-night: false
      # Кого поднимать. Husk выбран не случайно: он не горит на солнце.
      mobs:
        - ZOMBIE
        - SKELETON
        - SPIDER
        - CREEPER
        - HUSK

  meteor_shower:
    name: "Метеоритный дождь"
    description: "Редкие крупные метеоры и щедрый дроп с мобов — небо работает на вас."
    type: LOOT
    duration-seconds: 420
    weight: 8
    cooldown-seconds: 5400
    percent: 25
    icon: FIREWORK_STAR
    items:
      - AMETHYST_SHARD
      - GLOWSTONE_DUST
      - BLAZE_POWDER
      - GOLD_NUGGET
      - IRON_NUGGET
    # Здесь звёзды редкие и крупные: метеор несёт больше добычи, чем звезда
    # «Звездопада», и падает дальше от игрока.
    meteors:
      enabled: true
      interval-seconds: 55
      max-active: 2
      radius: 40
      blocks:
        - MAGMA_BLOCK
        - OBSIDIAN
      loot:
        - RAW_IRON
        - RAW_GOLD
        - GOLD_NUGGET
        - IRON_NUGGET
        - BLAZE_POWDER
        - AMETHYST_SHARD
      min-loot: 2
      max-loot: 4
      announce: true

  quiet_hour:
    name: "Тихий час"
    description: "Сервер дышит спокойно: регенерация и ночное зрение на время события."
    type: EFFECT
    duration-seconds: 600
    weight: 8
    cooldown-seconds: 5400
    icon: CLOCK
    effects:
      - type: regeneration
        amplifier: 0
        seconds: 120
      - type: night_vision
        amplifier: 0
        seconds: 600
