# =====================================================================
# CHRDK_F_REGISTER — ТЕКСТЫ ПЛАГИНА (messages.yml)
# =====================================================================
# Здесь собраны ВСЕ сообщения плагина: их можно свободно переписывать,
# переводить и перекрашивать без правки кода.
#
# Формат разметки — MiniMessage:
#   <red>текст</red>, <gradient:gold:yellow>текст</gradient>
#   <hover:show_text:'<green>подсказка</green>'>текст</hover>
#   <click:open_url:'https://...'>ссылка</click>, <bold>, <underlined>, <italic>
#   Старые коды вида &c &l тоже работают — они переводятся автоматически.
#
# Подстановки пишутся в процентах и подставляются плагином:
#   %player%, %price%, %days%, %until%, %reason%, %duration%, %count% и т. д.
#   Значения экранируются, поэтому ник игрока не сможет «сломать» разметку.
#
# Важно:
#   * Ключи, которых нет в этом файле, берутся из значений по умолчанию —
#     при обновлении плагина файл ломаться не будет.
#   * Изменения применяются командой /pass reload (без перезапуска сервера).
#     Команда также проверит файл: ошибки разметки, неизвестные ключи и
#     потерянные подстановки будут показаны администратору.
#   * Часовой пояс дат настраивается в config.yml (general.timezone).
# =====================================================================

