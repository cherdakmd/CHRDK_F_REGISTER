  # ---------------------------------------------------------------
  # guide — Книга-путеводитель для новичков (команда /guide, 1.4.107)
  # ---------------------------------------------------------------
  "guide":
    "title": "Путеводитель новичка"
    "author": "Сервер CHERDAK"
    "received": "<green>📘 Путеводитель новичка у вас в инвентаре — откройте книгу и читайте.</green>"
    "disabled": "<red>Книга-путеводитель отключена в конфигурации сервера.</red>"
    # Каждый элемент списка — отдельная страница книги (до 100 страниц по 1024 символа).
    # Перенос строки внутри страницы — тег <newline>, цвета — обычная разметка MiniMessage.
    # Страницы должны оставаться ОДНОЙ строкой: список разбивается по строкам файла.
    "pages":
      - "<gold><bold>Добро пожаловать на CHERDAK!</bold></gold><newline><gray>Это выживание с защитой построек, экономикой и проходкой. В книге — короткий маршрут новичка: что сделать в первый час и куда смотреть дальше.</gray>"
      - "<aqua><bold>Вход на сервер</bold></aqua><newline><gray>1. /register пароль пароль — пароль от аккаунта.<newline>2. /2fa setup — отсканируйте QR-карту из руки.<newline>3. /2fa confirm код — привязка готова.<newline>Дальше: /login пароль. Выход: /logout.</gray>"
      - "<gold><bold>Проходка</bold></gold><newline><gray>Играть можно только с проходкой. Проверить срок: /pass status. Продлить: /pass donate — там страница оплаты. После оплаты заходить заново не нужно, доступ включится сразу.</gray>"
      - "<green><bold>Первые шаги</bold></green><newline><gray>Не стройтесь у спавна: /rtp перенесёт в случайную точку мира (стоит алмазы). Осмотритесь и поставьте кровать — после смерти вы вернётесь к ней.</gray>"
      - "<yellow><bold>Защита дома</bold></yellow><newline><gray>Купите приват: /claim — это чанк 16×16. Пополняйте казну: /claim deposit, проверка: /claim balance. Команды и карта: /claim help.</gray>"
      - "<aqua><bold>Дом и перемещения</bold></aqua><newline><gray>/sethome дом — сохранить точку, /home дом — вернуться, /homes — список. Позвать к себе: /tpahere ник, прийти к игроку: /tpa ник. Ответ: /tpaccept.</gray>"
      - "<light_purple><bold>Экономика</bold></light_purple><newline><gray>Магазин: /shop. Аукцион: /ah. Лотерея: /lottery. Ежедневная награда: /daily — не пропускайте стрик. Валюта — алмазы.</gray>"
      - "<red><bold>Развитие</bold></red><newline><gray>Редкости снаряжения: /tiers. Артефакты: /artifacts. Чары: /enchants. Звания за стаж: /ranks. Сезон: /battlepass. Общие цели: /goals.</gray>"
      - "<white><bold>Общение и помощь</bold></white><newline><gray>/chat — локальный и общий чат. /msg ник текст — личное сообщение, /r — ответ. Главное меню: /menu. Эта книга снова: /guide.</gray>"

