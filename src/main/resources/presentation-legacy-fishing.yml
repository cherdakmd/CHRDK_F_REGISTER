  - category: account
    icon: NETHER_STAR
    name: <gold><bold>Витрина рангов</bold></gold>
    lore: '<gray>Пять ступеней: что даёт каждая</gray>

      <dark_gray>Карточки, цены и кнопка оплаты</dark_gray>'
    command: rank
  - category: account
    icon: BOOK
    name: <gold><bold>Правила рангов</bold></gold>
    lore: '<gray>Что ранг даёт и чего не даёт</gray>

      <dark_gray>Честные границы без скрытых бонусов</dark_gray>'
