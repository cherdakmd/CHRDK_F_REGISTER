      <gray>и шапка таба — каждое включается отдельно</gray>

      <dark_gray>Клик: /labels</dark_gray>'
    command: labels
    permission: chrdkregister.labels
  - category: social
    icon: SHIELD
    name: <gold><bold>Античит</bold></gold>
    lore: <gray>Все классы читов под наблюдением</gray>\n<gray>Журнал доказательств,
      запрет выносит человек</gray>\n<dark_gray>Клик — как это работает</dark_gray>
    command: ac
    plugin: CHRDK_Anticheat
    permission: chrdkanticheat.use
auto-messages:
  enabled: true
  interval-seconds: 240
  random-order: true
  minimum-players: 1
  prefix: '<dark_gray>[<gold>CHRDK</gold>]</dark_gray> '
  messages:
  - text: '<gray>С чего начнётся ваша история? Откройте <white>/menu</white>: стройка,
      ремесло, приключения и развитие собраны по разделам.</gray>'
    permission: chrdkregister.menu
  - text: '<gray>Не гадайте о правилах: <white>/wiki</white> открывает справочник
      CHERDAK. Точные цены, требования и доступность проверяйте в игре.</gray>'
  - text: '<gray>Ваш прогресс в одном месте — <white>/profile</white>: ранг, личный
      банк и разделы развития. Это личная карточка, а не выбор ремесла.</gray>'
    permission: chrdkregister.profile
  - text: '<gray>На вашем личном счёте — <white>%balance%</white> алмазов. Проверка:
      <white>/bal</white>. Исторические счётчики — <white>/bal stats</white>, не вся
      прибыль. Казна клана отдельна; личные приваты оплачиваются с /bal, покупки —
      тоже с вашего счёта.</gray>'
    permission: chrdkregister.bal
  - text: '<gray>Освободите инвентарь: обычные алмазы и алмазные блоки вносятся через
      <white>/bal deposit</white>. Снятие: <white>/bal withdraw сумма</white>; от
      64 алмазов нужны просмотр условий и confirm за 30 секунд.</gray>'
    permission: chrdkregister.bal
  - text: '<gray>Перевод другу: <white>/pay ник сумма</white>. Проверьте комиссию
      и зачисление, затем введите <white>/pay ник сумма confirm</white> за 30 секунд;
      повторный confirm не создаёт новое согласие. Просмотр условий не резервирует
      алмазы.</gray>'
    permission: chrdkregister.pay
  - text: '<gray>Хотите обратиться ко всему серверу? Начните сообщение с <white>!</white>.
      Каналы: <white>/chat global</white> и <white>/chat local</white>; текущий —
      <white>/chat status</white>.</gray>'
  - text: '<gray>Разговор на двоих: <white>/msg ник текст</white>, ответ — <white>/r
      текст</white>. Перед отправкой проверьте адресата; пароли и коды 2FA не сообщайте
      никому.</gray>'
  - text: '<gray>Защитите историю своего персонажа: 2FA подключается по желанию:  <white>/2fa
      setup</white>, затем <white>/2fa confirm код</white>. Секрет храните отдельно,
      одноразовые коды никому не передавайте.</gray>'
    condition: unsecured
  - text: <gray>Завершаете игру на чужом компьютере? Используйте <white>/logout</white>.
      Проверить сохранённые сессии можно через <white>/session</white>.</gray>
  - text: <gray>Играть можно без покупки ранга. Личные удобства и условия рангов —
      <white>/rank shop</white>, действующие права — <white>/rank my</white>. Пароль
      для входа обязателен.</gray>
  - text: <gray>Ваш ранг действует ещё <white>%pass_left%</white>. Срок и возможности
      — <white>/rank my</white>. Ранг не заменяет пароль и подключённую 2FA.</gray>
    condition: paid
  - text: '<gray>Сделайте ник своим: <white>/labels</white> управляет метками и их
      местами. Ник всегда первый; премиальные цвета покупаются отдельно, в том числе
      при V ранге.</gray>'
    permission: chrdkregister.labels
  - text: '<gray>Награда за игру — не платный ранг: отдельный XP-буст усиливает опыт
      Minecraft и навыков. Запас смотрите в <white>/profile</white>; время расходуется
      онлайн после входа. Платный ранг не продлевается.</gray>'
    permission: chrdkregister.profile
  - text: '<gray>Каждое дело оставляет опыт: <white>/skills</white> показывает навыки
      CHRDK. Читайте требования и откаты в карточках; повторная установка блока не
      гарантирует новый XP.</gray>'
    plugin: CHRDK_Skills
    permission: chrdkskills.use
  - text: '<gray>Нужна цель для путешествия? <white>/quests menu</white> — задания
      и фракции. Условия: <white>/quests info id</white>, сдача: <white>/quests claim
      id</white>. Награды — опыт, предметы и репутация, не алмазы.</gray>'
    plugin: CHRDK_Quests
    permission: chrdkquests.use
  - text: '<gray>Сезон — это путь, а не гонка за один вечер. Задания: <white>/battlepass
      menu</white>, прогресс: <white>/battlepass progress</white>. Перед получением
      проверьте условия дорожки наград.</gray>'
    plugin: CHRDK_BattlePass
    permission: chrdkbp.use
  - text: '<gray>Собирайте историю своих достижений: <white>/achievements menu</white>.
      Чтобы заслуженный бейдж появился у ника, включите и разместите его через <white>/labels</white>.</gray>'
    plugin: CHRDK_Achievements
    permission: chrdkachievements.use
  - text: '<gray>Сегодняшняя награда ждёт действия: <white>/daily info</white> → <white>/daily
      claim</white>. День считается по UTC; простой вход не выдаёт награду, пропуск
      дня сбрасывает серию.</gray>'
    plugin: CHRDK_DailyRewards
    permission: chrdkdaily.use
  - text: '<gray>Большие дела легче вместе: <white>/goals</white> показывает общую
      цель и ваш вклад. Личные ожидающие награды — <white>/goals claim</white>; общий
      фонд не равен выплате одному игроку.</gray>'
    plugin: CHRDK_CommonGoals
    permission: chrdkgoals.use
    min-online: 3
  - text: '<gray>Наигранное время тоже становится историей: <white>/ranks</white>
      — заслуженные звания. Это не оплаченные ранги; отображение настраивается через
      <white>/labels</white>.</gray>'
    plugin: CHRDK_Ranks
    permission: chrdkranks.use
  - text: '<gray>Перед покупкой узнайте сумму: <white>/shop quote buy товар количество</white>.
      Количество считается поштучно; расчёт не фиксирует цену. Оплата сначала с <white>/bal</white>,
      затем обычными алмазами при недостаче.</gray>'
    plugin: CHRDK_DiamondShop
    permission: chrdkshop.use
  - text: '<gray>Разгрузите рюкзак осознанно: <white>/shop quote sell товар количество</white>
      — расчёт, <white>/shop sellall</white> — немедленная продажа. Продажа копит
      неоплаченную долю до целого алмаза в <white>/bal</white>, без округления вверх.</gray>'
    plugin: CHRDK_DiamondShop
    permission: chrdkshop.use
  - text: '<gray>Дом начинается с защищённой земли. Содержание личных чанков оплачивается
      с <white>/bal</white>; <white>/claim budget 3</white> считает запас с долгом
      и допустимыми продлениями аренды: предоплата не вычитается, это не календарь
      списаний. <white>/claim sellback</white> требует подтверждения.</gray>'
    plugin: CHRDK_Claims
    permission: chrdkclaims.use
  - text: <gray>Нужен участок на время? <white>/claim rent</white>. Продление оплачивается
      с личного <white>/bal</white> арендатора, содержание — со счёта владельца. Нехватка
      средств прекращает аренду; оплаченный срок защищён, собственность не переходит.</gray>
    plugin: CHRDK_Claims
    permission: chrdkclaims.use
  - text: <gray>Вернуться домой — <white>/homes</white>, проверить цены — <white>/homes
      prices</white>. Платный <white>/sethome имя</white> сначала показывает стоимость;
      <white>/sethome имя confirm</white> — в той же точке и с тем же взглядом за
      30 секунд. Перемещения платные.</gray>
    plugin: CHRDK_Teleports
    permission: chrdktele.use
  - text: '<gray>Сильная чара начинается с подходящей книги: <white>/enchants sources</white>
      — источники, <white>/enchants info id</white> — условия. Книга не отменяет конфликты
      и ограничения наковальни.</gray>'
    plugin: CHRDK_Enchants
    permission: chrdkenchants.use
  - text: '<gray>У каждой находки две стороны: <white>/artifacts collection</white>.
      Полезный эффект может требовать опыт, иметь перезарядку или сочетаться с недостатком
      — читайте всю карточку.</gray>'
    plugin: CHRDK_Artifacts
    permission: chrdkartifacts.use
  - text: <gray>Мирный или боевой клан? <white>/clan gui</white>. Казна отдельна от
      <white>/bal</white>; ежедневный взнос — не меньше 10 алмазов с участника. У
      мирного клана есть дополнительная плата; условия читайте до вступления.</gray>
    plugin: CHRDK_Guilds
    permission: chrdkguilds.use
  - text: '<gray>Последний штрих к образу: <white>/cosmetics trails</white> — доступные
      шлейфы, <white>/cosmetics off</white> — отключение. Открытый каталог не означает
      владение; у права может быть срок.</gray>'
    plugin: CHRDK_Cosmetics
    permission: chrdkcosmetics.use
  - text: <gray>Хотите поддержать CHERDAK? <click:run_command:'/donate'><white>/donate</white></click>
      даст официальную ссылку. Не переводите деньги по реквизитам из чужих личных
      сообщений.</gray>
    permission: chrdkregister.donate
  - text: '<gray>CHERDAK рядом и вне игры: <white>/vk link</white> выдаёт код для
      личных сообщений сообщества. Входы и самозащита — в ЛС; беседа — для общения
      и новостей. Пароли и коды 2FA боту не отправляйте.</gray>'
    plugin: CHRDK_VK
    permission: chrdkvk.use
  - text: '<gray>Свой угол производства: <white>/generator</white> — личный генератор
      из лавы и воды, тиры ресурсов и модули.</gray>'
    plugin: CHRDK_Generator
    permission: chrdkgenerator.use
  - text: '<gray>Читы на CHERDAK ловит античит: движение, бой, пакеты и чат под наблюдением.
      Срабатывания попадают в журнал доказательств, запрет выносит человек — исключений
      ни у кого.</gray>'
    plugin: CHRDK_Anticheat
    permission: chrdkanticheat.use
  - text: '<gray>На CHERDAK работает <white>Plasmo Voice</white>: голосовой чат с
      учётом расстояния между игроками. Нужен клиентский мод Plasmo Voice и настроенный
      микрофон; текстовые каналы и правила общения остаются прежними.</gray>'
  - text: '<gray>Чем дальше от спавна мира, тем опаснее мобы: подпись «Т3 · Зомби»
      — это тир врага, а убийство сильных приносит деньги на счёт. Границы тиров и
      награды: <white>/mobtiers</white>.</gray>'
    plugin: CHRDK_Mobs
    permission: chrdkmobs.use
