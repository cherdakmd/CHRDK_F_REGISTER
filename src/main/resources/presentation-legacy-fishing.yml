    permission: chrdkcosmetics.use
  - category: social
    icon: FEATHER
    name: <gold><bold>Чат</bold></gold>
    lore: '<gray>Клик — переключить канал</gray>

      <dark_gray>Локальный слышат рядом, глобальный — все</dark_gray>'
    command: chat
  - category: social
    icon: WHITE_BANNER
    name: <gold><bold>Гильдия</bold></gold>
    lore: <gray>Казна, ранги и войны</gray>
    command: guild menu
    plugin: CHRDK_Guilds
    permission: chrdkguilds.use
  - category: social
    icon: NAME_TAG
    name: <gold><bold>Оформление ника</bold></gold>
