server-menu:
  enabled: true
  title: <gold>Меню сервера</gold>
  category-title: <dark_gray>Меню · </dark_gray><gold>%category%</gold>
  back-slot: 40
  back-icon: ARROW
  back-name: <gray>◀ Назад</gray>
  close-slot: 44
  close-icon: BARRIER
  close-name: <red>✖ Закрыть</red>
  categories:
  - id: account
    slot: 10
    icon: PAPER
    name: <gold><bold>Ранг и аккаунт</bold></gold>
    lore: <gray>Ранг, оплата, награды входа и защита аккаунта</gray>
  - id: progress
    slot: 11
    icon: EXPERIENCE_BOTTLE
    name: <gold><bold>Прогресс и награды</bold></gold>
    lore: <gray>Сезон, задания, навыки, класс и достижения</gray>
  - id: economy
    slot: 12
    icon: DIAMOND
    name: <gold><bold>Экономика</bold></gold>
    lore: <gray>Банк и магазин</gray>
  - id: world
    slot: 13
    icon: GRASS_BLOCK
    name: <gold><bold>Мир и территории</bold></gold>
    lore: <gray>Приваты, дома и телепорты</gray>
  - id: gear
    slot: 14
    icon: ANVIL
    name: <gold><bold>Снаряжение</bold></gold>
    lore: <gray>Чары, тиры, артефакты и косметика</gray>
  - id: social
    slot: 16
    icon: BELL
    name: <gold><bold>Общество</bold></gold>
    lore: <gray>Чат, гильдия, оформление</gray>
  items:
  - slot: 4
    icon: PLAYER_HEAD
    name: <gold><bold>%player%</bold></gold>
    lore: '<gray>Ранг: <white>%rank%</white></gray>

      <gray>Осталось: <white>%pass_left%</white></gray>

      <dark_gray>Клик — карточка игрока</dark_gray>'
    command: profile
    permission: chrdkregister.profile
  - slot: 20
    icon: BOOK
    name: <gold><bold>Вики сервера</bold></gold>
    lore: '<gray>Все команды, цены и лимиты сайтом</gray>

      <dark_gray>Клик — ссылка на сайт в чат</dark_gray>'
    command: wiki
  - slot: 22
    icon: KNOWLEDGE_BOOK
    name: <gray><bold>Как пользоваться</bold></gray>
    lore: '<gray>Клик по иконке открывает раздел</gray>

      <gray>Внутри — кнопки с командами</gray>

      <gray>«Назад» и «Закрыть» — в нижнем ряду</gray>'
  - slot: 24
    icon: EMERALD
    name: <gold><bold>Поддержать сервер</bold></gold>
    lore: '<gray>Официальный донат-магазин CHRDK</gray>

      <yellow>chrdk.trademc.org</yellow>

      <dark_gray>Клик — ссылка на магазин в чат</dark_gray>'
    command: donate
    permission: chrdkregister.donate
  - category: account
    icon: NAME_TAG
    name: <gold><bold>Мой ранг</bold></gold>
    lore: '<gray>Сейчас: <white>%rank%</white> <dark_gray>·</dark_gray> <white>%rank_status%</white></gray>

      <gray>Осталось: <white>%pass_left%</white></gray>

      <dark_gray>Клик — бонусы ступени и срок</dark_gray>'
