# Алмазный банк: /bal, /pay, /baltop (1.4.138).
# Валюта — алмазы: предметы в инвентаре и счёт в банке. Курс фиксированный,
# депозит и снятие ничего не теряют. Переводы идут по счёту и работают для
# офлайн-получателей, поэтому не зависят от свободного места в инвентаре.
economy:
  # false — команды /bal, /pay, /baltop отключены, счета сохраняются.
  enabled: true
  # Сколько алмазов даёт один алмазный блок при депозите.
  block-worth: 9
  # Границы одного перевода /pay (в алмазах).
  min-pay: 1
  max-pay: 1000000
  # Комиссия перевода в процентах: вычитается из суммы и «сгорает».
  # 0 — переводы без потерь; 2 — сдерживающий налог на крупные суммы.
  pay-tax-percent: 0
  # Пауза между переводами одного игрока (секунды, 0 — без паузы).
  pay-cooldown-seconds: 2
  # Сколько строк показывает /baltop (3..50).
  baltop-size: 10
  # Разрешать переводы игрокам не в сети (счёт открывается при первом входе).
  allow-offline-pay: true

# Интеграции со сторонними плагинами (мягкие зависимости — без них плагин работает как обычно)
integrations:
  # Группа LuckPerms, которая выдаётся игрокам с активным рангом (пустая строка — выключено).
  # Снимается при отзыве /pass remove и при истечении (см. ниже).
  # С pass-group-paid-only: true (по умолчанию) группа — признак покупки: пробный период
  # и /pass testpay её не выдают, ручная выдача и Boosty — выдают.
  pass-group: ""
  # Снимать группу при истечении ранга (false — группа остаётся, пока админ не отзовёт ранг)
  pass-group-remove-expired: true
  # Выдавать группу ТОЛЬКО за реальную оплату: тестовый период при регистрации (/register)
  # и тестовая оплата (/pass testpay) группу не выдают — она появится после первой покупки.
  # false = группа выдаётся при любом активном ранге, включая приветственный (старое поведение)
  pass-group-paid-only: true
  # Дополнительные права для группы ранга. Применяются по /pass luckperms setup:
  # он создаёт/достраивает схему default → <pass-group> → admin (права всех chrdk*-аддонов).
  pass-group-permissions: []
  # Защита служебных команд от обычных игроков при /pass luckperms setup: в группу
  # default выставляются ЯВНЫЕ запреты (/plugins, /version, /timings, /op, /ban,
  # /whitelist, /kick и т.п.), а в admin — те же узлы разрешёнными (вес решает).
  lp-command-protect: true
  # Дополнительные узлы, запрещаемые обычным игрокам (добавляются к встроенному списку):
  lp-deny-extra: []

auth:
  # Время жизни сессии по IP в минутах (0 = отключить сессию, спрашивать пароль при каждом входе)
  session-minutes: 30
  # Может ли IP-сессия пропускать код 2FA (false = код требуется всегда — безопаснее).
  # При totp.required: true этот ключ игнорируется — второй фактор не пропускается никогда.
  session-skips-2fa: false
  # Требовать, чтобы сессия принадлежала тому же UUID игрока
  session-require-same-uuid: true
  # Минимальная и максимальная длина пароля
  min-password-length: 8
  max-password-length: 64
  # Максимальное количество неверных попыток ввода пароля до кика с сервера
  max-login-attempts: 5
  # Интервал отправки напоминаний заблокированным игрокам (в секундах)
  reminder-seconds: 5
  # Эскалационная проверка «ты не бот»: после N подряд неудачных попыток входа перед
  # следующей попыткой открывается диалог с выбором правильного числа (0 = выключено)
  captcha-after-attempts: 3
  # Показывать ввод пароля в нативном диалоге Paper 1.21.6+ вместо команды /login <пароль>
  dialogs: true
  # Вход кнопками: /login без аргументов открывает инвентарную клавиатуру, где каждый клик
  # добавляет символ и перетасовывает раскладку — по записи стрима пароль не восстановить.
  # Клики не попадают ни в чат, ни в консоль, ни в логи. (false = только команда/диалог)
  button-login: true
  # Дополнительные знаки на странице «цифры и знаки» кнопочной клавиатуры
  button-login-symbols: "!@#$%&*-_+=.?"
  # Маскировать аргументы /login, /register, /changepassword и /2fa в консоли и logs/latest.log
  mask-commands-in-logs: true
  # Запрещать пароли из списка самых частых и пароли из последовательных символов
  reject-common-passwords: true
  # Запрещать пароль, совпадающий с ником или похожий на него
  reject-nickname-as-password: true
  # Показывать оценку надёжности пароля при регистрации и смене
  password-strength-hint: true
  brute-force:
    # Задержка в секундах по номеру неудачной попытки (последнее значение применяется ко всем дальше)
    backoff-seconds: [0, 0, 1, 2, 5, 10, 30, 60, 120, 300]
    # Лимит неудачных попыток на аккаунт в пределах окна
    account-max-attempts: 8
    account-window-minutes: 10
    # Лимит неудачных попыток с одного IP на все аккаунты (перебор по списку ников)
    per-ip-max-attempts: 15
    per-ip-window-minutes: 10
    # Временный бан IP при превышении лимита (0 = не банить, только блокировать вход)
    temp-ip-ban-minutes: 15
    # Уведомлять администраторов в чате при всплеске неудачных попыток
    notify-admins: true

anti-multialt:
  # Отслеживать, когда с одного IP входят несколько аккаунтов с активными рангами
  enabled: true
  # notify = предупредить администрацию и записать в аудит, deny = запретить вход
  mode: notify
  max-accounts-per-ip: 3
  window-minutes: 240

guide:
  # Книга-путеводитель для новичков (1.4.107): краткая инструкция по серверу в виде
  # письменной книги. Тексты (заголовок, автор и страницы) — в messages.yml: guide.title,
  # guide.author, guide.pages — их можно править без пересборки плагина.
  enabled: true
  # Выдавать книгу при первом входе после регистрации (один раз на аккаунт).
  # Игравшим до обновления книгу не навязываем — они берут её командой /guide.
  # false = книга не выдаётся автоматически, но /guide продолжает работать.
  give-on-first-join: true

spawn:
  # Случайный спавн (1.4.106): новичок появляется в случайной точке мира после регистрации/входа,
  # а погибший — вместо спавна мира. Только если у игрока нет СВОЕГО места: кровати, якоря
  # возрождения или личной точки /spawnpoint (это не отключается), дома в CHRDK_Teleports
  # (respect-homes) и привата в CHRDK_Claims (respect-claims).
  enabled: true
  # Первый заход: случайная точка после завершения входа (пароль + 2FA).
  on-first-join: true
  # Смерть: случайная точка вместо спавна мира при возрождении.
  on-death: true
  # Мир для случайной точки; пустая строка — мир игрока. Смерть в Нижнем мире/Энде
  # переносит в случайную точку основного мира (на крыше Нижнего мира спавнить нельзя).
  world: ""
  # Центр поиска — спавн мира (true) или фиксированные координаты ниже.
  use-world-spawn-center: true
  center-x: 0
  center-z: 0
  # Радиус кольца в блоках: точка выбирается равномерно по площади, от min-radius до radius.
  radius-blocks: 3000
  min-radius-blocks: 200
  # Сколько раз пробовать найти безопасное место. Каждая проба в неизученном чанке
  # генерирует его — не ставьте слишком много.
  max-attempts: 16
  # Не выбирать точку внутри чужого привата (CHRDK_Claims).
  avoid-claims: true
  # Не переносить игрока, у которого уже есть свой приват / дом.
  respect-claims: true
  respect-homes: true
  # Смерть в Нижнем мире/Энде: overworld — случайная точка основного мира (по умолчанию),
  # vanilla — обычное возрождение в этом измерении (рандом там не применяется).
  other-dimensions: "overworld"

totp:
  # Включить поддержку двухфакторной аутентификации (TOTP: Google Authenticator, 2FAS, Authy, Яндекс Ключ)
  enabled: true
  # Обязательная 2FA ДЛЯ ВСЕХ: пока игрок не привяжет приложение-аутентификатор, он не попадает
  # в игру (доступны только /2fa, /login, /captcha). Привязка идёт сразу после пароля:
  # /2fa setup → скан QR/ключа → /2fa confirm <код>. Отключить 2FA сам игрок не может —
  # только администратор командой /pass reset2fa <ник> (после сброса привязка потребуется снова).
  # При enabled: false этот ключ не действует. false = 2FA по желанию игрока (старое поведение).
  # ВНИМАНИЕ: включение переводит в режим привязки всех, у кого 2FA ещё не настроена.
  required: true
  # Название сервера в приложении-аутентификаторе (Issuer)
  issuer: "CHRDK"
  # Допустимое расхождение времени в 30-секундных шагах (1 = ±30 секунд)
  window-steps: 1
  # Максимальное количество неверных попыток ввода 6-значного кода 2FA до кика с сервера
  max-attempts: 5
  # Выдавать карту с QR-кодом otpauth:// при /2fa setup (и по команде /2fa qr):
  # привязка приложения-аутентификатора одним сканом вместо ручного ввода ключа
  qr-map: true

storage:
  # Как часто сбрасывать накопленные изменения data.json на диск (в секундах)
  save-debounce-seconds: 5
  # Писать файл данных в отдельном потоке (false = в главном потоке)
  write-async: true
  # Сколько последних бэкапов хранить в папке backups/ (0 = не удалять старые)
  backup-count: 14
  # Делать бэкап при запуске сервера
  backup-on-start: true

audit:
  # Вести журнал событий (аудит) в папке audit/ в формате JSONL
  enabled: true
  # Сколько дней хранить аудит
  keep-days: 180
  # Записывать успешные входы и выходы игроков
  log-logins: true

notifications:
  # Вебхук Discord для важных событий (пусто = уведомления выключены)
  discord-webhook-url: ""
  # Какие события отправлять: pass.granted, pass.revoked, bruteforce.alert, totp.reset, password.reset,
  # multialt.alert, donate.pending, donatepay.error, donatepay.down, donatepay.up,
  # chat.mute, totp.enabled, totp.disabled, password.change, update.available, lottery.draw
  events: [pass.granted, pass.revoked, bruteforce.alert, totp.reset, password.reset, donate.pending,
          donatepay.error, donatepay.down, donatepay.up, update.available, lottery.draw]
  # Упоминания в сообщении (например, "<@&1234567890>")
  mentions: []

metrics:
  # Отправлять анонимную статистику bStats (требуется числовой ID плагина с bstats.org)
  bstats: true
  # ID выдаётся бесплатно на bstats.org (заведите там плагин CHRDK_Core); 0 = метрики выключены.
  # Отправляются только обезличенные числа: игроки с рангами, аккаунты с 2FA, активный провайдер доната.
  bstats-id: 0

# Ручные команды (независимы от enabled): /pass update check и pass update download.
# download только из консоли/RCON; проверяет GitHub SHA-256 всех 17 JAR и общий ZIP,
# готовит лишь установленные плагины в пустом update-folder, сохраняет исходные JAR.
# После сообщения о готовности нужен полный перезапуск; /reload не устанавливает код.
updates:
  # Фоново проверять новые версии ядра на GitHub Releases (игру не тормозит)
  enabled: true
  # Репозиторий релизов вида owner/name
  repo: "cherdakmd/CHRDK_F_REGISTER"
  # Как часто проверять, в часах (1..720)
  interval-hours: 6
  # Сообщать администраторам (право chrdkregister.admin) — сразу при обнаружении и при входе на сервер
  notify-admins: true

chat:
  # Включить встроенный чат: локальный/глобальный каналы, упоминания, личные сообщения, автосообщения
  enabled: true
  # Режим чата по умолчанию: local (слышно в радиусе) или global (слышно всему серверу)
  default-channel: local
  # Радиус слышимости локального чата в блоках
  local-radius: 100
  # Слышен ли локальный чат игрокам в других мирах (false = только в пределах своего мира)
  local-cross-world: false
  # Префикс разового сообщения в глобальный чат, например "!привет"; пустая строка отключает приём
  quick-global-prefix: "!"
  # Форматы сообщений. Подстановки: %player%, %world%, %message%
  local-format: "&7[Л] &f%player%&7: &f%message%"
  global-format: "&6[Г] &f%player%&7: &f%message%"
  # Разрешить цветовые коды в чате (право chrdkregister.chat.color)
  allow-color-codes: true
  # Задержка между сообщениями одного игрока в секундах (0 = без задержки)
  cooldown-seconds: 1
  # Максимальная длина одного сообщения в символах
  max-message-length: 256
  # Автоматически исправлять сообщения, написанные КАПСОМ
  anti-caps: true
  # Порог заглавных букв в процентах, после которого сообщение переводится в нижний регистр
  caps-percent: 70
  # Запрещать повторную отправку одного и того же сообщения
  block-duplicates: true
  # Через сколько секунд одно и то же сообщение можно отправить снова
  duplicate-window-seconds: 15
  # Упоминания вида @ник: подсветка в чате, уведомление и звук упомянутому игроку
  mention-highlight: true
  mention-color: "&e"
  mention-sound: true
  # Максимум упоминаний @ник в одном сообщении (0 = без ограничения)
  max-mentions: 3
  # Медленный режим глобального чата: минимум секунд между сообщениями всех игроков (0 = выключен)
  slow-mode-seconds: 0
  # Фильтр запрещённых слов, регулярных выражений и ссылок
  filter:
    enabled: true
    # replace = заменять совпадения на ***, block = не отправлять сообщение совсем
    mode: replace
    words: []
    regex:
      - "(?i)https?://"
      - "(?i)discord\\.gg/"
      - "(?i)(?:\\d{1,3}\\.){3}\\d{1,3}"
    # Строки, при наличии которых фильтр не применяется (вайтлист)
    whitelist: []
    notify-admins: true
  # История чата (logs/chat/chat-ГГГГ-ММ-ДД.log) и команда /chat history
  chat-log:
    enabled: true
    keep-days: 90
    include-private: true
  # Сообщения о входе и выходе игроков (по умолчанию выключено, чтобы не дублировать другие плагины)
  join-quit-messages: false
  join-message: "&8[&a+&8] &7%player% &7присоединился к серверу"
  quit-message: "&8[&c-&8] &7%player% &7покинул сервер"

private-messages:
  # Личные сообщения: /msg <ник> <текст> (алиасы /m, /tell, /w, /pm), ответ — /r <текст>
  enabled: true
  # Звуковое уведомление получателю
  sound: true
  # Форматы личных сообщений. Подстановки: %sender%, %target%, %message%
  send-format: "&7[&dЯ &7→ &d%target%&7] &f%message%"
  receive-format: "&7[&d%sender% &7→ &dЯ&7] &f%message%"
  # Строка, которую видят администраторы в режиме /socialspy
  spy-format: "&8[SPY] &7%sender% &8→ &7%target%&8: &r%message%"

auto-messages:
  enabled: true
  # Интервал между сообщениями в секундах (минимум 30).
  interval-seconds: 240
  # Случайный порядок без повтора последних пяти текстов. false — строго по
  # списку: каждое сообщение по очереди, выбывшие пропускаются.
  random-order: true
  # Минимум авторизованных получателей с правом chrdkregister.automessage.receive.
  minimum-players: 1
  prefix: "<dark_gray>[<gold>CHRDK</gold>]</dark_gray> "
  # Каждое сообщение — строка или карта:
  #   text        — MiniMessage-текст;
  #   plugin      — показывать только когда аддон включён (иначе скрыто);
  #   permission  — показывать только владельцам права;
  #   condition   — always (по умолчанию), trial (приветственный ранг),
  #                 unsecured (2FA не подключена), no-pass (ранга нет),
  #                 paid (активный оплаченный ранг);
  #   min-online  — минимум игроков онлайн (0 — без ограничения).
  # Подстановки: %player%, %online%, %max%, %world%, %pass_left%, %pass_days%,
  # %pass_type%, %trial_days%, %balance% (баланс банка /bal).
  # Проверка без ожидания: /pass automessages list|next|test <номер>.
  messages:
    # --- общее ---
    - {"text": "<gray>Все возможности сервера собраны в <white>/menu</white>: ранг, прогресс, экономика, мир, снаряжение, охота и общество.</gray>"}
    - {"text": "<gray>Ваш баланс банка: <white>%balance%</white> алмазов. Перевод другу — <white>/pay ник сумма</white>, топ — <white>/baltop</white>.</gray>"}
    - {"text": "<gray>Алмазы можно хранить в банке: <white>/bal deposit</white> и <white>/bal withdraw</white>. Счёт не теряется при смерти.</gray>"}
    - {"text": "<gray>Переключение локального и общего чата — <white>/chat</white>. Личное сообщение — <white>/msg ник текст</white>, ответ — <white>/r</white>.</gray>"}
    # --- ранг и безопасность ---
    - {"text": "<gray>Ваш приветственный ранг активен: осталось <white>%pass_left%</white>. Статус и продление — <white>/pass menu</white>.</gray>", "condition": "trial"}
    - {"text": "<gray>Ранг закончился. Продлить и сохранить оформление — <white>/pass menu</white>, вопросы — в Discord сервера.</gray>", "condition": "no-pass"}
    - {"text": "<gray>Спасибо за поддержку сервера! Ваш ранг активен до конца срока: <white>%pass_left%</white>.</gray>", "condition": "paid"}
    - {"text": "<gray>Защитите аккаунт: <white>/2fa setup</white>, затем подтвердите код приложения. Никому не сообщайте пароль и коды.</gray>", "condition": "unsecured"}
    - {"text": "<gray>Проверьте сессии входа: <white>/session</white>. Для выхода из аккаунта — <white>/logout</white>.</gray>"}
    - {"text": "<gray>Хотите поддержать проект? <white>/pass donate</white> откроет ссылку на оплату и продление.</gray>"}
    # --- прогресс ---
    - {"text": "<gray>Задания сезона и награды: <white>/battlepass</white>. Прогресс не сгорает при перезапуске.</gray>", "plugin": "CHRDK_BattlePass", "permission": "chrdkbp.use"}
    - {"text": "<gray>72 достижения ждут своего героя: <white>/achievements</white>. Бейджи открываются вместе с целями.</gray>", "plugin": "CHRDK_Achievements", "permission": "chrdkachievements.use"}
    - {"text": "<gray>Десять навыков и 60 перков: <white>/skills</white>. Уровни растут от обычной игры — копайте, бейте, варите.</gray>", "plugin": "CHRDK_Skills", "permission": "chrdkskills.use"}
    - {"text": "<gray>Клад можно найти в любом камне: <white>/treasures</white>. Способности по ПКМ, сеты и проклятия — в лоре находок.</gray>", "plugin": "CHRDK_Treasures", "permission": "chrdktreasures.use"}
    - {"text": "<gray>Артефакты собираются в коллекцию: <white>/artifacts collection</white>. За полноту каталога — дни ранга и алмазы.</gray>", "plugin": "CHRDK_Artifacts", "permission": "chrdkartifacts.use"}
    - {"text": "<gray>Звание растёт вместе с наигранным временем. Ваш прогресс — <white>/ranks</white>.</gray>", "plugin": "CHRDK_Ranks", "permission": "chrdkranks.use"}
    - {"text": "<gray>Общие цели сервера: <white>/goals</white> — ваш вклад и прогресс сообщества.</gray>", "plugin": "CHRDK_CommonGoals", "permission": "chrdkgoals.use", "min-online": 3}
    # --- экономика ---
    - {"text": "<gray>Обмен ресурсов и актуальные цены: <white>/shop</white>. Счёт магазина отделён от банка <white>/bal</white>.</gray>", "plugin": "CHRDK_DiamondShop", "permission": "chrdkshop.use"}
    - {"text": "<gray>Продайте стак из руки: <white>/auction sell цена</white>. Покупка требует подтверждения, комиссия видна в лоте.</gray>", "plugin": "CHRDK_Auction", "permission": "chrdkauction.use"}
    - {"text": "<gray>Купленные и возвращённые лоты ждут в <white>/auction mail</white>. Выручку забирайте через <white>/auction money</white>.</gray>", "plugin": "CHRDK_Auction", "permission": "chrdkauction.use"}
    - {"text": "<gray>Лотерея: <white>/lottery</white> — банк, шанс и время. Билеты — <white>/lottery buy</white>, выигрыш — <white>/lottery claim</white>.</gray>", "plugin": "CHRDK_Lottery", "permission": "chrdklottery.use"}
    - {"text": "<gray>Защитите постройки: <white>/claim help</white>. Казна для ежедневной ренты — <white>/claim balance</white>.</gray>", "plugin": "CHRDK_Claims", "permission": "chrdkclaims.use"}
    # --- мир, снаряжение, сообщество ---
    - {"text": "<gray>Точки дома: <white>/homes</white> и <white>/sethome имя</white>. Запрос к игроку — <white>/tpa ник</white>.</gray>", "plugin": "CHRDK_Teleports", "permission": "chrdktele.use"}
    - {"text": "<gray>Изучайте кастомные чары: <white>/enchants</white>. Редкости снаряжения — <white>/tiers</white>.</gray>", "plugin": "CHRDK_Enchants", "permission": "chrdkenchants.use"}
    - {"text": "<gray>Косметический шлейф: <white>/cosmetics list</white>. Выключить эффект — <white>/cosmetics off</white>.</gray>", "plugin": "CHRDK_Cosmetics", "permission": "chrdkcosmetics.use"}
    - {"text": "<gray>Стримите на Twitch или VK Play Live? Привяжите канал: <white>/stream link</white> — час эфира даёт сутки ранга.</gray>", "plugin": "CHRDK_Streams", "permission": "chrdkstreams.use"}
    - {"text": "<gray>Приглашайте друзей: <white>/ref</white> — статус и условия бонуса. Вас позвал друг? <white>/ref use его_ник</white>.</gray>", "plugin": "CHRDK_Referrals", "permission": "chrdkref.use"}
    - {"text": "<gray>Сейчас на сервере <white>%online%</white> игроков. Самое время для общих целей: <white>/goals</white>.</gray>", "plugin": "CHRDK_CommonGoals", "permission": "chrdkgoals.use", "min-online": 5}
    - {"text": "<gray>Забирайте ежедневную награду: <white>/daily</white>. Стрик входов не сбрасывается при пропуске одного дня.</gray>", "plugin": "CHRDK_DailyRewards", "permission": "chrdkdaily.use"}
    - {"text": "<gray>Сведения об очереди входа: <white>/queue info</white>. Приоритет зависит от настроек сервера.</gray>", "plugin": "CHRDK_Queue", "permission": "chrdkqueue.use"}

tablist:
  # Таб-лист (TAB): шапка/подвал списка игроков и формат имени в нём.
  # Разметка — MiniMessage либо &-коды. Подстановки:
  #   %player% — ник игрока, %online%/%max% — онлайн и лимит,
  #   %tps% — TPS сервера, %ping% — пинг игрока, %world% — его мир,
  #   %rank_tag% — название донатного ранга в его оформлении (« · Покровитель»),
  #   %pass_status% — активен/истёк/нет ранга, %pass_left% — «12 дн. 3 ч.»,
  #   %pass_days% — осталось целых дней ранга.
  #   %pass_type% — приветственный/обычный/нет, %auth_status% — состояние входа,
  #   %auth_hint% — следующий шаг, %security% — состояние 2FA,
  #   %navigation% — доступные ссылки после входа (до входа: пустая строка).
  enabled: true
  # Как часто (в тиках, 20 = 1 сек) обновлять таб-лист всем игрокам. Минимум 10.
  refresh-ticks: 40
  # Строки шапки списка (каждая с новой строки экрана)
  header:
    - ""
    - "<gradient:gold:yellow><bold>CHERDAK • ВЫЖИВАНИЕ</bold></gradient>"
    - "<gray>Онлайн <white>%online%/%max%</white> <dark_gray>•</dark_gray> TPS <green>%tps%</green>"
    - "<gray>%player% <dark_gray>•</dark_gray> <white>%auth_status%</white>"
    - ""
  footer:
    - ""
    - "<gold>%pass_type%</gold> <dark_gray>•</dark_gray> <aqua>%pass_left%</aqua>"
    - "<gray>%auth_hint%</gray>"
    - "<gray>2FA: <white>%security%</white> <dark_gray>•</dark_gray> <yellow>%ping% мс</yellow> <dark_gray>•</dark_gray> %world%"
    - "<aqua>%navigation%</aqua>"
    - ""
  # %player_tagged% — ник с оформлением: знак и цвет донатного ранга, метка
  # стримера, звание кладоискателя. Пусто — не перекрашивать чужие префиксы
  # (сортировкой таба управляет CHRDK_Ranks, формат ей не мешает).
  # %rank_tag% — хвост « · Покровитель» с названием ступени (пусто без ранга).
  # Порядок частей свободный: можно поставить %rank_tag% перед ником.
  player-name-format: "%player_tagged%%rank_tag%"
  # Добавлять название ранга, даже если в формате выше нет %rank_tag%.
  # Нужно для старых конфигов: обновление подхватит название само.
  # false — в табе останутся только знак и цвет ступени.
  show-rank-name: true
  # Что игрок показывает в своём нике, он решает сам: /labels открывает меню,
  # где каждое звание и надпись включаются отдельно (ранг, титул кузни, звание
  # кладоискателя, класс, гильдия, стример, квесты, достижения, шапка таба).
  # Файл plugins/CHRDK_Core/labels.json. Скрытие — только оформление: ранг,
  # опыт и права остаются. Сортирует список CHRDK_Ranks: сначала донатный ранг,
  # внутри ранга — звание за стаж (ranks.sort-tab в его config.yml).
  #
  # Никнеймы, закреплённые ВВЕРХУ списка игроков (регистр не важен).
  # Реализовано через приоритетную команду scoreboard — клиент Minecraft
  # сортирует список сначала по команде, потом по нику.
  # ВНИМАНИЕ: если другой плагин садит этих игроков в свою команду
  # (префиксы/ранги), его команда имеет приоритет — TAB не перетягивает игрока обратно.
  pinned-names:
    - kalinin_play

# =====================================================================
#  Оформление ника: цвета и пресеты (1.4.187)
# =====================================================================
# Что игрок уже выбрал — в plugins/CHRDK_Core/labels.json (скрытые надписи,
# порядок меток, цвет, сохранённые пресеты). Здесь — что ему вообще доступно.
#
# Правило сервера: оформление не даёт силы. Цвет ника — это вид, а не бонус,
# поэтому часть палитры открыта всем, часть — со ступенью ранга, а отдельные
# «дорогие» цвета продаются в каталоге (см. shop.products, товары nick-*).
labels:
  colors:
    # false — палитра пропадает: ник красит только ранг или тег каталога.
    enabled: true
    # Цвета по порядку в меню. У каждого:
    #   id      — машинное имя (латиницей, без пробелов), оно пишется в labels.json;
    #   name    — подпись в меню (MiniMessage);
    #   format  — шаблон с %name%, в него подставляется ник;
    #   rank    — минимальная ступень доната (0 — доступен всем);
    #   product — id товара каталога: такой цвет продаётся, и покупка —
    #             единственный способ его получить; ступень ранга его не заменяет.
    # Свой цвет главнее цвета ступени, но не главнее купленного тега каталога:
    # оплаченное вперёд не отбираем.
    list:
      - {"id": "gray",         "name": "<gray>Серый</gray>",                 "format": "<gray>%name%</gray>",                                  "rank": 0}
      - {"id": "white",        "name": "<white>Белый</white>",               "format": "<white>%name%</white>",                                "rank": 0}
      - {"id": "yellow",       "name": "<yellow>Жёлтый</yellow>",            "format": "<yellow>%name%</yellow>",                              "rank": 0}
      - {"id": "green",        "name": "<green>Зелёный</green>",             "format": "<green>%name%</green>",                                "rank": 0}
      - {"id": "aqua",         "name": "<aqua>Бирюзовый</aqua>",             "format": "<aqua>%name%</aqua>",                                  "rank": 1}
      - {"id": "blue",         "name": "<blue>Синий</blue>",                 "format": "<blue>%name%</blue>",                                  "rank": 1}
      - {"id": "gold",         "name": "<gold>Золотой</gold>",               "format": "<gold>%name%</gold>",                                  "rank": 2}
      - {"id": "light-purple", "name": "<light_purple>Сиреневый</light_purple>", "format": "<light_purple>%name%</light_purple>",              "rank": 3}
      - {"id": "red",          "name": "<red>Алый</red>",                    "format": "<red>%name%</red>",                                    "rank": 4}
      - {"id": "sunset",       "name": "<gradient:#ffd700:#ff8800>Закат</gradient>", "format": "<gradient:#ffd700:#ff8800>%name%</gradient>",   "rank": 5}
      # Только каталог: ранг эти градиенты не открывает — «богаче» от ступени
      # даёт количество обычных цветов, а не бесплатный премиум.
      - {"id": "aurora",       "name": "<gradient:#00e5ff:#8a2be2>Сияние</gradient>", "format": "<gradient:#00e5ff:#8a2be2>%name%</gradient>", "product": "nick-aurora"}
      - {"id": "flame",        "name": "<gradient:#ff3d00:#ffd54f>Пламя</gradient>",  "format": "<gradient:#ff3d00:#ffd54f>%name%</gradient>", "product": "nick-flame"}
      - {"id": "pearl",        "name": "<gradient:#ffffff:#9fd8ff>Жемчуг</gradient>", "format": "<gradient:#ffffff:#9fd8ff>%name%</gradient>", "product": "nick-pearl"}
  presets:
    # Свои пресеты оформления: снимок «что скрыто + порядок + цвет», который
    # возвращается одной кнопкой. Индекс списка — ступень ранга:
    # [без ранга, I, II, III, IV, V]. Больше шести слотов меню не покажет.
    slots: [2, 2, 3, 4, 5, 6]
