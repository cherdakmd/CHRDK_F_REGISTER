      name: "<gray>Странник</gray>"
      price: 99
      days: 30
      rank: 1
      group: ""
      description: "Знак ✦, +10 % опыта, 4 дома, 28 чанков, скидка 10 %"
      tag: ""
      permissions: []
      commands: []

    - id: rank-wanderer-year
