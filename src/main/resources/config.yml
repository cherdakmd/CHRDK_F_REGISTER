# =====================================================================
#  ВИКИ ИГРОКА (1.4.171): сайт с командами, ценами и лимитами
# =====================================================================
# Вики — статический сайт из этого же репозитория (папка wiki/, публикация
# через GitHub Pages). В игре браузер не открыть, поэтому /wiki и кнопка
# «Вики сервера» в /menu отправляют кликабельную ссылку: клик открывает
# браузер, вторая строка копирует адрес.
#
# Адрес берётся из этой секции при каждом вызове команды: после /pass reload
# можно сменить домен без перезапуска сервера. Пустой или невалидный url
# выключает ссылку — игрок увидит честное «ссылка не настроена», а не битую.
wiki:
  enabled: true
  # Должен совпадать с адресом сайта из docs/WIKI.md. Слэш на конце не обязателен.
  url: "https://cherdakmd.github.io/CHRDK_F_REGISTER/"
  # Подсказки в TAB и в сообщении об ошибке: слаг = имя файла страницы на сайте.
  pages: ["start", "menu", "commands", "ranks", "economy", "claims", "faq"]

# Главное меню сервера /menu (1.4.170): игрок открывает разделы и выполняет
# команды кликом, без знания синтаксиса. Ядро об аддонах ничего не знает —
# состав меню целиком задаётся здесь.
#
# Как устроено:
#   * главная страница — категории (ряд 10..16) и быстрые пункты без category;
#   * страница категории — её пункты, кнопка «Назад» (back-slot) и «Закрыть» (close-slot);
#   * пункт без command — подсказка: иконка видна, клик ничего не делает;
#   * категория без доступных пунктов исчезает с главной страницы;
#   * пункт скрывается, если выключен его аддон (plugin) или нет права (permission).
#
# Поля пункта: slot (0-53; -1 = авто), icon, name/lore (MiniMessage),
# command (выполняется ОТ ИГРОКА по клику), plugin, permission, category.
# Подстановки: %player%, %rank%, %rank_badge%, %rank_level%, %rank_status%,
# %pass_left%, %pass_days%, %trial_days%. Админские команды сюда не ставить.
server-menu:
  enabled: true
  title: "<gold>Меню сервера</gold>"
  # Заголовок раздела: «Меню · <имя категории>» — видно, где игрок находится.
  category-title: "<dark_gray>Меню · </dark_gray><gold>%category%</gold>"
  # Кнопки нижнего ряда страницы раздела.
  back-slot: 40
  back-icon: "ARROW"
  back-name: "<gray>◀ Назад</gray>"
  # -1 — не показывать кнопку «Закрыть» (ESC работает всегда).
  close-slot: 44
  close-icon: "BARRIER"
  close-name: "<red>✖ Закрыть</red>"
  # Семь разделов: путь игрока от ранга до общества. Порядок слотов = порядок
  # иконок на главной странице.
  categories:
    - {"id": "account", "slot": 10, "icon": "PAPER", "name": "<gold><bold>Ранг и аккаунт</bold></gold>", "lore": "<gray>Ранг, оплата, награды входа и защита аккаунта</gray>"}
    - {"id": "progress", "slot": 11, "icon": "EXPERIENCE_BOTTLE", "name": "<gold><bold>Прогресс и награды</bold></gold>", "lore": "<gray>Сезон, задания, навыки, класс и достижения</gray>"}
    - {"id": "economy", "slot": 12, "icon": "DIAMOND", "name": "<gold><bold>Экономика</bold></gold>", "lore": "<gray>Банк, магазин, аукцион и заказы</gray>"}
    - {"id": "world", "slot": 13, "icon": "GRASS_BLOCK", "name": "<gold><bold>Мир и территории</bold></gold>", "lore": "<gray>Приваты, дома и телепорты</gray>"}
    - {"id": "gear", "slot": 14, "icon": "ANVIL", "name": "<gold><bold>Снаряжение и питомцы</bold></gold>", "lore": "<gray>Чары, тиры, артефакты, косметика и питомцы</gray>"}
    - {"id": "adventure", "slot": 15, "icon": "IRON_SWORD", "name": "<gold><bold>Охота</bold></gold>", "lore": "<gray>Охота, бестиарий и трофеи</gray>"}
    - {"id": "social", "slot": 16, "icon": "BELL", "name": "<gold><bold>Общество</bold></gold>", "lore": "<gray>Чат, гильдия, оформление</gray>"}
  # Пункты. category — id раздела; без category пункт живёт на главной странице.
  # Без command — подсказка (клик игнорируется).
  items:
    # ------------------------------ главная ------------------------------
    - {"slot": 4, "icon": "PLAYER_HEAD", "name": "<gold><bold>%player%</bold></gold>", "lore": "<gray>Ранг: <white>%rank%</white></gray>\n<gray>Осталось: <white>%pass_left%</white></gray>\n<dark_gray>Клик — карточка игрока</dark_gray>", "command": "profile", "permission": "chrdkregister.profile"}
    - {"slot": 20, "icon": "BOOK", "name": "<gold><bold>Вики сервера</bold></gold>", "lore": "<gray>Все команды, цены и лимиты сайтом</gray>\n<dark_gray>Клик — ссылка на сайт в чат</dark_gray>", "command": "wiki"}
    - {"slot": 22, "icon": "KNOWLEDGE_BOOK", "name": "<gray><bold>Как пользоваться</bold></gray>", "lore": "<gray>Клик по иконке открывает раздел</gray>\n<gray>Внутри — кнопки с командами</gray>\n<gray>«Назад» и «Закрыть» — в нижнем ряду</gray>"}
    - {"slot": 24, "icon": "EMERALD", "name": "<gold><bold>Поддержать сервер</bold></gold>", "lore": "<gray>Официальный донат-магазин CHRDK</gray>\n<yellow>chrdk.trademc.org</yellow>\n<dark_gray>Клик — ссылка на магазин в чат</dark_gray>", "command": "donate", "permission": "chrdkregister.donate"}
    # ------------------------------ аккаунт ------------------------------
    - {"category": "account", "icon": "NAME_TAG", "name": "<gold><bold>Мой ранг</bold></gold>", "lore": "<gray>Сейчас: <white>%rank%</white> <dark_gray>·</dark_gray> <white>%rank_status%</white></gray>\n<gray>Осталось: <white>%pass_left%</white></gray>\n<dark_gray>Клик — бонусы ступени и срок</dark_gray>", "command": "rank my"}
