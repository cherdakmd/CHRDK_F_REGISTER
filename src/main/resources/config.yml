# =====================================================================
# CHRDK_F_REGISTER — настройки входа (регистрация, пароль, TOTP 2FA), донатных
# рангов гильдии, встроенного чата (локальный/глобальный, ЛС, автосообщения),
# защиты от перебора паролей, журнала донатов и аудита.
# 1.4.167: вход свободный, платить за него не нужно. Секции donatepay, boosty
# и pass остались для совместимости и для владельцев, которые захотят вернуть
# платный вход ключом pass.enabled: true.
# Сервер: Purpur 26.3 (Java 25)
# =====================================================================

general:
  # Часовой пояс для всех дат в сообщениях, аудите и именах бэкапов
  timezone: "Europe/Moscow"
  # Язык текстов плагина: ru — файл messages.yml, любой другой — наложение messages_<locale>.yml
  # (например locale: en подхватит messages_en.yml поверх русских значений по умолчанию)
  locale: "ru"

donatepay:
  # 1.4.167: продажи идут только через TradeMC (trademc.enabled: true), поэтому
  # автопровайдер по умолчанию выключен. Включать имеет смысл лишь для приёма
  # «пожертвований без ранга» — выдача дней продлевает ранг, но новых прав не даёт.
  # false — сторож/опрос/health выключены, но кликабельная
  # ссылка (payment-url ниже) показывается игрокам, пока она заполнена.
  # Режим «оплату обрабатывает внешний плагин (EasyPayments), CHRDK — только ссылка и
  # хранилище проходок»: выключите оба опроса и пропишите ссылку на магазин EasyDonate.
  enabled: false
  # API-токен из личного кабинета DonatePay (https://donatepay.ru/page/api)
  api-token: ""
  # Показывать в консоли имя кошелька DonatePay и баланс при рукопожатии (GET /user
  # при старте/релоаде). false — в логах только «токен валиден», без имени и суммы.
  show-balance: true
  # Ссылка на вашу страницу оплаты DonatePay (показывается игроку в чате)
  payment-url: "https://new.donatepay.ru/@your_page"
  # Минимальная сумма доната в рублях для автоматической выдачи дней ранга
  minimum-rubles: 150
  # Интервал проверки новых донатов через API DonatePay в секундах (минимум 15)
  poll-seconds: 30
  # Пульс подключения: раз в столько секунд в консоль пишется heartbeat-строка вида
  # "DonatePay heartbeat: OK — последний успешный опрос N с назад" (60..3600)
  health-seconds: 300
  # Сколько подряд неудачных опросов считается падением DonatePay (тревога админам +
  # консоль, по одному разу на эпизод; сообщение о восстановлении — после первой удачи)
  alert-fail-streak: 10
  # Дублировать тревогу о падении/восстановлении DonatePay онлайн-админам в чат
  alert-admins: true

# Консольные действия по входящим донатам (оба провайдера: DonatePay и EasyDonate).
# При успешной оплате с суммой >= sum выполняется command от имени консоли.
# Плейсхолдеры: {username} — имя из формы оплаты, {player} — ник получателя ранга
# (или username, если не заматчился), {sum} — сумма в рублях, {message} — комментарий.
# Донорский ввод экранируется автоматически (кавычки/слэши вырезаются).
# Не срабатывает для backfill при первом включении и retry старых pending — только
# новые платежи и /pass testpay (удобно обкатывать шаблоны: /pass testpay Ник 500).
# Примеры:
#   - sum: 50
#     command: "broadcast <gold>{username}</gold> поддержал сервер на <yellow>{sum} ₽</yellow>!"
#   - sum: 500
#     command: "title @a title {\"text\":\"{username} — ЛЕГЕНДА!\",\"color\":\"gold\"}"
  # Повторять тревогу, пока DonatePay всё ещё недоступен (интервал в минутах; 0 = только
  # одна тревога на эпизод). Совпадение с health-seconds гармонично: 15 мин ~ 3 heartbeat линии
  alert-repeat-minutes: 15
  # Напоминать админам, если донат ждёт ручного разбора дольше N часов (0 = выкл; повтор — раз в N часов)
  pending-notify-hours: 24
  # Строгая проверка регистра букв в нике донатера (false = ник сверяется без учёта регистра)
  strict-case-match: false
  # Платежи, которые не удалось сопоставить с ником, попадают в журнал и ждут решения:
  # /pass pending → /pass approve <id> / /pass reject <id>. false = игнорировать такие платежи
  review-unmatched: true
  # Подсказывать администратору похожие ники (регистр, раскладка клавиатуры, одна опечатка)
  fuzzy-match: true
  # Просить игрока указывать в имени донатера короткий код: "Ник 4821" (детерминированное сопоставление)
  payment-code: false
  # Количество цифр в коде платежа
  payment-code-digits: 4
  # Сколько дней хранить журнал донатов
  journal-keep-days: 365

donation-actions: []

# EasyDonate (v1.4.35) — второй провайдер донатов: опрашивается рядом с DonatePay
# в тот же интервал poll-seconds. Отказ одного сервиса не ставит на паузу другой.
easydonate:
  # Включить API-опрос EasyDonate? false — опрос/сторож выключены; при желании
  # оставить только LINK к магазину — заполните payment-url ниже (он показывается
  # независимо от enabled). При ПЕРВОМ включении опроса идёт backfill за 24 ч.
  enabled: false
  # Ключ магазина EasyDonate: раздел «Магазин → Настройки → API» (заголовок Shop-Key из доков v3)
  shop-key: ""
  # Ссылка на страницу магазина EasyDonate — появляется игроку второй кнопкой рядом с DonatePay
  payment-url: ""
  # Обратите внимание: сверка ников (strict-case-match, review-unmatched, fuzzy-match,
  # payment-code, journal-keep-days) — общие и живут в секции donatepay выше.

  # ================================================================
#  Магазин TradeMC (https://trademc.org) — режим "донат ТОЛЬКО через TradeMC"
#  Доставка покупок — по RCON: панель магазина сама выполняет на сервере
#  команду после оплаты. enabled: true выключает опросы DonatePay и
#  EasyDonate и Boosty-подписки ЕДИНЫМ переключателем.
#  Настройка в panel.trademc.org:
#   1) Магазин → Сервера: привяжите сервер по RCON (хост/порт/пароль rcon).
#   2) Товар ранга → поле "команда при покупке":
#      pass shoppay %username% <цена_товара>
#      Плейсхолдер ника у TradeMC — %username% (точное написание есть в
#      подсказке панели). Команда выполняется от консоли, слэш не нужен.
#      Сумма должна совпадать с ценой карточки в shop.products (поле price):
#      по ней ядро находит ступень и срок. Если цены нет — работает старый
#      путь донатов (donatepay), поэтому дублируйте цены один в один.
#   3) Тест: купите товар или выполните из консоли
#      pass shoppay TestPlayer 99
# ================================================================
trademc:
  # 1.4.167: ОСНОВНОЙ режим продаж. true выключает опросы DonatePay/EasyDonate
  # и Boosty-подписки одним переключателем; панель TradeMC после оплаты выполняет
  # по RCON `pass shoppay <ник> <цена>` и выдаёт карточку ранга по цене.
  # Впишите shop-id и payment-url ниже — без ссылки игрок увидит ссылку DonatePay.
  enabled: true
  # Числовой ID вашего магазина из панели TradeMC (идёт в логи и /pass status)
  shop-id: 0
  # Ссылка на вашу витрину TradeMC — игрокам в строке продления ранга
  payment-url: ""

  # ================================================================
#  Подписка Boosty.to («дни ранга, пока жива подписка») — по умолчанию выключена
#  Игрок пишет /pass boost <ник_на_Boosty>; пока его подписка активна,
#  ранг ежедневно продлевается до "сейчас + days-per-period".
#  Никаких платёжных API: подписчики читаются со страницы блога.
# ================================================================
boosty:
  # Включить подписочный провайдер Boosty? У Boosty нет публичного API —
  # используется приватный веб-API с токеном из браузера (ниже).
  enabled: false
  # Имя вашего блога: https://boosty.to/<blog>
  blog: ""
  # Ссылка, которую игроки видят в подсказке о ранге (если пустая —
  # собирается из имени блога)
  blog-url: ""
  # Токены из браузера: зайдите на boosty.to под ВЛАДЕЛЬЦЕМ БЛОГА,
  # F12 → Application → Local Storage, ключи:
  #   "auth"       → accessToken/refreshToken/expiresAt (inside JSON)
  #   "_clientId"  → deviceId
  # Либо из DevTools: Network → любой запрос к api.boosty.to →
  # заголовок Authorization: Bearer <это ваш token>.
  # ВНИМАНИЕ: Boosty РОТИРУЕТ refresh-token при каждом обновлении — рабочие
  # токены плагин хранит в boosty-tokens.json, config.yml нужен только для посева.
  token: ""
  refresh-token: ""
  device-id: ""
  # Минимальная цена уровня подписки (₽/мес), дающего дни ранга
  min-level-price: 300
  # На сколько дней хватает подтверждённой подписки (горизонт продления)
  days-per-period: 30
  # Как часто перепроверять подписки привязанных игроков (часы)
  recheck-hours: 24
  # Холостой прогон: всё проверяем, но привязки/продления не применяем
  dry-run: false
  # Подробное логирование Boosty в консоль
  debug-log: false
  # Сколько часов скидка каталога (shop.boosty-bonus) живёт после последнего
  # подтверждения подписки. Одна пропущенная проверка не отбирает бонус.
  perk-grace-hours: 48

# ================================================================
#  Динамический MOTD (текст в списке серверов)
#  Выбор строки — motd.mode (rotate каждые rotate-seconds или random на пинг),
#  MiniMessage (<color>, <gradient>, <b> и т.п.) + плейсхолдеры:
#  %online% %max% %date% %time% %version% %players% (ники онлайн)
#  %price% (мин. цена доната) %url% (ссылка на оплату)
#  Для переноса строки внутри MOTD используйте \n (внутри one-linе кавычек)
# ================================================================
motd:
  enabled: false
  # Как выбирать строку из списка: rotate — ковш по времени (при повторном пинге
  # текст один и тот же), random — случайная строка на каждый пинг.
  mode: rotate
  rotate-seconds: 60
  # Плейсхолдеры: %online% %max% %date% %time% %version% %players% (ники онлайн,
  # до 10 — дальше "+N"), %price% (мин. цена доната), %url% (ссылка на оплату).
  lines:
    - "<gold><b>ЧРДК</b></gold> <gray>•</gray> <green>выживание для своих</green>\n<gray>Онлайн: <white>%online%/%max%</white> — вход свободный</gray>"
    - "<gradient:#ffcc00:#ff8800><b>ЧРДК — делаем контент вместе</b></gradient>\n<gray>Сегодня %date% · v%version% · ждём именно тебя</gray>"

pass:
  # Однократный приветственный ранг для нового аккаунта после первой регистрации.
  # Отсчёт начинается с успешного /register; до регистрации доступен только вход/регистрация.
  # Уже зарегистрированным и ранее получавшим ранг аккаунтам повторно не выдаётся.
  # Старый пробный период больше не нужен: вход свободный, а приветственный ранг
  # новичка настраивается в секции ranks.welcome (1.4.167).
  trial:
    enabled: false
    days: 14
  # Мастер-флаг донат-стены. С 1.4.167 по умолчанию ВЫКЛЮЧЕН: вход свободный,
  # регистрация/пароль/2FA остаются, а игрок без ранга сразу играет.
  # true возвращает старую стену (полезно, если когда-нибудь понадобится
  # платный вход): стадия NO_PASS, подсказки и боссбар вернутся.
  enabled: false
  # Срок действия дней ранга по умолчанию (1 месяц = 30 дней)
  grant-days: 30
  # Устаревшие тарифы старого движка донатов: сумма в рублях → количество дней.
  # Для рангов годы и месяцы задаются карточками shop.products.
  tiers:
    - { amount: 150, days: 30, label: "1 месяц" }
    - { amount: 400, days: 90, label: "3 месяца" }
    - { amount: 1400, days: 365, label: "Год" }
  # За сколько минут до окончания предупреждать игрока (по умолчанию: 7 дней, 3 дня, 1 день, 1 час)
  expiry-warnings-minutes: [10080, 4320, 1440, 60]
  # Показывать над хотбаром полосу с обратным отсчётом в последний час ранга
  expiry-bossbar: true
  # Звук при предупреждении об окончании ранга
  expiry-warning-sound: true
  # Кикать незаавторизовавшихся игроков через N секунд (0 = не кикать)
  kick-after-seconds: 0
  # Инвентарное GUI-меню /pass menu: статус, оплата, тарифы, 2FA, пароль, сессии (для админов — статистика)
  gui-menu: true

# ================================================================
#  Донатные ранги (1.4.167). Пришли на смену платному входу: вход на сервер
#  свободный, а ранг — подписка на комфорт, оформление и статус.
#  Цены и сроки живут в каталоге shop.products (товары с полем rank),
#  числа (дома, приваты, скидки) — в конфигах модулей. Здесь только то,
#  что рисует ядро: имя, знак, цвет и строка входа.
# ================================================================
ranks:
  enabled: true
  # Показывать слово «Странник» рядом с ником в чате и в %player_tagged%.
  # false — только знак и цвет; в табе название тогда добавляет %rank_tag%
  # (см. tablist.show-rank-name), поэтому дубля нет ни в одном режиме.
  show-name-in-chat: false
  # Анонсировать вход в чат для ступеней, у которых задана join-line.
  announce-join: true
  # /hat — надеть блок из руки на голову. Со ступени ниже нужен только права
  # chrdkregister.hat (у администраторов).
  hat:
    min-level: 5
  # Бонусы ступени (1.4.167): то, ради чего берут старший ранг.
  # Индекс — уровень: [без ранга, I, II, III, IV, V]. Здесь не сила, а темп:
  # опыт профессий и сезонного пропуска, количество добычи, дополнительные
  # уровни навыка сверх обычного потолка (25). Потолки контракта в RankBonus:
  # 50 % опыта, 25 % добычи, +10 уровней навыка — выше конфиг не действует.
  bonuses:
    xp-percent: [0, 10, 20, 30, 40, 50]
    drop-percent: [0, 5, 10, 15, 20, 25]
    skill-levels: [0, 2, 4, 6, 8, 10]
  # Приветственный ранг новичку после регистрации: три дня первой ступени.
  # Сутки легко пропустить (зашёл вечером, вернулся через два дня) — три дня
  # показывают оформление, очередь и шлейф хотя бы в двух-трёх заходах.
  welcome:
    enabled: true
    level: 1
    days: 3
  # Лестница снизу вверх. format — MiniMessage-шаблон с %name%; badge — знак
  # перед ником; join-line — строка входа (%player% — ник, пусто — не анонсировать).
  levels:
    - level: 1
      id: wanderer
      name: "Странник"
      format: "<gray>%name%</gray>"
      badge: "✦"
      join-line: ""
    - level: 2
      id: pathfinder
      name: "Следопыт"
      format: "<green>%name%</green>"
      badge: "❖"
      join-line: ""
    - level: 3
      id: keeper
      name: "Хранитель"
      format: "<aqua>%name%</aqua>"
      badge: "✧"
      join-line: "<aqua>✧ Хранитель</aqua> <white>%player%</white> <gray>вернулся в гильдию</gray>"
    - level: 4
      id: patron
      name: "Меценат"
      format: "<gradient:#ffd700:#ff8800>%name%</gradient>"
      badge: "★"
      join-line: "<gradient:#ffd700:#ff8800>★ Меценат</gradient> <white>%player%</white> <gray>снаряжает новую экспедицию</gray>"
    - level: 5
      id: founder
      name: "Покровитель"
      format: "<gradient:#b388ff:#ffd700>%name%</gradient>"
      badge: "⚜"
      join-line: "<gradient:#b388ff:#ffd700>⚜ Покровитель</gradient> <white>%player%</white> <gray>входит в летопись гильдии</gray>"

# ================================================================
#  Каталог товаров (1.4.110, ранги — 1.4.167). Пять ступеней рангов,
#  косметика поштучно и боевой пропуск. Товар выдаётся по RCON-команде
#  из витрины TradeMC:
#
#      pass shopbuy <ник> <товар>          # срок из товара
#      pass shopbuy <ник> <товар> 30       # свой срок (не больше потолка)
#
#  У товара три необязательных действия:
#    group       — временная группа LuckPerms (её видят очередь и аддоны);
#    permissions — права, которые получает эта группа при /pass luckperms setup;
#    tag         — MiniMessage-разметка ника в чате;
#    rank        — ступень донатного ранга 1..5 (вместо записи «товар → срок»);
#    commands    — консольные команды с %player% (анонс, выдача предметов).
#
#  ПРАВИЛО СЕРВЕРА: за деньги продаются удобство, оформление и статус.
#  Ресурсы, алмазы, снаряжение и влияние на бои — не продаются.
# ================================================================
shop:
  # Выключатель витрины: false — /pass shop показывает «каталог выключен»,
  # shopbuy ничего не выдаёт (покупки на сайте в это время лучше отключить).
  enabled: true
  # Потолок суммарного срока одного товара у игрока (дней). Повторные покупки
  # складываются, но не уходят дальше этого горизонта: «навсегда» не продаётся.
  max-total-days: 365
  # Скидка подписчикам Boosty. Витрина TradeMC продаёт по фиксированной цене
  # карточки, поэтому «−15 %» на сайте не покажешь; вместо этого подписчик
  # получает больше дней за ту же цену — это тот же процент, посчитанный здесь.
  # Работает только при boosty.enabled: true и подтверждённой подписке
  # (проверка раз в boosty.recheck-hours, окно boosty.perk-grace-hours).
  boosty-bonus:
    enabled: true
    # Процент дней. 15 % от 30 дней = 5 дней (округление вверх).
    percent: 15
    # Потолок бонуса за одну покупку (дней). 0 — без отдельного потолка,
    # но бонус всё равно не больше самого срока покупки.
    max-days: 30
  products:
    # --- Донатные ранги (1.4.167) -------------------------------------------
    # Ранг — подписка на комфорт, оформление и статус. У каждой ступени свои
    # возможности; числа (дома, приваты, скидки) живут в конфигах модулей,
    # оформление — в секции ranks выше. Здесь только цена, срок и сама ступень.
    # Год = десять месяцев, два в подарок.
    #
    # ВАЖНО: цена месячной карточки — база для пересчёта остатка при повышении
    # ранга (см. RankLadder.carryDays). Меняйте цены парами: месяц и год.
    - id: rank-wanderer
      name: "<gray>Странник</gray>"
      price: 99
      days: 30
      rank: 1
      group: ""
      description: "Вход без очереди, знак ✦, +10 % опыта, 4 дома, 28 чанков, скидка 10 %"
      tag: ""
