    - { slot: 12, icon: PAPER,      name: "<aqua><bold>Проходка и аккаунт</bold></aqua>",         lore: "<gray>статус, тарифы, сессии, 2FA</gray>",    command: "pass menu" }
    - { slot: 14, icon: CLOCK,      name: "<yellow><bold>Ежедневные награды</bold></yellow>",     lore: "<gray>призы за ежедневный вход</gray>",       command: "daily" }
