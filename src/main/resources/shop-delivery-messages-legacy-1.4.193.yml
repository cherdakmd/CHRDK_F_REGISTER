messages:
  paid-only:
    blocked: '<yellow>Бесплатная выдача платных прав отключена. Только реальная покупка. Подтверждённую оплату оформляйте из консоли: /pass shopbuy ник товар [дней] payment=номер_платежа. За достижения — отдельный буст.</yellow>'
    required: '<red>Нужны консоль/RCON и номер подтверждённой реальной оплаты последним аргументом: payment=provider:12345. Это подтверждение владельца, не тест и не награда. Номер — 3–128 латинских букв, цифр, точек, подчёркиваний, двоеточий или дефисов.</red>'
    unknown-price: '<red>По этой сумме нет однозначной карточки покупки. Ничего не выдано: сверьте платёж с каталогом и оформите /pass shopbuy с номером реальной оплаты.</red>'
  usage:
    pass-shoppay: '<yellow>Использование: /%label% shoppay <ник> <сумма_руб> payment=номер_платежа — RCON-хук магазина TradeMC: провести покупку как донат (журнал, выдача по тарифам).</yellow>'
    pass-shopbuy: '<yellow>Использование: /%label% shopbuy <ник> <товар> [дней] payment=номер_платежа — выдать товар каталога (RCON-хук витрины TradeMC).</yellow>'
    pass-shopgift: '<yellow>Использование: /%label% shopgift <ник> <товар> [даритель] payment=номер_платежа — подарить товар каталога.</yellow>'
  pass:
    admin-help: '<gold>Команды управления рангами:</gold>

      <yellow>/%label% add <ник></yellow><gray> — выдать/продлить ранг на %grant_days% дней</gray>

      <yellow>/%label% remove <ник></yellow><gray> — отозвать ранг игрока</gray>

      <yellow>/%label% check <ник></yellow><gray> — проверить статус ранга, пароля и 2FA игрока</gray>

      <yellow>/%label% unregister <ник></yellow><gray> — сбросить пароль и 2FA игрока</gray>

      <yellow>/%label% reset2fa <ник></yellow><gray> — сбросить только TOTP 2FA игрока</gray>

      <yellow>/%label% status</yellow><gray> — общая статистика плагина</gray>

      <yellow>/%label% add <ник> [дней]</yellow><gray> — отключено: требуется подтверждённая реальная оплата</gray>

      <yellow>/%label% gift <ник> <дней></yellow><gray> — отключено: оплаченные подарки через shopgift с номером платежа</gray>

      <yellow>/%label% shoppay <ник> <сумма> payment=номер</yellow><gray> — покупка из магазина TradeMC: журнал, тариф, выдача</gray>

      <yellow>/%label% pending</yellow><gray> — нераспознанные донаты</gray>

      <yellow>/%label% donations [фильтр] [лимит]</yellow><gray> — журнал всех донатов (выданные/ожидание/отклонённые)</gray>

      <yellow>/%label% health</yellow><gray> — состояние донатных сервисов, счётчики опросов</gray>

      <yellow>/%label% approve <id> [ник] [дней]</yellow><gray> — подтвердить платёж и выдать ранг</gray>

      <yellow>/%label% reject <id> [причина]</yellow><gray> — отклонить платёж</gray>

      <yellow>/%label% sessions <ник></yellow><gray> — активные сессии и IP игрока</gray>

      <yellow>/%label% logoutall <ник></yellow><gray> — завершить все сессии игрока</gray>

      <yellow>/%label% stats</yellow><gray> — выручка, конверсия и тарифы</gray>

      <yellow>/%label% doctor</yellow><gray> — самопроверка конфигурации</gray>

      <yellow>/%label% paidaudit</yellow><gray> — отчёт сверки покупок без изменения прав</gray>

      <yellow>/%label% audit [ник] [N]</yellow><gray> — последние записи аудита</gray>

      <yellow>/%label% backup <create|list|restore></yellow><gray> — резервные копии данных</gray>

      <yellow>/%label% luckperms [setup|status]</yellow><gray> — авто-настройка групп LuckPerms (default → ранг → admin)</gray>

      <yellow>/%label% update check|download</yellow><gray> — проверить релиз / подготовить обновление (download только из консоли)</gray>

      <yellow>/%label% reload</yellow><gray> — перезагрузить config.yml</gray>'
