# Фильтр имени при входе на сервер. Применяется после /pass reload.
# Совпадение ищется внутри ника без учёта регистра: Admin123 и xKLauncher запрещены.
enabled: true
denied-fragments:
  - "228"
  - "klauncher"
  - "admin"
  - "moderator"
# Точные имена-исключения (без учёта регистра). Прав доступа на этом этапе ещё нет.
allowed-names: []
