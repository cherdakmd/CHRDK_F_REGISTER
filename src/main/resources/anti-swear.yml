# Независимый антимат для общего/локального чата и личных сообщений.
# replace — заменять найденные фрагменты, block — не отправлять сообщение.
enabled: true
mode: replace
replacement: "***"
# Корни слов и фрагменты без учёта регистра. Список можно сократить или дополнить.
words:
  - "бляд"
  - "ебал"
  - "ебан"
  - "пизд"
  - "хуй"
  - "хуя"
  - "сука"
  - "fuck"
  - "shit"
  - "bitch"
# Java regex с CASE_INSENSITIVE | UNICODE_CASE; неправильное выражение не заменит рабочий старый конфиг.
regex: []
# Если любой фрагмент найден, это сообщение антимат пропускает целиком.
whitelist: []
bypass-permission: "chrdkregister.moderation.swear.bypass"
