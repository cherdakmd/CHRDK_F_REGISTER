  "premium-none": "<gold>★ Боевой пропуск</gold> <gray>открывает золотые награды заданий: /pass shop</gray>"
  "footer-premium-locked": "<gray>Готово к выдаче золотых наград: <gold>%count%</gold> — нужен боевой пропуск.</gray>"
  "claim-all-premium-only": "<yellow>Готовые премиум-награды: %count%. Их открывает боевой пропуск — /pass shop</yellow>"
