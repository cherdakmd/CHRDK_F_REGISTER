battlepass:
  "header": "%season% <dark_gray>(неделя %week% из %weeks_total%)</dark_gray>"
  "week-locked": "<gray>Волна %week% откроется через %days% дн.</gray>"
  "week-title": "<yellow>— Волна %week% —</yellow>"
  "mission": "%state% %desc% <white>%progress%/%target%</white>"
  "mission-done": "<green>выполнено — забрать: /%label% claim %id%</green>"
  "mission-claimed": "<green>%desc% — награда уже забрана ✔</green>"
  "reward": "<green>Награда за %id%: +%days% дн. проходки! Всего до %until%.</green>"
  "reward-vip": "<light_purple>VIP-награда за %id%: +%days% дн. проходки!</light_purple>"
  "vip-denied": "<yellow>%id%: VIP-награда только для владельцев активной проходки.</yellow>"
  "not-ready": "<yellow>%id%: задание ещё не выполнено (%progress%/%target%).</yellow>"
  "locked": "<yellow>%id%: эта волна ещё не открыта.</yellow>"
  "unknown": "<red>Задание «%id%» не найдено в текущем сезоне.</red>"
  "no-season": "<yellow>Сезон батлпасса не настроен — ждите анонса.</yellow>"
  "usage": "<yellow>Использование: /%label% [claim <id>]</yellow>"
  "admin-reloaded": "<green>Батлпасс перечитан: волн %weeks%, заданий %missions%.</green>"
  "admin-info": "<gray>Сезон «%season%»: старт %start%, текущая волна %week% из %weeks_total%.</gray>"
  "admin-reset": "<green>Прогресс игрока %player% по сезону сброшен.</green>"
  "admin-not-found": "<red>Игрок %player% не найден в данных сезона.</red>"
  "usage-admin": "<yellow>Использование: /bpadmin <reload | info | reset <ник>></yellow>"
