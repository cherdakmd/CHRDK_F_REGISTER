  "already-claimed": "<gray>%desc% — награда уже забрана.</gray>"
  "no-season": "<yellow>Сезон батлпасса не настроен — ждите анонса.</yellow>"
  "no-core": "<red>Ядро сервера сейчас недоступно — награду выдать нельзя. Попробуйте позже.</red>"
  "no-permission": "<red>У вас нет доступа к батлпассу.</red>"
  "usage": "<yellow>Использование: /%label% [menu|tasks|rewards|progress|top|info <id>|claim [id|all]|help]</yellow>"
