battlepass:
  # Тексты CHRDK_BattlePass. Разметка — MiniMessage; %ключи% подставляются плагином.
  # Название сезона и описания заданий берутся из config.yml и тоже могут содержать
  # MiniMessage (или старые &-коды) — они вставляются как готовая разметка.
  # --------------------------------- профиль ----------------------------------
  "profile-title": "Боевой пропуск"
  "profile-points": "<gray>Очков сезона: </gray><gold>%points%</gold>"
  "profile-missions": "<gray>Заданий выполнено: </gray><white>%done%/%total%</white>"
  "profile-claimed": "<gray>Наград забрано: </gray><white>%claimed%</white>"
  "header": "<gold><bold>Боевой пропуск</bold></gold> <dark_gray>·</dark_gray> %season%"
  "subheader": "<gray>Волна %week% из %weeks_total%</gray>%next%"
  "next-week": " <dark_gray>·</dark_gray> <gray>следующая через %days% дн. (%date%)</gray>"
  "season-not-started": "<yellow>Сезон начнётся %date% — задания откроются в первый день.</yellow>"
  "season-ended": "<red>Сезон завершён %date%: прогресс заморожен, но награды за выполненные задания ещё можно забрать.</red>"
  "vip-active": "<gray>Ранг активен до</gray> <light_purple>%until%</light_purple> <dark_gray>·</dark_gray> <gray>VIP-награды открыты</gray>"
  "vip-none": "<dark_gray>Ранга нет: VIP-награды закрыты, обычные награды доступны всем.</dark_gray>"
  "premium-active": "<gold>★ Боевой пропуск активен: премиум-награды открыты.</gold>"
  "premium-none": "<gold>★ Боевой пропуск</gold> <gray>открывает золотые награды заданий: /pass shop</gray>"
  "footer-premium-locked": "<gray>Готово к выдаче золотых наград: <gold>%count%</gold> — нужен боевой пропуск.</gray>"
  "claim-all-premium-only": "<yellow>Готовые премиум-награды: %count%. Их открывает боевой пропуск — /pass shop</yellow>"
  "claim-all-premium-skipped": "<gray>Пропущено премиум-наград: <gold>%count%</gold> — нужен боевой пропуск.</gray>"
  "premium-denied": "<gold>★ Премиум-награда за «%desc%» ждёт боевой пропуск.</gold> <gray>Купить: /pass shop</gray>"
  "premium-products-granted": "<green>Подарки активированы: %count% — смотрите /pass my</green>"
  "week-title": "<yellow><bold>Волна %week%</bold></yellow> <dark_gray>· забрано %claimed% из %total% наград</dark_gray>"
  "week-complete": "<green>Волна %week% — все награды забраны ✔</green>"
  "week-locked": "<dark_gray>Волна %week% откроется %date% (через %days% дн.)</dark_gray>"
  "mission": "%state% %desc% %bar% <white>%progress%/%target%</white> %reward%"
  "mission-ready": "%state% %desc% <green>%progress%/%target%</green> %reward% %hint%"
  "mission-vip": "%state% %desc% <white>%progress%/%target%</white> %reward% %hint%"
  "mission-premium": "%state% %desc% <white>%progress%/%target%</white> %reward% %hint%"
  "mission-claimed": "%state% <dark_gray><strikethrough>%desc%</strikethrough></dark_gray> <dark_gray>%progress%/%target% · забрано</dark_gray>"
  "state-progress": "<gray>•</gray>"
  "state-ready": "<green>✔</green>"
  "state-vip": "<light_purple>◆</light_purple>"
  "state-premium": "<gold>★</gold>"
  "state-claimed": "<dark_gray>✔</dark_gray>"
  "bar-filled": "<green>%bars%</green>"
  "bar-empty": "<dark_gray>%bars%</dark_gray>"
  "reward-free": "<green>+%hours% ч. ранга</green>"
  "reward-vip": "<light_purple>VIP +%hours% ч. ранга</light_purple>"
  "reward-both": "<green>+%free% ч.</green> <light_purple>(VIP +%vip% ч.)</light_purple>"
  "reward-premium-hours": "<gold>★ +%hours% ч.</gold>"
  "reward-premium-item": "<gold>★ подарок</gold>"
  "mission-claim-hint": "<click:run_command:'/%label% claim %id%'><hover:show_text:'<gray>Забрать награду за это задание</gray>'><green><bold>[забрать]</bold></green></hover></click>"
  "mission-vip-hint": "<click:run_command:'/pass menu'><hover:show_text:'<gray>Посмотреть условия ранга</gray>'><light_purple><bold>[нужен ранг]</bold></light_purple></hover></click>"
  "mission-premium-hint": "<click:run_command:'/pass shop'><hover:show_text:'<gray>Боевой пропуск открывает золотые награды сезона</gray>'><gold><bold>[нужен боевой пропуск]</bold></gold></hover></click>"
  "mission-done": "<green>✔ Задание выполнено:</green> %desc% <green>—</green> %hint%"
  "footer-claimable": "<yellow>Готово к получению: %count%</yellow> <dark_gray>·</dark_gray> <click:run_command:'/%label% claim'><hover:show_text:'<gray>Забрать все доступные награды</gray>'><green><bold>[забрать всё]</bold></green></hover></click>"
  "footer-vip-locked": "<dark_gray>VIP-награды (%count%) откроются с рангом —</dark_gray> <yellow>/pass menu</yellow>"
  "footer-idle": "<dark_gray>Награды открываются по мере прогресса и доступны весь сезон.</dark_gray>"
  "points-footer": "<dark_gray>Очки сезона:</dark_gray> <gold>%points%</gold> <dark_gray>·</dark_gray> <dark_gray>выполнено заданий:</dark_gray> <white>%completed%</white>"
  "reward": "<green>Награда получена:</green> %desc% <dark_gray>·</dark_gray> <green>+%hours% ч. ранга</green> <gray>до</gray> <aqua>%until%</aqua>"
  "reward-products": "<green>Награда получена:</green> %desc% <dark_gray>·</dark_gray> <gold>подарки активированы</gold>"
  "vip-denied": "<yellow>%desc%: VIP-награда (+%hours% ч.) — только для владельцев ранга.</yellow>"
  "not-ready": "<yellow>%desc%: ещё не выполнено (%progress%/%target%).</yellow>"
  "locked": "<yellow>%id%: волна с этим заданием ещё не открыта.</yellow>"
  "unknown": "<red>Задание «%id%» не найдено в текущем сезоне.</red>"
  "already-claimed": "<gray>%desc% — награда уже забрана.</gray>"
  "no-season": "<yellow>Сезон батлпасса не настроен — ждите анонса.</yellow>"
  "no-core": "<red>Ядро сервера сейчас недоступно — награду выдать нельзя. Попробуйте позже.</red>"
  "no-permission": "<red>У вас нет доступа к батлпассу.</red>"
  "usage": "<yellow>Использование: /%label% [menu|progress|top|info <id>|claim [id|all]|help]</yellow>"
  "claim-all-summary": "<green>Забрано наград: %count%</green> <dark_gray>·</dark_gray> <green>+%hours% ч. ранга</green> <gray>до</gray> <aqua>%until%</aqua>"
  "claim-all-products": "<green>Забрано наград: %count%</green> <dark_gray>·</dark_gray> <gold>подарки активированы</gold>"
  "claim-all-empty": "<yellow>Готовых наград нет: сначала выполните задания.</yellow> <gray>Прогресс —</gray> <yellow>/battlepass</yellow>"
  "claim-all-vip-only": "<yellow>VIP-награды (%count%) ждут ранг — других наград к получению нет.</yellow>"
  "claim-all-vip-skipped": "<dark_gray>VIP-награды (%count%) останутся доступны, когда появится ранг.</dark_gray>"

  # Справка /battlepass help — одна запись-список, а не десяток ключей.
  "help":
    - "<gold><bold>Боевой пропуск — команды</bold></gold>"
    - "<yellow>/%label%</yellow> <gray>— GUI сезона: задания, прогресс и получение наград</gray>"
    - "<yellow>/%label% menu</yellow> <gray>— то же в виде меню: клик по готовому заданию забирает награду</gray>"
    - "<yellow>/%label% progress</yellow> <gray>— текстовый прогресс в чате</gray>"
    - "<yellow>/%label% claim</yellow> <gray>— забрать все готовые награды сразу</gray>"
    - "<yellow>/%label% claim <id></yellow> <gray>— забрать награду за одно задание</gray>"
    - "<yellow>/%label% info <id></yellow> <gray>— подробности задания: цель, награды, очки, условия</gray>"
    - "<yellow>/%label% top</yellow> <gray>— рейтинг сезона по очкам</gray>"
    - "<dark_gray>Награды выдаются часами ранга; VIP-ветка доступна владельцам активного ранга.</dark_gray>"

  "info-header": "%desc%"
  "info-line": "<dark_gray>Задание</dark_gray> <white>%id%</white> <dark_gray>·</dark_gray> <gray>волна</gray> <white>%week%</white> <dark_gray>·</dark_gray> <gray>тип</gray> <white>%type%</white>"
  "info-progress": "%bar% <white>%progress%/%target%</white> <dark_gray>(%percent%%)</dark_gray>"
  "info-rewards": "<gray>Награды:</gray> %reward% <dark_gray>·</dark_gray> <gray>очки:</gray> <gold>%points%</gold>"
  "info-worlds": "<gray>Миры:</gray> <white>%worlds%</white>"
  "info-permission": "<gray>Право:</gray> <white>%permission%</white>"
  "info-status": "<gray>Статус:</gray> %state%"
  "info-hint": "<click:run_command:'/%label% claim %id%'><green><bold>[забрать награду]</bold></green></click>"

  "top-header": "<gold><bold>Рейтинг сезона</bold></gold> <dark_gray>·</dark_gray> <gray>игроков: %count%</gray>"
  "top-line": "<gray>%place%.</gray> <white>%player%</white> <dark_gray>·</dark_gray> <gold>%points% очк.</gold> <dark_gray>·</dark_gray> <gray>заданий: %completed%</gray>"
  "top-more": "<dark_gray>…и ещё %rest% игроков</dark_gray>"
  "top-self": "<dark_gray>Ваше место: %place% из %total% · %points% очк.</dark_gray>"
  "top-none-self": "<dark_gray>Вас пока нет в рейтинге — выполните задание.</dark_gray> <yellow>/%label%</yellow>"
  "top-empty": "<gray>Рейтинг пока пуст — выполните первое задание.</gray>"

  "menu-title": "<dark_gray>БП · %season% · %page%/%pages%</dark_gray>"
  "menu-lore":
    - "<dark_gray>Волна %week%</dark_gray>"
    - "%bar% <white>%progress%/%target%</white>"
    - "<gray>Награда:</gray> %reward%"
    - "<gray>Очки:</gray> <gold>%points%</gold>"
  "menu-lore-claim": "<green><bold>Нажмите, чтобы забрать</bold></green>"
  "menu-lore-vip": "<light_purple>VIP-награда: нужен ранг</light_purple>"
  "menu-lore-premium": "<gold>★ Премиум-награда: нужен боевой пропуск (/pass shop)</gold>"
  "menu-lore-claimed": "<dark_gray>Награда уже забрана</dark_gray>"
  "menu-summary-name": "%season%"
  "menu-summary-lore":
    - "<gray>Очки сезона:</gray> <gold>%points%</gold>"
    - "<gray>Выполнено заданий:</gray> <white>%completed%</white>"
    - "<gray>Забрано наград:</gray> <white>%claimed%</white>"
    - "<gray>Готово к получению:</gray> <green>%ready%</green>"
  "menu-lore-locked": "<yellow>🔒 Откроется %date% (время сервера)</yellow>"
  "menu-claim-all": "<green><bold>Забрать все готовые награды</bold></green>"
  "menu-back": "<yellow>← Главное меню</yellow>"
  "menu-refresh": "<aqua>Обновить прогресс</aqua>"
  "menu-premium-name": "<gold>★ Доступ к наградам · магазин</gold>"
  "menu-premium-lore":
    - "<gray>Обычные награды:</gray> <green>доступны всем</green>"
    - "<light_purple>VIP-ветка:</light_purple> %vip%"
    - "<gold>Премиум-ветка:</gold> %premium%"
    - "<gray>VIP открывается активным рангом.</gray>"
    - "<gray>Премиум — рангом IV–V или покупкой пропуска.</gray>"
    - "<yellow>Нажмите, чтобы открыть витрину</yellow>"
  "menu-track-active": "<green>открыта</green>"
  "menu-track-locked": "<dark_gray>закрыта</dark_gray>"
  "menu-prev": "<yellow>← Предыдущая страница</yellow>"
  "menu-next": "<yellow>Следующая страница →</yellow>"
  "menu-close": "<red>Закрыть</red>"
  "menu-disabled": "<yellow>Меню батлпасса выключено администратором.</yellow>"

  "wave-opened": "<gold><bold>Открылась новая волна — %week%!</bold></gold> <gray>Задания уже в</gray> <yellow>/battlepass</yellow>"
  "actionbar-completed": "<green>✔ Задание выполнено — /battlepass claim</green>"
  "actionbar-claimed": "<green>+%hours% ч. ранга</green>"
  "actionbar-wave": "<gold>Новая волна: %week%</gold>"

  "admin-reloaded": "<green>Батлпасс перечитан: волн %weeks%, заданий %missions%.</green>"
  "admin-info": "<gray>Сезон %season%: старт %start%, волна %week% из %weeks_total%, заданий %missions%.</gray>"
  "admin-info-end": "<gray>Конец сезона: %end% (через %days% дн.).</gray>"
  "admin-info-open": "<dark_gray>Сезон без даты окончания.</dark_gray>"
  "admin-reset": "<green>Прогресс игрока %player% по сезону сброшен.</green>"
  "admin-not-found": "<red>Игрок %player% не найден в данных сезона.</red>"
  "admin-resetall": "<green>Прогресс сезона сброшен: %players% игрок(ов).</green>"
  "admin-progress": "<green>%player%: «%id%» — прогресс %progress%/%target%.</green>"
  "admin-stats":
    - "<gold><bold>Сводка сезона</bold></gold>"
    - "<gray>Сезон:</gray> %season% <dark_gray>·</dark_gray> <gray>волна %week% из %weeks_total%</gray>"
    - "<gray>Игроков в данных:</gray> <white>%players%</white>"
    - "<gray>Выполнено заданий:</gray> <white>%completed%</white> <dark_gray>·</dark_gray> <gray>очки:</gray> <gold>%points%</gold>"
    - "<gray>Забрано наград:</gray> <white>%claimed%</white>"
    - "<gray>Готово к получению у онлайн-игроков:</gray> <green>%ready%</green>"
  "admin-list-header": "<gold>Задания сезона (%count%):</gold>"
  "admin-list-line": "<gray>%week%.</gray> <white>%id%</white> <dark_gray>·</dark_gray> <gray>%type% ×%target%</gray> <dark_gray>·</dark_gray> <green>+%free%</green> <light_purple>VIP +%vip%</light_purple> <gold>★ +%premium%</gold> <dark_gray>·</dark_gray> <gold>%points% очк.</gold>"
  "admin-validate-ok": "<green>Конфиг сезона в порядке: волн %weeks%, заданий %missions%.</green>"
  "admin-validate-header": "<red>Проблем в конфиге: %count%</red>"
  "admin-validate-problem": "<red>• %problem%</red>"
  "admin-validate-hint": "<gray>Задания с ошибками пропущены; остальные загружены. Исправьте config.yml и выполните</gray> <yellow>/bpadmin reload</yellow>"
  "usage-admin": "<yellow>Использование: /bpadmin <reload|info|stats|list|validate|reset <ник>|resetall|addprogress <ник> <id> <n>|setprogress <ник> <id> <n>></yellow>"
  "admin-usage-progress": "<yellow>Использование: /bpadmin addprogress|setprogress <ник> <id> <n></yellow>"
