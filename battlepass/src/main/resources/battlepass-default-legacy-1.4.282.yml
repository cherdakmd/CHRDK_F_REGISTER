# Пререлиз 1.4.281-rc.1: 5 постоянных волн, не ежедневный сброс.
# Награды — часы отдельного +10% XP-буста; не ранг, алмазы или платные товары.
# Лимит банка Core не увеличивается: не поместившийся приз остаётся доступен.
# Не меняйте season-start ради рестарта: он задаёт область receipt наград.
battlepass:
  season-name: <gold>Сезон «Первая стужа»</gold>
  season-start: '2026-10-13'
  season-end: ''
  autosave-seconds: 300
  match-variants: true
  premium:
    min-rank: 4
    enabled: true
    product: battlepass-premium
  fair-play:
    count-creative: false
    ignore-player-placed: true
    placed-memory-seconds: 600
  display:
    bar-width: 8
    sounds: true
    actionbar: true
    announce-new-waves: true
    menu: true
  weeks:
  - unlock-day: 0
    missions:
    - id: mine_diamonds
      desc: <gray>Добыть алмазную руду</gray>
      type: MINE
      material: DIAMOND_ORE
      target: 16
      free-boost-hours: 6
      vip-boost-hours: 8
      premium-boost-hours: 12
      points: 20
    - id: hunt_zombies
      desc: <gray>Победить зомби</gray>
      type: KILL
      entity: ZOMBIE|HUSK|DROWNED
      target: 40
      free-boost-hours: 6
      vip-boost-hours: 4
      premium-boost-hours: 12
      points: 20
    - id: angler
      desc: <gray>Поймать 10 уловов</gray>
      type: FISH
      entity: ANY
      target: 10
      free-boost-hours: 6
      vip-boost-hours: 4
      premium-boost-hours: 12
      points: 10
    - id: builder
      desc: <gray>Построить 128 блоков</gray>
      type: PLACE
      material: COBBLESTONE|STONE|OAK_PLANKS
      target: 128
      free-boost-hours: 6
      vip-boost-hours: 4
      premium-boost-hours: 12
      points: 15
      icon: BRICKS
    - id: starter_lumber
      desc: <gray>Заготовить 32 бревна</gray>
      type: MINE
      material: OAK_LOG|BIRCH_LOG|SPRUCE_LOG
      target: 32
      free-boost-hours: 6
      vip-boost-hours: 8
      premium-boost-hours: 12
      points: 25
    - id: starter_cook
      desc: <gray>Приготовить 16 порций еды</gray>
      type: SMELT
      material: COOKED_BEEF|COOKED_PORKCHOP|COOKED_COD
      target: 16
      free-boost-hours: 6
      vip-boost-hours: 8
      premium-boost-hours: 12
      points: 25
  - unlock-day: 7
    missions:
    - id: mine_ancient
      desc: <gray>Добыть древние обломки</gray>
      type: MINE
      material: ANCIENT_DEBRIS
      target: 6
      free-boost-hours: 12
      vip-boost-hours: 12
      premium-boost-hours: 18
      points: 30
    - id: craft_netherite
      desc: <gray>Скрафтить 2 незеритовых слитка</gray>
      type: CRAFT
      material: NETHERITE_INGOT
      target: 2
      free-boost-hours: 6
      vip-boost-hours: 8
      premium-boost-hours: 12
      points: 25
    - id: hunt_skeletons
      desc: <gray>Победить скелетов</gray>
      type: KILL
      entity: SKELETON|STRAY|BOGGED
      target: 60
      free-boost-hours: 6
      vip-boost-hours: 4
      premium-boost-hours: 12
      points: 20
    - id: smelter
      desc: <gray>Выплавить 64 слитка</gray>
      type: SMELT
      material: IRON_INGOT|GOLD_INGOT
      target: 64
      free-boost-hours: 6
      vip-boost-hours: 8
