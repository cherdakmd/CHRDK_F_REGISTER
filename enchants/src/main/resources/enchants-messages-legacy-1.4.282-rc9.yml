enchants:
  help-anvil:
  - '<gold>Наковальня: совместимость и уровни опыта</gold>'
  - <gray>Слева один целевой предмет, справа одна кастомная книга; результат берите обычным кликом.</gray>
  - <gray>Проверьте тип снаряжения, конфликты и лимиты. Если одна чара книги не подходит, весь перенос отклоняется.</gray>
  - '<gray>Одинаковые ID и уровни: +1 уровень до потолка; разные уровни: больший, не сумма.</gray>'
  - '<gray>Пример: I + I → II, II + I → II. Чистая кастомная книга без улучшения не расходуется.</gray>'
  - '<gray>Доплата за реально усиленные чары: 3 + сумма(вес редкости × итоговый уровень).</gray>'
  - '<gray>Веса: обычная 2, редкая 4, эпическая 7, легендарная 10. Общие 3 добавляются один раз.</gray>'
  - '<gray>Плюс базовая цена наковальни: прежние работы, ванильные чары, переименование. Это уровни XP, не алмазы.</gray>'
  - <gray>/enchants preview показывает актуальные части цены и итоговые уровни; не выдаёт результат.</gray>
  - <gray>В Survival цена должна быть строго ниже предела наковальни. Ванильные конфликты не обходятся.</gray>
  - '<gray>Если результата нет: проверьте /enchants inspect, /enchants hand, уровень XP и состав книги.</gray>'
