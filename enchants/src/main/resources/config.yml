# CHRDK_Enchants — 70 кастомных чар: 55 светлых и 15 проклятий. Предметы с ними
# живут в NBT (PDC) и сохраняются в инвентарях игроков — отдельного хранилища нет.
#
# 1.4.128: проклятия — это отдельный полюс. Они реально мешают (минус к урону,
# броне, скорости, опыту, износу). Стол выбирает светлую чару ИЛИ проклятие;
# это прежнее поведение. Книжный дроп мобов — только светлый.

general:
  locale: ru

# Источники получения
sources:
  table:
    # Книга -> книга с ванильными и кастомными чарами; снаряжение -> чара на нём.
    # Цена 1/2/3 лазурита: редкость не выше редкой/эпической/легендарной.
    enabled: true
    # Базовый шанс (%) при полной стойке книг (3 лазурита); при меньшей цене — пропорционально.
    chance-percent: 35
    # Из сработавших случаев столько процентов дают проклятие вместо светлой чары (0 — только светлые).
    curse-chance-percent: 25
  mobs:
    # Только природные мобы с активной меткой уровня CHRDK_Hunt.
    # Последний удар — авторизованный игрок Survival, напрямую или снарядом.
    enabled: true
    # Проценты; жёсткие потолки 1% и 25%. Без проклятий и множителей XP/монет.
    regular-chance-percent: 0.35
    elite-chance-percent: 8
  villager:
    # У библиотекарей книга в трейде может замениться на книгу кастомной чары.
    enabled: true
    convert-chance-percent: 50

rules:
  # Максимум кастомных чар на одном предмете (конфликты учитываются отдельно).
  max-per-item: 3
  # Не более одной легендарной чары на предмет.
  max-legendary-per-item: 1
  # Мастер-выключатель проклятий: false — новые проклятия не выпадают ниоткуда,
  # но уже лежащие на предметах продолжают работать (снять их можно только наковальней).
  curses-enabled: true

# Отключение отдельных чар (id: enabled).
enchants:
  careful_work: {enabled: true}       # Бережная работа — до 1 единицы износа после блока
  garden_step: {enabled: true}        # Садовая поступь — не вытаптывает грядки
  air_reserve: {enabled: true}        # Запас воздуха — +40/60 единиц раз в 60 секунд
  quiet_step: {enabled: true}         # Тихий шаг — без вибрации STEP при ходьбе
  crippling_edge: {enabled: true}     # Подрезание — замедляет моба после удара
  sapping_edge: {enabled: true}       # Изнуряющий клинок — ослабляет моба
  pinning_shot: {enabled: true}       # Сковывающий выстрел — замедляет моба
  sapping_shot: {enabled: true}       # Изнуряющий выстрел — ослабляет моба
  briar_guard: {enabled: true}        # Терновый заслон — замедляет атакующего моба
  faltering_guard: {enabled: true}    # Ослабляющий заслон — ослабляет атакующего моба
  thunderstrike: {enabled: true}      # Громобой
  lifesteal: {enabled: true}          # Вампиризм
  chainspark: {enabled: true}         # Цепная молния
  bleeding: {enabled: true}           # Кровоточность
  paralyze: {enabled: true}           # Паралич
  execution: {enabled: true}          # Казнь
  berserk: {enabled: true}            # Берсерк
  slayer: {enabled: true}             # Истребитель
  souleater: {enabled: true}          # Пожиратель душ
  stormarrow: {enabled: true}         # Грозовая стрела
  explosive: {enabled: true}          # Взрывная стрела
  sniper: {enabled: true}             # Снайперская стрела
  frostarrow: {enabled: true}         # Морозная стрела
  tracer: {enabled: true}             # Следящая стрела
  headhunter: {enabled: true}         # Охотник за головами
  retribution: {enabled: true}        # Возмездие
  laststand: {enabled: true}          # Последний шанс
  fortified: {enabled: true}          # Крепость
  lightningrod: {enabled: true}       # Громоотвод
  phoenix: {enabled: true}            # Феникс
  iceward: {enabled: true}            # Страж льдов
  truesight: {enabled: true}          # Орлиный глаз
  seer: {enabled: true}               # Провидец
  swiftfeet: {enabled: true}          # Стремительные
  froggy: {enabled: true}             # Лягушачьи лапки
  lavawalker: {enabled: true}         # Лавоступ
  autosmelt: {enabled: true}          # Автоплавка
  veinminer: {enabled: true}          # Жилодробитель
  excavator: {enabled: true}          # Дробитель
  midas: {enabled: true}              # Рука Мидаса
  # --- 15 светлых чар (1.4.128) ---
  keen_edge: {enabled: true}           # Острый край — +урон оружия
  frenzy: {enabled: true}              # Ярость — урон на низком здоровье
  plunder: {enabled: true}             # Мародёр — больше добычи
  duelist: {enabled: true}             # Дуэлянт — урон по игрокам
  steady_aim: {enabled: true}          # Верный прицел — урон стрел
  quickdraw: {enabled: true}           # Скорый выстрел — скорость снаряда
  bulwark: {enabled: true}             # Оплот — +броня
  second_skin: {enabled: true}         # Вторая кожа — мягче входящий урон
  vitality: {enabled: true}            # Живучесть — самовосстановление
  grounded: {enabled: true}            # Устойчивость — мягче падение
  lightfoot: {enabled: true}           # Лёгкая поступь — скорость после убийства
  featherstep: {enabled: true}         # Пёрышко — +скорость передвижения
  prospector: {enabled: true}          # Старатель — спешка
  fortunate: {enabled: true}           # Золотая жила — удвоение руды
  scholar: {enabled: true}             # Книжник — +опыт
  # --- 15 проклятий (1.4.128) ---
  dull_blade: {enabled: true}          # Тупое лезвие
  clumsy_swing: {enabled: true}        # Неуклюжий замах
  brittle: {enabled: true}             # Хрупкость
  weak_draw: {enabled: true}           # Слабый натяг
  sluggish_shot: {enabled: true}       # Вялый выстрел
  thin_padding: {enabled: true}        # Тонкая подкладка
  exposed: {enabled: true}             # Открытость
  heavy_hull: {enabled: true}          # Тяжёлый корпус
  fire_prone: {enabled: true}          # Боязнь огня
  fragile_bones: {enabled: true}       # Хрупкие кости
  dull_pick: {enabled: true}           # Тупой резец
  jinxed: {enabled: true}              # Порча
  gluttony: {enabled: true}            # Обжорство
  slow_learner: {enabled: true}        # Тугодум
  cursed_blood: {enabled: true}        # Проклятая кровь

# Новые PvE-чары 1.4.203: только авторизованные игроки Survival с chrdkenchants.use.
# Шансы/длительности фиксированы в балансе; общий cooldown 12/15 сек в PDC игрока.
# Не действуют на игроков, питомцев, NPC, именованных мобов и ванильных боссов.
# Уже имеющееся Замедление/Слабость любого уровня НЕ заменяется.
pve-effects:
  enabled: true

# Утилиты 1.4.204: общий выключатель новых выдач и эффектов этой группы.
# Только авторизованные Survival с chrdkenchants.use. PDC/старые чары не стирает.
# Износ: шанс 10/20/30%, максимум -1, cooldown 8 сек. Воздух: 40/60, cooldown 60 сек.
# Тихий шаг НЕ скрывает спринт, прыжки, приземления и звуки шагов.
utility-effects:
  enabled: true
