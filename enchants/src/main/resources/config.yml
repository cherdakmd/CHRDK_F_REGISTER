  brittle: {enabled: true}             # Хрупкость
  weak_draw: {enabled: true}           # Слабый натяг
  sluggish_shot: {enabled: true}       # Вялый выстрел
  thin_padding: {enabled: true}        # Тонкая подкладка
  exposed: {enabled: true}             # Открытость
  heavy_hull: {enabled: true}          # Тяжёлый корпус
  fire_prone: {enabled: true}          # Боязнь огня
  fragile_bones: {enabled: true}       # Хрупкие кости
  dull_pick: {enabled: true}           # Тупой резец
  jinxed: {enabled: true}              # Порча
  gluttony: {enabled: true}            # Обжорство
  slow_learner: {enabled: true}        # Тугодум
  cursed_blood: {enabled: true}        # Проклятая кровь

# Новые PvE-чары 1.4.203: только авторизованные игроки Survival с chrdkenchants.use.
# Шансы/длительности фиксированы в балансе; общий cooldown 12/15 сек в PDC игрока.
# Не действуют на игроков, питомцев, NPC, именованных мобов и ванильных боссов.
# Уже имеющееся Замедление/Слабость любого уровня НЕ заменяется.
pve-effects:
  enabled: true

# Утилиты 1.4.204/208: общий выключатель новых выдач и эффектов этой группы.
# Только авторизованные Survival с chrdkenchants.use. PDC/старые чары не стирает.
# Износ: шанс 10/20/30%, максимум -1, cooldown 8 сек. Воздух: 40/60, cooldown 60 сек.
# Тихий шаг НЕ скрывает спринт, прыжки, приземления и звуки шагов.
# Предохранитель не ремонтирует и не защищает правый клик/бой/нестандартный износ.
# Морозостойкость — только FREEZE без сущности-источника, в рыхлом снегу у ног.
utility-effects:
  enabled: true

# Инструменты 1.4.208: жилы (6/10/14 всего) и область (8/17 дополнительных)
# только при Shift, с тем же инструментом/слотом; каждый блок — native Player.breakBlock.
# Без загрузки чанков, TileState и блоков hardness >=30; расстояние от глаз ≤5 блоков.
# Автоплавка меняет реальные RAW-дропы 1:1; Silk Touch приоритетен, Fortune/XP ванильные.
# Мидас 10%, Золотая жила 10/18%: максимум одна дополнительная базовая партия ≤64.
# Нет минерал-бонуса для Silk/вторичных блоков/установленной или двигавшейся поршнем руды.
# Отрицательные метки постоянны в chunk PDC, до 4096: переполнение/битые данные
# запрещают бонус чанку (обычные дропы и разрушение не запрещают). Не удалять ради фарма.
# Историю установки до этой версии, WorldEdit и прямые setType чужих плагинов восстановить нельзя.

# Библиотека 1.4.209: сохраняет лучшие найденные уровни книг в PDC игрока.
# Только настоящий собственный инвентарь после переноса/подбора; Survival + авторизация.
# Нет копий книг, наград, монет или дополнительных эффектов. Старые книги тоже учитываются.
# Выключение останавливает сканирование/команду, но НЕ удаляет сохранённые открытия.
library:
  enabled: true

# Источник новых книг (стол/житель/моб/клад/осколки/админ/API) — справочная метка PDC.
# Старые книги не переписываются; неизвестная метка не отменяет их действительные чары.
# Книжный бросок моба фиксируется навсегда только после финально неотменённой смерти.

# PvE 1.4.210: Провоцирующий удар I/II — шанс 15/20%, один retarget в 6 блоках
# с прямой видимостью. Не фиксирует агро, не меняет AI; отмена события цели соблюдается.
# Сигнальный заслон I/II — шанс 15/20%, свечение 2/3 сек., без замены существующего.
# Общая перезарядка новых чар 15 сек.; один эффект, без суммирования брони.
# /enchants guard [auto|briar_guard|faltering_guard|signal_guard]: личный приоритет
# только реально надетой включённой защиты. Не надето — обычный выбор по уровню,
# сам выбор хранится в PDC. Изменение приоритета не сбрасывает pve_ready_at.

# 1.4.213: reload проверяет config.yml + сообщения до смены рабочего снимка.
# Ошибка YAML/типа/чтения сохраняет прежние настройки, GUI и ожидающие операции.
# Успешный reload закрывает старые меню и очищает устаревшие задачи, но не PDC/data.
# Для первого запуска нужен корректный конфиг: молчаливого старта со стоком при ошибке нет.

# 1.4.214: наковальня сохраняет native-цену и штрафы предыдущих работ обоих входов.
# Доплата: 3 + сумма(2/4/7/10 за редкость * итоговый уровень) усиленных чар.
# Итог >= native maximumRepairCost (обычно 40) скрывает результат вне Creative.
# Накопление следующего штрафа читает Purpur settings.blocks.anvil.cumulative-cost.
# Чистая книга + имя без native-результата: только текст; форматирование — отдельно.
