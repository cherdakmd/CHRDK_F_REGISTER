# CHRDK_Enchants — общий источник описаний книг, каталога, команд и вики.
# Механика не меняется: числа сверены с действующими обработчиками.
enchants:
  workshop-quote: '<aqua>%action%</aqua><gray>: цена <yellow>%cost%</yellow>. Ничего ещё не списано. В течение 30 секунд: <yellow>/enchants confirm %code%</yellow>.
    Не меняйте руки и инвентарь.</gray>'
  workshop-selected: '<gray>Выбранная чара: <light_purple>%name%</light_purple>. Очищение удаляет только её проклятие; разделение переносит её в отдельную книгу без
    копирования.</gray>'
  workshop-result: '<gray>После объединения: <light_purple>%name%</light_purple>, уровень <yellow>%level%</yellow>; две исходные книги расходуются.</gray>'
  workshop-done: <green>Операция завершена. Материалы списаны, результат в инвентаре.</green>
  workshop-rejected: '<red>Операция отклонена, ничего не списано. Нужны Survival, закрытый контейнер, один предмет в основной руке, обычные материалы и место. Объединение:
    две полностью одинаковые чистые кастомные книги в руках, один id/уровень ниже потолка. Разделение: смешанная книга и id. Подтверждение устаревает при изменении
    инвентаря, выходе, смерти, TP или reload.</red>'
  preview-open-anvil: <yellow>Откройте наковальню, положите предмет слева и кастомную книгу справа, затем /enchants preview.</yellow>
  preview-unavailable: <red>Нет действующего безопасного расчёта. Проверьте книгу, совместимость и состояние наковальни.</red>
  preview-price: <aqua>Наковальня:</aqua> <gray>базовая часть %native% + кастомные чары %custom% = <yellow>%total% уровней</yellow>; native-предел %maximum% (для
    Survival цена строго ниже). Только отчёт, предмет не выдаётся.</gray>
  preview-ready: <green>По текущему расчёту и вашему уровню получение доступно. При клике всё проверяется заново.</green>
  preview-too-expensive: '<red>Сейчас получить результат нельзя: native-предел или недостаточно уровней. Preview не обходит цену.</red>'
  preview-transfer: '<gray>%name%: %before% → <yellow>%after%</yellow>. Остальные данные сохраняются штатным результатом наковальни.</gray>'
  book-source-workshop: <aqua>мастерская чар</aqua>
  no-api: <red>Ядро CHRDK_F_REGISTER не найдено — чары недоступны.</red>
  need-auth: <red>Сначала войдите на сервер (/login).</red>
  table-added: '<light_purple>✦ Стол дарует чару: %name% %levelroman%!</light_purple>'
  table-cursed: '<dark_red>☠ Стол выплеснул проклятие: %name% %levelroman%!</dark_red>'
  anvil-capped: <red>На предмете уже максимум чар (%max%) или они конфликтуют.</red>
  usage: <gray>/enchants — каталог %count% чар; help [books|anvil|workshop|effects], info &lt;id&gt;, find &lt;текст&gt;, group &lt;тип&gt;, rarity &lt;редкость&gt;,
    light, curses, hand, sort &lt;id|name|rarity&gt;, inspect, cooldowns, sources, library [страница], guard [auto|id], preview, cleanse &lt;id&gt;, combine, split
    &lt;id&gt;, confirm &lt;код&gt;</gray>
  info-header: <light_purple>✦ %name% <gray>(%rarity%, ур. I–%maxlevel%)</gray>
  info-items: '<gray>Накладывается на: <yellow>%items%</yellow></gray>'
  info-conflicts: '<gray>Конфликтует с: <red>%conflicts%</red></gray>'
  not-found: <red>Чара с id <yellow>%id%</yellow> не найдена.</red>
  player-only: <red>Команда доступна только игрокам.</red>
  no-permission: <red>Недостаточно прав.</red>
  admin-given: '<green>Выдана книга чары: %name% <gray>ур. %level%</gray> игроку %player%.</green>'
  admin-offline: <red>Игрок %player% не в сети.</red>
  admin-reloaded: <green>Конфигурация чар перезагружена.</green>
  admin-usage:
  - <gray><yellow>/enchantsadmin give <ник> <id> [уровень]</yellow> — выдать книгу</gray>
  - <gray><yellow>/enchantsadmin purify <ник></yellow> — снять проклятия с предмета в руке</gray>
  - <gray><yellow>/enchantsadmin reload</yellow> — перечитать конфиг</gray>
  admin-purified: '<green>С предмета игрока %player% снято проклятий: %count%.</green>'
  admin-purify-empty: <gray>На предмете в руке игрока %player% нет проклятий.</gray>
  anvil-curse-applied: '<dark_red>☠ Проклятие вросло в предмет: снять его наковальней нельзя.</dark_red>'
  phoenix-armed: <gold>✦ Феникс готов вспыхнуть.</gold>
  phoenix-consumed: <gold>☀ Феникс воскресил вас! Перезарядка %seconds% сек.</gold>
  laststand-triggered: '<yellow>✦ Последний шанс: держитесь! (перезарядка %seconds% сек)</yellow>'
  gui-title: Чары CHRDK — стр. %page%/%pages%
  gui-enchant-lore-polarity: '<gray>Тип: %polarity%</gray>'
  gui-enchant-lore-rarity: '<gray>Редкость: %rarity% · макс. ур.: %maxlevel%</gray>'
  gui-enchant-lore-items: '<gray>На: %items%</gray>'
  gui-book-name: '<light_purple>✦ Книга чар: %name%</light_purple>'
  gui-book-name-curse: '<dark_red>☠ Книга проклятия: %name%</dark_red>'
  lore-line: <dark_purple>✶ %name% <gray>%levelroman%</gray>
  lore-line-curse: <dark_red>✶ %name% <gray>%levelroman%</gray></dark_red>
  gui-footer: <gray>Стол, библиотекари, природные мобы; /enchants sources — действующие шансы.</gray>
  gui-prev: <yellow>← Предыдущая страница</yellow>
  gui-next: <yellow>Следующая страница →</yellow>
  info-polarity: '<gray>Тип: %polarity%</gray>'
  info-curse-warning: '<dark_red>Проклятие — отрицательный эффект. Наковальня его не снимает; мастерская: /enchants cleanse %id%.</dark_red>'
  curse-jinxed: '<dark_red>☠ Порча: добыча рассыпалась в прах.</dark_red>'
  polarity-light: <light_purple>светлая чара</light_purple>
  polarity-curse: <dark_red>проклятие</dark_red>
  rarity-common: <gray>Обычная</gray>
  rarity-rare: <aqua>Редкая</aqua>
  rarity-epic: <light_purple>Эпическая</light_purple>
  rarity-legendary: <gold>Легендарная</gold>
  item-sword: мечи/топоры
  item-bow: луки/арбалеты
  item-helmet: шлемы
  item-chestplate: нагрудники
  item-leggings: поножи
  item-boots: ботинки
  item-armor: любая броня
  item-tool: кирки/лопаты/топоры
  item-any: любой предмет
  item-crossbow: арбалеты
  en:
    pve_anchor:
      name: PvE-якорь
      lore:
      - '<gray>Ботинки I/II: −15/30% горизонтального отбрасывания только от обычного враждебного моба в ближнем бою.</gray>'
      - <gray>Не PvP, питомцы, NPC, боссы, именные мобы, взрывы или снаряды; вертикаль без изменений.</gray>
      - '<gray>Общая PvE-перезарядка: 15 секунд; остаточное сопротивление, не иммунитет.</gray>'
      - <gray>Приоритет /enchants guard pve_anchor, общий выключатель pve-effects.enabled.</gray>
    harvest_replant:
      name: Бережная пересадка
      lore:
      - '<gray>Мотыга I: после разрешённого ручного сбора зрелой культуры сажает росток за одно обычное настоящее семя из инвентаря.</gray>'
      - <gray>Без роста/добавочного опыта/дропа. Вместе со Skills — одна посадка, не две. Приваты могут отменить размещение.</gray>
    thunderstrike:
      name: Громобой
      lore:
      - '<gray>При ближнем ударе: шанс 10/15/20% вызвать молнию.</gray>'
      - <gray>Дополнительный урон 4 ед. (2 сердца) до защиты цели.</gray>
      - '<gray>Это не гарантированный поджог: используется визуальная молния.</gray>'
    lifesteal:
      name: Вампиризм
      lore:
      - <gray>При ближнем ударе лечит на 10/15/20% итогового урона.</gray>
      - <gray>Минимальное лечение 0,5 ед.; не выше максимума здоровья.</gray>
    chainspark:
      name: Цепная молния
      lore:
      - <gray>При ближнем ударе задевает ещё до 1/2 живых целей.</gray>
      - <gray>Каждой — 40% итогового урона основного удара.</gray>
      - '<gray>Область вокруг жертвы: ±3,5 блока, по высоте ±2,5.</gray>'
    bleeding:
      name: Кровоточность
      lore:
      - <gray>Ближний удар накладывает Иссушение I на 2/3/4 сек.</gray>
      - <gray>Это временный зельевой эффект, а не отдельная рана.</gray>
    paralyze:
      name: Паралич
      lore:
      - '<gray>Ближний удар: шанс 10/14% сковать живую цель.</gray>'
      - <gray>Медлительность V на 1,5 сек. и Усталость IV на 2 сек.</gray>
    execution:
      name: Казнь
      lore:
      - <gray>Если до удара у цели не более 20% максимального HP,</gray>
      - <gray>базовый урон удара умножается на 2/2,5.</gray>
      - '<gray>Не мгновенное убийство: броня и остальные расчёты остаются.</gray>'
    berserk:
      name: Берсерк
      lore:
      - '<gray>При своём здоровье не выше 50%: +10/15/20% к удару.</gray>'
      - <gray>При здоровье выше половины бонус не действует.</gray>
    slayer:
      name: Истребитель
      lore:
      - <gray>После убийства с оружием в основной руке:</gray>
      - <gray>Сила I на 6/10 сек.; не постоянный бонус оружия.</gray>
    souleater:
      name: Пожиратель душ
      lore:
      - '<gray>После убийства: +1/2 ед. сытости и +1/2 ед. HP.</gray>'
      - <gray>Также короткий эффект Насыщения; HP не выше максимума.</gray>
      - <gray>Оружие должно оставаться в основной руке.</gray>
    stormarrow:
      name: Грозовая стрела
      lore:
      - <gray>При попадании стрелы — молния и урон по области.</gray>
      - <gray>Живые цели в ±2 блоках получают 2/3/4 ед. урона.</gray>
      - <gray>Стрелок исключён; это не усиление только одной жертвы.</gray>
    explosive:
      name: Взрывная стрела
      lore:
      - <gray>При попадании стрелы создаёт взрыв силой 0,8/1,6.</gray>
      - <gray>Без поджога и разрушения блоков.</gray>
      - <gray>Урон зависит от взрыва и защиты, не равен его силе.</gray>
    sniper:
      name: Снайперская стрела
      lore:
      - '<gray>Урон стрелы: +3/5/7% за каждые 10 блоков от старта.</gray>'
      - <gray>Бонус растёт плавно; потолок +45/60/75%.</gray>
      - <gray>Измеряется расстояние, не время полёта.</gray>
    frostarrow:
      name: Морозная стрела
      lore:
      - '<gray>Попадание: Медлительность I на 4/6 сек.</gray>'
      - <gray>Добавляет замерзание, не выше предела цели.</gray>
      - <gray>Это не полная остановка движения.</gray>
    tracer:
      name: Следящая стрела
      lore:
      - <gray>Попавшая стрела подсвечивает живую цель на 10 сек.</gray>
      - <gray>Свечение видно через препятствия; стрела не самонаводится.</gray>
    headhunter:
      name: Охотник за головами
      lore:
      - <gray>Стрелы наносят игрокам на 15% больше урона.</gray>
      - <gray>По мобам эта прибавка не действует.</gray>
      - <gray>Название не обещает гарантированное получение головы.</gray>
    retribution:
      name: Возмездие
      lore:
      - <gray>Возвращает 8/12/16% итогового урона ближнему атакующему.</gray>
      - <gray>Отражение срабатывает, если получается хотя бы 0,5 ед.</gray>
      - <gray>Берётся лучший уровень надетой брони; не против стрел.</gray>
    laststand:
      name: Последний шанс
      lore:
      - <gray>После несмертельного удара осталось не более 3 ед. HP:</gray>
      - <gray>Поглощение I и Сопротивление I на 25 сек.</gray>
      - <gray>Откат 240 сек.; смертельный удар не отменяет.</gray>
    fortified:
      name: Крепость
      lore:
      - <gray>Снижает входящий урон на 6/9/12% до остальных расчётов.</gray>
      - <gray>Берётся лучший уровень на надетой броне.</gray>
      - <gray>Одинаковые чары на четырёх частях не складываются.</gray>
    lightningrod:
      name: Громоотвод
      lore:
      - <gray>Отменяет урон типа Молния и даёт Скорость I на 10 сек.</gray>
      - <gray>Не общий иммунитет к огню или любому магическому урону.</gray>
    phoenix:
      name: Феникс
      lore:
      - <gray>При готовности отменяет смертельный урон.</gray>
      - <gray>Устанавливает здоровье до 8 ед. (4 сердца), тушит огонь.</gray>
      - <gray>Сопротивление II 5 сек., Огнестойкость I 10 сек.; откат 300 сек.</gray>
    iceward:
      name: Страж льдов
      lore:
      - '<gray>Ближнему атакующему: Медлительность I на 2/3 сек.</gray>'
      - <gray>Добавляет замерзание до предела цели; не против стрел.</gray>
    truesight:
      name: Орлиный глаз
      lore:
      - <gray>Каждые 4 сек. подсвечивает невидимых живых существ и монстров.</gray>
      - '<gray>Область вокруг вас: ±6 блоков, по высоте ±4.</gray>'
      - <gray>Не поиск руды или сундуков; шлем должен быть надет.</gray>
    seer:
      name: Провидец
      lore:
      - <gray>Ночное зрение I, пока шлем надет.</gray>
      - <gray>Постоянная аура без мигания; после снятия источник исчезает.</gray>
    swiftfeet:
      name: Стремительные
      lore:
      - <gray>Во время спринта поддерживает Скорость I/II.</gray>
      - <gray>При обычной ходьбе этот источник скорости не действует.</gray>
    froggy:
      name: Лягушачьи лапки
      lore:
      - <gray>Пока ботинки надеты, поддерживает Прыгучесть I/II.</gray>
      - <gray>Не даёт полёт или отдельную защиту от падения.</gray>
    lavawalker:
      name: Лавоступ
      lore:
      - <gray>Лава под ногами превращается в корку 3×3 примерно на 10 сек.</gray>
      - <gray>На лаве и собственной корке поддерживает огнестойкость.</gray>
      - <gray>Не бессрочный иммунитет после ухода с лавы.</gray>
    autosmelt:
      name: Автоплавка
      lore:
      - '<gray>Железная/золотая/медная руда: сырьё сразу в слитки.</gray>'
      - <gray>Древние обломки — в незеритовый лом; без печного XP.</gray>
      - <gray>Шёлковое касание отключает переплавку; количество не растёт.</gray>
    veinminer:
      name: Жилодробитель
      lore:
      - '<gray>Присев, разрушьте руду: до 6/10/14 блоков той же жилы.</gray>'
      - <gray>Предел включает исходный блок; дополнительные ломаются обычно.</gray>
      - <gray>Нужны доступ, дальность до 5 блоков и загруженный чанк.</gray>
    excavator:
      name: Дробитель
      lore:
      - '<gray>Присев, ломайте блок: область 3×3 / 3×3×2 по направлению взгляда.</gray>'
      - <gray>Нет обхода приватов, износа или дальности до 5 блоков.</gray>
      - <gray>Контейнеры, жидкости и блоки твёрдостью от 30 не ломает.</gray>
    midas:
      name: Рука Мидаса
      lore:
      - <gray>Шанс 10% добавить одну базовую партию минерала.</gray>
      - <gray>Только природная руда, без Шёлкового касания.</gray>
      - <gray>С Золотой жилой — не более одной добавки; без XP/денег.</gray>
    keen_edge:
      name: Острый край
      lore:
      - '<gray>Урон атаки оружия в основной руке: +4/6/8%.</gray>'
      - <gray>Это модификатор атрибута, не гарантированный итоговый урон.</gray>
    frenzy:
      name: Ярость
      lore:
      - '<gray>При своём здоровье не выше 50%: +10/15/20% урона удара.</gray>'
      - <gray>Выше половины здоровья прибавки нет.</gray>
    plunder:
      name: Мародёр
      lore:
      - '<gray>Расчёт добавки к дропу убитого: 10/15/20%.</gray>'
      - <gray>Дробная часть разыгрывается; стек не выше его максимума.</gray>
      - <gray>Не множитель денег, XP или любых сторонних наград.</gray>
    duelist:
      name: Дуэлянт
      lore:
      - <gray>Ближние удары по игрокам сильнее на 8/12/16%.</gray>
      - <gray>По мобам прибавка не действует; правила PvP не отменяет.</gray>
    steady_aim:
      name: Верный прицел
      lore:
      - <gray>Урон выпущенных стрел увеличивается на 8/12/16%.</gray>
      - <gray>Не ускоряет натяжение и не делает выстрел самонаводящимся.</gray>
    quickdraw:
      name: Скорый выстрел
      lore:
      - '<gray>Начальная скорость полёта стрелы: +4/6/8%.</gray>'
      - <gray>Не сокращает время натяжения лука или зарядки арбалета.</gray>
    bulwark:
      name: Оплот
      lore:
      - '<gray>Атрибут брони надетой части: +5/7/9%.</gray>'
      - <gray>Не равно такому же проценту снижения любого урона.</gray>
    second_skin:
      name: Вторая кожа
      lore:
      - <gray>Входящий урон снижается на 4/6/8% до остальных расчётов.</gray>
      - <gray>Берётся лучший уровень на надетой броне, не сумма частей.</gray>
    vitality:
      name: Живучесть
      lore:
      - <gray>Восстанавливает 0,5/0,75/1 ед. HP за секундный пульс.</gray>
      - <gray>Это 0,25/0,375/0,5 сердца; не выше максимального здоровья.</gray>
      - <gray>Берётся лучший уровень надетой брони, не сумма частей.</gray>
    grounded:
      name: Устойчивость
      lore:
      - <gray>Урон именно от падения снижается на 10/15/20%.</gray>
      - <gray>Берётся лучший уровень на броне; не полная неуязвимость.</gray>
    lightfoot:
      name: Лёгкая поступь
      lore:
      - '<gray>После убийства в этих ботинках: Скорость I/II/II.</gray>'
      - '<gray>Длительность по уровню чары: 4/6/8 сек.</gray>'
    featherstep:
      name: Пёрышко
      lore:
      - '<gray>Скорость передвижения в надетых ботинках: +4/6/8%.</gray>'
      - <gray>Это атрибут скорости, не эффект Скорость I/II/III.</gray>
    prospector:
      name: Старатель
      lore:
      - <gray>С инструментом в основной руке поддерживает Спешку I/II/II.</gray>
      - <gray>III уровень чары не даёт Спешку III.</gray>
      - <gray>Не прямые +8/12/16% к добыче и не добавочный дроп.</gray>
    fortunate:
      name: Золотая жила
      lore:
      - <gray>Шанс 10/18% добавить базовую партию минерала.</gray>
      - <gray>Только природная руда, без Шёлкового касания.</gray>
      - <gray>С Мидасом — не более одной добавки; вторичные блоки без бонуса.</gray>
    scholar:
      name: Книжник
      lore:
      - '<gray>Получаемый ванильный опыт: +5/8/11% с каждой экипированной копии.</gray>'
      - <gray>Учитываются броня и обе руки, итог округляется.</gray>
      - <gray>Не уровни профессий/навыков; общий потолок XP сервера остаётся.</gray>
    dull_blade:
      name: Тупое лезвие
      lore:
      - '<red>Урон атаки оружия в основной руке: −5/8/11%.</red>'
      - <red>Минус к атрибуту, а не отдельный периодический урон.</red>
    clumsy_swing:
      name: Неуклюжий замах
      lore:
      - '<red>Скорость атаки оружия в основной руке: −8/12/16%.</red>'
      - <red>Удары восстанавливаются медленнее; не скорость передвижения.</red>
    brittle:
      name: Хрупкость
      lore:
      - '<red>Износ при повреждении предмета: +15/25/35%.</red>'
      - '<red>Округление вверх: даже малый износ может вырасти на 1 ед.</red>'
    weak_draw:
      name: Слабый натяг
      lore:
      - '<red>Урон выпущенных стрел: −8/12/16%.</red>'
      - <red>Скорость полёта эта чара не меняет.</red>
    sluggish_shot:
      name: Вялый выстрел
      lore:
      - <red>Начальная скорость стрелы уменьшается на 10/20%.</red>
      - <red>Не увеличивает время натяжения или зарядки оружия.</red>
    thin_padding:
      name: Тонкая подкладка
      lore:
      - '<red>Атрибут брони надетой части: −4/6/8%.</red>'
      - <red>Это потеря брони, не прямой процент входящего урона.</red>
    exposed:
      name: Открытость
      lore:
      - <red>Входящий урон увеличивается на 8/12/16%.</red>
      - <red>Берётся лучший уровень на надетой броне, не сумма частей.</red>
    heavy_hull:
      name: Тяжёлый корпус
      lore:
      - '<red>Скорость передвижения с надетой частью: −10/15/20%.</red>'
      - <red>Работает как отрицательный атрибут экипировки.</red>
    fire_prone:
      name: Боязнь огня
      lore:
      - '<red>Огонь, лава и горячий пол: +15/25/35% урона.</red>'
      - <red>При таком уроне горение продлевается минимум до 2/3/4 сек.</red>
    fragile_bones:
      name: Хрупкие кости
      lore:
      - <red>Урон от падения увеличивается на 10/15/20%.</red>
      - <red>На другие причины урона эта прибавка не действует.</red>
    dull_pick:
      name: Тупой резец
      lore:
      - <red>С киркой в основной руке поддерживает Усталость I/II/II.</red>
      - <red>III уровень чары не даёт Усталость III.</red>
      - <red>Не прямые −10/18/25% к скорости добычи.</red>
    jinxed:
      name: Порча
      lore:
      - <red>При добыче шанс 8/14/20% потерять предметный дроп блока.</red>
      - <red>Не уменьшает опыт напрямую; не гарантирует потерю при каждом блоке.</red>
    gluttony:
      name: Обжорство
      lore:
      - <red>Каждую секунду добавляет 0,05/0,0875/0,125 истощения.</red>
      - <red>Учитывается лучший уровень на броне и в обеих руках.</red>
      - <red>Не прямые −20/35/50% к полоске сытости.</red>
    slow_learner:
      name: Тугодум
      lore:
      - '<red>Ванильный получаемый опыт: −10/18/25% за копию на экипировке.</red>'
      - <red>Броня и обе руки учитываются, итог округляется.</red>
      - <red>В этом обработчике остаётся минимум 10% исходного XP.</red>
    cursed_blood:
      name: Проклятая кровь
      lore:
      - <red>Раз в 5 сек. шанс 25/50/75% получить 1 ед. урона.</red>
      - <red>Проверяется, только пока здоровье больше 1 ед.</red>
      - '<red>Не обещает бессмертие: остальной урон/модификаторы остаются.</red>'
  en.crippling_edge.name: Подрезание
  en.crippling_edge.lore:
  - <gray>Замедление I на 2/3/4 сек., шанс 20/25/30%.</gray>
  - '<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>'
  - '<gray>Общая перезарядка новых PvE-чар: 12 сек. после срабатывания.</gray>'
  - <gray>Имеющийся эффект того же типа не заменяется.</gray>
  en.sapping_edge.name: Изнуряющий клинок
  en.sapping_edge.lore:
  - <gray>Слабость I на 2/3 сек., шанс 15/20%.</gray>
  - '<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>'
  - '<gray>Общая перезарядка новых PvE-чар: 15 сек. после срабатывания.</gray>'
  - <gray>Имеющийся эффект того же типа не заменяется.</gray>
  en.pinning_shot.name: Сковывающий выстрел
  en.pinning_shot.lore:
  - <gray>Замедление I на 2/3/4 сек., шанс 20/25/30%.</gray>
  - '<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>'
  - '<gray>Общая перезарядка новых PvE-чар: 12 сек. после срабатывания.</gray>'
  - <gray>Имеющийся эффект того же типа не заменяется.</gray>
