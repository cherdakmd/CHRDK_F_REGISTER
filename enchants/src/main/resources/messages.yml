# CHRDK_Enchants — имена/описания 76 чар (en.<id>.name, en.<id>.lore) и тексты UI.
# Проклятия лежат в той же секции en, цвет и знак задаются полярностью чары.
enchants:
  workshop-quote: "<aqua>%action%</aqua><gray>: цена <yellow>%cost%</yellow>. Ничего ещё не списано. В течение 30 секунд: <yellow>/enchants confirm %code%</yellow>. Не меняйте руки и инвентарь.</gray>"
  workshop-selected: "<gray>Выбранная чара: <light_purple>%name%</light_purple>. Очищение удаляет только её проклятие; разделение переносит её в отдельную книгу без копирования.</gray>"
  workshop-result: "<gray>После объединения: <light_purple>%name%</light_purple>, уровень <yellow>%level%</yellow>; две исходные книги расходуются.</gray>"
  workshop-done: "<green>Операция завершена. Материалы списаны, результат в инвентаре.</green>"
  workshop-rejected: "<red>Операция отклонена, ничего не списано. Нужны Survival, закрытый контейнер, один предмет в основной руке, обычные материалы и место. Объединение: две полностью одинаковые чистые кастомные книги в руках, один id/уровень ниже потолка. Разделение: смешанная книга и id. Подтверждение устаревает при изменении инвентаря, выходе, смерти, TP или reload.</red>"
  preview-open-anvil: "<yellow>Откройте наковальню, положите предмет слева и кастомную книгу справа, затем /enchants preview.</yellow>"
  preview-unavailable: "<red>Нет действующего безопасного расчёта. Проверьте книгу, совместимость и состояние наковальни.</red>"
  preview-price: "<aqua>Наковальня:</aqua> <gray>базовая часть %native% + кастомные чары %custom% = <yellow>%total% уровней</yellow>; native-предел %maximum% (для Survival цена строго ниже). Только отчёт, предмет не выдаётся.</gray>"
  preview-ready: "<green>По текущему расчёту и вашему уровню получение доступно. При клике всё проверяется заново.</green>"
  preview-too-expensive: "<red>Сейчас получить результат нельзя: native-предел или недостаточно уровней. Preview не обходит цену.</red>"
  preview-transfer: "<gray>%name%: %before% → <yellow>%after%</yellow>. Остальные данные сохраняются штатным результатом наковальни.</gray>"
  book-source-workshop: "<aqua>мастерская чар</aqua>"
  no-api: "<red>Ядро CHRDK_F_REGISTER не найдено — чары недоступны.</red>"
  need-auth: "<red>Сначала войдите на сервер (/login).</red>"
  table-added: "<light_purple>✦ Стол дарует чару: %name% %levelroman%!</light_purple>"
  table-cursed: "<dark_red>☠ Стол выплеснул проклятие: %name% %levelroman%!</dark_red>"
  anvil-capped: "<red>На предмете уже максимум чар (%max%) или они конфликтуют.</red>"
  usage: "<gray>/enchants — каталог %count% чар; info <id>, find <текст>, group <тип>, rarity <редкость>, light, curses, hand, sort <id|name|rarity>, inspect, cooldowns, sources, library [страница], guard [auto|id], preview, cleanse <id>, combine, split <id>, confirm <код></gray>"
  info-header: "<light_purple>✦ %name% <gray>(%rarity%, ур. I–%maxlevel%)</gray>"
  info-items: "<gray>Накладывается на: <yellow>%items%</yellow></gray>"
  info-conflicts: "<gray>Конфликтует с: <red>%conflicts%</red></gray>"
  not-found: "<red>Чара с id <yellow>%id%</yellow> не найдена.</red>"
  player-only: "<red>Команда доступна только игрокам.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  admin-given: "<green>Выдана книга чары: %name% <gray>ур. %level%</gray> игроку %player%.</green>"
  admin-offline: "<red>Игрок %player% не в сети.</red>"
  admin-reloaded: "<green>Конфигурация чар перезагружена.</green>"
  admin-usage:
    - "<gray><yellow>/enchantsadmin give <ник> <id> [уровень]</yellow> — выдать книгу</gray>"
    - "<gray><yellow>/enchantsadmin purify <ник></yellow> — снять проклятия с предмета в руке</gray>"
    - "<gray><yellow>/enchantsadmin reload</yellow> — перечитать конфиг</gray>"
  admin-purified: "<green>С предмета игрока %player% снято проклятий: %count%.</green>"
  admin-purify-empty: "<gray>На предмете в руке игрока %player% нет проклятий.</gray>"
  anvil-curse-applied: "<dark_red>☠ Проклятие вросло в предмет: снять его наковальней нельзя.</dark_red>"
  phoenix-armed: "<gold>✦ Феникс готов вспыхнуть.</gold>"
  phoenix-consumed: "<gold>☀ Феникс воскресил вас! Перезарядка %seconds% сек.</gold>"
  laststand-triggered: "<yellow>✦ Последний шанс: держитесь! (перезарядка %seconds% сек)</yellow>"
  gui-title: "Чары CHRDK — стр. %page%/%pages%"
  gui-enchant-lore-polarity: "<gray>Тип: %polarity%</gray>"
  gui-enchant-lore-rarity: "<gray>Редкость: %rarity% · макс. ур.: %maxlevel%</gray>"
  gui-enchant-lore-items: "<gray>На: %items%</gray>"
  gui-book-name: "<light_purple>✦ Книга чар: %name%</light_purple>"
  gui-book-name-curse: "<dark_red>☠ Книга проклятия: %name%</dark_red>"
  lore-line: "<dark_purple>✶ %name% <gray>%levelroman%</gray>"
  lore-line-curse: "<dark_red>✶ %name% <gray>%levelroman%</gray></dark_red>"
  gui-footer: "<gray>Источники: стол зачарований и жители-библиотекари. Стрелки — страницы.</gray>"
  gui-prev: "<yellow>← Светлые чары</yellow>"
  gui-next: "<red>Проклятия →</red>"
  info-polarity: "<gray>Тип: %polarity%</gray>"
  info-curse-warning: "<dark_red>Осторожно: проклятие вешает на предмет постоянный минус.</dark_red>"
  curse-jinxed: "<dark_red>☠ Порча: добыча рассыпалась в прах.</dark_red>"
  polarity-light: "<light_purple>светлая чара</light_purple>"
  polarity-curse: "<dark_red>проклятие</dark_red>"
  rarity-common: "<gray>Обычная</gray>"
  rarity-rare: "<aqua>Редкая</aqua>"
  rarity-epic: "<light_purple>Эпическая</light_purple>"
  rarity-legendary: "<gold>Легендарная</gold>"
  item-sword: "мечи/топоры"
  item-bow: "луки/арбалеты"
  item-helmet: "шлемы"
  item-chestplate: "нагрудники"
  item-leggings: "поножи"
  item-boots: "ботинки"
  item-armor: "любая броня"
  item-tool: "кирки/лопаты/топоры"
  item-any: "любой предмет"
  item-crossbow: "арбалеты"
  # --- 30 чар ---
  en:
    pve_anchor:
      name: "PvE-якорь"
      lore:
        - "<gray>Ботинки I/II: −15/30% горизонтального отбрасывания только от обычного враждебного моба в ближнем бою.</gray>"
        - "<gray>Не PvP/взрывы/снаряды; вертикаль без изменений. Общий PvE-cooldown 15 секунд, приоритет /enchants guard pve_anchor.</gray>"
    harvest_replant:
      name: "Бережная пересадка"
      lore:
        - "<gray>Мотыга I: после разрешённого ручного сбора зрелой культуры сажает росток за одно обычное настоящее семя из инвентаря.</gray>"
        - "<gray>Без роста/добавочного опыта/дропа. Вместе со Skills — одна посадка, не две. Приваты могут отменить размещение.</gray>"
    thunderstrike:
      name: "Громобой"
      lore: "<gray><gray>Есть шанс, что удар вызовет молнию и подпалит цель.</gray></gray>"
    lifesteal:
      name: "Вампиризм"
      lore: "<gray><gray>Часть наносимого урона возвращается здоровьем.</gray></gray>"
    chainspark:
      name: "Цепная молния"
      lore: "<gray><gray>Удар перескакивает на ближайших врагов цепной зарницей.</gray></gray>"
    bleeding:
      name: "Кровоточность"
      lore: "<gray><gray>Раны кровоточат — цель иссушается несколько секунд.</gray></gray>"
    paralyze:
      name: "Паралич"
      lore: "<gray><gray>Может сковать врага: ступор и тяжёлые руки.</gray></gray>"
    execution:
      name: "Казнь"
      lore: "<gray><gray>По почти павшим врагам бьёт разяще сильнее.</gray></gray>"
    berserk:
      name: "Берсерк"
      lore: "<gray><gray>Чем меньше у вас здоровья (ниже половины), тем сильнее удары.</gray></gray>"
    slayer:
      name: "Истребитель"
      lore: "<gray><gray>За каждое убийство дарует прилив силы.</gray></gray>"
    souleater:
      name: "Пожиратель душ"
      lore: "<gray>Убийства участвуют в вашей сытости и здоровье.</gray>"
    stormarrow:
      name: "Грозовая стрела"
      lore: "<gray>Попадание бьёт зарницей и задевает врагов рядом.</gray>"
    explosive:
      name: "Взрывная стрела"
      lore: "<gray>Стрела взрывается (кубики целы, врагам — больно).</gray>"
    sniper:
      name: "Снайперская стрела"
      lore: "<gray>Урон растёт с каждыми десятью пролетевшими блоками.</gray>"
    frostarrow:
      name: "Морозная стрела"
      lore: "<gray>Замораживает цель и замедляет её.</gray>"
    tracer:
      name: "Следящая стрела"
      lore: "<gray>Помеченная цель светится 10 сек.</gray>"
    headhunter:
      name: "Охотник за головами"
      lore: "<gold>Игроки умирают, оставляя голову; по игрокам по ним +15 процентов урона.</gold>"
    retribution:
      name: "Возмездие"
      lore: "<gray>Бьющий вас получает часть удара обратно.</gray>"
    laststand:
      name: "Последний шанс"
      lore: "<gold>На пороге смерти даёт щит и стойкость (редкий трюк).</gold>"
    fortified:
      name: "Крепость"
      lore: "<gray>Уменьшает любой входящий урон.</gray>"
    lightningrod:
      name: "Громоотвод"
      lore: "<gray>Молнии не страшны; её удар даёт скорость.</gray>"
    phoenix:
      name: "Феникс"
      lore: "<gold>Смертельный удар отменяется: воскрешение в пламени (редкий трюк).</gold>"
    iceward:
      name: "Страж льдов"
      lore: "<gray>Нападающие в ближнем бою подмораживаются.</gray>"
    truesight:
      name: "Орлиный глаз"
      lore: "<gray>Видит невидимок поблизости — они вспыхивают.</gray>"
    seer:
      name: "Провидец"
      lore: "<gray>Вечное ночное зрение на носящем.</gray>"
    swiftfeet:
      name: "Стремительные"
      lore: "<gray>Спринт заметно ускоряет шаг.</gray>"
    froggy:
      name: "Лягушачьи лапки"
      lore: "<gray>Дарует выдающуюся прыгучесть.</gray>"
    lavawalker:
      name: "Лавоступ"
      lore: "<gold>Шагайте по лаве: под ногами — магматическая корка.</gold>"
    autosmelt:
      name: "Автоплавка"
      lore: "<gray>Железо/золото/медь и обломки плавятся 1:1; Fortune сохраняется, Silk приоритетен.</gray>"
    veinminer:
      name: "Жилодробитель"
      lore: "<gray>С Shift: до 6/10/14 блоков жилы, с проверкой защиты и износом каждого.</gray>"
    excavator:
      name: "Дробитель"
      lore: "<gray>С Shift: 3×3, II — слой по направлению взгляда; защита и износ каждого блока.</gray>"
    midas:
      name: "Рука Мидаса"
      lore: "<gold>Шанс 10% добавить базовую партию минерала; не Silk, не поставленная руда.</gold>"

    # --- 15 светлых чар (1.4.128) ---
    keen_edge:
      name: "Острый край"
      lore: "<gray>+4–8% к урону оружия.</gray>"
    frenzy:
      name: "Ярость"
      lore: "<gray>На последних сердцах (ниже половины) бьёт заметно сильнее.</gray>"
    plunder:
      name: "Мародёр"
      lore: "<gray>С убитых падает больше добычи.</gray>"
    duelist:
      name: "Дуэлянт"
      lore: "<gray>+8–16% урона по игрокам — для честных дуэлей.</gray>"
    steady_aim:
      name: "Верный прицел"
      lore: "<gray>+8–16% к урону стрел.</gray>"
    quickdraw:
      name: "Скорый выстрел"
      lore: "<gray>Снаряд летит быстрее — цель не успевает уйти.</gray>"
    bulwark:
      name: "Оплот"
      lore: "<gray>+5–9% к броне.</gray>"
    second_skin:
      name: "Вторая кожа"
      lore: "<gray>Любой входящий урон мягче на 4–8%.</gray>"
    vitality:
      name: "Живучесть"
      lore: "<gray>Сердце по капле восстанавливается само.</gray>"
    grounded:
      name: "Устойчивость"
      lore: "<gray>Урон от падения ниже на 10–20%.</gray>"
    lightfoot:
      name: "Лёгкая поступь"
      lore: "<gray>После убийства дарует скорость на несколько секунд.</gray>"
    featherstep:
      name: "Пёрышко"
      lore: "<gray>+4–8% к скорости передвижения.</gray>"
    prospector:
      name: "Старатель"
      lore: "<gray>Спешка, пока инструмент в руке.</gray>"
    fortunate:
      name: "Золотая жила"
      lore: "<gray>Шанс 10/18% добавить базовую партию минерала; с Мидасом не более одной.</gray>"
    scholar:
      name: "Книжник"
      lore: "<gray>+5–11% к получаемому опыту.</gray>"

    # --- 15 проклятий (1.4.128) ---
    dull_blade:
      name: "Тупое лезвие"
      lore: "<red>−5–11% к урону оружия.</red>"
    clumsy_swing:
      name: "Неуклюжий замах"
      lore: "<red>−8–16% к скорости атаки.</red>"
    brittle:
      name: "Хрупкость"
      lore: "<red>Предмет изнашивается на 15–35% быстрее.</red>"
    weak_draw:
      name: "Слабый натяг"
      lore: "<red>−8–16% к урону стрел.</red>"
    sluggish_shot:
      name: "Вялый выстрел"
      lore: "<red>Снаряд летит медленнее.</red>"
    thin_padding:
      name: "Тонкая подкладка"
      lore: "<red>−4–8% к броне.</red>"
    exposed:
      name: "Открытость"
      lore: "<red>+8–16% входящего урона.</red>"
    heavy_hull:
      name: "Тяжёлый корпус"
      lore: "<red>−10–20% к скорости передвижения.</red>"
    fire_prone:
      name: "Боязнь огня"
      lore: "<red>Огонь и лава жгут сильнее и дольше.</red>"
    fragile_bones:
      name: "Хрупкие кости"
      lore: "<red>Урон от падения выше на 10–20%.</red>"
    dull_pick:
      name: "Тупой резец"
      lore: "<red>Усталость при работе инструментом.</red>"
    jinxed:
      name: "Порча"
      lore: "<red>Добыча может рассыпаться в прах.</red>"
    gluttony:
      name: "Обжорство"
      lore: "<red>Голод наступает быстрее.</red>"
    slow_learner:
      name: "Тугодум"
      lore: "<red>−10–25% к получаемому опыту.</red>"
    cursed_blood:
      name: "Проклятая кровь"
      lore: "<red>Раз в пять секунд кровь может отнять полсердца.</red>"
  en.crippling_edge.name: "Подрезание"
  en.crippling_edge.lore:
    - "<gray>Замедление I на 2/3/4 сек., шанс 20/25/30%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 12 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  en.sapping_edge.name: "Изнуряющий клинок"
  en.sapping_edge.lore:
    - "<gray>Слабость I на 2/3 сек., шанс 15/20%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 15 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  en.pinning_shot.name: "Сковывающий выстрел"
  en.pinning_shot.lore:
    - "<gray>Замедление I на 2/3/4 сек., шанс 20/25/30%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 12 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  en.sapping_shot.name: "Изнуряющий выстрел"
  en.sapping_shot.lore:
    - "<gray>Слабость I на 2/3 сек., шанс 15/20%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 15 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  en.briar_guard.name: "Терновый заслон"
  en.briar_guard.lore:
    - "<gray>Замедление I атакующему мобу на 2/3 сек., шанс 15/20%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 15 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  en.faltering_guard.name: "Ослабляющий заслон"
  en.faltering_guard.lore:
    - "<gray>Слабость I атакующему мобу на 2/3 сек., шанс 15/20%.</gray>"
    - "<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>"
    - "<gray>Общая перезарядка новых PvE-чар: 15 сек. после срабатывания.</gray>"
    - "<gray>Имеющийся эффект того же типа не заменяется.</gray>"
  book-rarity: "<dark_gray>✶</dark_gray> <gray>Редкость: %rarity% · максимум %maxlevel%</gray>"
  book-items: "<dark_gray>✶</dark_gray> <gray>Для: %items%</gray>"
  book-conflicts: "<dark_gray>✶</dark_gray> <gray>Несовместимо: %conflicts%</gray>"
  book-apply: "<dark_gray>✶</dark_gray> <gray>Перенос: предмет + книга на наковальне</gray>"
  en.careful_work.name: "Бережная работа"
  en.careful_work.lore:
    - "<gray>Шанс 10/20/30% сберечь 1 ед. износа после разбитого блока.</gray>"
    - "<gray>Перезарядка 8 сек., сохраняется при релоге; не ремонт.</gray>"
    - "<gray>Только работа инструментом; урон, добыча и XP не растут.</gray>"
  en.garden_step.name: "Садовая поступь"
  en.garden_step.lore:
    - "<gray>Не вытаптываете грядки в этих ботинках.</gray>"
    - "<gray>Не ускоряет урожай и не даёт обходить защиту блоков.</gray>"
  en.air_reserve.name: "Запас воздуха"
  en.air_reserve.lore:
    - "<gray>При падении воздуха до 40: +40/60 ед. (базово 2/3 сек.).</gray>"
    - "<gray>Раз в 60 сек., не выше максимума; не бесконечное дыхание.</gray>"
    - "<gray>Нужен тот же шлем; голова должна оставаться под водой.</gray>"
  en.quiet_step.name: "Тихий шаг"
  en.quiet_step.lore:
    - "<gray>При обычной ходьбе не создаётся вибрация шага для скалка.</gray>"
