  en.provoking_strike.name: Провоцирующий удар
  en.provoking_strike.lore:
  - '<gray>После разрешённого ближнего удара: шанс 15/20% переключить цель моба на себя.</gray>'
  - <gray>Только обычный враждебный Monster в 6 блоках, с прямой видимостью.</gray>
  - <gray>Отмена/подмена цели соблюдается; агро не фиксируется, AI не меняется.</gray>
  - '<gray>Общая перезарядка новых PvE-чар: 15 сек. после успеха; не игроки/питомцы/NPC/боссы.</gray>'
  en.signal_guard.name: Сигнальный заслон
  en.signal_guard.lore:
  - '<gray>После разрешённого попадания моба: шанс 15/20% подсветить его на 2/3 сек.</gray>'
  - '<gray>Только враждебные мобы: не игроки, питомцы, NPC или боссы.</gray>'
  - <gray>Свечение любого происхождения не заменяется; уровни брони не складываются.</gray>
  - '<gray>Общая перезарядка новых PvE-чар: 15 сек. после успешного эффекта.</gray>'
