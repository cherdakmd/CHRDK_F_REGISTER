  sources-villager: '<gray>Библиотекарь: %state%. Новый книжный трейд заменяется с шансом %chance% процентов. Только светлые, до III, включая легендарные. Существующие
    трейды не меняются.</gray>'
  sources-mobs: '<gray>Природные уровневые мобы: %state%. Обычный %normal%%, элита %elite%% (потолки 1%/25%). Только светлые; уровни моба 1–9/10–19/20–30: редкость
    до редкой/эпической/легендарной, шанс повышения уровня 5/20/40% на шаг. Последний удар — авторизованный Survival-игрок или его снаряд, не ферма.</gray>'
  sources-footer: '<gray>Настроенные проценты — не гарантия конкретной книги: учитываются доступный пул, пределы чары, мир, прогресс, отмена событий и защита от ферм.
    Админ-выдача не игровой источник. Отчёт ничего не выдаёт и не списывает.</gray>'
