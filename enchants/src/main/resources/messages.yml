  catalog-help: '<gray>Клик: как получать и применять книги. /enchants help</gray>'
  help-unknown: '<yellow>Темы: /enchants help books | anvil | workshop | effects</yellow>'
  help-overview:
  - <gold>Чары CHRDK — справочник</gold>
  - '<gray>Каталог: /enchants; карточка: /enchants info &lt;id&gt;; поиск: /enchants find &lt;текст&gt;.</gray>'
  - '<gray>Книги и источники: /enchants help books; действующие шансы: /enchants sources.</gray>'
  - '<gray>Наложение и цена XP: /enchants help anvil; материалы: /enchants help workshop.</gray>'
  - '<gray>Уровни, проклятия и откаты: /enchants help effects.</gray>'
  - '<gray>Предмет в руке: /enchants inspect; подбор новых чар: /enchants hand.</gray>'
  - '<gray>Каталог и библиотека ничего не выдают. Библиотека найденных книг: /enchants library.</gray>'
  help-books:
  - '<gold>Книги чар: от находки до предмета</gold>'
  - <gray>Кастомная книга содержит ID и уровень чары, типы снаряжения, описание, конфликты и источник.</gray>
  - <gray>Книга в инвентаре не усиливает целевое оружие. Наложите её на совместимый предмет на наковальне.</gray>
  - <gray>Стол может добавить кастомную чару к обычному зачарованию книги или прямо снаряжения.</gray>
  - <gray>Библиотекари и подходящие природные мобы дают светлые книги; проклятия возможны со стола.</gray>
  - '<gray>/enchants sources — текущие шансы. Редкость и уровень — разные вещи: легендарная не означает III.</gray>'
  - '<gray>Книга бывает смешанной: ванильные и несколько кастомных чар. Для переноса должны подходить все.</gray>'
  - <gray>Предмет слева, одна книга справа; /enchants preview — расчёт. При взятии результата книга расходуется.</gray>
  - <gray>Старая книга без метки источника не подделка. /enchants inspect обновит её описание, не уровень/чары.</gray>
  - <gray>Библиотека запоминает найденные книги, но не хранит их и не выдаёт копии. Держите сам предмет.</gray>
  help-anvil:
  - '<gold>Наковальня: совместимость и уровни опыта</gold>'
  - <gray>Слева один целевой предмет, справа одна кастомная книга; результат берите обычным кликом.</gray>
  - <gray>Проверьте тип снаряжения, конфликты и лимиты. Если одна чара книги не подходит, весь перенос отклоняется.</gray>
  - '<gray>Одинаковые ID и уровни: +1 уровень до потолка; разные уровни: больший, не сумма.</gray>'
  - '<gray>Пример: I + I → II, II + I → II. Чистая кастомная книга без улучшения не расходуется.</gray>'
  - '<gray>Доплата за реально усиленные чары: 3 + сумма(вес редкости × итоговый уровень).</gray>'
  - '<gray>Веса: обычная 2, редкая 4, эпическая 7, легендарная 10. Общие 3 добавляются один раз.</gray>'
  - '<gray>Плюс базовая цена наковальни: прежние работы, ванильные чары, переименование. Это уровни XP, не алмазы.</gray>'
  - <gray>/enchants preview показывает актуальные части цены и итоговые уровни; не выдаёт результат.</gray>
  - <gray>Предел «Слишком дорого» снят, полная цена остаётся. Для дорогой операции читайте цену в чате; ЛКМ с пустым курсором. Конфликты не обходятся.</gray>
  - '<gray>Если результата нет: проверьте /enchants inspect, /enchants hand, уровень XP и состав книги.</gray>'
  help-workshop:
  - '<gold>Мастерская: материалы вместо XP</gold>'
  - <gray>Survival, авторизация, закрытый контейнер; один предмет в основной руке. Материалы — обычные, без метаданных.</gray>
  - '<gray>/enchants cleanse &lt;id&gt;: удаляет только указанное проклятие; 8 осколков аметиста + 1 физический алмаз.</gray>'
  - '<gray>/enchants combine: по одной полностью одинаковой чистой кастомной книге в каждой руке.</gray>'
  - <gray>Один ID и одинаковый уровень ниже потолка, без ванильных чар; совпадать должны и метаданные/источник.</gray>
  - <gray>Цена 8 лазурита + 1 физический алмаз; две книги превращаются в одну с уровнем +1.</gray>
  - '<gray>/enchants split &lt;id&gt;: смешанная книга в основной руке; 1 обычная книга + 8 лазурита и место.</gray>'
  - <gray>Выбранная чара переносится в новую книгу; прочие кастомные/ванильные остаются. Из снаряжения не извлекается.</gray>
  - <gray>Сначала получите условия, затем /enchants confirm &lt;код&gt; в течение 30 сек. До подтверждения расхода нет.</gray>
  - <gray>Не меняйте инвентарь, руки и слот. Выход, смерть, TP, закрытие окна или reload отменяют предложение.</gray>
  - <gray>Мастерская может быть выключена администрацией; баланс /bal вместо материалов не списывается.</gray>
  help-effects:
  - <gold>Как читать чары и проклятия</gold>
  - <gray>I/II/III — уровень самой чары; Скорость II и Спешка II — уровни отдельных зельевых эффектов.</gray>
  - <gray>10/15/20% означает значение для I/II/III, не сумму. 1 сердце = 2 единицы HP/урона.</gray>
  - <gray>Редкость влияет на выбор из пула, лимит легендарных и цену, но не заменяет описание действия.</gray>
  - <gray>На оружии нужен правильный слот, броня должна быть надета. Ауры требуют действующего источника.</gray>
  - <gray>Лучший уровень брони и сумма копий — не одно и то же; правило зависит от конкретной чары.</gray>
  - '<gray>Новые PvE-контроль и утилиты имеют свои ограничения: не обещают действие на игроков, питомцев и боссов.</gray>'
  - <gray>/enchants guard — приоритет PvE-защиты; /enchants cooldowns — общие таймеры PvE, работы и воздуха.</gray>
  - '<gray>Нулевой таймер не гарантирует эффект: остаются шанс, цель и условия. Это не список всех старых откатов.</gray>'
  - <gray>Проклятия занимают места на предмете. На наковальне не снимаются; /enchants help workshop — очищение.</gray>
  - '<gray>Новая выдача: Нет — не обещание удаления старой чары. Настройки источников и эффектов проверяются отдельно.</gray>'
