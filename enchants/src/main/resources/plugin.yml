name: CHRDK_Enchants
version: ${version}
main: ru.cherdakmd.chrdkenchants.EnchantsPlugin
api-version: '26.3'
description: "30 кастомных эпичных чар CHRDK: стол зачарований и жители-библиотекари"
author: cherdakmd
depend: [CHRDK_F_REGISTER]
commands:
  enchants:
    description: Список кастомных чар и их описания
    aliases: [cenchant]
  enchantsadmin:
    description: Управление чарами (выдача книг, перезагрузка)
    permission: chrdkenchants.admin
permissions:
  chrdkenchants.use:
    description: Просмотр чар и получение их в игре
    default: true
  chrdkenchants.admin:
    description: Администрирование чар
    default: op
