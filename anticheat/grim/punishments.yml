# Эталон punishments.yml для Grim AC 2.x (CHRDK). См. docs/design/ANTICHEAT.md.
#
# Каждое срабатывание уходит в CHRDK_Anticheat консольной командой
#   chrdkac flag %player% %check_name% %vl% %verbose%
# — это запись в журнал доказательств flags.jsonl и алерты модераторам.
# Иные команды (штрафы, кики, баны) не предусмотрены: запрет выносит человек.
#
# ВАЖНО: проверки, не попавшие ни в одну группу, Grim НЕ включает.
# Группы ниже покрывают все проверки Grim 2.x ровно один раз: попадание
# в две группы дало бы два журнальных записи на один флаг.
#
# Формат команды: «порог:интервал команда». Порог — активный уровень
# нарушений внутри окна remove-violations-after (секунд); интервал > 0
# повторяет команду через каждые интервал нарушений после порога;
# интервал 0 — один раз при достижении порога.

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
      - "Phase"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "!VehicleTimer"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "1:1 chrdkac flag %player% %check_name% %vl% %verbose%"
