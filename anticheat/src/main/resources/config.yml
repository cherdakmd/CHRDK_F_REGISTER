# CHRDK_Anticheat — мост античита (docs/design/ANTICHEAT.md).
# Детекцию ведёт внешний Grim AC: его punishments.yml исполняет chrdkac flag
# на каждом срабатывании. Модуль пишет журнал доказательств и алертит модераторам.
general:
  # false — журнал и алерты моста выключены (команда детектора отвечает "выключен").
  enabled: true
  # Язык сообщений модуля из messages.yml.
  locale: ru

alerts:
  # Не чаще одного алерта на пару «игрок+чек» за это окно, секунды (1..3600).
  # В журнал пишется каждый флаг — окно ограничивает только шум в чате.
  throttle-seconds: 10

journal:
  # Сколько суток хранить архивы flags-YYYYMMDD.jsonl (1..365).
  keep-days: 30
