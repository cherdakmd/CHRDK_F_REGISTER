# CHRDK_Pets — питомцы из ванильных кошек и волков.
#
# Модуль не спавнит новых существ: он подбирает уже приручённых кошек и волков
# (включая приручённых до установки плагина) и ведёт им уровень, кличку и бонусы.
# Прогресс хранится в pets.json по UUID сущности, поэтому один игрок может держать
# сколько угодно питомцев, и прогресс между ними не путается.
#
# Принцип репозитория: никакого pay-to-win. Уровни не покупаются и не продаются,
# опыт не продаётся, бонусы дают только сами питомцы, которых игрок приручил.

general:
  # Главный выключатель. При false модуль не принимает питомцев, не даёт опыт
  # и снимает бонусы; данные при этом сохраняются.
  enabled: true
  # Язык сообщений: messages.yml с тем же суффиксом (ru, en).
  locale: ru
  # Как часто пересчитывать ауру хозяина, в тиках. 20 тиков = раз в секунду.
  # Меньше 10 ставить не нужно: аура — не боевой эффект с точным таймингом.
  refresh-ticks: 20
  # Как часто сохранять pets.json на диск, в секундах. Запись идёт асинхронно;
  # при выключении сервера файл сохраняется принудительно.
  save-interval-seconds: 60
  # Радиус действия ауры хозяина (в блоках). Питомец дальше этого расстояния
  # бонусов не даёт.
  owner-radius: 8
  # Радиус, в котором питомец считается «рядом» для опыта за бой и рыбалку.
  xp-radius: 12
  # Сколько строк показывает /pet top.
  top-size: 10

# Бонусы видов. Все величины — «за каждый уровень выше первого», поэтому на
# первом уровне питомец ровно такой, каким его приручили. max-* — жёсткий
# потолок: потолки не дают ни опечатке в конфиге, ни правке админа превратить
# питомца в рейд-босса.
species:
  wolf:
    enabled: true
    # +2 HP за уровень, но не больше +18 (десятый уровень).
    health-per-level: 2.0
    max-health-bonus: 18.0
    # +0.25 урона за уровень, но не больше +2.25.
    damage-per-level: 0.25
    max-damage-bonus: 2.25
    # +0.4 % скорости за уровень, но не больше +3.6 %.
    speed-percent-per-level: 0.4
    max-speed-percent: 3.6
    # Аура хозяину: +0.3 % скорости за уровень, но не больше +2.7 %.
    owner-speed-percent-per-level: 0.3
    max-owner-speed-percent: 2.7
    # Волк удачу не даёт; ключ оставлен для единообразия с кошкой.
    owner-luck-per-level: 0.0
    max-owner-luck: 0.0
  cat:
    enabled: true
    # +1 HP за уровень, но не больше +9.
    health-per-level: 1.0
    max-health-bonus: 9.0
    # Кошки не дерутся: урон намеренно не растёт.
    damage-per-level: 0.0
    max-damage-bonus: 0.0
    # +0.35 % скорости за уровень, но не больше +3.15 %.
    speed-percent-per-level: 0.35
    max-speed-percent: 3.15
    # Скорость хозяину кошка не даёт.
    owner-speed-percent-per-level: 0.0
    max-owner-speed-percent: 0.0
    # Аура хозяину: +0.1 удачи за уровень, но не больше +0.9.
    # Удача влияет на рыбалку и добычу, но не на урон.
    owner-luck-per-level: 0.1
    max-owner-luck: 0.9

levels:
  # Максимальный уровень питомца. Больше 10 не рекомендуется: кривая линейная,
  # и дальше прокачка начинает ощущаться как вторая работа.
  max-level: 10
  # Опыт за переход с 1-го уровня на 2-й.
  xp-base: 40
  # Прибавка к стоимости следующего уровня за каждый уровень.
  # При base=40 и growth=25 стоимость шагов: 40, 65, 90, ..., 240.
  xp-growth: 25

xp:
  # Волк сам добил враждебного моба (Monster). Животные, игроки и чужие
  # питомцы опыта не дают — иначе ближайшая ферма кур стала бы вечной прокачкой.
  kill: 8
  # Хозяин добил враждебного моба, питомец был рядом (general.xp-radius).
  assist: 5
  # Хозяин поймал рыбу, питомец был рядом.
  fish: 6
  # Хозяин проспал ночь, питомец был рядом: утренняя награда.
  sleep: 25
  # Множитель «уютных» событий для кошки (рыбалка, сон, помощь в бою).
  # Кошки не дерутся, поэтому основной опыт приходит из мирных занятий.
  cat-multiplier: 1.5
  # Потолок опыта на одного питомца в минуту. 0 — без ограничения.
  # Защита от ферм: 120 в минуту — это 15 убийств мобов, быстрее не выйдет.
  max-per-minute: 120

names:
  # Минимальная и максимальная длина клички после очистки.
  min-length: 2
  max-length: 16
  # Показывать уровень в имени над головой: «Барсик · ур. 5».
  # При false остаётся только кличка.
  show-level: true

storage:
  # Сколько дней хранить память о погибших питомцах в /pet list.
  # 0 — удалять сразу; 30 — месяц истории.
  keep-dead-days: 30
