# CHRDK_Pets — питомцы из ванильных кошек и волков.
#
# Модуль не спавнит новых сущностей: он «подбирает» уже приручённых кошек и
# волков (в том числе приручённых до установки) и ведёт им уровень, кличку и
# бонусы. Прогресс живёт в pets.json по UUID сущности, уровень выводится из
# опыта — менять кривую можно без миграции.
#
# Чего здесь нет и не будет: продажи питомцев и опыта за деньги. Питомца можно
# только приручить и вырастить самому — это правило «не продаём силу».
general:
  # Главный выключатель. false — приём и опыт останавливаются, бонусы и аура
  # снимаются; данные питомцев сохраняются.
  enabled: true
  locale: ru
  # Раз в сколько тиков пересчитывается аура хозяина (5..200). 20 тиков — раз
  # в секунду: игрок успевает отойти, а лишней нагрузки нет.
  refresh-ticks: 20
  # Как часто писать pets.json на диск, секунды (5..3600). Запись асинхронная,
  # при выключении сервера файл сохраняется принудительно.
  save-interval-seconds: 60
  # Радиус, в котором /pet находит питомца для карточки и переименования.
  interact-radius: 8
  # Радиус, в котором питомец должен быть рядом, чтобы получить опыт за убийство
  # хозяином, рыбалку и утренний сон.
  xp-radius: 12
  # Радиус ауры: бонус хозяину работает, только пока питомец ближе этого.
  # Аура берётся от ОДНОГО ближайшего питомца и не складывается.
  owner-radius: 8
  # Сколько строк в /pet top (3..50).
  top-size: 10

# Кривая уровней: опыт за переход с уровня L на L+1 = base-xp + growth * (L - 1).
# При base-xp 40 и growth 25 первый уровень стоит 40 опыта, девятый — 240,
# весь путь 1..10 — 1 260 опыта. Это несколько вечеров активной игры.
levels:
  # Максимальный уровень питомца (2..100).
  max-level: 10
  base-xp: 40
  growth: 25

# Опыт за события. Значения — до видового множителя; кошка получает
# cat-multiplier на «уютные» события (рыбалка, сон, помощь в бою).
xp:
  # Волк сам добил враждебного моба.
  per-kill: 8
  # Хозяин добил враждебного моба, питомец был рядом (xp-radius).
  per-assist: 5
  # Хозяин поймал рыбу, питомец был рядом.
  per-fish: 6
  # Утро после сна: питомец спал рядом с кроватью.
  per-sleep: 25
  # Видовой множитель кошки. 1.0 — сравнять виды, 2.0 — удвоить.
  cat-multiplier: 1.5
  # Потолок опыта на питомца в минуту (0 — без потолка). Защита от ферм:
  # 120 — это максимум 15 убийств мобов в минуту.
  max-per-minute: 120

# Бонусы видов. Все прибавки считаются «за уровень выше первого» и упираются
# в max-*: даже опечатка в конфиге не сделает из волка рейд-босса.
#
# Волк — боевой: здоровье, урон, скорость; хозяину — немного скорости.
# Кошка — уютная: здоровье и скорость; хозяину — удача (рыбалка и добыча).
species:
  wolf:
    enabled: true
    # Базовое здоровье ванильного волка — 20 (10 сердец). Менять только если
    # на сервере уже есть другой плагин, меняющий базу.
    base-health: 20
    # +2 HP за уровень, но не больше +18 к 10-му уровню.
    health-per-level: 2.0
    max-health-bonus: 18.0
    # +0.25 урона за уровень, но не больше +2.25.
    damage-per-level: 0.25
    max-damage-bonus: 2.25
    # +0.4% скорости за уровень, но не больше +3.6%.
    speed-percent-per-level: 0.4
    max-speed-percent: 3.6
    # Аура хозяину: +0.3% скорости за уровень, но не больше +2.7%.
    owner-speed-percent-per-level: 0.3
    max-owner-speed-percent: 2.7
    # Волк удачу не даёт: оставлено нулём для единообразия секций.
    owner-luck-per-level: 0.0
    max-owner-luck: 0.0
  cat:
    enabled: true
    # Базовое здоровье ванильной кошки — 10 (5 сердец).
    base-health: 10
    # +1 HP за уровень, но не больше +9.
    health-per-level: 1.0
    max-health-bonus: 9.0
    # Кошка не дерётся — урон не растёт.
    damage-per-level: 0.0
    max-damage-bonus: 0.0
    # +0.35% скорости за уровень, но не больше +3.15%.
    speed-percent-per-level: 0.35
    max-speed-percent: 3.15
    # Скорость хозяину кошка не даёт.
    owner-speed-percent-per-level: 0.0
    max-owner-speed-percent: 0.0
    # Аура хозяину: +0.1 удачи за уровень, но не больше +0.9.
    owner-luck-per-level: 0.1
    max-owner-luck: 0.9

names:
  # Минимальная и максимальная длина клички (1..32).
  min-length: 2
  max-length: 16
  # Показывать уровень в имени над головой: «Барсик · ур. 5».
  # false — показывать только кличку (уровень виден в /pet).
  show-level: true

storage:
  # Сколько дней хранить память о погибших питомцах (0..3650).
  # 0 — удалять сразу, 30 — месяц истории в /pet list.
  keep-dead-days: 30
