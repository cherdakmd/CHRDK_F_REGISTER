  # Главное GUI охоты · RC.4
  menu-main-back: "<yellow>В главное меню охоты</yellow>"
  menu-wild-lore: "<gray>Шесть редких разновидностей.\nВстречи, победы, контрприёмы и трофеи-записи.\n<yellow>Нажмите, чтобы открыть журнал.</yellow></gray>"
  menu-moon-open: "<yellow>Нажмите: статус, правила и безопасные места.</yellow>"
  menu-guide: "<aqua>Как устроена охота</aqua>"
  menu-guide-open: "<gray>Уровни, элиты, разновидности и награды.\n<yellow>Открыть справку без команд в чате.</yellow></gray>"
  menu-guide-lore: "<gray>Выберите раздел главного меню.\nВ лавке, сундуках и обмене действуют обычные цены.\nПолнолуние и дикие биомы не требуют новой валюты.</gray>"
  menu-guide-combat: "<gold>Опасность и боевые подсказки</gold>"
  menu-guide-combat-lore: "<gray>Уровни обычных мобов зависят от местности\nи развития игроков. Элиты встречаются редко.\nДикие разновидности не совмещаются с элитами.\nСмотрите подготовку манёвра и используйте укрытие.\nКнопка HUD в главном меню переключает подсказки;\nобщий выключатель сервера имеет приоритет.\nЗа спавнеры, яйца и командных мобов\nохотничьих наград по стандартным правилам нет.</gray>"
  menu-hud: "<aqua>Боевые подсказки · HUD</aqua>"
  menu-hud-toggle: "<yellow>Нажмите, чтобы переключить. Наблюдения сохраняются независимо от HUD.</yellow>"
  menu-moon-safety: "<green>Где безопасно</green>"
  menu-moon-safety-lore: "<gray>Приваты и зона спавна защищены.\nНашествие направлено на активных игроков выживания.\nВ шахтах и закрытых комнатах зомби не появляются.\nОни не подбирают вещи и не ломают двери/блоки.</gray>"
  menu-moon-sleep: "<light_purple>Можно ли пропустить ночь?</light_purple>"
  menu-moon-sleep-lore: "<gray>Перед опасной ночью появляется предупреждение.\nТолько эту ночь нельзя пропустить сном.\nКровать остаётся доступной для точки возвращения.\nОбычные ночи не меняются.</gray>"
  menu-moon-waves: "<gold>Ограниченные волны</gold>"
  menu-moon-waves-lore: "<gray>Небольшие порции, общий и личный лимиты.\nТолько загруженные чанки, без генерации мира.\nПри нагрузке новый спавн приостанавливается;\nдлительная перегрузка завершает нашествие.\nДобычи, XP и прогрессии за этих зомби нет.</gray>"
  menu-moon-dawn: "<yellow>Что будет на рассвете</yellow>"
  menu-refresh: "<aqua>Обновить статус</aqua>"
  menu-refresh-lore: "<gray>Показать текущее состояние и число зомби.\nБез фонового автообновления и дополнительных таймеров.</gray>"
  menu-hud-state: "<gray>Состояние: %state%</gray>"
  help-gui: "<yellow>/hunt · /hunt gui · /hunt menu</yellow> <gray>— главное меню всех разделов охоты</gray>"
