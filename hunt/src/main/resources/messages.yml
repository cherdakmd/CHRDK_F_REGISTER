  wild-info-lore: "<gray>Большинство противников обычные. У редких — один манёвр,\nбез увеличения здоровья и наложения элиты.\nВстреча: бой или /hunt wild, глядя на моба с 16 блоков.\nПобеда открывает памятную запись-трофей, не предмет/валюту.\nОбычная добыча Hunt и задания по типу моба сохраняются.</gray>"
