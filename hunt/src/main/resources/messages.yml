  player-only: "<red>Эта команда только для игроков.</red>"
  disabled: "<red>Охота выключена в config.yml.</red>"
  unknown-subcommand: "<red>Неизвестная подкоманда «%sub%». Смотрите <yellow>/hunt help</yellow>.</red>"

