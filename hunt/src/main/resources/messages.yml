  help-stats: "<yellow>/hunt stats [ник]</yellow> <gray>— кошелёк, звание и осколки</gray>"
  help-shop: "<yellow>/hunt shop</yellow> <gray>— лавка за монеты</gray>"
  help-buy: "<yellow>/hunt buy <id> [кол-во]</yellow> <gray>— купить позицию лавки</gray>"
  help-exchange: "<yellow>/hunt exchange <алмазы|max></yellow> <gray>— обменять монеты на алмазы</gray>"
