  help-shop: "<yellow>/hunt shop</yellow> <gray>— лавка за монеты</gray>"
  help-buy: "<yellow>/hunt buy <id> [кол-во]</yellow> <gray>— купить позицию лавки</gray>"
  help-exchange: "<yellow>/hunt exchange <алмазы|max></yellow> <gray>— обменять монеты на /bal</gray>"
  help-keys: "<yellow>/hunt keys</yellow> <gray>— ключи и сундуки семейств</gray>"
  help-chest: "<yellow>/hunt chest <семейство></yellow> <gray>— открыть сундук за ключ</gray>"
  help-bestiary: "<yellow>/hunt bestiary [раздел|claim <раздел>]</yellow> <gray>— журнал видов и награды разделов</gray>"
