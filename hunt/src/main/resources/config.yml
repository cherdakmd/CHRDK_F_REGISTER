# CHRDK_Hunt — охота на мобов: монеты, осколки пяти семейств, трофеи и ключи.
#
# Монеты и осколки — это кошелёк в hunt.json, а не предметы: их нельзя потерять
# при смерти, нельзя передать другому игроку и нельзя продублировать.
# Ванильный дроп (кость, кожа, порох и т.п.) падает обычными вещами.
#
# Антифарм: мобы со спавнера, из яйца и созданные командой добычи не дают.
# Поэтому охота — это поход в мир, а не ферма на участке.
#
# Монеты тратятся в лавке и меняются на алмазы у скупщика с суточным потолком:
# именно потолок не даёт охоте заменить шахту и разогнать экономику.
#
# Неизвестный материал или моб пропускается с предупреждением в лог, а не
# роняет плагин. Все числа зажимаются в безопасные границы.

general:
  # Главный выключатель: false — добыча не начисляется, кошельки сохраняются.
  enabled: true
  locale: ru
  # Сколько строк в /hunt top (3..50).
  top-size: 10
  # Показывать строку с добычей в экшен-баре.
  actionbar: true
  # Миры, где охота выключена (например, творческий или тестовый).
  disabled-worlds: []

limits:
  # Сколько монет можно заработать за календарные сутки UTC (0 — без лимита).
  # Осколки и ключи этим лимитом не ограничены: они и так падают по шансу.
  coins-per-day: 2000
  # Сколько алмазов можно получить за монеты за сутки UTC (0 — обмен закрыт).
  # Это главный потолок экономики: 8 алмазов в сутки.
  exchange-per-day: 8
  # Курс: сколько монет стоит один алмаз (1..100000).
  coins-per-diamond: 40
  # Минимальный обмен в алмазах. Клик по алмазу в меню меняет ровно столько.
  exchange-min: 1

anti-farm:
  # Мобы со спавнера (обычного и испытательного) не дают добычи.
  block-spawners: true
  # Мобы из яйца призыва и выброшенного яйца не дают добычи.
  block-eggs: true
  # Мобы, созданные командой (в том числе /summon), не дают добычи.
  block-command: true

