# Звания охотника по монетам, заработанным за всё время. Текст звания — в
# messages.yml, ключи rank.*. Звание даёт только статус и открывает позиции
# лавки с порогом min-coins-earned.
ranks:
  0: novice
  300: tracker
  1200: hunter
  4000: master
  10000: legend

# Природные враждебные мобы: уровень 1–30 фиксируется при появлении.
# Мир/каждые 1024 блока от спавна задают диапазон, Skills ближайшего
# авторизованного игрока Survival (128 блоков) уточняет уровень внутри него.
# Без Skills используется минимум зоны; NPC, боссы, питомцы, спавнеры исключены.
# Свои множители ограничены: здоровье x2.5, урон x1.5, скорость x1.10.
# Монеты, опыт, осколки и ключи НЕ умножаются.
mob-progression:
  enabled: true
  # Только action bar по попаданию, не чаще одного раза в 2 секунды.
  hud: true
  # 0–5%; элита лишь дальше 512 блоков и при суммарном Skills >= 50.
  # Стойкий: здоровье, яростный: урон, стремительный: скорость, бронированный: броня.
  elite-chance-percent: 2
  # Четвёртый вариант в том же общем шансе элиты (не дополнительный бросок).
  # До +4 единиц брони, не выше 12 с учётом уже имеющейся брони.
  # Выключение снимает только наш бонус; уровень/вариант существующего моба сохраняется.
  armored-elite: true

  # N10: пятый вариант ВНУТРИ общего шанса элиты, не дополнительный бросок.
  # Только после фактического урона авторизованного Survival-игрока (прямой удар/снаряд).
  # После подтверждения — задержка; затем native-лечение с возможностью отмены другими плагинами.
  # Попытки и cooldown хранятся в PDC моба, не сбрасываются выгрузкой/reload/restart.
  recovery:
    enabled: true
    # 1–5 секунд после проверки попадания на следующем тике.
    delay-seconds: 2
    # Не ниже 10, не выше 60 секунд; отсчёт с попытки лечения.
    cooldown-seconds: 10
    # 1–3 попытки за жизнь моба; отмена RegainHealthEvent тоже расходует попытку.
    max-attempts: 3
    # 0.5–3 HP, дополнительно ограничено процентом максимального HP и недостающим здоровьем.
    heal-hp: 3
    # 1–8%; при NaN/Infinity берётся 8. 1 сердце = 2 HP.
    max-health-percent: 8

  # N11: шестой вариант в ПРЕЖНЕМ общем шансе элиты, только допустимые наземные типы.
  # Подтверждённое native-агро на игрока либо новое попадание уже преследуемого игрока.
  # Без телепорта/velocity/новой цели; на земле, не в воде/лаве/транспорте, видимость и 2–12 блоков.
  dash:
    enabled: true
    # 10–30 тиков (20 = одна секунда при 20 TPS); повторные события не продлевают эффект.
    duration-ticks: 20
    # 10–60 секунд; следующий срок в PDC, не сбрасывается выгрузкой/reload/restart.
    cooldown-seconds: 12
    # Целевой суммарный множитель CHRDK (уровень + всплеск), не +10% поверх уровня.
    # 1.01–1.10; NaN/Infinity -> 1.10. Если уровень уже достиг значения, всплеска нет.
    # Чужие эффекты/модификаторы и базовая скорость не переписываются.
    speed-multiplier: 1.10

  # N12: седьмой вариант ВНУТРИ прежнего шанса элиты, без иммунитета/постоянной брони.
  # После фактической потери HP запоминает тип (ближний/снаряд) и игрока на короткое окно.
  # Один следующий удар этого типа от того же подходящего игрока уменьшает БАЗОВЫЙ урон.
  # Броня/поглощение пересчитываются штатным Bukkit; это не фиксированный процент конечной потери HP.
  tactics:
    enabled: true
    # 40–100 тиков: окно не продлевается попаданиями, другой тип/игрок защиту не запускает.
    window-ticks: 60
    # 10–60 секунд от реакции, затем нужен новый подтверждённый удар для подготовки.
    cooldown-seconds: 12
    # 1–3 реакции за жизнь; PDC не очищается unload/reload/restart.
    max-reactions: 3
    # 5–15% базового урона; NaN/Infinity -> 10%. Первый подтверждённый удар не снижается.
    # Поздняя отмена/перезапись после HIGHEST сохраняется и не возвращает потраченный бюджет.
    reduction-percent: 10

  # N13: восьмой вариант в прежнем общем шансе, только наземные типы с обычным goal-selector.
  # Подтверждённый урон преследуемого Survival-игрока при низком HP; 10 тиков на приземление.
  # Временный MOVE-goal, обычная скорость 1.0, без TP/velocity/смены цели/ломания блоков.
  # Только ровный безопасный пол с воздухом в исходном чанке; если пути нет, попытка не гарантирует движение.
  retreat:
    enabled: true
    # 15–30% текущего максимального HP; NaN/Infinity -> 25%.
    health-percent: 25
    # 20–40 тиков со времени установки goal; нет продления/перепрокладки пути по ударам.
    duration-ticks: 30
    # 3–5 блоков до точки, NaN/Infinity -> 4; текущий чанк не покидается заданным маршрутом.
    distance: 4
    # 10–60 секунд от начала попытки поиска, даже при заблокированном пути.
    cooldown-seconds: 15
    # 1–2 попытки за жизнь, бюджет в PDC до поиска; unload/reload/restart не обнуляют.
    max-attempts: 2

  # N19: опциональная защита новичка, только ПЕРВОЕ природное появление моба.
  # Любой авторизованный Survival-игрок с правом chrdkhunt.use в прямой видимости
  # и радиусе (3D) уменьшает уровень до минимума региона и исключает элиту.
  # Работает и в смешанной группе, когда ближайший игрок — ветеран.
  # Не ослабляет существующих мобов, не меняет награды/агро/приват и не делает Энд безопасным.
  newcomer-protection:
    enabled: false
    # Суммарный уровень CHRDK_Skills: 10–50; при недоступном Skills считается 10.
    max-skill-total: 20
    # Радиус в блоках: 4–24; NaN/Infinity заменяются на 16.
    radius: 16

  # N18: локальная группа видимых авторизованных Survival-игроков, не party/гильдия.
  # Среднее суммы Skills ближайших участников; минимум двое, иначе прежний ближайший.
  # Меняет только новый уровень внутри диапазона региона. Шанс элиты по-прежнему
  # зависит от ближайшего игрока; защита новичка N19 имеет приоритет над группой.
  group:
    enabled: false
    # 4–32 блока (3D), нечисловое значение -> 24.
    radius: 24
    # 2–8 ближайших; равное расстояние разрешается по UUID.
    max-members: 8
  # N21: тихая личная история последних 20 природных уровневых мобов.
  # Только прямой удар/снаряд авторизованного Survival-игрока и финальная смерть.
  # Выключение останавливает запись, но не удаляет старую историю /hunt history.
  history:
    enabled: true

# 1.4.213: reload проверяет config.yml + сообщения до смены рабочего снимка.
# Ошибка YAML/типа/чтения сохраняет прежние настройки, GUI и ожидающие операции.
# Успешный reload закрывает старые меню и очищает устаревшие задачи, но не PDC/data.
# Для первого запуска нужен корректный конфиг: молчаливого старта со стоком при ошибке нет.
