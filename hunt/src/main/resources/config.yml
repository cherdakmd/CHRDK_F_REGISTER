# Бестиарий — журнал убитых видов. Раздел = семейство, вид = моб из секции mobs.
# Отдельный список мобов здесь не нужен: добавили моба в mobs — он появился в
# журнале. Награда выдаётся один раз за закрытый раздел (убит каждый его вид)
# и не входит в суточный потолок монет: это разовая награда, а не фарм.
#   sections.<семейство> — coins/shards/keys: что дать за закрытие раздела;
#   icons.<ТИП_МОБА> — иконка в меню (по умолчанию голова моба или яйцо призыва);
#   full-coins — разовая награда за все закрытые разделы;
#   enabled: false — меню бестиария выключено, счётчики не ведутся.
bestiary:
  enabled: true
  full-coins: 1500
  sections:
    undead:
      coins: 150
      shards: 10
      keys: 1
    beasts:
      coins: 150
      shards: 10
      keys: 1
    arthropods:
      coins: 100
      shards: 8
      keys: 1
    nether:
      coins: 200
      shards: 12
      keys: 1
    end:
      coins: 250
      shards: 12
      keys: 1
  # Иконки можно переопределить, если голова моба смотрится неудачно:
  # icons:
  #   ZOMBIE: ROTTEN_FLESH
  #   ENDER_DRAGON: DRAGON_BREATH

