    unavailable: '<red>Лот уже продан, истёк, не ваш или принадлежит вам. Обновите меню.</red>'
    no-diamonds: '<red>Для покупки нужно %price% 💠: сначала /bal, затем обычные алмазы, руда или блоки из слотов хранения. Именованные предметы и вторая рука не расходуются.</red>'
    bought: '<green>Лот #%id% куплен. Товар: /ah mail → /ah claim %id%. Сдача %change% 💠 зачислена в /bal.</green>'
    cancelled: '<yellow>Лот #%id% снят. Предмет возвращён в /ah mail.</yellow>'
    claimed: '<green>Предмет #%id% получен.</green>'
    full: '<yellow>Освободите место в инвентаре. Предмет остаётся в почтовом ящике.</yellow>'
    no-mail: '<yellow>Почтовый ящик пуст.</yellow>'
    mail-line: '<gray>Посылка #%id% — %item% × %amount%. /ah claim %id%</gray>'
    balance: '<gold>Общий личный счёт /bal: %balance% 💠. Выручка уже здесь; /ah money больше не выдаёт предметы. Снятие — /bal withdraw.</gold>'
