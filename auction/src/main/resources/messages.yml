    mine-title: '<gold>Мои лоты — нажмите для снятия</gold>'
    mail-title: '<gold>Почта — нажмите для получения</gold>'
    confirm-title: '<gold>Подтверждение покупки</gold>'
    confirm: '<green>Купить за %price% 💠</green>'
    back: '<yellow>Назад</yellow>'
    prev: '<yellow>Предыдущая страница</yellow>'
    next: '<yellow>Следующая страница</yellow>'
    mine: '<aqua>Мои лоты</aqua>'
    mail: '<aqua>Почтовый ящик</aqua>'
    money: '<gold>Личный счёт /bal: %balance% 💠</gold>'
    help: '<gray>/ah sell <цена> — продать предмет из руки</gray>'
    lot-lore: '<gray>#%id% · %seller% · %price% 💠 · комиссия %fee% 💠 · осталось %hours% ч.</gray>'
    click-buy: '<yellow>Нажмите для подтверждения покупки</yellow>'
    click-cancel: '<yellow>Нажмите, чтобы снять свой лот</yellow>'
    parcel-lore: '<yellow>Посылка #%id% — нажмите для получения</yellow>'
    finance-unavailable: '<red>Банк/миграция/квитанция недоступны или несовместимы. Сделка остановлена, источник старой выручки сохранён. Проверьте /bal и обратитесь к администратору.</red>'
    seller-unavailable: '<red>Старая выручка продавца пока не перенесена: предел счёта или недоступный банк. Лот сохранён, деньги не списаны.</red>'
    finance-refused: '<red>Банк отклонил сделку: недостаточно средств либо достигнут предел счёта покупателя/продавца. Предметы не изменены, лот сохранён.</red>'
    sold: '<green>Лот #%id% продан. После комиссии %money% 💠 зачислено в общий /bal.</green>'
