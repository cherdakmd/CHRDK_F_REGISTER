    error: '<red>Сбой хранения. Торговля могла быть приостановлена; администратору: /ahadmin status. Не повторяйте выдачу вручную без проверки журнала.</red>'
    recovery: '<red>Есть незавершённая операция аукциона. Новые сделки заблокированы до восстановления.</red>'
    recovery-kick: '<red>Незавершённая предметная операция аукциона. После входа проверятся банк и снимки; если банк недоступен или данные расходятся, обратитесь к администратору.</red>'
    recovered: '<green>Незавершённая операция восстановлена: банковская оплата проверена по квитанции, предметная часть — по снимкам.</green>'
    admin-usage: '<gray>/ahadmin reload; /ahadmin status; /ahadmin recover — проверить онлайн-владельца незавершённой операции</gray>'
    reloaded: '<green>Конфигурация аукциона перечитана. Уже выставленные цены и комиссии не изменились.</green>'
    status: '<gray>Активных лотов: %count%. Журнал: %pending%.</gray>'
    recover-offline: '<yellow>Владелец операции оффлайн или не авторизован. Он должен войти; автоматическая проверка пройдёт после /login.</yellow>'
