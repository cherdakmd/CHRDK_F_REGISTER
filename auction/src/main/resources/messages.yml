messages:
  auction:
    usage: '<gray>/ah — рынок; /ah sell <цена> — весь стак из руки; /ah mine; /ah mail; /ah money; /ah claim <id>; /ah buy <id> confirm; /ah cancel <id></gray>'
    auth: '<red>Сначала завершите вход на сервер.</red>'
    permission: '<red>Нет права пользоваться этой командой.</red>'
    player-only: '<red>Команда доступна только игроку.</red>'
    mode: '<red>Торговля доступна в выживании и приключении, не в Creative/Spectator.</red>'
