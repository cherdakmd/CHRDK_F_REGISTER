    empty: '<red>Возьмите предмет в основную руку.</red>'
    blocked: '<red>Этот предмет нельзя выставить, либо его данные слишком велики.</red>'
    price: '<red>Цена за весь стак должна быть от %min% до %max% алмазов.</red>'
