# Оплата: сначала общий /bal, затем обычные DIAMOND/DIAMOND_ORE/DEEPSLATE_DIAMOND_ORE (1)
# и DIAMOND_BLOCK (9) из storage. Выручка после комиссии и сдача — на /bal.
# Отдельного расходуемого баланса нет. Старый money заморожен как once-import источник.
# Нужен CHRDK_Core API 15+. При сбое банка fallback к выдаче алмазов запрещён.
# CHRDK_Auction — обычные алмазы, НЕ Vault и НЕ реальные деньги.
market:
  min-price: 100
  max-price: 100000
  # Комиссия фиксируется при выставлении; округление ВВЕРХ до целого алмаза.
  fee-percent: 10
  duration-hours: 48
  # Лимит лотов по ступени ранга (1.4.167): [без ранга, I..V]. Пусто — max-per-player.
  rank-lots: [10, 12, 15, 18, 24, 30]
  max-per-player: 10
  max-active-lots: 500
  # Ошибка в имени материала отключит аддон вместо незаметного разрешения предмета.
  blocked-materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW]
