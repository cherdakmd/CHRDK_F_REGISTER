plugins { id 'java' }

group = project.maven_group
version = project.plugin_version
base { archivesName = 'chrdk-custom-items' }
repositories {
    mavenCentral()
    maven { url = 'https://repo.purpurmc.org/snapshots' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    compileOnly project(':')
    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    testImplementation project(':')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    def pluginVersion = project.version
    inputs.property 'version', pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') { expand version: pluginVersion }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform() }

// Build a standalone client resource pack; a copy is embedded for first-time installation.
tasks.register('prototypeResourcePack', Zip) {
    archiveFileName = 'chrdk-custom-items-prototype.zip'
    destinationDirectory = layout.buildDirectory.dir('resource-packs')
    from('resource-pack')
    // Add namespaced Fishing models; retain the existing pack metadata and vanilla assets.
    from('../fishing/resource-pack') { exclude 'pack.mcmeta' }
}
tasks.named('build') { dependsOn tasks.named('prototypeResourcePack') }

// Install a copy under plugins/CHRDK_CustomItems on first startup; never overwrite operator changes.
tasks.named('processResources') {
    dependsOn tasks.named('prototypeResourcePack')
    from(tasks.named('prototypeResourcePack')) { rename { 'custom-items-pack.zip' } }
}
