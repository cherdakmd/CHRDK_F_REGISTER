# Только для изолированного теста с экспериментальным ресурс-паком.
# На обычном сервере оставить false: другие паки могут использовать эти же model data.
prototype-textures: false

# Отправлять предложение пакета автоматически при входе. Без настроенных URL
# и SHA-1 отправка не начнётся; аддон не запускает собственный веб-сервер.
# URL должен прямо отдавать ZIP по публичному HTTPS без авторизации. SHA-1
# вычисляется для конкретного ZIP: sha1sum chrdk-custom-items-prototype.zip.
# После смены ZIP обязательно обновить SHA-1 и перезапустить плагин/сервер.
# Игроки могут отклонить пакет; при отказе их не отключает от сервера.
resource-pack:
  enabled: true
  url: ""
  sha1: ""
