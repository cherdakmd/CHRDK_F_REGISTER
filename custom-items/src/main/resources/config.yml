# Только для изолированного теста с экспериментальным ресурс-паком.
# На обычном сервере оставить false: другие паки могут использовать эти же model data.
prototype-textures: false
# Только для тестового сервера: 12 небоевых свойств, включая три расходника.
prototype-properties: false

# Пакет создаётся в plugins/CHRDK_CustomItems/custom-items-pack.zip и НЕ
# перезаписывается при обновлении. Разместите именно этот файл по прямой
# публичной HTTPS-ссылке (например, через настроенный обратный прокси).
# Клиент скачивает его сам; плагин не открывает веб-порт.
# SHA-1 автоматически вычисляется из локального ZIP при запуске. При замене
# файла обновите файл на веб-хостинге и перезапустите сервер.
# required=false: игрок вправе отказаться и останется на сервере.
# required=true: клиент обязан принять пакет; отказ/ошибка может отключить игрока.
resource-pack:
  enabled: true
  required: false
  url: ""
  # Необязательная дополнительная проверка: если задано, должно совпасть с ZIP.
  sha1: ""
