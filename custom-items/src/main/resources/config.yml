# Только для изолированного теста с экспериментальным ресурс-паком.
# На обычном сервере оставить false: другие паки могут использовать эти же model data.
prototype-textures: false
# Только для тестового сервера: 12 небоевых свойств, включая три расходника.
prototype-properties: false

# ZIP создаётся в plugins/CHRDK_CustomItems/custom-items-pack.zip и не
# перезаписывается при обновлении. Встроенный HTTP-сервер отдаёт только этот
# файл, снимок читается при запуске; для замены ZIP перезапустите сервер.
# Откройте TCP-порт 8123 в firewall/панели хостинга и при необходимости NAT.
# Укажите внешний адрес, доступный игрокам, например:
# url: "http://example.com:8123/custom-items-pack.zip"
# Плагин не может автоматически определить публичный IP или открыть порт.
# HTTP не шифруется; HTTPS возможен через собственный обратный прокси.
# required=false: отказавшийся игрок остаётся на сервере.
resource-pack:
  enabled: true
  required: false
  url: ""
  # Пусто = SHA-1 вычисляется автоматически; при наличии должен совпасть с ZIP.
  sha1: ""
  host:
    enabled: true
    bind: "0.0.0.0"
    port: 8123
