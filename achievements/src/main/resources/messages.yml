  admin-already: "<gray>У игрока %player% уже открыто %id%.</gray>"
  admin-reset-badge: "<gray>Бейдж игрока %player% сброшен.</gray>"
  admin-usage: "<yellow>/achadmin <reload|grant <ник> <ид>|reset <ник>></yellow>"

