# CHRDK_Achievements — тексты достижений: имена и описания (ach.<id>.name|desc),
# разделы, витрина, бейджи и админские команды.
messages:
  player-only: "<red>Эта команда только для игроков.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  usage: "<yellow>/achievements [menu|list|badge <ид|off>]</yellow>"
  achievements-disabled: "<red>Достижения выключены в config.yml.</red>"

  # ------------------------------- витрина --------------------------------
  achievements-title: "<gold>Достижения · %category%</gold>"
  category.path: "<green>Путь</green>"
  category.combat: "<red>Бой</red>"
  category.craft: "<yellow>Ремесло</yellow>"
  category.social: "<aqua>Сообщество</aqua>"
  category.all: "<white>Все</white>"
  tab-path: "<green>Путь</green> <dark_gray>(вкладка)</dark_gray>"
  tab-combat: "<red>Бой</red> <dark_gray>(вкладка)</dark_gray>"
  tab-craft: "<yellow>Ремесло</yellow> <dark_gray>(вкладка)</dark_gray>"
  tab-social: "<aqua>Сообщество</aqua> <dark_gray>(вкладка)</dark_gray>"
  tab-all: "<white>Все достижения</white>"
  gui-close: "<red>Закрыть</red>"
  entry-unlocked-name: "<green>✔ %name%</green>"
  entry-locked-name: "<dark_gray>%name%</dark_gray>"
  entry-desc: "<gray>%text%</gray>"
  entry-progress: "<gray>%bar%</gray> <white>%current%/%goal%</white> <dark_gray>(%percent%%)</dark_gray>"
  entry-reward: "<gold>Награда: %reward%</gold>"
  entry-done: "<green>✦ Достижение открыто</green>"
  entry-locked: "<dark_gray>Ещё не открыто</dark_gray>"
  entry-badge-click: "<aqua>Клик — надеть бейдж</aqua>"
  entry-badge-worn: "<aqua>Бейдж надет · клик — снять</aqua>"
  progress-name: "<gold>Открыто: %unlocked% из %total%</gold>"
  progress-line: "<green>%bar%</green> <gray>%percent%%</gray>"
  progress-next: "<gray>Ближе всего: <white>%name%</white></gray>"
  progress-badge: "<gray>Ваш бейдж: %badge%</gray>"
  progress-badge-none: "<dark_gray>Бейдж не выбран — откройте достижение с бейджем</dark_gray>"

  # ----------------------------- уведомления ------------------------------
  achievement-unlocked: "<gold>✦ Достижение открыто: <white>%name%</white> <dark_gray>(%category%)</dark_gray></gold>"
  achievement-reward: "<green>Награда: %reward%</green>"
  achievement-hint-badges: "<gray>Витрина и бейджи: <yellow>/achievements</yellow></gray>"
  actionbar-unlocked: "<gold>✦ %name%</gold>"
  reward-days: "<aqua>%days% дн. проходки</aqua>"
  reward-diamonds: "<aqua>%count% алмазов</aqua>"
  reward-join: "<gray> + </gray>"
  reward-none: "<gray>без материальной награды</gray>"

  # -------------------------------- бейджи --------------------------------
  badge-usage: "<yellow>/achievements badge <ид|off></yellow>"
  badge-set: "<green>Бейдж выбран: %badge%</green>"
  badge-removed-plain: "<gray>Бейдж снят.</gray>"
  badge-removed: "<gray>Бейдж «%name%» снят.</gray>"
  badge-worn: "<green>Бейдж «%name%» надет.</green>"
  badge-unknown: "<red>У этого достижения нет бейджа.</red>"
  badge-locked: "<red>Сначала откройте это достижение.</red>"
  badges-disabled: "<red>Бейджи выключены в config.yml.</red>"
  badge.veteran: "<gold>⭐</gold><yellow>ВЕТЕРАН</yellow>"
  badge.legenda: "<gold>🏆</gold><yellow>ЛЕГЕНДА</yellow>"

  # -------------------------------- список --------------------------------
  list-header: "<gold>══════ Достижения: %unlocked%/%total% ══════</gold>"
  list-category: "<gold>— %category% —</gold>"
  list-line-done: "<green>✔ %name%</green> <dark_gray>(%current%/%goal%)</dark_gray>"
  list-line-open: "<gray>▫ %name%</gray> <dark_gray>(%current%/%goal%)</dark_gray>"
  list-footer: "<gray>Подробности: <yellow>/achievements</yellow></gray>"

  # ------------------------------ админские --------------------------------
  admin-reloaded: "<green>Конфигурация достижений перечитана.</green>"
  admin-player-not-found: "<red>Игрок не найден (должен быть онлайн).</red>"
  admin-unknown: "<red>Неизвестное достижение (см. /achievements list).</red>"
  admin-granted: "<green>Достижение %id% выдано игроку %player%.</green>"
  admin-already: "<gray>У игрока %player% уже открыто %id%.</gray>"
  admin-reset-badge: "<gray>Бейдж игрока %player% сброшен.</gray>"
  admin-usage: "<yellow>/achadmin <reload|grant <ник> <ид>|reset <ник>></yellow>"

