# CHRDK_Achievements — 48 достижений в четырёх разделах: путь, бой, ремесло и
# сообщество (по 12 в каждом). Прогресс живёт в achievements.json (по UUID), награды выдаются один раз.

general:
  locale: ru

achievements:
  # false — прогресс не начисляется и витрина закрыта. Уже открытые достижения
  # и бейджи сохраняются.
  enabled: true
  # Писать в чат поздравление при открытии достижения.
  announce: true
  # Дублировать открытие короткой строкой над хотбаром.
  actionbar: true
  # Считать блоки и мобов в креативе/спектаторе (false — «честная игра»).
  count-creative: false
  # Считать полёт (элитры, креатив, /fly) в пройденные блоки.
  count-flying: false
  # Раз в сколько секунд начисляется время игры онлайн-игрокам (10..600).
  playtime-tick-seconds: 60

# Бейджи — оформление ника через API ядра. Выбранный бейдж виден в чате,
# личных сообщениях и TAB (если ядро выводит оформленное имя).
badges:
  enabled: true

# Точечные переопределения наград: ключ — ид достижения, значения необязательны.
# Значение -1 (или отсутствие поля) означает «как в каталоге».
# Пример:
# rewards:
#   veteran:
#     pass-days: 10
#     diamonds: 64
rewards: {}
