# Денежные награды вех поступают в /bal, без предметной выдачи и drops.
# При cap/недоступном банке новые обязательства сохраняются в achievements-money/fixed-money.json.
# Старый milestone-awards.json хранит ранее принятые обязательства; не удаляйте журналы.
# CHRDK_Achievements — 72 достижения в четырёх разделах: путь, бой, ремесло и
# сообщество (по 18 в каждом). Прогресс живёт в achievements.json (по UUID), награды выдаются один раз.

general:
  locale: ru

achievements:
  # false — прогресс не начисляется и витрина закрыта. Уже открытые достижения
  # и бейджи сохраняются.
  enabled: true
  # Писать в чат поздравление при открытии достижения.
  announce: true
  # Дублировать открытие короткой строкой над хотбаром.
  actionbar: true
  # Считать блоки и мобов в креативе/спектаторе (false — «честная игра»).
  count-creative: false
  # Считать полёт (элитры, креатив, /fly) в пройденные блоки.
  count-flying: false
  # Раз в сколько секунд начисляется время игры онлайн-игрокам (10..600).
  playtime-tick-seconds: 60

# Старые бейджи сохраняются; новые заменяются денежным эквивалентом 100 /bal.
# Выбранный старый бейдж виден при соответствующих настройках оформления имени.
badges:
  enabled: true

# Точечные переопределения наград: ключ — ид достижения, значения необязательны.
# Значение -1 (или отсутствие поля) означает «как в каталоге».
# boost-hours — денежный эквивалент старых часов: 150 /bal за час (максимум 24).
# diamonds — базовые алмазы, пересчитываемые по курсу при принятии.
# Пример:
# rewards:
#   veteran:
#     boost-hours: 10
#     diamonds: 64
rewards: {}
