plugins {
    id 'java'
}

group = project.maven_group
version = project.plugin_version

base {
    archivesName = 'chrdk-disasters'
}

repositories {
    mavenCentral()
    maven {
        name = 'purpurmc'
        url = 'https://repo.purpurmc.org/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    // Ядро: Messages и схема версий конфигов.
    compileOnly project(':')
    // Приваты — обязательная защита катастроф; плагин может быть отключён.
    compileOnly project(':claims')
    // Мягкие интеграции: ачивки и опыт Skills. Обе софт-зависимости
    // опрашиваются через ServicesManager и не нужны disasters в одиночку.
    compileOnly project(':achievements')
    compileOnly project(':skills')

    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    testImplementation project(':')
    testImplementation project(':claims')
    testImplementation project(':achievements')
    testImplementation project(':skills')
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def pluginVersion = project.version
    inputs.property "version", pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand "version": pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
    }
}
