  "hint-tornado": "<aqua>Смерч движется по спирали и подбрасывает. Держитесь на расстоянии.</aqua>"
  "hint-flood": "<blue>Наводнение: фронт воды наступает кольцами.</blue>"
  "hint-blizzard": "<white>Метель. Избегайте пудрового снега и сохраняйте тепло.</white>"
