# CHRDK_Disasters — все игровые тексты модуля. Ключи, которых нет здесь,
# берутся из этого же файла в JAR; Messages не перезаписывает правки владельца.
disasters:
  "start": "<gold>⚠ <bold>%kind%</bold></gold> <gray>рядом с вами · уровень %level%.</gray> <dark_gray>Предупреждение → активность → затухание; изменения мира отменятся по таймеру.</dark_gray>"
  "warn": "<yellow>⚠ Через %seconds% с рядом начнётся <bold>%kind%</bold> · уровень %level%.</yellow>"
  "end": "<gray>%kind% затихает. Изменения мира вернутся по таймеру.</gray>"
  "hint-dust-storm": "<yellow>Пыльная буря. Блоки не пострадают — переждите её.</yellow>"
  "hint-meteor-shower": "<gold>Метеоритный дождь. Кратеры исчезнут по таймеру.</gold>"
  "hint-earthquake": "<red>Землетрясение. Площадь изменится на время фазы.</red>"
  "hint-tornado": "<aqua>Смерч поднимает блоки по спирали. Держитесь на расстоянии.</aqua>"
  "hint-flood": "<blue>Наводнение: вода временно заливает поверхность.</blue>"
  "hint-blizzard": "<white>Метель. Холод замедляет, но урона не наносит.</white>"
  "status-enabled": "<green>Катастрофы включены.</green> <gray>Следующая примерно через %seconds% с.</gray>"
  "status-disabled": "<gray>Катастрофы сейчас выключены.</gray>"
  "player-only": "<red>Команда доступна только игроку.</red>"
  "no-permission": "<red>Недостаточно прав.</red>"
  "unknown-kind": "<red>Неизвестная или отключённая катастрофа. Доступны: dust-storm, meteor-shower, earthquake, tornado, flood, blizzard.</red>"
  "admin-usage": "<yellow>Использование: /disastersadmin <start <kind> [level] [player]|list|stop [id]|restore|reload|on|off></yellow>"
  "admin-started": "<green>Запущено #%id%: %kind% · уровень %level% · %player%.</green>"
  "admin-blocked": "<red>Старт отменён: рядом приват CHRDK_Claims или спавн.</red>"
  "admin-stopped": "<green>Все катастрофы остановлены, блоки возвращены.</green>"
  "admin-stopped-one": "<green>Катастрофа #%id% остановлена, эффекты сняты.</green>"
  "admin-no-run": "<red>Катастрофа #%id% не найдена.</red>"
  "admin-list": "<gold>Активных катастроф: %count%.</gold>"
  "admin-list-empty": "<gray>Активных катастроф нет.</gray>"
  "admin-list-line": "<gray>#%id% · %kind% · уровень %level% · %phase% · осталось %seconds% с.</gray>"
  "admin-restored": "<green>Восстановлено блоков: %count%.</green>"
  "admin-not-found": "<red>Игрок не найден или не в сети.</red>"
  "admin-on": "<green>Катастрофы включены до рестарта.</green>"
  "admin-off": "<yellow>Катастрофы выключены до рестарта (файл не менялся).</yellow>"
  "reloaded": "<green>Конфигурация CHRDK_Disasters перечитана, блоки возвращены.</green>"
  "kind-dust-storm": "Пыльная буря"
  "kind-meteor-shower": "Метеоритный дождь"
  "kind-earthquake": "Землетрясение"
  "kind-tornado": "Смерч"
  "kind-flood": "Наводнение"
  "kind-blizzard": "Метель"
