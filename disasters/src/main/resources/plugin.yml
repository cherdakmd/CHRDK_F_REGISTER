name: CHRDK_Disasters
version: ${version}
main: ru.cherdakmd.chrdkdisasters.DisastersPlugin
api-version: '26.3'
description: "Собственные катастрофы CHRDK: пыльная буря, метеоритный дождь и землетрясение с защитой приватов и откатом блоков"
author: cherdakmd
depend: [CHRDK_Core]
softdepend: [CHRDK_Claims, CHRDK_Skills, PlaceholderAPI]
commands:
  disasters:
    description: "Статус катастроф у игрока"
    usage: "/disasters [status]"
    permission: chrdkdisasters.use
  disastersadmin:
    description: "Управление катастрофами"
    usage: "/disastersadmin <start <kind> [level] [player]|stop|restore|reload|on|off>"
    permission: chrdkdisasters.admin
permissions:
  chrdkdisasters.use:
    description: "Смотреть статус катастроф"
    default: true
  chrdkdisasters.admin:
    description: "Запуск, остановка, откат и перезагрузка катастроф"
    default: op
  chrdkdisasters.bypass:
    description: "Катастрофы не случаются у этого игрока"
    default: false
