plugins {
    id 'java'
}

group = project.maven_group
version = project.plugin_version
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'purpurmc'
        url = 'https://repo.purpurmc.org/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'luckperms'
        url = 'https://repo.luckperms.net/maven'
    }
}

dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "me.clip:placeholderapi:2.12.3"
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    compileOnly "net.luckperms:api:5.4"

    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def pluginVersion = project.version
    inputs.property "version", pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand "version": pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

jar {
    def archiveName = project.archives_base_name
    inputs.property "archiveName", archiveName
    from("LICENSE") {
        rename { "${it}_${archiveName}" }
    }
}
