plugins {
    id 'java'
}

// Одинаковые исходники должны давать побайтово сравнимые архивы независимо
// от времени сборки и порядка обхода файловой системы. Настройка общая для
// ядра и всех аддонов, включая тестовые/дополнительные archive tasks.
allprojects {
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

group = project.maven_group
version = project.plugin_version
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'purpurmc'
        url = 'https://repo.purpurmc.org/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'luckperms'
        url = 'https://repo.luckperms.net/maven'
    }
}

dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    compileOnly "com.google.code.gson:gson:2.11.0"
    // CI: официальный GitHub release той же версии, проверенный prepare_papi.py (compileOnly, не упаковка).
    compileOnly(rootProject.findProperty('chrdk.papiJar')
            ? files(rootProject.file(rootProject.property('chrdk.papiJar')))
            : "me.clip:placeholderapi:2.12.3")
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    compileOnly "net.luckperms:api:5.4"

    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    // Тесты expansion'ов резолвят суперкласс PlaceholderExpansion: тот же pinned jar,
    // что и compileOnly, должен быть виден compileTestJava (не попадает в артефакт).
    testImplementation(rootProject.findProperty('chrdk.papiJar')
            ? files(rootProject.file(rootProject.property('chrdk.papiJar')))
            : "me.clip:placeholderapi:2.12.3")
    testImplementation "com.github.MilkBowl:VaultAPI:1.7.1"
    testImplementation "net.luckperms:api:5.4"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Opt-in integration harness: real Core bank + Fishing journal, never included in any JAR.
sourceSets {
    fishingRecoveryTest {
        java {
            srcDirs = ['fishing/src/main/java', 'src/fishingRecoveryTest/java']
            include 'ru/cherdakmd/chrdkfishing/BaitCatalog.java'
            include 'ru/cherdakmd/chrdkfishing/FishCatalog.java'
            include 'ru/cherdakmd/chrdkfishing/FishSaleJournal.java'
            include 'ru/cherdakmd/chrdkfishing/FishToken.java'
            include 'ru/cherdakmd/chrdkfishing/FishingModel.java'
            include 'ru/cherdakmd/chrdkfishing/FishingOrders.java'
            include 'ru/cherdakmd/chrdkfishing/FishingRules.java'
            include 'ru/cherdakmd/chrdkfishing/bukkit/CoreSaleBank.java'
            include 'ru/cherdakmd/chrdkfishing/bukkit/FishingBankRecoveryIntegrationTest.java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    fishingRecoveryTestImplementation.extendsFrom testImplementation
    fishingRecoveryTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    fishingRecoveryTestImplementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    fishingRecoveryTestImplementation 'org.mockito:mockito-core:5.20.0'
    fishingRecoveryTestRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}
tasks.register('fishingRecoveryTest', Test) {
    description = 'Offline integration of real Core bank and Fishing sale journal with simulated inventory.'
    testClassesDirs = sourceSets.fishingRecoveryTest.output.classesDirs
    classpath = sourceSets.fishingRecoveryTest.runtimeClasspath
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    def pluginVersion = project.version
    inputs.property "version", pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand "version": pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

jar {
    def archiveName = project.archives_base_name
    inputs.property "archiveName", archiveName
    from("LICENSE") {
        rename { "${it}_${archiveName}" }
    }
}
