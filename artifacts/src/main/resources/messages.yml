  admin-given-dropped: "<gray>Часть выдачи (%amount%) не поместилась в инвентарь игрока %player% и выпала под ноги.</gray>"
  admin-received: "<gold>✦ Вам вручён артефакт: %name%</gold>"
  admin-usage: "<yellow>/artifactsadmin give <игрок> <ид> [кол-во] | /artifactsadmin reload</yellow>"
  dropped: "<gold>⚑ Судьба одарила вас артефактом: %name%!</gold>"
  sources-header: '<gold>Источники артефактов: текущие проценты сервера</gold>'
  sources-line: "<gray>• Данжи и сокровищницы ● Боссы (дракон, визер, варден) ● Рыбалка на сокровище ● Или у админов событий</gray>"

  art:
    solnechny-obereg:
      name: "Солнечный оберег"
      lore: "Покуда при себе — огонь не страшен и удача ближе."
      details:
      - '<gray>Пока носите при себе: Огнестойкость I, Удача I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    zhabii-kamen:
      name: "Жабий камень"
      lore: "Дышит вместо тебя под водой и гонит волну."
      details:
      - '<gray>Пока носите при себе: Подводное дыхание I, Грация дельфина I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    dyhanie-gor:
      name: "Дыхание гор"
      lore: "Падение становится неторопливым планированием."
      details:
      - '<gray>Пока носите при себе: Медленное падение I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    nochnoj-svetlyak:
      name: "Ночной светляк"
      lore: "Тьма расступается вокруг носителя."
      details:
      - '<gray>Пока носите при себе: Ночное зрение I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    kamen-stojkosti:
      name: "Камень стойкости"
      lore: "Чужие удары тупятся об камень."
      details:
      - '<gray>Пока носите при себе: Сопротивление I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    vetryanaya-spitsa:
      name: "Ветряная спица"
      lore: "Ноги сами плетут дорогу."
      details:
      - '<gray>Пока носите при себе: Скорость I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    koren-zhizni:
      name: "Корень жизни"
      lore: "Сердцевина мира делится сердцем."
      details:
      - '<gray>Пока носите при себе: Прилив здоровья I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    ruka-rudokopa:
      name: "Рука рудокопа"
      lore: "Кирка летит быстрее мысли."
      details:
      - '<gray>Пока носите при себе: Спешка I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    grozovoj-kolokol:
      name: "Грозовой колокол"
      lore: "Звонит — и небо бьёт трижды."
      details:
      - <gray>Три настоящие молнии у точки взгляда, дальность выбора до 30 блоков.</gray>
      - '<gray>Каждая смещается до 2 блоков по X/Z: не точечный безопасный луч.</gray>'
    rog-tajgi:
      name: "Рог тайги"
      lore: "Один вдох — и ты уже за восемь шагов дальше."
      details:
      - <gray>Телепорт по горизонтальному взгляду до 8 блоков.</gray>
      - <gray>Нужны свободные ноги/голова и опора; затем Скорость II на 3 сек.</gray>
    plamya-ochaga:
      name: "Пламя очага"
      lore: "Теплосытость дома взамен уровня опыта."
      details:
      - <gray>Устанавливает сытость 20, насыщение 14 и истощение 0.</gray>
      - <gray>Не лечит здоровье и не создаёт еду в инвентаре.</gray>
    kaplya-zhizni:
      name: "Капля жизни"
      lore: "Последняя слеза родника: лечит всё до дна."
      details:
      - <gray>Восстанавливает здоровье до максимума.</gray>
      - <gray>Снимает все текущие зельевые эффекты, в том числе полезные.</gray>
      - <gray>Не удаляет чары, свойства предметов и их пассивные источники.</gray>
    klyuch-strannika:
      name: "Ключ странника"
      lore: Ищет безопасное место для перехода в текущем мире.
      details:
      - <gray>Ищет поверхность на расстоянии 60–300 блоков в том же мире.</gray>
      - <gray>Проверяет место, границу мира и крышу Нижнего мира.</gray>
      - <gray>Отказ перехода не расходует XP и не запускает откат.</gray>
    linza-providesa:
      name: "Линза провидца"
      lore: "Сквозь неё не спрятаться злым тварям."
      details:
      - <gray>Подсветка живых существ, кроме игроков, на 30 сек.</gray>
      - '<gray>Область от носителя: ±25 блоков по X/Z и ±10 по высоте.</gray>'
    hartiya-char:
      name: "Хартия чар"
      lore: "Клеймо мастера само вписывает чару в предмет во второй руке."
      details:
      - <gray>Случайная кастомная чара на предмете в другой руке.</gray>
      - <gray>Нужен действующий CHRDK_Enchants, совместимость и свободное место.</gray>
      - <gray>Это не книга и не выбор конкретной чары; при отказе XP/откат не тратятся.</gray>
    sleza-vdovy:
      name: "Слеза вдовы"
      lore: "Тяжесть чужого горя в кармане."
      details:
      - '<gray>Пока носите при себе: Медлительность I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    golodnyj-koren:
      name: "Голодный корень"
      lore: "Сосёт силы тише, чем хлеб даёт."
      details:
      - '<gray>Пока носите при себе: Голод I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    smolyanoj-mrak:
      name: "Смоляной мрак"
      lore: "Капля ночи, что не смывается."
      details:
      - '<gray>Пока носите при себе: Тьма I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    krivoe-zerkalo:
      name: "Кривое зеркало"
      lore: "Мир плывёт перед очами."
      details:
      - '<gray>Пока носите при себе: Тошнота I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    rzhavyj-gvozd:
      name: "Ржавый гвоздь"
      lore: "Руки помнят его тяжесть при каждом ударе кирки."
      details:
      - '<gray>Пока носите при себе: Усталость I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    glinyanaya-dusha:
      name: "Глиняная душа"
      lore: "Ноги прирастают к земле."
      details:
      - '<gray>Вычитает базовую силу обычного прыжка: без других модификаторов — ноль.</gray>'
      - <gray>Не обнуляет движение от любой внешней силы или полёта.</gray>
    pepel-pogroma:
      name: "Пепел погрома"
      lore: "То и дело вспыхивает заново."
      details:
      - <gray>За пассивный цикл шанс 8% поджечь владельца на 4 сек.</gray>
      - <gray>Это вероятность за пульс, а не гарантированное событие каждые 4 сек.</gray>
    sushonyj-glaz:
      name: "Сушёный глаз"
      lore: "Недобро смотрит на тебя."
      details:
      - <gray>За цикл шанс 10% получить Отравление I на 8 сек.</gray>
      - <gray>Частота попыток зависит от настроенного периода пассивов.</gray>
    chernaya-moneta:
      name: "Чёрная монета"
      lore: "Сила по сходной цене: расплата тут же."
      details:
      - <gray>Сила II на 15 сек., но одновременно Слабость II на 60 сек.</gray>
      - <gray>Оба эффекта действуют на владельца; алмазы не выдаются.</gray>
    svistok-kostej:
      name: "Свисток костей"
      lore: "Слышат лишь мертвяки. И бегут на звук."
      details:
      - <gray>Призывает двух скелетов рядом с владельцем.</gray>
      - <gray>Их начальная цель — сам призыватель, не ручные союзники.</gray>
    membrana-prizraka:
      name: "Мембрана призрака"
      lore: "Рвёт пространство, не глядя куда."
      details:
      - <gray>Случайный переход на 10–34 блока в том же мире.</gray>
      - <gray>После успеха Слепота I на 5 сек.; место выбираете не вы.</gray>
      - <gray>При отказе перехода нет расходов XP, отката и слепоты.</gray>
    rakovina-toski:
      name: "Раковина тоски"
      lore: "Шумит бурей и зовёт молнию на голову."
      details:
      - <gray>Настоящая молния в владельца; при разрешении — гроза на 120 сек.</gray>
      - <gray>Запрет погоды не отменяет личную молнию и цену успешного применения.</gray>
    zhalo-moroki:
      name: "Жало мороки"
      lore: "Сковывает чужих, слепит своего."
      details:
      - '<gray>Живым существам, кроме игроков: Медлительность IV на 10 сек.</gray>'
      - <gray>Область ±10 блоков по X/Z, ±6 по высоте.</gray>
      - <gray>Самому владельцу Слепота I на 10 сек.</gray>
    chasy-duroshljopa:
      name: "Часы дурошлёпа"
      lore: "Вечно показывают полночь."
      details:
      - <gray>При разрешении переводит время мира на 18000.</gray>
      - <gray>Владельцу Тьма I на 30 сек., даже если изменение времени запрещено.</gray>
    porvannyj-kupon:
      name: "Порванный купон"
      lore: "Кто-то уже расплатился. Тобой."
      details:
      - <gray>Даёт 3 уровня опыта и Слабость II на 30 сек.</gray>
      - <gray>Если здоровья больше 8 ед., отнимает 8 ед. (4 сердца).</gray>
      - <gray>При здоровье ≤8 эта потеря не выполняется; это не лечение до полного HP.</gray>
    # ---- добрая волна (1.4.58, по мотивам CHRDK_REBORN) ----
    pero-feniksa:
      name: "Перо Феникса"
      lore: При готовности отводит смертельный удар; не страховка предметов от потери.
      details:
      - <gray>При готовности спасает от смертельного урона до половины максимального HP.</gray>
      - <gray>Тушит огонь и даёт Регенерацию II на 4 сек.; откат 600 сек.</gray>
      - <gray>Не дублирует тотем бессмертия в руках; копии не дают отдельные таймеры.</gray>
    magnit-opyta:
      name: "Магнит Опыта"
      lore: "Опытные шары слышат зов кармана и летят к нему."
      details:
      - <gray>За пульс подтягивает до 12 шаров опыта к владельцу.</gray>
      - <gray>Область ±8 блоков по X/Z и ±5 по высоте; XP не создаёт.</gray>
    zhnej-dush:
      name: "Жнец Душ"
      lore: "Душа каждого павшего подкрепляет жнеца."
      details:
      - <gray>Убийство с зачтённым вам killer лечит на 4 ед. HP (2 сердца).</gray>
      - <gray>Не выше максимума; несколько копий не умножают лечение.</gray>
    ledyanaya-aura:
      name: "Ледяная Аура"
      lore: "Злое зверьё вокруг носителя стынет и вяжет ногами."
      details:
      - <gray>Монстрам поблизости поддерживает Медлительность II и замерзание.</gray>
      - <gray>Область ±8 блоков по X/Z и ±5 по высоте; не действует на игроков.</gray>
    ternistyj-plasch:
      name: "Тернистый Плащ"
      lore: "Кто ударит — обломает шило о колючки."
      details:
      - <gray>Ближнему живому нападавшему отвечает уроном 2 ед. (1 сердце до защиты).</gray>
      - <gray>Не ответ на стрелу; цепочка ответов двух плащей ограничена.</gray>
    travjanoj-eliksir:
      name: "Травяной Эликсир"
      lore: "Отвар бабушкиных опушек: раны дышат и дышат."
      details:
      - '<gray>Пока носите при себе: Регенерация I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    sapogi-vetra:
      name: "Сапоги Ветра"
      lore: "Прыжок становится подскоком, подскок — парением."
      details:
      - '<gray>Пока носите при себе: Прыгучесть I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    klever-udachi:
      name: "Клевер Удачи"
      lore: "Четыре лепестка, один лишний: судьба в деталях."
      details:
      - '<gray>Пока носите при себе: Удача I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    travyanoj-meshochek:
      name: "Травяной Мешочек"
      lore: "Пахучая щепоть трав сытит идущего тропой."
      details:
      - '<gray>Пока носите при себе: Насыщение I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    serdtse-drakona:
      name: "Сердце Дракона"
      lore: "Кровь дракона бьёт ударом в десять сердец."
      details:
      - '<gray>Пока носите при себе: Прилив здоровья V.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    svitok-ochischeniya:
      name: "Свиток Очищения"
      lore: "Смывает с себя злые чары, болезни и огонь."
      details:
      - <gray>Снимает текущие вредные зельевые эффекты и тушит огонь.</gray>
      - <gray>Если снимать нечего, нет расхода XP и отката.</gray>
      - '<gray>Не удаляет проклятые предметы/свойства: источник может вернуть эффект.</gray>'
    totem-krovi:
      name: "Тотем Крови"
      lore: "Красный щит и ладья кожи на минуту вперёд."
      details:
      - <gray>Поглощение IV и Сопротивление I на 60 сек.</gray>
      - <gray>Не воскрешение от смертельного удара и не новый предмет-тотем.</gray>
    sfera-pobega:
      name: "Сфера Побега"
      lore: "Ломится туда, откуда ноги растут. Домой."
      details:
      - <gray>Переход к точке возрождения, при её отсутствии — к спавну текущего мира.</gray>
      - <gray>Не выбор точки из /homes; отменённый переход не оплачивается.</gray>
    ledyanaya-stena:
      name: "Ледяная Стена"
      lore: "Разгерметизация зимы: зверьё вокруг вмерзает в пол."
      details:
      - <gray>Монстрам в ±10 блоках X/Z и ±6 по высоте:</gray>
      - <gray>Медлительность IV и замерзание на 6 сек.</gray>
      - <gray>Не строит стену блоками и не замедляет игроков.</gray>
    glaz-nachala:
      name: "Глаз Начала"
      lore: "Все истинные владыки окрестностей обнажаются взглядом."
      details:
      - <gray>Свечение на 60 сек. в области ±64 X/Z и ±24 по высоте.</gray>
      - '<gray>Цели: дракон, иссушитель, варден, древний страж и скелет-иссушитель.</gray>'
      - <gray>Не поиск любых существ по всему миру.</gray>
    korona-bezdny:
      name: "Корона Бездны"
      lore: "Сила бездны на полминуты. Голова кружит от перспектив."
      details:
      - <gray>Сила II на 30 сек., одновременно Тошнота I на 6 сек.</gray>
      - <gray>Дополнительные случайные свойства предмета учитываются отдельно.</gray>
    ender-sdvig:
      name: "Эндер-сдвиг"
      lore: "Сдвигает пространство по направлению взгляда. Даже сквозь воздух."
      details:
      - <gray>Выбирает свободную точку ног/головы по взгляду до 12 блоков.</gray>
      - <gray>Это не гарантия безопасной поверхности или защиты от падения.</gray>
      - <gray>При отмене телепорта XP и откат не расходуются.</gray>
    oskolok-vechnosti:
      name: "Осколок Вечности"
      lore: "Щепка застывшего времени: запас жизни на полторы минуты."
      details:
      - <gray>Прилив здоровья II и Поглощение II на 90 сек.</gray>
      - <gray>Прилив повышает максимум, не означает мгновенное полное лечение.</gray>
    # ---- тёмная волна (1.4.58) ----
    okov-tyazhesti:
      name: "Оковы Тяжести"
      lore: "Каждый шаг гремит и плавится в молоко."
      details:
      - '<gray>Пока носите при себе: Медлительность II.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    pustoy-zhivot:
      name: "Пустой Живот"
      lore: "Кормит ложкой, забирает ковшом."
      details:
      - '<gray>Пока носите при себе: Голод II.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    slabye-kisti:
      name: "Слабые Кисти"
      lore: "Кулаки висят как ветошь."
      details:
      - '<gray>Пока носите при себе: Слабость I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    krovavyj-svyaz:
      name: "Кровавая Связь"
      lore: "Пуповинатая нить к чужой боли."
      details:
      - <gray>За цикл шанс 5% получить 1 ед. урона (полсердца до защиты).</gray>
      - <gray>Проверяется при HP >1; другие модификаторы урона остаются.</gray>
    smertnyj-potok:
      name: "Смертный Поток"
      lore: "Вода становится шершавой глоткой яда."
      details:
      - <gray>За цикл шанс 8% получить 1 ед. урона, пока вы в воде.</gray>
      - <gray>Не постоянный штраф ко всему входящему урону.</gray>
    chernye-slezy:
      name: "Чёрные Слёзы"
      lore: "Чернильно плачет прямо на ваши глаза."
      details:
      - <gray>За цикл шанс 6% получить Слепоту I на 3 сек.</gray>
      - <gray>Частота попыток зависит от периода пассивов.</gray>
    ruga-zhadnosti:
      name: "Руна Жадности"
      lore: "Замысел опирается на осколки чужого опыта."
      details:
      - <gray>За цикл шанс 15% потерять 10 очков опыта при total XP >10.</gray>
      - <gray>Это очки XP, не 10 уровней и не деньги в /bal.</gray>
    prah-marka:
      name: "Прах Марка"
      lore: "Столб невезучей пыли: удача в минус."
      details:
      - '<gray>Пока носите при себе: Невезение I.</gray>'
      - <gray>Пассив не требует ПКМ; копии одного ID не умножают эффект.</gray>
    koltso-usmerti:
      name: "Кольцо Усмерти"
      lore: "Стынет тихим зудом. Иногда — иссушающей злобой."
      details:
      - <gray>За цикл шанс 4% получить Иссушение I на 4 сек.</gray>
      - <gray>Предмет в сундуке не является носимым источником проклятия.</gray>
    kniga-proklyatiy:
      name: "Книга Проклятий"
      lore: "Страница срывается: чужие глаза и ноги отнимаются."
      details:
      - <gray>Другим игрокам в ±15 X/Z и ±8 по высоте:</gray>
      - <gray>Слепота I и Медлительность II на 10 сек.; себе Голод II на 10 сек.</gray>
      - <gray>Это действующая старая механика; справочник не меняет правила PvP.</gray>
    zhertvennyj-kubok:
      name: "Жертвенный Кубок"
      lore: "Щека крови равно щит из красного стекла."
      details:
      - <gray>Нужно больше 6 ед. HP; отнимает 4 ед. (2 сердца).</gray>
      - <gray>Поглощение III на 90 сек. и Регенерация I на 5 сек.</gray>
      - <gray>Проверка здоровья идёт до расхода XP и запуска отката.</gray>
    raskolotaya-luna:
      name: "Расколотая Луна"
      lore: "Половинка светила зажигает ночь на всех чужаках."
      details:
      - <gray>При разрешении устанавливает время мира 18000.</gray>
      - <gray>Другим игрокам в этом мире Свечение I на 15 сек.; себе Тьма I на 10 сек.</gray>
      - <gray>Запрет смены времени не отменяет остальные эффекты и цену.</gray>
    shlyapa-bezdelnika:
      name: "Шляпа Бездельника"
      lore: "Летать она не научит, но парить — запросто."
      details:
      - <gray>Левитация II на 1,5 сек. и Медленное падение I на 8 сек.</gray>
      - <gray>Дополнительно Слабость I на 10 сек.; не постоянный полёт.</gray>
    silok-dushi:
      name: "Силок Души"
      lore: "Зымья чужих душ сами просятся в капкан."
      details:
      - <gray>Монстрам в ±12 X/Z и ±8 по высоте:</gray>
      - <gray>Левитация II на 3 сек. и Слабость I на 10 сек.; не игрокам.</gray>
    oblaka-durmana:
      name: "Облака Дурмана"
      lore: "Грядка дымных трав: все хмурятся, вы поете."
      details:
      - '<gray>Другим игрокам в ±10 X/Z и ±6 по высоте: Тошнота I 12 сек., Медлительность I 4 сек.</gray>'
      - <gray>Себе Слепота I 3 сек. и Скорость I 6 сек.</gray>
    klyuch-propasti:
      name: "Ключ Пропасти"
      lore: "Отпирает форточку в ближайшую пещеру. Прямо вниз."
      details:
      - <gray>Ищет свободную безопасную колонну под вами менее чем на 60 блоков вниз.</gray>
      - <gray>После перехода Слепота I на 2 сек.; не создаёт пещеру.</gray>
      - <gray>При отсутствии точки или отмене перехода XP и откат не тратятся.</gray>
    svist-gadov:
      name: "Свист Гадов"
      lore: "Когти гремят где-то под ногами. На свист."
      details:
      - <gray>Призывает трёх пещерных пауков рядом.</gray>
      - <gray>Их начальная цель — сам призыватель; не бесплатные питомцы.</gray>

