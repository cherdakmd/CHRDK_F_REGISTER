  # Подробный справочник RC8; общий текст новых предметов, карточек и вики.
  card-id: '<gray>ID: <white>%id%</white> · при себе: %carried%</gray>'
  card-passive-use: '<gray>Пассив: носите при себе, не обязательно в руке. Сундук не считается. /artifacts help use</gray>'
  card-active-use: <gray>ПКМ в воздух из руки; по сундуку/верстаку и в приседе по блоку клик остаётся игре.</gray>
  card-cooldown: '<gray>Ваш оставшийся откат: %seconds% сек. Он общий для ваших копий этого ID.</gray>'
  lore-reference: '<dark_gray>ID: %id% · описание и свойства: /artifacts inspect</dark_gray>'
  inspect-empty: <gray>В основной руке нет распознанного артефакта. Переименование обычного предмета его не создаёт.</gray>
  inspect-traits: '<gold>Свойства именно этого экземпляра: %count%</gold><gray> · ID/уровни/имя/лор не изменены.</gray>'
  guide-yes: <green>Да</green>
  guide-no: <gray>Нет</gray>
  guide-unknown: <yellow>/artifacts help [use|sources|traits|collection]</yellow>
  sources-chest: '<gray>Таблица добычи <white>%key%</white>: %chance%% за генерацию.</gray>'
  sources-mob: '<gray>Существо <white>%type%</white>: %chance%% при убийстве с зачтённым игроком.</gray>'
  sources-fishing: '<gray>Среди подходящих рыболовных сокровищ: %chance%% дополнительной находки; не среди всех забросов.</gray>'
  sources-side: '<gray>После успеха: светлая сторона %good%%, проклятая %cursed%%; затем равномерный ID внутри стороны.</gray>'
  sources-empty: <gray>В этой группе нет настроенных источников.</gray>
  sources-footer: <gray>Не шанс конкретного ID. Старый уже сгенерированный сундук не перебрасывается от просмотра справки. Режим/доступ эффекта проверяются
    отдельно; просмотр не выдаёт предмет и не открывает коллекцию.</gray>
  guide-overview:
  - <gold>Артефакты — справочник</gold>
  - <gray>/artifacts [страница] — каталог; /artifacts ID — действие, цена и ваш откат.</gray>
  - <gray>/artifacts inspect — основная рука, действие и точные свойства экземпляра, без изменения предмета.</gray>
  - <gray>/artifacts help use — как носить/активировать; help traits — как читать свойства.</gray>
  - <gray>/artifacts sources — текущие шансы; help sources — как понимать эти проценты.</gray>
  - <gray>/artifacts collection — открытия и награды; help collection — отличие от владения вещью.</gray>
  - <gray>Каталог, inspect и справка не выдают копии и не расходуют XP.</gray>
  guide-use:
  - <gold>Носить и активировать</gold>
  - <gray>Пассив распознаётся в основном инвентаре, броне и обеих руках. В сундуке или на земле — не носится.</gray>
  - <gray>Активную способность применяют ПКМ из основной или второй руки; носить активный предмет недостаточно.</gray>
  - <gray>По интерактивному блоку и в приседе по блоку клик отдаётся игре. Для проверки кликните в воздух.</gray>
  - <gray>Нужны право использования, включённый ID, требуемый вход, готовый таймер и уровни XP.</gray>
  - <gray>Цена — уровни опыта, не очки XP и не /bal. Копии одного ID делят ваш откат.</gray>
  - <gray>После успешного эффекта списываются уровни и запускается откат; предмет активацией не расходуется.</gray>
  - <gray>Полный отказ, например отменённый телепорт, не оплачивается. Частично запрещённый мировой эффект может оставить личную часть.</gray>
  - '<gray>Снятие вредного зелья не уничтожает источник: носимый проклятый артефакт может наложить его снова.</gray>'
  - <gray>Защита от обычного использования — не страховка от смерти, выбрасывания, всех крафтов или продажи.</gray>
  guide-sources:
  - <gold>Как читать шансы находок</gold>
  - '<gray>Сундук: бросок при генерации конкретной таблицы добычи, не за каждый просмотр или каждый сундук строения.</gray>'
  - '<gray>Мобы: шанс для настроенного типа при зачтённом игроке-убийце. Это другой источник, не правила книжного дропа Hunt.</gray>'
  - <gray>Временные мобы исключены. Случайный обычный моб не получает шанс только потому, что у него высокий уровень.</gray>
  - '<gray>Рыбалка: дополнительный бросок при подходящем сокровище — луке, книге, удочке, бирке, ракушке или седле.</gray>'
  - <gray>После успешного броска выбирается сторона по её весу, затем равномерно ID этой стороны.</gray>
  - <gray>70% светлой стороны не означает 70% получить конкретный светлый артефакт.</gray>
  - <gray>/artifacts sources показывает текущие проценты. Отключение эффекта ID не обещает исчезновение предмета из старой добычи.</gray>
  guide-traits:
  - <gold>Базовая способность и свойства ▲/▼</gold>
  - '<gray>У ID фиксирована основная способность. Случайные свойства хранятся у экземпляра: две копии могут различаться.</gray>'
  - <gray>▲ — польза, ▼ — вред. Светлый предмет тоже может иметь изъян, а проклятый — полезное свойство.</gray>
  - <gray>/artifacts traits — обзор диапазонов; /artifacts inspect — точное значение уровня предмета в основной руке.</gray>
  - '<gray>Уровень свойства III не всегда равен уровню зелья III: смотрите указанный эффект.</gray>'
  - <gray>Одинаковое свойство на носимых артефактах берётся по лучшему уровню, не суммируется за копии.</gray>
  - '<gray>Процент атрибута не прямой процент урона: +8% брони не означает −8% любого попадания.</gray>'
  - <gray>Два разных процентных множителя могут перемножаться. Противоположные проценты не обязаны дать ровно ноль.</gray>
  - <gray>Свойства активного предмета — отдельный фон, не дополнительная плата за ПКМ. Книга чар не выбирает свойство артефакта.</gray>
  guide-collection:
  - <gold>Коллекция — память о находке, не хранилище</gold>
  - <gray>Учитываются уникальные ID найденных предметов, не их количество или варианты свойств.</gray>
  - <gray>Один ID с тремя разными наборами свойств — одно открытие. Старые предметы учитываются сканированием.</gray>
  - <gray>Просмотр каталога или inspect не выдаёт и не регистрирует новую находку. /artifacts collection сканирует инвентарь.</gray>
  - <gray>Открытый ID не означает, что предмет сейчас при вас. Потерянная вещь не восстанавливается из коллекции.</gray>
  - <gray>Вехи могут выдавать часы игрового буста и личные алмазы в /bal; не оплаченный ранг.</gray>
  - <gray>Повтор открытия меню не должен выдавать уже отмеченную награду снова. Статус выплаты может отличаться от открытия ID.</gray>
  - <gray>При полном/недоступном банке денежная часть хранится в журнале наград; не ищите алмазы на земле.</gray>
  - <gray>Награды и сама коллекция могут быть выключены владельцем. Это не выключает владение физическим предметом.</gray>
