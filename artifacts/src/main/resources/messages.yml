  collection-progress-name: "<gold>Открыто: %found% из %total% (%percent%)</gold>"
  collection-progress-line: "<green>%bar%</green> <gray>%percent%%</gray>"
  collection-progress-hint: "<gray>Артефакт засчитывается, когда попадает в инвентарь: подбор, выдача, находка.</gray>"
  collection-prev: "<gold>← Назад</gold>"
  collection-next: "<gold>Вперёд →</gold>"
  collection-close: "<red>Закрыть</red>"
  collection-unknown-name: "<dark_gray>???</dark_gray>"
  collection-unknown-lore: "<dark_gray>Ещё не найден. Ищите в сундуках, у боссов и на рыбалке.</dark_gray>"
  collection-entry-name: "%name%"
  collection-entry-good-passive: "<yellow>★ Светлый · пассивный</yellow>"
  collection-entry-good-active: "<gold>★ Светлый · активный (ПКМ)</gold>"
  collection-entry-cursed-passive: "<red>✖ Проклятый · пассивный</red>"
  collection-entry-cursed-active: "<dark_red>✖ Проклятый · активный (ПКМ)</dark_red>"
  collection-entry-active: "<yellow>ПКМ · КД %cooldown%с · %xp% ур.</yellow>"
  collection-entry-found: "<green>✔ Открыт</green>"
  collection-rewards-name: "<gold>Награды за коллекцию</gold>"
  collection-reward-line: "<gray>%percent%% — %reward% · %status%</gray>"
  collection-reward-claimed: "<green>получено</green>"
  collection-reward-pending: "<yellow>ещё нет</yellow>"
  collection-reward-hours: "<aqua>%hours% ч. буста</aqua>"
  collection-reward-diamonds: "<aqua>%count% алмазов в /bal</aqua>"
  collection-reward-join: "<gray> + </gray>"
  collection-reward-none: "<gray>отметка о достижении</gray>"
  collection-discovered: "<gold>✦ Коллекция пополнилась: %name% <gray>(%found%/%total%)</gray></gold>"
  collection-scan: "<gold>✦ Новые артефакты в коллекции: %count%. Всего %found%/%total%.</gold>"
  collection-reward-granted: "<green>✦ Награда за %percent%% коллекции: %reward%</green>"
  collection-done: "<gold>✦ Коллекция собрана полностью: %total% из %total%!</gold>"
  collection-disabled: "<red>Коллекция артефактов выключена в config.yml.</red>"
  admin-reloaded: "<green>Конфигурация артефактов перечитана.</green>"
  admin-player-not-found: "<red>Игрок не найден (должен быть онлайн).</red>"
