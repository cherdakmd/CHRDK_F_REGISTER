    pero-feniksa:
      name: "Перо Феникса"
      lore: "Смертельный удар отшатнётся (раз в 10 минут). Не выпадает при смерти."
    magnit-opyta:
      name: "Магнит Опыта"
      lore: "Опытные шары слышат зов кармана и летят к нему."
    zhnej-dush:
      name: "Жнец Душ"
      lore: "Душа каждого павшего подкрепляет жнеца."
    ledyanaya-aura:
      name: "Ледяная Аура"
      lore: "Злое зверьё вокруг носителя стынет и вяжет ногами."
    ternistyj-plasch:
      name: "Тернистый Плащ"
      lore: "Кто ударит — обломает шило о колючки."
    travjanoj-eliksir:
      name: "Травяной Эликсир"
      lore: "Отвар бабушкиных опушек: раны дышат и дышат."
    sapogi-vetra:
      name: "Сапоги Ветра"
      lore: "Прыжок становится подскоком, подскок — парением."
    klever-udachi:
      name: "Клевер Удачи"
      lore: "Четыре лепестка, один лишний: судьба в деталях."
    travyanoj-meshochek:
      name: "Травяной Мешочек"
      lore: "Пахучая щепоть трав сытит идущего тропой."
    serdtse-drakona:
      name: "Сердце Дракона"
      lore: "Кровь дракона бьёт ударом в десять сердец."
    svitok-ochischeniya:
      name: "Свиток Очищения"
      lore: "Смывает с себя злые чары, болезни и огонь."
    totem-krovi:
      name: "Тотем Крови"
      lore: "Красный щит и ладья кожи на минуту вперёд."
    sfera-pobega:
      name: "Сфера Побега"
      lore: "Ломится туда, откуда ноги растут. Домой."
    ledyanaya-stena:
      name: "Ледяная Стена"
      lore: "Разгерметизация зимы: зверьё вокруг вмерзает в пол."
    glaz-nachala:
      name: "Глаз Начала"
      lore: "Все истинные владыки окрестностей обнажаются взглядом."
    korona-bezdny:
      name: "Корона Бездны"
      lore: "Сила бездны на полминуты. Голова кружит от перспектив."
    ender-sdvig:
      name: "Эндер-сдвиг"
      lore: "Сдвигает пространство по направлению взгляда. Даже сквозь воздух."
    oskolok-vechnosti:
      name: "Осколок Вечности"
      lore: "Щепка застывшего времени: запас жизни на полторы минуты."
    # ---- тёмная волна (1.4.58) ----
    okov-tyazhesti:
      name: "Оковы Тяжести"
      lore: "Каждый шаг гремит и плавится в молоко."
    pustoy-zhivot:
      name: "Пустой Живот"
      lore: "Кормит ложкой, забирает ковшом."
    slabye-kisti:
      name: "Слабые Кисти"
      lore: "Кулаки висят как ветошь."
    krovavyj-svyaz:
