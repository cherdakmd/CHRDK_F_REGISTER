      lore: "Пуповинатая нить к чужой боли."
    smertnyj-potok:
      name: "Смертный Поток"
      lore: "Вода становится шершавой глоткой яда."
    chernye-slezy:
      name: "Чёрные Слёзы"
      lore: "Чернильно плачет прямо на ваши глаза."
    ruga-zhadnosti:
      name: "Руна Жадности"
      lore: "Замысел опирается на осколки чужого опыта."
    prah-marka:
      name: "Прах Марка"
      lore: "Столб невезучей пыли: удача в минус."
    koltso-usmerti:
      name: "Кольцо Усмерти"
      lore: "Стынет тихим зудом. Иногда — иссушающей злобой."
    kniga-proklyatiy:
      name: "Книга Проклятий"
      lore: "Страница срывается: чужие глаза и ноги отнимаются."
    zhertvennyj-kubok:
      name: "Жертвенный Кубок"
      lore: "Щека крови равно щит из красного стекла."
    raskolotaya-luna:
      name: "Расколотая Луна"
      lore: "Половинка светила зажигает ночь на всех чужаках."
    shlyapa-bezdelnika:
      name: "Шляпа Бездельника"
      lore: "Летать она не научит, но парить — запросто."
    silok-dushi:
      name: "Силок Души"
      lore: "Зымья чужих душ сами просятся в капкан."
    oblaka-durmana:
      name: "Облака Дурмана"
      lore: "Грядка дымных трав: все хмурятся, вы поете."
    klyuch-propasti:
      name: "Ключ Пропасти"
      lore: "Отпирает форточку в ближайшую пещеру. Прямо вниз."
    svist-gadov:
      name: "Свист Гадов"
      lore: "Когти гремят где-то под ногами. На свист."
