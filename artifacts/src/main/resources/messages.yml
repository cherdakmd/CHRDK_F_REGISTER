  traits-header-bad: "<red>▼ Вредные свойства</red>"
  traits-line-good: "<green>▲</green> <yellow>%name%</yellow> <gray>— %desc%</gray>"
  traits-line-bad: "<red>▼</red> <yellow>%name%</yellow> <gray>— %desc%</gray>"
  traits-footer: "<gray>Свойства выпадают при получении артефакта: до %max% шт., шанс %chance%, уровень I–%level%. Редко бывает «чужая» полярность.</gray>"
  traits-hint: "<gray>Свойства артефактов: <yellow>/artifacts traits</yellow></gray>"
  list-header: "<gold>══════ Каталог артефактов · стр. %page%/%pages% ══════</gold>"
  list-footer: '<gray>Коллекция: %found%/%total% · стр. %page%/%pages%. Карточка: /artifacts ID · справка: /artifacts help</gray>'
  list-bad-argument: <red>Неизвестный артефакт, страница или тема.</red> <gray>/artifacts [страница|id|collection|traits|inspect|sources|help]</gray>
  card-good-passive: "<yellow>★ Светлый · пассивный</yellow>"
  card-good-active: "<gold>★ Светлый · активный (ПКМ)</gold>"
  card-cursed-passive: "<red>✖ Проклятый · пассивный</red>"
  card-cursed-active: "<dark_red>✖ Проклятый · активный (ПКМ)</dark_red>"
  card-desc: "<gray>%text%</gray>"
  card-active: "<yellow>Кулдаун: %cooldown% с · цена: %xp% ур.</yellow>"
  card-source: '<gray>Конкретные источники и текущие шансы: /artifacts sources. Это не гарантия нужного ID.</gray>'
  card-disabled: "<red>Артефакт выключен в config.yml.</red>"
  card-collection-found: "<green>Коллекция: открыт ✔</green>"
  card-collection-unknown: "<gray>Коллекция: ещё не открыт</gray>"
  card-footer: '<gray>Свойства экземпляра: /artifacts inspect · памятка: /artifacts help · коллекция: /artifacts collection</gray>'
