# CHRDK_Artifacts — имена/описания 65 артефактов (art.<id>.name, art.<id>.lore),
# 15 полезных и 15 вредных свойств (trait.<id>.name, trait.<id>.desc), тексты UI,
# карточки артефактов и коллекция (с 1.4.130).
# Свойства пишутся в лор маркерами ▲ (польза) и ▼ (вред).
messages:
  player-only: "<red>Эта команда только для игроков.</red>"
  need-auth: "<red>Артефакты слушаются лишь авторизованного хозяина. Войдите сначала.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  activated: "<gold>✦ Артефакт пробудился: %name%</gold>"
  on-cooldown: "<gray>Артефакт ещё спит: %seconds% сек.</gray>"
  not-enough-levels: "<red>Не хватает уровней опыта: нужно %need%.</red>"
  item-protected: "<gray>Артефакт нельзя поставить, съесть или использовать как обычный предмет.</gray>"
  dash-blocked: "<red>Тайга не пускает: впереди толща.</red>"
  teleport-denied: "<red>Переход отменён. Опыт не потрачен, перезарядка не запущена.</red>"
  teleport-failed: "<red>Артефакт не нашёл безопасного места для перехода. Попробуйте ещё раз.</red>"
  world-effect-blocked: "<gray>Погода и время этого мира не подчиняются артефакту.</gray>"
  revealed: "<light_purple>✦ Линза обнажила %count% существ вокруг.</light_purple>"
  enchant-needs-item: "<red>Хартия ждёт предмет во второй руке.</red>"
  enchant-failed: "<red>Письмена хартии не проступили. Архив чар недоступен.</red>"
  enchant-no-room: "<red>На предмете не осталось места для новых чар.</red>"
  enchant-applied: "<light_purple>✦ Хартия вписала: <yellow>%name% <white>%level%</white></yellow></light_purple>"
  curse-ignite: "<dark_red>✖ Пепел погрома вспыхнул на вас!</dark_red>"
  curse-poison: "<dark_red>✖ Сушёный глаз недобро посмотрел: в жилах яд.</dark_red>"
  curse-bleed: "<dark_red>✖ Кровавая связь натянулась: капля капает изнутри.</dark_red>"
  curse-water: "<dark_red>✖ Смертный поток тянет на дно: глоток боли в воде.</dark_red>"
  curse-blind: "<dark_red>✖ Чёрные слёзы застили взор на мгновение.</dark_red>"
  curse-xp: "<dark_red>✖ Руна жадности высосала частицу опыта.</dark_red>"
  curse-wither: "<dark_red>✖ Кольцо усмерти сжалось: иссушающий озноб.</dark_red>"
  phoenix-saved: "<gold>✦ Перо Феникса вспыхнуло: смерть отшатнулась! Вы воскресли наполовину.</gold>"
  cleansed: "<light_purple>✦ Свиток очищения смыл %count% болезней и чар.</light_purple>"
  cleanse-none: "<gray>Очищать пока нечего — душа чиста.</gray>"
  home-missing: "<red>Сфера побега не нашла дорогу домой.</red>"
  blood-donate-low: "<red>Кубок не примет жертву: крови у вас и так на дне.</red>"
  line-good-passive: "<yellow>★ Светлый артефакт · пассивный</yellow>"
  line-good-active: "<gold>★ Светлый артефакт · активный (ПКМ)</gold>"
  line-cursed-passive: "<red>✖ Проклятый артефакт · пассивный</red>"
  line-cursed-active: "<dark_red>✖ Проклятый артефакт · активный (ПКМ)</dark_red>"
  lore-desc: "<gray>%text%</gray>"
  lore-active-info: "<yellow>ПКМ — активировать · КД %cooldown%с · цена %xp% ур.</yellow>"
  trait-line-good: "<green>▲ %name% %levelroman%</green> <dark_gray>— %desc%</dark_gray>"
  trait-line-bad: "<red>▼ %name% %levelroman%</red> <dark_gray>— %desc%</dark_gray>"
  trait-good: "<green>польза</green>"
  trait-bad: "<red>вред</red>"
