# CHRDK_Artifacts — 65 артефактов (33 светлых, 32 проклятых). Метки артефактов и их
# свойства ▲/▼ живут в PDC предметов; прогресс коллекции и кулдауны — в collection.json
# и cooldowns.json рядом с этим файлом (с 1.4.130). Здесь включаемость, кулдауны и цена
# активации в уровнях опыта для каждого артефакта, уникальные свойства, коллекция и
# обратная связь.

general:
  locale: ru
  # Пассивные и активные артефакты работают только для авторизованных игроков.
  require-auth: true
  # Период (в тиках) пульса пассивных эффектов (20 тиков = 1 сек).
  passive-refresh-ticks: 40

# Природные источники артефактов (шанс в %; 0 — источник выключен).
sources:
  # Вес стороны при броске артефакта: светлая vs проклятая (по умолчанию 70/30).
  good-side-chance-percent: 70
  # Сундуки: ключ таблицы лута (можно полный minecraft:chests/… или короткий).
  chests:
    minecraft:chests/ancient_city: 12
    minecraft:chests/end_city_treasure: 15
    minecraft:chests/bastion_treasure: 10
    minecraft:chests/buried_treasure: 8
    minecraft:chests/woodland_mansion: 6
    minecraft:chests/shipwreck_treasure: 6
    minecraft:chests/pillager_outpost: 4
    minecraft:chests/desert_pyramid: 4
    minecraft:chests/stronghold_corridor: 3
    minecraft:chests/stronghold_crossing: 3
    minecraft:chests/ruined_portal: 3
    minecraft:chests/jungle_pyramid: 3
    minecraft:chests/simple_dungeon: 2
    minecraft:chests/abandoned_mineshaft: 2
  # Мобы: шанс дропа при убийстве игроком (типы — EntityType).
  mobs:
    ENDER_DRAGON: 100
    WITHER: 50
    WARDEN: 25
    ELDER_GUARDIAN: 12
    RAVAGER: 3
    EVOKER: 4
  # Сокровище с рыбалки (ванильная категория treasure: лук, книга, удочка, бирка,
  # ракушка, седло): дополнительная находка. Мусор (палка, кость, миска…) не считается.
  fishing-treasure-percent: 3

# Уникальные свойства артефактов (1.4.129): 15 полезных ▲ и 15 вредных ▼.
# Свойства бросаются при выдаче предмета и живут в его PDC («artifact_traits»),
# поэтому две копии одного артефакта могут отличаться. Светлому чаще достаётся
# польза, проклятому — вред, но изредка бывает наоборот (cross-chance): изъян на
# светлом артефакте и искра силы на проклятом делают предмет интереснее.
traits:
  # false — новые артефакты выдаются без свойств. Уже выданные свойства
  # продолжают работать: это часть предмета, снимать её за спиной игрока нельзя.
  enabled: true
  # Шанс (%), что артефакт вообще получит свойство. 0 — только «чистые» предметы.
  chance-percent: 55
  # Потолок свойств на один предмет (0..3). Второе свойство выпадает с шансом 35%.
  max-per-item: 2
  # Потолок уровня свойства (1..3): I — слабый эффект, III — заметный.
  max-level: 3
  # Шанс «чужой» полярности, %: изъян на светлом или польза на проклятом.
  cross-chance-percent: 12

# Коллекция артефактов (1.4.130): какие артефакты игрок уже находил.
# Открытие засчитывается, когда предмет попадает в инвентарь (подбор, выдача,
# находка), а также разово при входе и открытии /artifacts collection.
# Прогресс и выданные награды лежат в collection.json.
collection:
  enabled: true
  # Награды за долю открытого каталога, %: дни ранга + алмазы. Выдаются
  # один раз. Пустой блок (rewards: {}) вернёт набор по умолчанию — чтобы
  # выключить награды, поставьте enabled: false или нули в полях.
  rewards:
    25: {pass-days: 1, diamonds: 8}
    50: {pass-days: 2, diamonds: 16}
    75: {pass-days: 3, diamonds: 24}
    100: {pass-days: 7, diamonds: 32}

# Обратная связь (1.4.130): экшнбар и звуки вместо «тонущих» строк в чате.
feedback:
  # Показывать активацию, остаток кулдауна и проклятия над хотбаром.
  actionbar: true
  # Звуки активации, отказа, находки.
  sounds: true
  # Проклятия не чаще одного сообщения в чат на артефакт за этот интервал (сек).
  # 0 — писать каждый раз (старое поведение).
  curse-message-seconds: 10

# Мировые эффекты проклятых артефактов. «Раковина тоски» нагоняет грозу на весь мир,
# «Расколотая Луна» и «Часы дурошлёпа» переводят время. На публичном сервере это
# инструмент гриферства: выключите погоду/время или ограничьте список миров.
world-effects:
  weather: true
  time: true
  # Пусто — все миры; иначе только перечисленные (например: [world, world_nether]).
  worlds: []

