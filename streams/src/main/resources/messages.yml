streams:
  # Тексты CHRDK_Streams. Разметка — MiniMessage; %ключи% подставляются плагином.
  # --------------------------------- профиль ----------------------------------
  "profile-title": "Стримы"
  "profile-days": "<gray>Дней ранга за эфиры: </gray><aqua>%days%</aqua>"
