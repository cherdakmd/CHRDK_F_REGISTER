streams:
  # Тексты CHRDK_Streams. Разметка — MiniMessage; %ключи% подставляются плагином.
  "usage": "<yellow>Стример: /%label% <link <twitch|vkplay> <канал> | check | status | unlink | viewers [on|off]></yellow>"
  "usage-viewer": "<yellow>Зритель: /%label% <watch <стример> | watching | code <код> | watch stop></yellow>"
  "usage-admin": "<yellow>Админ: /%label% <stats | reload></yellow>"
  "players-only": "<red>Это команда только для игроков: привязка канала и просмотр идут от своего лица.</red>"
  "no-permission": "<red>Недостаточно прав для этой команды.</red>"
  "disabled": "<yellow>Стримерская программа сейчас выключена.</yellow>"
  "no-core": "<red>Ядро CHRDK_Core недоступно — награды выдать некому.</red>"
  "no-platform": "<red>Платформа «%name%» не настроена. Доступны: %list%</red>"
  "no-platforms": "<red>Ни одна платформа не настроена — обратитесь к администрации.</red>"

  "link-header": "<gold><bold>Привязка канала</bold></gold> <dark_gray>·</dark_gray> %platform%"
  "link-created": "<green>Канал %channel% привязан.</green> <gray>Проверка владения — код в названии эфира:</gray>"
  "link-code": "<gold><bold>%code%</bold></gold> <click:copy_to_clipboard:'%code%'><gray>[скопировать]</gray></click>"
  "link-howto": "<gray>1. Выйдите в эфир на %platform%. 2. Вставьте код в название стрима. 3. Напишите <white>/%label% check</white>.</gray>"
  "link-url": "<gray>Ваш канал: <aqua>%url%</aqua></gray>"
  "link-unknown-platform": "<red>Неизвестная платформа «%name%».</red> <gray>Доступны: %list%</gray>"
  "link-invalid-channel": "<red>Некорректное имя канала.</red> <gray>Латиница, цифры и «_», от 3 до 25 символов.</gray>"
  "link-taken-player": "<red>Канал %channel% уже привязан к другому игроку.</red>"
  "link-replaced": "<yellow>Прежняя привязка (%channel%) заменена.</yellow>"
  "link-trusted": "<green>Канал привязан и сразу подтверждён: проверка кодом отключена администрацией.</green>"

  "check-live": "<gray>Проверяем эфир %channel%…</gray>"
  "check-verified": "<green>Канал подтверждён: код найден в названии эфира.</green> <gray>Теперь каждый час стрима даёт сутки проходки.</gray>"
  "check-no-code": "<red>Эфир идёт, но кода в названии нет.</red> <gray>Название: %title%</gray> <gray>Нужен код <white>%code%</white>.</gray>"
  "check-offline": "<yellow>Эфир не идёт.</yellow> <gray>Запустите стрим с кодом <white>%code%</white> в названии и повторите.</gray>"
  "check-error": "<red>Платформа не ответила: %error%</red> <gray>Попробуйте позже.</gray>"
  "check-no-channel": "<red>Канал ещё не привязан.</red> <gray>Начните с /%label% link twitch <канал></gray>"
  "check-already": "<green>Канал уже подтверждён.</green>"

  "not-linked": "<gray>Канал не привязан. Начните с <white>/%label% link twitch <канал></white>.</gray>"

  "status-header": "<gold><bold>Стримерская программа</bold></gold> <dark_gray>·</dark_gray> %player%"
  "status-line": "<gray>Канал:</gray> <white>%channel%</white> <dark_gray>(%platform%)</dark_gray>"
  "status-verified": "<green>✔ подтверждён</green>"
  "status-unverified": "<yellow>⚠ не подтверждён — код %code% в названии эфира</yellow>"
  "status-progress": "<gray>До следующих суток:</gray> <white>%minutes% / %needed% мин.</white> <dark_gray>·</dark_gray> <gray>сегодня: %today% / %max%</gray>"
  "status-total": "<gray>Всего с программы:</gray> <white>%days% дн.</white>"
  "status-live": "<green>● эфир идёт</green> <gray>(%viewers% зр.)</gray>"
  "status-offline": "<dark_gray>○ эфира нет</dark_gray>"
  "status-error": "<dark_gray>○ платформа не ответила</dark_gray>"
  "status-online-hint": "<gray>Награда идёт только пока вы на сервере.</gray>"
  "status-footer": "<gray>Правило: %minutes% минут эфира — сутки проходки, до %max% суток в день.</gray>"

  "unlinked": "<yellow>Привязка канала удалена.</yellow> <gray>Прогресс дня сохранён.</gray>"
  "awarded": "<gold>✦ Эфир засчитан:</gold> <green>+%days% дн. проходки</green> <gray>(сегодня %today% / %max%)</gray>"
  "awarded-until": "<gray>Проходка активна до %until%.</gray>"
  "award-error": "<red>Не удалось выдать награду: %error%</red>"

  "stats-header": "<gold><bold>Стримерская программа</bold></gold> <gray>· привязок: %count%</gray>"
  "stats-line": "<white>%player%</white> <dark_gray>·</dark_gray> <gray>%platform%/%channel%</gray> <dark_gray>·</dark_gray> %state% <dark_gray>·</dark_gray> <gray>%days% дн. всего</gray>"
  "stats-state-verified": "<green>✔</green>"
  "stats-state-unverified": "<yellow>⚠</yellow>"
  "stats-viewers": "<gray>Зрителей: <white>%count%</white> · каналов с просмотром: <white>%streamers%</white></gray>"

  # ------------------------------- зрители -------------------------------
  "watch-disabled": "<yellow>Награды за просмотр сейчас выключены.</yellow>"
  "watch-usage": "<yellow>Введите код из эфира: /%label% code WATCH-XXXX</yellow>"
  "watch-none-hint": "<gray>Вы не смотрите ничей стрим.</gray> <gray>Начать: <white>/%label% watch <стример></white>.</gray>"
  "watch-no-streamer": "<red>Стример %player% не найден или канал не подтверждён.</red>"
  "watch-self": "<red>Свой канал смотреть нельзя.</red>"
  "watch-streamer-off": "<yellow>Этот стример выключил награды за просмотр.</yellow>"
  "watch-already": "<green>Вы уже смотрите канал %streamer%.</green>"
  "watch-replaced": "<yellow>Прежний канал (%streamer%) заменён.</yellow>"
  "watch-requested": "<green>Заявка отправлена стримеру %streamer%.</green> <gray>Он подтвердит, что вы подписаны на его каналы.</gray>"
  "watch-accepted": "<green>Вы смотрите канал %streamer%.</green> <gray>Код из эфира: <white>/%label% code <код></white>.</gray>"
  "watch-approved": "<green>Стример %streamer% подтвердил просмотр.</green>"
  "watch-denied": "<red>Стример %streamer% отклонил заявку.</red>"
  "watch-pending": "<yellow>Заявка на канал %streamer% ещё ждёт подтверждения.</yellow>"
  "watch-code-wrong": "<red>Код не подходит.</red> <gray>Возьмите свежий код с экрана эфира.</gray>"
  "watch-too-soon": "<gray>Следующий код можно ввести через %minutes% мин.</gray> <gray>(не чаще раза в %window% мин.)</gray>"
  "watch-offline": "<yellow>Эфир сейчас не идёт — засчитывать нечего.</yellow>"
  "watch-error": "<red>Платформа не ответила: %error%</red>"
  "watch-tick": "<green>+%minutes% мин. просмотра.</green> <gray>До суток: %left% мин. · сегодня: %today% / %max%</gray>"
  "watch-awarded": "<gold>✦ Просмотр засчитан:</gold> <green>+%days% дн. проходки</green> <gray>(сегодня %today% / %max%)</gray>"
  "watch-awarded-until": "<gray>Проходка активна до %until%.</gray>"
  "watch-award-error": "<red>Не удалось выдать награду: %error%</red>"
  "watch-left": "<yellow>Вы больше не смотрите канал %streamer%.</yellow> <gray>Прогресс сохранён.</gray>"
  "watch-status-header": "<gold><bold>Просмотр</bold></gold> <dark_gray>·</dark_gray> %player%"
  "watch-status-streamer": "<gray>Канал:</gray> <white>%streamer%</white> <dark_gray>·</dark_gray> %state%"
  "watch-state-accepted": "<green>подтверждён</green>"
  "watch-state-pending": "<yellow>ждёт подтверждения</yellow>"
  "watch-status-progress": "<gray>Просмотрено:</gray> <white>%minutes% / %needed% мин.</white> <dark_gray>·</dark_gray> <gray>сегодня: %today% / %max%</gray>"
  "watch-status-total": "<gray>Всего за просмотр:</gray> <white>%days% дн.</white>"
  "watch-status-code": "<gray>Код из эфира: <white>/%label% code <код></white></gray>"
  "watch-status-window": "<gray>Код меняется каждые %window% мин — вводите свежий.</gray>"
  "watch-status-off": "<yellow>Стример выключил наград за просмотр.</yellow>"

  # --------------------------- панель стримера ---------------------------
  "viewers-no-channel": "<red>Сначала привяжите и подтвердите канал.</red> <gray>Начните с /%label% link twitch <канал>.</gray>"
  "viewers-off-hint": "<gray>Просмотр выключен.</gray> <gray>Включить: <white>/%label% viewers on</white>.</gray>"
  "viewers-enabled": "<green>Просмотр включён.</green> <gray>Код для зрителей:</gray> <gold><bold>%code%</bold></gold> <click:copy_to_clipboard:'%code%'><gray>[скопировать]</gray></click>"
  "viewers-howto": "<gray>Показывайте код на экране эфира (оверлей/название). Он меняется каждые %minutes% мин — обновляйте.</gray>"
  "viewers-approval-on": "<gray>Заявки подтверждаются вручную: проверяйте, что зритель подписан на ваши каналы.</gray>"
  "viewers-approval-off": "<yellow>Подтверждение отключено: смотреть может любой, кто введёт код.</yellow>"
  "viewers-disabled": "<yellow>Просмотр выключен, отвязано зрителей: %count%.</yellow>"
  "viewers-usage": "<yellow>Стримеру: /%label% viewers <on|off> · /%label% viewer <accept|deny> <ник></yellow>"
  "viewers-panel-header": "<gold><bold>Зрители</bold></gold> <dark_gray>·</dark_gray> <gray>подтверждено: %accepted%, заявок: %pending%</gray>"
  "viewers-code": "<gray>Код для эфира:</gray> <gold><bold>%code%</bold></gold> <gray>(сменится через %minutes% мин.)</gray>"
  "viewers-pending-empty": "<gray>Новых заявок нет.</gray>"
  "viewers-pending-header": "<gray>Ждут подтверждения:</gray>"
  "viewers-pending-line": " <white>%player%</white> <dark_gray>·</dark_gray> <gray>/%label% viewer accept %player%</gray>"
  "viewer-none": "<red>Заявки от %player% нет.</red>"
  "viewer-accepted": "<green>%player% теперь смотрит ваш стрим.</green>"
  "viewer-denied": "<yellow>Заявка %player% отклонена.</yellow>"
  "viewer-request": "<aqua>%player% просит доступ к просмотру.</aqua> <gray>Подтвердить: /%label% viewer accept %player%</gray>"

  "stats-empty": "<gray>Пока никто не привязал канал.</gray>"
  "reloaded": "<green>Программа стримеров перечитана: платформ %platforms%, правило %minutes% мин. = 1 сутки, до %max% в день.</green>"
