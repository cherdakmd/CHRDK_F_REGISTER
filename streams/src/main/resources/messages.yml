streams:
  # Тексты CHRDK_Streams. Разметка — MiniMessage; %ключи% подставляются плагином.
  "usage": "<yellow>Использование: /%label% <link <twitch|vkplay> <канал> | check | status | unlink></yellow>"
  "usage-admin": "<yellow>Админ: /%label% <stats | reload></yellow>"
  "players-only": "<red>Это команда для игроков: привязка канала идёт от своего лица.</red>"
  "no-permission": "<red>Недостаточно прав для этой команды.</red>"
  "disabled": "<yellow>Стримерская программа сейчас выключена.</yellow>"
  "no-core": "<red>Ядро CHRDK_Core недоступно — награды выдать некому.</red>"
  "no-platform": "<red>Платформа «%name%» не настроена. Доступны: %list%</red>"
  "no-platforms": "<red>Ни одна платформа не настроена — обратитесь к администрации.</red>"

  "link-header": "<gold><bold>Привязка канала</bold></gold> <dark_gray>·</dark_gray> %platform%"
  "link-created": "<green>Канал %channel% привязан.</green> <gray>Проверка владения — код в названии эфира:</gray>"
  "link-code": "<gold><bold>%code%</bold></gold> <click:copy_to_clipboard:'%code%'><gray>[скопировать]</gray></click>"
  "link-howto": "<gray>1. Выйдите в эфир на %platform%. 2. Вставьте код в название стрима. 3. Напишите <white>/%label% check</white>.</gray>"
  "link-url": "<gray>Ваш канал: <aqua>%url%</aqua></gray>"
  "link-unknown-platform": "<red>Неизвестная платформа «%name%».</red> <gray>Доступны: %list%</gray>"
  "link-invalid-channel": "<red>Некорректное имя канала.</red> <gray>Латиница, цифры и «_», от 3 до 25 символов.</gray>"
  "link-taken-player": "<red>Канал %channel% уже привязан к другому игроку.</red>"
  "link-replaced": "<yellow>Прежняя привязка (%channel%) заменена.</yellow>"
  "link-trusted": "<green>Канал привязан и сразу подтверждён: проверка кодом отключена администрацией.</green>"

  "check-live": "<gray>Проверяем эфир %channel%…</gray>"
  "check-verified": "<green>Канал подтверждён: код найден в названии эфира.</green> <gray>Теперь каждый час стрима даёт сутки проходки.</gray>"
  "check-no-code": "<red>Эфир идёт, но кода в названии нет.</red> <gray>Название: %title%</gray> <gray>Нужен код <white>%code%</white>.</gray>"
  "check-offline": "<yellow>Эфир не идёт.</yellow> <gray>Запустите стрим с кодом <white>%code%</white> в названии и повторите.</gray>"
  "check-error": "<red>Платформа не ответила: %error%</red> <gray>Попробуйте позже.</gray>"
  "check-no-channel": "<red>Канал ещё не привязан.</red> <gray>Начните с /%label% link twitch <канал></gray>"
  "check-already": "<green>Канал уже подтверждён.</green>"

  "not-linked": "<gray>Канал не привязан. Начните с <white>/%label% link twitch <канал></white>.</gray>"

  "status-header": "<gold><bold>Стримерская программа</bold></gold> <dark_gray>·</dark_gray> %player%"
  "status-line": "<gray>Канал:</gray> <white>%channel%</white> <dark_gray>(%platform%)</dark_gray>"
  "status-verified": "<green>✔ подтверждён</green>"
  "status-unverified": "<yellow>⚠ не подтверждён — код %code% в названии эфира</yellow>"
  "status-progress": "<gray>До следующих суток:</gray> <white>%minutes% / %needed% мин.</white> <dark_gray>·</dark_gray> <gray>сегодня: %today% / %max%</gray>"
  "status-total": "<gray>Всего с программы:</gray> <white>%days% дн.</white>"
  "status-live": "<green>● эфир идёт</green> <gray>(%viewers% зр.)</gray>"
  "status-offline": "<dark_gray>○ эфира нет</dark_gray>"
  "status-error": "<dark_gray>○ платформа не ответила</dark_gray>"
  "status-online-hint": "<gray>Награда идёт только пока вы на сервере.</gray>"
  "status-footer": "<gray>Правило: %minutes% минут эфира — сутки проходки, до %max% суток в день.</gray>"

  "unlinked": "<yellow>Привязка канала удалена.</yellow> <gray>Прогресс дня сохранён.</gray>"
  "awarded": "<gold>✦ Эфир засчитан:</gold> <green>+%days% дн. проходки</green> <gray>(сегодня %today% / %max%)</gray>"
  "awarded-until": "<gray>Проходка активна до %until%.</gray>"
  "award-error": "<red>Не удалось выдать награду: %error%</red>"

  "stats-header": "<gold><bold>Стримерская программа</bold></gold> <gray>· привязок: %count%</gray>"
  "stats-line": "<white>%player%</white> <dark_gray>·</dark_gray> <gray>%platform%/%channel%</gray> <dark_gray>·</dark_gray> %state% <dark_gray>·</dark_gray> <gray>%days% дн. всего</gray>"
  "stats-state-verified": "<green>✔</green>"
  "stats-state-unverified": "<yellow>⚠</yellow>"
  "stats-empty": "<gray>Пока никто не привязал канал.</gray>"
  "reloaded": "<green>Программа стримеров перечитана: платформ %platforms%, правило %minutes% мин. = 1 сутки, до %max% в день.</green>"
