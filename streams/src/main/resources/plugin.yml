name: CHRDK_Streams
version: ${version}
main: ru.cherdakmd.chrdkstreams.StreamPlugin
api-version: '26.3'
description: "Награда стримерам: час эфира на Twitch или VK Play Live — сутки проходки (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI]
commands:
  stream:
    description: "Стримерская программа: привязка канала, статус, награды"
    aliases: [streams, strimer]
    usage: "/stream <link <twitch|vkplay> <канал> | check | status | unlink | viewers [on|off] | viewer <accept|deny> <ник> | watch <стример> | watching | code <код> | stats | reload>"
permissions:
  chrdkstreams.use:
    description: "Стримерская программа и просмотр (/stream link, check, status, viewers, watch, code)"
    default: true
  chrdkstreams.admin:
    description: "Управление программой (/stream stats, reload)"
    default: op
