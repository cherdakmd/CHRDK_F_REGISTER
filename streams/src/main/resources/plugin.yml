name: CHRDK_Streams
version: ${version}
main: ru.cherdakmd.chrdkstreams.StreamPlugin
api-version: '26.3'
description: "Награда стримерам: час эфира на Twitch или VK Play Live — сутки проходки (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI]
commands:
  stream:
    description: "Стримерская программа: привязка канала, статус, награды"
    aliases: [streams, strimer]
    usage: "/stream <link <twitch|vkplay> <канал или ссылка> | check [площадка] | status | unlink [площадка] | top [n] | viewers [on|off] | viewer <accept|deny|list> [ник] | watch <стример или канал> | watching | code <код> | stats | admin unlink <ник> [площадка] | reload>"
permissions:
  chrdkstreams.use:
    description: "Стримерская программа и просмотр (/stream link, check, status, top, viewers, watch, code)"
    default: true
  chrdkstreams.admin:
    description: "Управление программой (/stream stats, admin unlink, reload)"
    default: op
