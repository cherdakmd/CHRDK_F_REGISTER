general:
  # Язык сообщений: ru — messages.yml. Другие значения ищут messages_<locale>.yml.
  locale: ru

streams:
  # Выключатель программы целиком: false — эфиры не опрашиваются, награды не начисляются,
  # /stream status объясняет, что программа выключена администрацией.
  enabled: true

  # Награда: сколько минут эфира дают одни сутки проходки. 60 — «час стрима = сутки».
  minutes-per-day: 60
  # Потолок наград за одни календарные сутки (UTC). 6 — не больше шести суток в день,
  # даже если стример вещает круглосуточно.
  max-days-per-day: 6
  # Потолок суммарно с программы (дней на игрока). 0 — без потолка.
  # Считаются только дни, полученные за эфир: покупки и подарки этот счётчик не трогают.
  max-total-days: 365

  # Как часто опрашивать платформы (секунды). Минимум 60: у Twitch жёсткие лимиты API,
  # у VK Play Live запрос дешёвый, но спамить тоже не нужно.
  poll-seconds: 120
  # Максимум минут за один опрос. Защита от «сервер стоял сутки, потом начислил сутки
  # за один тик»: при первом опросе после простоя считается только этот объём.
  max-credit-minutes: 10

  # Считать эфир только пока игрок на сервере. false — эфир капает и в оффлайне
  # (не рекомендуется: включать стрим и уходить — прямой путь к накрутке).
  require-online: true
  # Требовать код в названии эфира. Без этого любой мог бы указать чужой канал.
  # false — привязка доверенная (только для тестов на своём сервере).
  require-verified: true
  # Минимум зрителей, чтобы эфир считался. 0 — любой эфир, даже без зрителей.
  min-viewers: 0

  # Сообщать игроку в чат о каждой начисленной награде (иначе — молча, только /stream status).
  announce: true

  twitch:
    # Twitch Helix API. Нужны Client ID и Client Secret приложения:
    # https://dev.twitch.tv/console/apps → Register Your Application.
    # Токен приложения плагин получает сам (client_credentials) и обновляет.
    enabled: true
    client-id: ""
    client-secret: ""
    # Готовый токен вместо client-secret (необязательно). Если задан — секрет не нужен;
    # учтите, что приложение-токен истекает примерно через 60 дней.
    token: ""

  vkplay:
    # VK Play Live (сейчас VK Видео Live) — публичный эндпоинт канала.
    # %channel% подставляется в путь; канал — латиница, цифры и «_».
    enabled: true
    api-url: "https://api.vkplay.live/v1/blog/%channel%/public_video_stream"
