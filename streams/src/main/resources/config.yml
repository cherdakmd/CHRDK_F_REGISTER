general:
  # Язык сообщений: ru — messages.yml. Другие значения ищут messages_<locale>.yml.
  locale: ru

  # Автосохранение прогресса (минуты). 0 — выключить. События (новая привязка,
  # награда) пишутся на диск сразу, а минуты между ними — по этому таймеру:
  # при падении сервера теряется не больше одного интервала.
  auto-save-minutes: 5

streams:
  # Выключатель программы целиком: false — эфиры не опрашиваются, награды не начисляются,
  # /stream status объясняет, что программа выключена администрацией.
  enabled: true

  # Награда: сколько минут эфира дают одни сутки ранга. 60 — «час стрима = сутки».
  minutes-per-day: 60
  # Потолок наград за одни календарные сутки (UTC). 6 — не больше шести суток в день,
  # даже если стример вещает круглосуточно.
  max-days-per-day: 6
  # Потолок суммарно с программы (дней на игрока). 0 — без потолка.
  # Считаются только дни, полученные за эфир: покупки и подарки этот счётчик не трогают.
  max-total-days: 365

  # Как часто опрашивать платформы (секунды). Минимум 60: у Twitch жёсткие лимиты API,
  # у VK Play Live запрос дешёвый, но спамить тоже не нужно.
  poll-seconds: 120
  # Максимум минут за один опрос. Защита от «сервер стоял сутки, потом начислил сутки
  # за один тик»: при первом опросе после простоя считается только этот объём.
  max-credit-minutes: 10

  # Считать эфир только пока игрок на сервере. false — эфир капает и в оффлайне
  # (не рекомендуется: включать стрим и уходить — прямой путь к накрутке).
  require-online: true
  # Требовать код в названии эфира. Без этого любой мог бы указать чужой канал.
  # false — привязка доверенная (только для тестов на своём сервере).
  require-verified: true
  # Подтверждать канал автоматически: опрос сам ищет код в названии эфира и
  # снимает ручной шаг /stream check. false — только вручную.
  verify-on-poll: true
  # Минимум зрителей, чтобы эфир считался. 0 — любой эфир, даже без зрителей.
  # При нескольких каналах сравнивается СУММА зрителей всех живых эфиров.
  min-viewers: 0

  # Сколько каналов может привязать один стример: 1 или 2. Два — это Twitch
  # и VK Play Live одновременно; на одной площадке канал всегда один, поэтому
  # больше двух не поддерживается. Прогресс при этом общий: час эфира даёт
  # сутки ранга один раз, даже если стрим идёт на двух площадках сразу.
  max-channels: 2

  # Сообщать игроку в чат о каждой начисленной награде (иначе — молча, только /stream status).
  # Пауза между ручными проверками канала, секунды (0 — без паузы). Защита от
  # того, чтобы /stream check не молотил API площадок по кругу.
  check-cooldown-seconds: 30
  # Сколько секунд /stream status доверяет последнему опросу, прежде чем снова
  # спрашивать площадку. 0 — всегда запрашивать заново.
  status-cache-seconds: 60

  announce: true

  # Метка стримера: жирный ник и «[СТРИМ]» после него (1.4.116).
  tags:
    # Выключатель оформления. Сама программа при этом продолжает работать.
    enabled: true
    # Текст метки. Разметка MiniMessage здесь не нужна — только буквы.
    text: "СТРИМ"
    # Цвет метки в чате. Сообщение нельзя «мигать» задним числом, поэтому в чате
    # цвет постоянный; мигание — в списке игроков (TAB).
    chat-color: "red"
    # Период смены цвета в TAB (тики). 20 тиков = 1 секунда.
    blink-ticks: 15
    # Два цвета, между которыми мигает метка.
    color-a: "red"
    color-b: "dark_gray"
    # Управлять именем в списке игроков. Если в ядре задан
    # tablist.player-name-format, аддон не вмешивается (имя всё равно перезапишется):
    # добавьте %player_tagged% в формат ядра — там будет и метка.
    tab: true

  # Награды зрителям за просмотр (1.4.116).
  #
  # Как это работает:
  #   1. стример: /stream viewers on — плагин выдаёт код WATCH-XXXX,
  #      стример показывает его на экране эфира (оверлей/название);
  #   2. зритель: /stream watch <стример> — заявка; стример подтверждает её
  #      командой /stream viewer accept <ник>, если человек подписан на его каналы;
  #   3. зритель вводит код из эфира: /stream code WATCH-XXXX.
  #
  # Код меняется каждые code-window-minutes: перестал смотреть — пропустил смену
  # и минуты больше не капают. Проверить «подписан ли зритель» автоматически
  # нельзя: у Twitch для этого нужен OAuth каждого зрителя, у VK Play Live
  # официального API фолловеров нет. Поэтому фолловер-проверка — подтверждение
  # стримером (он видит список подписчиков в панели канала).
  viewers:
    enabled: true
    # Сколько минут просмотра дают сутки ранга. 120 — два часа за сутки.
    minutes-per-day: 120
    # Потолок за календарные сутки (UTC) и за всё время с просмотра.
    max-days-per-day: 1
    max-total-days: 30
    # Окно кода: как часто стримеру нужно обновлять код на экране (3–120 мин).
    code-window-minutes: 10
    # Не чаще одного чек-ина в столько минут (1–окно).
    checkin-min-minutes: 5
    # true — заявку подтверждает стример (фолловеры). false — пускать любого,
    # кто ввёл код (проще, но подписка не проверяется).
    require-approval: true
    # Сколько зрителей можно подтвердить одному стримеру (0 — без лимита).
    # Стримерская награда ценнее зрительской, поэтому поток заявок ограничен.
    max-per-streamer: 50
    # Сколько часов живёт заявка, которую стример не подтвердил (0 — бессрочно).
    request-ttl-hours: 72
    # Защита от перебора кода: столько ошибок подряд — и ввод блокируется.
    # 0 — не блокировать (не рекомендуется: код короткий).
    max-code-attempts: 5
    code-lock-minutes: 5
    # Присылать стримеру в чат новый код, когда окно истекло.
    announce-code: true

  twitch:
    # Twitch Helix API. Нужны Client ID и Client Secret приложения:
    # https://dev.twitch.tv/console/apps → Register Your Application.
    # Токен приложения плагин получает сам (client_credentials) и обновляет.
    enabled: true
    client-id: ""
    client-secret: ""
    # Готовый токен вместо client-secret (необязательно). Если задан — секрет не нужен;
    # учтите, что приложение-токен истекает примерно через 60 дней.
    token: ""

  vkplay:
    # VK Play Live (сейчас VK Видео Live) — публичный эндпоинт канала.
    # %channel% подставляется в путь; канал — латиница, цифры и «_».
    enabled: true
    api-url: "https://api.vkplay.live/v1/blog/%channel%/public_video_stream"
