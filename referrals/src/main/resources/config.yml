# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_Referrals — реферальная система (аддон CHRDK_F_REGISTER)
# Новичок привязывается к пригласившему (/ref use <ник>) ДО первой подписки;
# когда он впервые оплачивает ранг — оба получают бонусные ЧАСЫ ранга (с 1.4.184;
# раньше единицей были сутки, старые ключи bonus-days.* читаются как часы).
# ═══════════════════════════════════════════════════════════════════════════

bonus-hours:
  # Бонус пригласившему за оплатившего друга (часы ранга, потолок 24)
  inviter: 7
  # Бонус самому приглашённому (добавляется к его первому рангу, потолок 24)
  invitee: 3

rules:
  # Пригласитель обязан пройти регистрацию пароля (анти-одноразовые аккаунты)
  require-inviter-registered: true
  # Одноразовая подсказка новичку при входе («знаете код? /ref use <ник>»)
  join-hint: true

general:
  locale: "ru"
