# ═══════════════════════════════════════════════════════════════════════════
# CHRDK_Referrals — реферальная система (аддон CHRDK_F_REGISTER)
# Новичок привязывается к пригласившему (/ref use <ник>) ДО первой проходки;
# когда он впервые оплачивает проходку — оба получают бонусные дни.
# ═══════════════════════════════════════════════════════════════════════════

bonus-days:
  # Бонус пригласившему за оплатившего друга
  inviter: 7
  # Бонус самому приглашённому (добавляется к его первой проходке)
  invitee: 3

rules:
  # Пригласитель обязан пройти регистрацию пароля (анти-одноразовые аккаунты)
  require-inviter-registered: true
  # Одноразовая подсказка новичку при входе («знаете код? /ref use <ник>»)
  join-hint: true

general:
  locale: "ru"
