messages:
  "ref":
    "no-api": "<red>Ядро CHRDK_F_REGISTER не найдено — реферальная система недоступна.</red>"
    "usage": "<gray>/ref — статус и ваш код (ваш ник); /ref use <ник> — вас пригласили; /ref top — лучшие приглашатели</gray>"
    "status-header": "<gold>=== Реферальная программа ===</gold>"
    "status-code": "<gray>Ваш код — ваш ник: </gray><aqua>%player%</aqua>"
    "status-stats": "<gray>Приглашено друзей: %linked% (оплатили: %paid%), заработано часов: %hours%</gray>"
    "status-linked-none": "<gray>Вы ни к кому не привязаны. Знаете чей-то код? </gray><yellow>/ref use <ник></yellow>"
    "status-linked-to": "<gray>Ваша пригласивший: </gray><aqua>%inviter%</aqua>%consumed%"
    "status-consumed": "<gray> (бонус уже выплачен)</gray>"
    "how-it-works": "<dark_gray>Позовите друга: он пишет /ref use %player% до первой оплаты — вы оба получаете по %bonus% ч. буста.</dark_gray>"
    "use-ok": "<green>Готово! Вас пригласил(а) </green><aqua>%inviter%</aqua><green>. Оформите ранг — вы оба получите бонусные дни.</green>"
    "use-already-linked": "<red>Вы уже привязаны к %inviter% — привязка одноразовая.</red>"
    "use-self": "<red>Нельзя привязаться к самому себе.</red>"
    "use-too-late": "<red>Привязаться можно только до первой оплаченной подписки (у вас она уже была).</red>"
    "use-inviter-unregistered": "<red>%inviter% ещё не прошёл регистрацию на сервере — привязка невозможна.</red>"
    "bonus-you": "<gold>✔ Реферальный бонус: +%hours% ч. к рангу — добро пожаловать от %inviter%!</gold>"
    "bonus-inviter": "<gold>✔ Ваш друг <aqua>%invitee%</aqua> оформил ранг! Бонус: +%hours% ч.</gold>"
    "join-hint": "<gold>Подсказка:</gold> <gray>если вас позвал друг, напишите </gray><yellow>/ref use <его_ник></yellow><gray> до первого продления ранга после приветственного периода. Бонус выдаётся при оплаченной выдаче ранга.</gray>"
    "top-header": "<gold>=== Топ приглашателей ===</gold>"
    "top-line": "<gray>%index%. <aqua>%player%</aqua> — оплативших друзей: %paid% (часов заработано: %hours%)</gray>"
    "top-empty": "<yellow>Пока никто не пригласил оплативших друзей.</yellow>"
  "admin":
    "usage": "<gray>/refadmin lookup <ник> | reset <ник> | reload</gray>"
    "lookup": "<gray>%player%: привязок %linked%, оплативших %paid%, часов заработано %hours%. Сам привязан к: %inviter%</gray>"
    "lookup-none": "<gray>По %player% данных нет.</gray>"
    "reset-ok": "<green>Реферальная привязка %player% сброшена.</green>"
    "reset-none": "<yellow>У %player% нет привязки.</yellow>"
    "reloaded": "<green>Конфигурация рефералки перечитана.</green>"
