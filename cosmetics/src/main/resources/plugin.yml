name: CHRDK_Cosmetics
version: ${version}
main: ru.cherdakmd.chrdkcosmetics.CosmeticsPlugin
api-version: '26.3'
description: "Косметика владельцев проходки: шлейфы частиц при ходьбе и торжественный эффект входа (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  cosmetics:
    description: "Косметические эффекты: шлейфы частиц"
    aliases: [cosmetic, cos]
    usage: "/cosmetics [list|off|<эффект>]"
permissions:
  chrdkcosmetics.use:
    description: "Выбирать косметические эффекты"
    default: true
