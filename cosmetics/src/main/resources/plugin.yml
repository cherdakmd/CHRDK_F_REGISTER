name: CHRDK_Cosmetics
version: ${version}
main: ru.cherdakmd.chrdkcosmetics.CosmeticsPlugin
api-version: '26.3'
description: "Косметика владельцев ранга: шлейфы частиц при ходьбе и торжественный эффект входа (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  cosmetic:
    description: "Косметические эффекты: шлейфы частиц"
    aliases: [cosmetics, cos]
    usage: "/cosmetic [list|trails|text|off|<эффект>]"
permissions:
  chrdkcosmetics.use:
    description: "Выбирать косметические эффекты"
    default: true
