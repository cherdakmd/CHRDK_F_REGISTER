# CHRDK_CommonGoals — тексты и имена общих целей (goal.<id>.name).
goals:
  need-auth: "<red>Сначала войдите на сервер (/login).</red>"
  player-only: "<red>Команда доступна только игрокам.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  usage: "<gray>/goals — активные цели и ваш вклад; /goals claim — забрать награды; /goals top — лидеры; /goals donate <кол-во> — взнос в котёл.</gray>"
  goal-completed: "<gold>⚑ Цель «%goal%» выполнена! Пул %pool% ⛁ разошёлся между %heroes% героев.</gold>"
  goal-complete-you: "<green>✦ Ваша доля за цель «%goal%»: %reward% ⛁ — заберите через /goals claim.</green>"
  hero-line: "<gray>%place%. %name% — %contrib% (%percent%%)</gray>"
  rotated: "<gold>Новая волна общих целей! Смотрите /goals.</gold>"
  all-done-idle: "<yellow>Все цели волны выполнены — новая ротация уже на подходе.</yellow>"
  list-header: "<gold>══════ Общие цели сервера (до %until%) ══════</gold>"
  list-line-active: "<yellow>⚐ %name%</yellow> <gray>%progress%/%target% (%percent%%) · ваш вклад: %mine% · лидер: %leader%</gray>"
  list-line-done: "<green>✔ %name% — выполнено!</green> <gray>ваш вклад: %mine%</gray>"
  list-footer: "<gray>Пул наград делится между участниками по вкладу. Накоплено у вас: <aqua>%pending% ⛁</aqua> — /goals claim.</gray>"
  top-header: "<gold>══════ Лидеры общих целей ══════</gold>"
  top-line-header: "<yellow>%name%</yellow>"
  top-none: "<gray>В этой волне вклада ещё нет — откроем/подсчитаем первые герои.</gray>"
  donate-done: "<aqua>В котёл общих целей внесено %amount% ⛁. Спасибо!</aqua>"
  donate-none: "<red>У вас нет алмазов (или их руд/блоков) на такую сумму.</red>"
  donate-invalid: "<red>Количество — целое число от 1 до %max%.</red>"
  donate-no-goal: "<gray>Сейчас нет активной цели «Общий котёл» — взнос не принят.</gray>"
  claim-done: "<green>Получено %amount% ⛁ из общей награды!</green>"
  claim-none: "<gray>У вас пока нет незабранных наград общих целей.</gray>"
  join-pending: "<aqua>Общие цели запомнили вас: ждёт %amount% ⛁. Заберите: /goals claim.</aqua>"
  admin-rotated: "<green>Волна целей принудительно обновлена.</green>"
  admin-reloaded: "<green>Конфигурация общих целей перечитана.</green>"
  admin-progress-set: "<green>Прогресс цели «%goal%» теперь %progress%.</green>"
  admin-unknown-goal: "<red>Нет такой цели. Активные смотрите в /goals.</red>"
  admin-usage: "<yellow>/goalsadmin rotate | reload | progress <id> <значение></yellow>"
