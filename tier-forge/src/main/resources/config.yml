# CHRDK_TierForge — крафт с накатом редкости (Terraria-style).
# Хранилище — только NBT (PDC) предметов.

general:
  locale: ru

# Шанс, что подходящие предметы получат накат при крафте (0 = аддон не трогает крафты).
# При identify.enabled: true это шанс ПОМЕТКИ «неопознанным» (редкость скрыта до инвентаря).
roll-on-craft-chance-percent: 100

# 7 тиров редкости, от слабого к сильному. weight — вес выпадения (столбик в сумме),
# percent — базовая сила тира (-х = штраф). С 1.4.124 она ощутима в игре:
#   оружие ближнего боя — percent × 2 к урону (легендарный клинок +60%);
#   лук/арбалет/трезубец — тот же процент к урону стрелы по факту попадания;
#   инструменты — percent × 3 к скорости добычи (легендарная кирка +90%);
#   броня — percent / 5 к скорости бега за деталь (легендарный сет ≈ +26%),
#   плюс percent / 2 к броне и percent / 2 к твёрдости.
# Топор — и оружие, и инструмент, поэтому получает и урон, и скорость добычи;
# кирке, лопате и мотыге урон от тира не выдаётся (с 1.4.117).
# Утилита (щит, рог, осколок эха, сердце моря, фонарь душ, часы, тотем) с 1.4.142
# получает тир, но не боевой профиль: percent / 5 к скорости бега и +1 удачи за
# каждые 10% (проклятый тир — −1). Ни урона, ни добычи, ни брони у неё нет.
# Старые предметы пересобираются сами при входе и смене слота — вручную ничего
# перекрафчивать не нужно.
tiers:
  cursed:    {weight: 5,  percent: -12}
  weak:      {weight: 15, percent: -5}
  common:    {weight: 30, percent: 0}
  fine:      {weight: 20, percent: 6}
  rare:      {weight: 15, percent: 12}
  epic:      {weight: 10, percent: 20}
  legendary: {weight: 5,  percent: 30}

# Уникальные свойства тиров (1.4.118): у каждого тира свой пул из 15 свойств
# (реестр в коде, см. TierProperties). Предмет получает свойство своего тира
# при накате, перекате, слиянии и апгрейде; при смене тира свойство меняется
# вместе с ним. Свойство видно в лоре строкой с маркером ✧ и в /tiers info.
properties:
  # false — новые накаты дают только процент тира, без уникальных свойств.
  # Уже выданные предметы свойство сохраняют: выключение не отбирает силу.
  enabled: true
  # Сколько разных свойств получает один предмет (1..3). 1 — «уникальное»,
  # 2–3 — для серверов, где редкость должна ощущаться сильнее.
  per-item: 1

# Универсальные аффиксы (волна 17): 15 хороших и 15 плохих свойств, не привязанных
# к тиру. Свойство тира задаёт «характер» редкости, аффиксы добавляют поверх него
# случайные достоинства ◆ и дефекты ✖. Тир решает только количество:
#   проклятый — 0 бонусов и 2 дефекта      редкий    — 1 бонус, 0 дефектов
#   слабый    — 0 бонусов и 1 дефект       эпический — 2 бонуса, 0 дефектов
#   простой   — 1 бонус и 1 дефект         легендарный — 2 бонуса, 0 дефектов
#   хороший   — 1 бонус, 0 дефектов
# Аффиксы детерминированы: один и тот же предмет всегда получает тот же набор,
# поэтому предпросмотр наковальни не «переролливается».
affixes:
  # false — аффиксов нет; уже выданные пропадут из лора и эффектов при
  # ближайшей пересборке (вход игрока, смена слота, перекат).
  enabled: true
  # Потолок бонусов на предмет (0..3). 0 — отключить только хорошие.
  max-good: 2
  # Потолок дефектов на предмет (0..3). 0 — сервер без минусов.
  max-bad: 2

# Случайные зачарования (волна 17): иногда тир-предмет приходит уже зачарованным.
# Зачарования не снимаются: если предмет зачарован игроком, плагин его не трогает.
# Пул зависит от вида: меч, топор, лук, арбалет, трезубец, шлем, нагрудник/
# штаны, ботинки, инструмент — только ванно допустимые для предмета чары.
# Взаимоисключающие чары вместе не выпадают (защиты между собой, удача/шёлк,
# острота/кара/бич). Уровень растёт по лестнице: I–II внизу, III наверху.
enchantments:
  # false — тир-предметы больше не получают зачарований «в комплекте».
  # Уже выданные чары остаются на предметах: это настоящие зачарования, и
  # снимать их за спиной игрока было бы потерей прогресса.
  enabled: true
  # Базовый шанс для проклятого тира, %. Каждый тир выше добавляет +8%
  # (легендарный — 68%). 0 — зачарования не выпадают ни на одном тире.
  chance-percent: 20
  # Сколько чар максимум на предмет (0..3). 1 — ровно одно без второго броска.
  max-per-item: 2
  # Потолок уровня зачарования (1..5) с учётом тира.
  max-level: 3
  # Кастомные чары CHRDK_Enchants (волна 18). Мягкая зависимость: если аддон
  # чар не установлен или старее 1.4.128, секция просто игнорируется.
  # Чары кладутся после сборки предмета и не переролливаются при пересборке:
  # бросок детерминирован по uid предмета и тиру (как аффиксы).
  custom:
    # false — тир-предметы не получают кастомных чар аддона.
    enabled: true
    # Базовый шанс для проклятого тира, %. Каждый тир выше добавляет +8%,
    # то есть у легендарного шанс = значение + 48%. 0 — выключено.
    chance-percent: 18
    # Сколько кастомных чар максимум на предмет (0..2).
    max-per-item: 1
    # Из сработавших выдач столько процентов становятся проклятием (0 — только
    # светлые). Проклятие вешает на предмет настоящий минус, поэтому по
    # умолчанию оно доступно лишь на высоких тирах.
    curse-chance-percent: 15
    # С какого тира допустимы проклятия: 0 cursed … 6 legendary.
    # 5 = только эпический и легендарный — «плата» за силу редкости.
    curse-min-tier: 5

# Визуальный образ тира (1.4.119): блеск предмета и аура частиц вокруг игрока.
# Аура рисуется за САМЫЙ СИЛЬНЫЙ тир из рук и надетой брони — одна на игрока,
# поэтому полный сет не превращается в облако. Инвентарь не светится: эффект
# виден только у взятого в руки/надетого предмета.
visuals:
  # false — без аур; блеск остаётся прежним (только у легендарного предмета).
  enabled: true
  # Как часто обновлять ауру, в тиках (5..40). 10 = два раза в секунду.
  interval-ticks: 10
  # true — частицы видит только сам владелец; false — все игроки рядом.
  self-only: false
  # Учитывать надетую броню при выборе тира для ауры.
  armor: true
  # Стили по тирам.
  #   glint: inherit — как в ванили (блеск только у зачарованных);
  #          on      — блестит всегда; off — блеска нет даже у зачарованных.
  #   particles — до трёх слоёв. type — частица Bukkit; DUST (цветная пыль)
  #               дополнительно понимает color: "#RRGGBB" и size: 0.1..4.
  #               count 1..8, spread 0..2, speed 0..1.
  #               Поддерживаются частицы без данных и DUST; остальные
  #               (ITEM, BLOCK, SCULK_CHARGE …) пропускаются с предупреждением.
  #   Пустой список particles: [] — тир без ауры.
  tiers:
    cursed:
      glint: "off"
      particles:
        - type: DUST
          color: "#6A0F14"
          size: 1.1
          count: 2
          spread: 0.32
          speed: 0.0
        - type: SMOKE
          count: 1
          spread: 0.35
          speed: 0.01
    weak:
      glint: inherit
      particles:
        - type: DUST
          color: "#9A9A9A"
          size: 1.0
          count: 1
          spread: 0.28
          speed: 0.0
    common:
      glint: inherit
      particles:
        - type: DUST
          color: "#E8E8E8"
          size: 0.9
          count: 1
          spread: 0.22
          speed: 0.0
    fine:
      glint: inherit
      particles:
        - type: DUST
          color: "#49B04F"
          size: 1.0
          count: 2
          spread: 0.30
          speed: 0.0
    rare:
      glint: inherit
      particles:
        - type: DUST
          color: "#2FD3E0"
          size: 1.05
          count: 2
          spread: 0.30
          speed: 0.0
        - type: BUBBLE
          count: 1
          spread: 0.30
          speed: 0.02
    epic:
      glint: "on"
      particles:
        - type: DUST
          color: "#B165F0"
          size: 1.15
          count: 3
          spread: 0.34
          speed: 0.0
        - type: PORTAL
          count: 1
          spread: 0.40
          speed: 0.05
    legendary:
      glint: "on"
      particles:
        - type: DUST
          color: "#FFC53D"
          size: 1.20
          count: 3
          spread: 0.38
          speed: 0.0
        - type: FLAME
          count: 1
          spread: 0.24
          speed: 0.005
        - type: END_ROD
          count: 1
          spread: 0.34
          speed: 0.01

# Статистика находок (stats.yml в папке аддона).
stats:
  # Сколько резервных копий хранить перед каждой перезаписью: stats.yml.bak1 …
  # 0 — не хранить копии (атомарная запись при этом остаётся).
  backup-copies: 3

# Коллекция кузни (1.4.150): игрок собирает не предметы, а впечатления —
# 7 редкостей, 105 свойств тиров (по 15 на тир) и 30 аффиксов (15 ◆ и 15 ✖).
# Первое появление отмечается в книге и переживает перезапуск. /tiers collection
# открывает витрину; за вехи начисляются дни ранга и алмазы — один раз.
collection:
  # false — книга не пополняется, витрина закрыта. Собранное сохраняется.
  enabled: true
  # Объявлять в чат каждую новинку (только счётчики, без спойлеров).
  announce-finds: true
  # Титулы за закрытые разделы надеваются рядом с ником в чате и в таб-листе
  # (текст — messages.yml, ключи title.*; выбор игрока — /tiers collection title).
  titles:
    enabled: true
    # Таб-лист: аддон сам рисует имя «ник · титул», если ядро не задаёт
    # tablist.player-name-format. Если ядро задаёт формат с %player_tagged%,
    # титул уже там — аддон имена не трогает (дважды никто не пишет).
    # Если список игроков ведёт сторонний TAB-плагин — выключите эту опцию
    # и поставьте в его конфиге %chrdktierforge_title%. Уже занятое чужими
    # плагинами имя (метка стримера) аддон не перебивает: уступает и ждёт.
    tab:
      enabled: true
      name-format: "<white>%player%</white> <dark_gray>·</dark_gray> %title%"
      # Период обновления списка игроков, 20 тиков = 1 сек (20..1200).
      refresh-ticks: 60
  rewards:
    # Награды за ПОЛНОСТЬЮ закрытый раздел: все 7 редкостей, все 30 аффиксов,
    # все 105 свойств или вся кузня (142). Выдаются один раз, вместе с титулом.
    # С 1.4.184 награда измеряется ЧАСАМИ буста (boost-hours), потолок — 24 ч.
    # Прежние «сутки» за единицу больше не выдаются.
    sections:
      tiers: {boost-hours: 3, diamonds: 16}
      affixes: {boost-hours: 5, diamonds: 24}
      properties: {boost-hours: 8, diamonds: 48}
      all: {boost-hours: 15, diamonds: 96}
    # Промежуточные вехи по уникальным свойствам тиров: ключ — сколько собрать.
    properties:
      15: {boost-hours: 2, diamonds: 8}
      45: {boost-hours: 4, diamonds: 16}
      75: {boost-hours: 7, diamonds: 32}
    # Промежуточные вехи по аффиксам (15 хороших + 15 плохих).
    affixes:
      10: {boost-hours: 2, diamonds: 8}
      20: {boost-hours: 4, diamonds: 16}

anvil:
  # Мастер-выключатель всех механик наковальни: слияние тиров, перекат и ковка
  # улучшений. false = аддон не трогает наковальню (ванильные починка и
  # переименование работают как обычно).
  # Слияние: два предмета одного материала и тира → тир выше.
  # «Неопознанные» предметы на наковальне не обрабатываются — сначала инвентарь.
  enabled: true
  # Оплата опытом за уровень тира повышения (умножается на индекс тира).
  base-xp-cost: 3

reroll:
  # Перекат: тир-предмет + катализатор на наковальне → новый случайный тир.
  # Превью стабильно до тех пор, пока результат не забран (передёрнуть,
  # дёргая слоты, не выйдет — новая попытка стоит опыт и катализатор).
  enabled: true
  # Чем платят за перекат. НЕ выбирайте материал из рецептов починки брони
  # (слитки/алмаз): перекат перекроет починку через наковальню для таких предметов.
  catalyst: AMETHYST_SHARD
  # Оплата опытом за индекс ТЕКУЩЕГО тира (перекат Хорошего дешевле переката Эпического).
  base-xp-cost: 5
  # Перекат не может понизить тир: ролл лишь среди тиров не ниже текущего.
  no-downgrade: true

mob-drop:
  # Экипировка (броня/оружие/инструменты, а с 1.4.142 и утилита — рог козы,
  # фонарь душ), упавшая с мертвецов, может прийти уже с накатом редкости.
  # Шанс считается на каждый подходящий дроп отдельно.
  enabled: true
  chance-percent: 15
  # Свой шанс для группы (−1 = общий chance-percent, 0 = группе накат не выдаётся).
  # Значения вне −1..100 клампятся с предупреждением в лог.
  weapons-chance-percent: -1
  armor-chance-percent: -1
  tools-chance-percent: -1
  utilities-chance-percent: -1
  # Множитель шанса для «именных» мобов и настоящих боссов (визер, дракон):
  # drop-chance × boss-multiplier. 1.0 = выключено (допустимо 1.0..20.0).
  boss-multiplier: 2.0
  # Миры, где дроп с мобов не получает накат (имена как в server.properties,
  # регистр не важен). Пусто — во всех мирах.
  world-blacklist: []
  # true — тир-дроп считается только убийством игрока: фермы, падения и лава
  # накат не выдают.
  player-kill-only: false

# Редкость мировой добычи (1.4.185). Вещь, появившаяся НЕ из крафта, получает
# тир в момент появления: лут-таблицы сундуков и структур, рыбалка. Дроп с
# мобов — своя секция mob-drop, клады выдают тир через мост ChrdkTierApi,
# у крафта свой шанс в craft.*. Вместе это закрывает все пути, которыми на
# сервере появляется новая экипировка.
#
# Редкость получает только то, что мир создал после обновления: инвентари не
# сканируются, поэтому старые вещи игроков не переролливаются и не слабеют от
# случайного «проклятого» тира.
#
# При identify.enabled: true предмет лежит в сундуке/висит на крючке
# «неопознанным», и редкость открывается в инвентаре — как у дропа с мобов.
world:
  enabled: true
  # Шанс, что подходящая вещь получит накат (0 — не выдаём).
  # 25% — «иногда»; 100% — редкость есть у каждой найденной вещи.
  chance-percent: 25
  # Свой шанс для группы (−1 = общий chance-percent, 0 = группе не выдаём).
  weapons-chance-percent: -1
  armor-chance-percent: -1
  tools-chance-percent: -1
  utilities-chance-percent: -1
  # Сундуки, бочки и находки структур (LootGenerateEvent).
  loot-enabled: true
  # Рыбалка: пойманная вещь (PlayerFishEvent).
  fishing-enabled: true
  # Миры, где мировая лотерея не работает (имена как в server.properties,
  # регистр не важен). Пусто — во всех мирах.
  world-blacklist: []

identify:
  # Режим неопознанных предметов: редкость скрыта, пока предмет не попадёт
  # в инвентарь игрока (подбор с земли — мгновенно; крафт/воронки/сундуки —
  # периодическим сканом). false = старый флоу с превью-роллом в сетке крафта.
  enabled: true
  # Период фонового сканирования инвентарей (в тиках, 20 = 1 секунда; 10..1200).
  scan-ticks: 10
  # Сколько игроков проверять за один проход (1..100). Скан идёт по кругу, поэтому
  # при онлайне больше этого числа каждый игрок проверяется реже, но тик не дороже.
  scan-players-per-tick: 5
  # Звуковой акцент при опознании (по «мощности» тира).
  sounds: true
  # Бонус к шансу пометки при крафте для владельцев активного ранга ядра
  # (ChrdkRegisterApi.hasActivePass). 0 = выключено.
  pass-bonus-chance-percent: 0

craft:
  # Только эти группы предметов получают накат (броня, оружие, инструменты, утилита).
  # Утилита (1.4.142) — щит, рог, фонарь, тотем и прочие носимые вещи: тир даёт
  # им скорость и удачу. false — находки-утилиты приходят без тира.
  armor: true
  weapons: true
  tools: true
  utilities: true
  # Свой шанс наката для конкретной группы (0-100). -1 = использовать общий.
  # Значения вне -1..100 клампятся с предупреждением в лог сервера.
  weapons-chance-percent: -1
  armor-chance-percent: -1
  tools-chance-percent: -1
  utilities-chance-percent: -1
  # Материалы, которым накат запрещён (имена Bukkit, регистр не важен).
  material-blacklist: []

# ---------------------------------------------------------------
# Кузнечные улучшения: тир-предмет + материал на наковальне → уровень свойства +1.
# ---------------------------------------------------------------
improve:
  enabled: true
  # Оплата опытом за шаг: base-xp-cost + текущий уровень улучшения (кламп в 1..38).
  base-xp-cost: 3
  # Чем оплачивается каждое из 85 улучшений (имя Bukkit-материала, строка).
  # НЕ назначайте материалы починки (слитки/алмаз/незерит): ветка улучшения
  # приоритетнее, и починка тир-предмета этим материалом станет невозможна.
  # И не назначайте материал катализатора переката (reroll.catalyst) — его ловит перекат.
  materials:
    edge: QUARTZ                      # Кромка: оружие, +2% урона/ур (макс. V)
    swing: FEATHER                    # Размах: оружие, +2% скорости атаки/ур (V)
    lifesteal: GHAST_TEAR             # Кровопийца: оружие, вампиризм 2% урона/ур (III)
    critical: RABBIT_FOOT             # Крит: оружие, +3% шанса крита ×1.5 урон/ур (V)
