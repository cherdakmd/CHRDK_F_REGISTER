    craftsman: SPYGLASS               # Мастер: инструменты, +0.2 м дальности руки/ур (III)
    smelter: FURNACE                  # Плавильня: инструменты, 10%/ур переплавить дроп руды (IV)
    geologist: BOOK                   # Геолог: инструменты, +15% опыта с блоков/ур (IV)
    hewer: RAIL                       # Забойщик: кирки, колонна блоков сверху (I), +снизу (II)
