    selfmend: EXPERIENCE_BOTTLE       # Самопочинка: любые, 5%/ур/точку опыта чинит предмет (V)
    lantern: GLOW_INK_SAC             # Светильник: любые, ночное зрение пассивно (I)
    magnet: COMPASS                   # Магнит: любые, тянет дроп (радиус 1.5+0.5×ур) (V)
    # --- третья ковка (1.4.57): ещё 35 улучшений ---
    storm: LIGHTNING_ROD              # Громовержец: оружие, 8%/ур громовой дозаряд +0.5❤ (III)
    hex: WITHER_ROSE                  # Проклятие: оружие, 10%/ур иссушить цель (III)
    reaper: NAUTILUS_SHELL            # Жатва: оружие, 10%/ур дубль дропа моба (IV)
    hook: TRIPWIRE_HOOK               # Крюк: оружие, 10%/ур подтянуть цель (III)
    crippler: FERMENTED_SPIDER_EYE    # Калечащий: оружие, +6%/ур по ослабленным (IV)
    duelist: GOLD_NUGGET              # Дуэлянт: оружие, +8%/ур по игрокам (IV)
    tamer: PORKCHOP                   # Зверолов: оружие, +6%/ур по животным (IV)
