    plated: COPPER_BLOCK              # Литная: броня, +0.5 прочности брони/ур (V)
    spring: SLIME_BLOCK               # Пружина: броня, +8% прыжка/ур (III)
    gliding: SHULKER_SHELL            # Парение: броня, -6% гравитации/ур (V)
    cushion: HAY_BLOCK                # Амортизатор: броня, -10% урона падения/ур (IV)
    aegis: GOLD_BLOCK                 # Эгида: броня, 15%/ур Поглощение при ударе (IV)
    warden: BONE_BLOCK                # Щитоносец: броня, 12%/ур Сопротивление при ударе (III)
