  stats-row: "%color%%name% <gray>— %count%</gray>"
  stats-empty: "<gray>Пока пусто: скрафтите, добудьте или поднимите экипировку, и тир раскроется в инвентаре.</gray>"
  stats-reset: "<green>Счётчик ваших находок обнулён.</green>"
  admin-stats-header: "<gray>═══ Находки %player% за всё время ═══</gray>"
  admin-stats-empty: "<gray>У %player% пока пусто.</gray>"
  admin-stats-reset: "<green>Счётчик находок %player% обнулён.</green>"
  admin-no-perm: "<red>Нужно право chrdktierforge.admin.</red>"
  admin-reloaded: "<green>Конфигурация тиров перезагружена.</green>"
  admin-given: "<green>Выдан предмет: %material% ×%amount% (%tier%) игроку %player%.</green>"
  admin-given-unidentified: "<green>Выдан неопознанный предмет: %material% ×%amount% игроку %player%.</green>"
  admin-offline: "<red>Игрок %player% не в сети.</red>"
  admin-bad-material: "<red>Материал %material% не подходит (броня/оружие/инструменты).</red>"
  admin-bad-tier: "<red>Нет тира %tier%. Доступны: %tiers%</red>"
  admin-bad-amount: "<red>Количество %amount% — не число. Укажите 1-64.</red>"
  admin-unidentified-off: "<red>Режим неопознанных предметов выключен (identify.enabled: false).</red>"
  admin-usage:
    - "<gray><yellow>/tiersadmin give <ник> <материал> <тир> [кол-во]</yellow> — выдать тир-предмет</gray>"
    - "<gray><yellow>/tiersadmin give-unidentified <ник> <материал> [кол-во]</yellow> — выдать неопознанный предмет</gray>"
    - "<gray><yellow>/tiersadmin stats <ник></yellow> — находки игрока за всё время</gray>"
    - "<gray><yellow>/tiersadmin resetstats <ник></yellow> — обнулить счётчик игрока</gray>"
    - "<gray><yellow>/tiersadmin reload</yellow> — перечитать конфиг</gray>"
