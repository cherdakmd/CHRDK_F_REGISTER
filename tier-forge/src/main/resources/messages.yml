# CHRDK_TierForge — названия тиров, лор предметов и тексты команд.
tiers:
  no-api: "<red>Ядро CHRDK_F_REGISTER не найдено — тир-крафт недоступен.</red>"
  need-auth: "<red>Сначала войдите на сервер (/login).</red>"
  player-only: "<red>Команда доступна только игрокам.</red>"
  usage: "<gray>/tiers — таблица тиров и шансов наката при крафте.</gray>"
  rolled: "<light_purple>✧ Крафт выдал: %tier%!</light_purple>"
  rolled-cursed: "<dark_red>✖ Крафт выдал проклятый предмет… Удачи с этим.</dark_red>"
  upgraded: "<light_purple>✧ Наковальня слила тир: %tier%!</light_purple>"
  up-max: "<gold>Легендарный — потолок редкости. Сливать больше нечего.</gold>"
  up-mismatch: "<red>На второй слот нужен предмет того же материала и того же тира.</red>"
  list-header: "<gray>═══ Редкость крафта (шанс наката %chance%%) ═══</gray>"
  list-footer: "<gray>Два одинаковых предмета одного тира на наковальне → тир выше (максимум Легендарный).</gray>"
  admin-reloaded: "<green>Конфигурация тиров перезагружена.</green>"
  admin-given: "<green>Выдан предмет: %material% (%tier%) игроку %player%.</green>"
  admin-offline: "<red>Игрок %player% не в сети.</red>"
  admin-bad-material: "<red>Материал %material% не подходит (броня/оружие/инструменты).</red>"
  admin-bad-tier: "<red>Нет тира %tier%. Доступны: %tiers%</red>"
  admin-usage:
    - "<gray><yellow>/tiersadmin give <ник> <материал> <тир></yellow> — выдать тир-предмет</gray>"
    - "<gray><yellow>/tiersadmin reload</yellow> — перечитать конфиг</gray>"
  tier:
    cursed:
      name: "✖ Проклятый"
      color: "<dark_red>"
    weak:
      name: "Слабый"
      color: "<gray>"
    common:
      name: "Простой"
      color: "<white>"
    fine:
      name: "Хороший"
      color: "<green>"
    rare:
      name: "Редкий"
      color: "<aqua>"
    epic:
      name: "Эпический"
      color: "<light_purple>"
    legendary:
      name: "★ Легендарный"
      color: "<gold>"
