  improve-max: "<gold>%name% уже на пределе — выше не поднять.</gold>"
  list-header: "<gray>═══ Редкость крафта ═══</gray>"
  list-row: "<color>%name% <gray>— вес <white>%weight%</white>, характеристики <white>%percent%%</white></gray>"
  list-chances: "<gray>Шанс наката: оружие <white>%weapons%%</white>, броня <white>%armor%%</white>, инструменты <white>%tools%%</white>.</gray>"
  list-drop-chances: "<gray>Дроп с мобов (на предмет): оружие <white>%weapons%%</white>, броня <white>%armor%%</white>, инструменты <white>%tools%%</white>.</gray>"
  list-footer: "<gray>Слияние: два одинаковых тир-предмета → тир выше (максимум Легендарный). Перекат: тир-предмет + аметистовый осколок → новый тир. Ковка: тир-предмет + материал улучшения → +1 уровень свойства (85 видов, реестр — improve.materials в config.yml аддона). Тир-экипировка падает и с мобов. Ваши находки: %own_count% · всего на сервере: %total_count%.</gray>"
  info-header: "<gray>═══ Разбор предмета ═══</gray>"
  info-empty: "<gray>Возьмите тир-предмет в руку и повторите /tiers info.</gray>"
  info-not-tier: "<gray>Это не тир-предмет — редкость на него не накатывалась.</gray>"
  info-offhand: "<dark_gray>Смотрю предмет в левой руке.</dark_gray>"
  info-line: "<gray>%item% <dark_gray>·</dark_gray> %tier%</gray>"
  info-unidentified: "<gray>%item% <dark_gray>·</dark_gray> <dark_gray>неопознанный (источник: %source%)</dark_gray></gray>"
  info-forge-name: "<gray>Кличка: <white>%name%</white></gray>"
  info-source: "<gray>Источник: <white>%source%</white></gray>"
  info-upgrades-header: "<gray>Улучшения (<white>%count%</white>):</gray>"
  info-upgrade: "<gold>✦ %name% %level%</gold> <gray>— %effect%</gray>"
  info-no-upgrades: "<gray>Улучшений нет: материал реестра + наковальня поднимут свойство.</gray>"
  info-merge: "<gray>Слияние: второй такой же предмет → <white>%next%</white> (<white>%xp%</white> опыта).</gray>"
  info-merge-max: "<gold>Слияние: это потолок лестницы.</gold>"
  info-reroll: "<gray>Перекат: <white>%xp%</white> опыта + <white>%catalyst%</white>.</gray>"
  info-reroll-safe: "<gray>Перекат: <white>%xp%</white> опыта + <white>%catalyst%</white>; тир не понизится.</gray>"
  info-anvil-off: "<dark_gray>Наковальня отключена администратором.</dark_gray>"
  source-craft: "крафт"
  source-drop: "добыча"
  source-give: "выдача"
  source-unknown: "неизвестно"
