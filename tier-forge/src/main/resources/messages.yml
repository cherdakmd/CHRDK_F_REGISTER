# CHRDK_TierForge — названия тиров, лор предметов и тексты команд.
tiers:
  no-api: "<red>Ядро CHRDK_Core не найдено — тир-крафт недоступен.</red>"
  need-auth: "<red>Сначала войдите на сервер (/login).</red>"
  no-perm: "<red>Нет права chrdktierforge.use.</red>"
  player-only: "<red>Команда доступна только игрокам.</red>"
  usage: "<gray>/tiers — таблица тиров; /tiers info — разбор предмета в руке; /tiers stats — находки за всё время; /tiers stats reset — обнулить свой счётчик.</gray>"
  rolled: "<light_purple>✧ Крафт выдал: %tier%!</light_purple>"
  rolled-cursed: "<dark_red>✖ Крафт выдал проклятый предмет… Удачи с этим.</dark_red>"
  upgraded: "<light_purple>✧ Наковальня слила тир: %tier%!</light_purple>"
  up-max: "<gold>Легендарный — потолок редкости. Сливать больше нечего.</gold>"
  up-mismatch: "<red>На второй слот нужен предмет того же материала и того же тира.</red>"
  rerolled: "<light_purple>✧ Перекат выдал: %tier%!</light_purple>"
  rerolled-cursed: "<dark_red>✖ Перекат пришёлся проклятьем… Такова судьба азартных.</dark_red>"
  unidentified-name: "<gray>Неопознанный предмет</gray>"
  unidentified-lore: "<dark_gray>Примите в инвентарь, чтобы открыть редкость…</dark_gray>"
  identified: "<light_purple>✧ Предмет опознан: %tier%!</light_purple>"
  identified-cursed: "<dark_red>✖ Предмет оказался проклятым… Возьмите на себя эту тяжесть.</dark_red>"
  anvil-unidentified: "<red>Неопознанный предмет нельзя обрабатывать на наковальне — сначала инвентарь.</red>"
