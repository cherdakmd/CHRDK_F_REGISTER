  # RC9: общий источник описаний расходников для предметов, справки и вики.
  forge.ascend.name: <light_purple>Кристалл возвышения</light_purple>
  forge.ascend.details:
  - <gray>Повышает тир выбранной вещи ровно на одну ступень, до легендарного.</gray>
  - <gray>Вещь ×1 — в основную руку, кристаллы — во вторую.</gray>
  - <gray>Введите /tiers forge ascend, изучите результат и /tiers forge confirm.</gray>
  - '<gray>Цена по целевому тиру: слабый 1/9, простой 1/12, хороший 2/15, редкий 4/18, эпический 8/21, легендарный 16/24.</gray>'
  - <gray>В паре цена — кристаллы / уровни XP. Нет разрушения или понижения.</gray>
  - <gray>Свойства тира и аффиксы меняются по новому тиру; чары и уровни ковки сохраняются.</gray>
  - '<dark_gray>Источник: подходящие природные уровневые мобы Hunt. Обычный материал/переименование не подходит. Не для ПКМ/наковальни.</dark_gray>'
  forge.temper.name: <light_purple>Кузнечное ядро</light_purple>
  forge.temper.details:
  - <gray>Поднимает выбранное УЖЕ установленное улучшение ковки на один уровень.</gray>
  - <gray>Не выше его максимума; не ставит новую характеристику или чару.</gray>
  - <gray>Вещь ×1 — в основную руку, ядро — во вторую.</gray>
  - <gray>/tiers forge temper ID — предпросмотр; /tiers forge confirm — применение.</gray>
  - <gray>ID подсказывает TAB; стоимость 1 ядро и 8 + 2 × текущий уровень ковки уровней XP.</gray>
  - <gray>Тир, остальные улучшения и свойства не переролливаются.</gray>
  - '<dark_gray>Источник: подходящие природные уровневые мобы Hunt. Обычный материал/переименование не подходит. Не для ПКМ/наковальни.</dark_gray>'
  forge.reforge.name: <light_purple>Печать перековки</light_purple>
  forge.reforge.details:
  - <gray>Меняет одно выбранное свойство ✧ на другое случайное того же тира.</gray>
  - <gray>Это не аффикс ◆/✖, не книга чар и не повышение тира.</gray>
  - <gray>Вещь ×1 — в основную руку, печать — во вторую.</gray>
  - <gray>/tiers forge reforge ID — предпросмотр; /tiers forge confirm — применение.</gray>
  - <gray>ID своего свойства подсказывает TAB. Цена 1 печать и 12 + 3 × индекс тира уровней XP (индекс 0–6).</gray>
  - <gray>Остальные свойства, чары и ковка сохраняются; повтор просмотра не даёт новый результат.</gray>
  - '<dark_gray>Источник: подходящие природные уровневые мобы Hunt. Обычный материал/переименование не подходит. Не для ПКМ/наковальни.</dark_gray>'
  forge-help:
  - <gold>Расходники кузни — /tiers forge</gold>
  - <gray>Survival, вход и право использования; закройте сундук/GUI. Предмет в основной, расходник во второй руке.</gray>
  - <gray>Сначала предпросмотр, потом /tiers forge confirm за 30 секунд. До подтверждения ничего не расходуется.</gray>
  - <gray>Не меняйте выбранный слот, предметы/количество, мир; после reload нужен новый просмотр.</gray>
  - <gray>Цена в уровнях XP, не очках опыта и не /bal. Нет платного ранга или усиления сверх прежних максимумов.</gray>
  - <gray>Новые предметы можно передавать/продавать игрокам; это физические вещи, без страховки от потери при смерти.</gray>
  - <gray>Слияние и случайные находки остались. По умолчанию аметистовый перекат выключен новой кузней.</gray>
  forge-found: '<light_purple>Находка кузни: %name%</light_purple> <gray>Описание на предмете; /tiers forge help.</gray>'
  forge-admin-usage: <gray>/tiersadmin material ник ascend|temper|reforge 1–64</gray>
  forge-unavailable: '<red>Кузня недоступна: проверьте Survival, вход/право, открытое окно, anvil.enabled и настройки операции.</red>'
  forge-stale: <red>Подтверждение устарело или входы изменились. Снова запросите предпросмотр. Ничего не списано.</red>
  forge-done: <green>Кузня применила показанное изменение. Расходник и уровни XP списаны.</green>
  forge-usage: <gray>/tiers forge ascend · temper ID · reforge ID · confirm · help. ID выбирайте через TAB.</gray>
  forge-input: <red>Нужна одна опознанная тир-вещь в основной руке и правильный настоящий расходник во второй.</red>
  forge-legacy: <red>Нужна актуальная метка вещи. Переложите её и повторите осмотр. Некорректные счётчики требуют проверки администратора.</red>
  forge-upgrade-invalid: <red>Выберите через TAB уже установленное совместимое улучшение ниже максимума; ковка должна быть включена.</red>
  forge-property-invalid: <red>Выберите через TAB действующее свойство ✧ этой вещи. Нужна доступная другая совместимая замена.</red>
  forge-cost: <red>Нужно %units% расходников во второй руке и %xp% уровней XP. Ничего не списано.</red>
  forge-preview: '<gold>Предпросмотр: цена %units% расходников и %xp% уровней XP. Результат ниже; /tiers forge confirm за 30 секунд.</gold>'
  forge-preserve: <gray>Имя, прочность, чары, чужие данные и прочая ковка сохраняются. Возвышение меняет тир, его свойства и аффиксы; печать — только
    выбранное ✧.</gray>
  forge-hint: '<gray>Расходники: /tiers forge help · новая кузня: %forge% · аметистовый
    перекат: %reroll%.</gray>'
  forge-state-on: включён
  forge-state-off: выключен
