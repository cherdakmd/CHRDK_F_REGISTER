  # RC9: общий источник описаний расходников для предметов, справки и вики.
  forge.ascend.name: <light_purple>Кристалл возвышения</light_purple>
  forge.ascend.details:
  - <gray>Повышает тир выбранной вещи ровно на одну ступень, до легендарного.</gray>
  - '<gray>В наковальне: одна тир-вещь слева, расходники справа.</gray>'
  - <gray>Изучите результат. ПКМ по результату — следующий выбор; ЛКМ с пустым курсором — применить.</gray>
  - '<gray>Цена: кристаллы / уровни XP, по целевому тиру.</gray>'
  - <gray>Слабый 1/9 · Простой 1/12 · Хороший 2/15.</gray>
  - <gray>Редкий 4/18 · Эпический 8/21 · Легендарный 16/24.</gray>
  - <gray>В паре цена — кристаллы / уровни XP. Нет разрушения или понижения.</gray>
  - <gray>Свойства тира и аффиксы меняются по новому тиру; чары и уровни ковки сохраняются.</gray>
  - '<dark_gray>Источник: природные уровневые мобы Hunt. Нужна серверная метка, не переименование материала.</dark_gray>'
  forge.temper.name: <light_purple>Кузнечное ядро</light_purple>
  forge.temper.details:
  - <gray>Поднимает выбранное УЖЕ установленное улучшение ковки на один уровень.</gray>
  - <gray>Не выше его максимума; не ставит новую характеристику или чару.</gray>
  - '<gray>В наковальне: одна тир-вещь слева, расходники справа.</gray>'
  - <gray>Изучите результат. ПКМ по результату — следующий выбор; ЛКМ с пустым курсором — применить.</gray>
  - <gray>Выбор кнопкой ПКМ в третьем слоте; 1 ядро и 8 + 2 × текущий уровень ковки уровней XP.</gray>
  - <gray>Тир, остальные улучшения и свойства не переролливаются.</gray>
  - '<dark_gray>Источник: природные уровневые мобы Hunt. Нужна серверная метка, не переименование материала.</dark_gray>'
  forge.reforge.name: <light_purple>Печать перековки</light_purple>
  forge.reforge.details:
  - <gray>Меняет одно выбранное свойство ✧ на другое случайное того же тира.</gray>
  - <gray>Это не аффикс ◆/✖, не книга чар и не повышение тира.</gray>
  - '<gray>В наковальне: одна тир-вещь слева, расходники справа.</gray>'
  - <gray>Изучите результат. ПКМ по результату — следующий выбор; ЛКМ с пустым курсором — применить.</gray>
