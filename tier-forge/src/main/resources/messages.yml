  list-bonuses: "<gray>Бонус тира: оружие — урон (у легендарного +60%), луки и арбалеты — урон стрел, броня — защита, твёрдость и скорость бега (+6% за деталь), инструменты — скорость добычи (у легендарной кирки +90%; топор — и урон, и добыча), утилита (щит, рог, фонарь, тотем) — скорость бега и удача, без урона и добычи. У каждого тира свой пул из 15 свойств (✧), плюс 15 хороших (◆) и 15 плохих (✖) аффиксов — их количество зависит от тира; утилите достаются только общие свойства. Иногда предмет приходит уже с зачарованиями. Разбор — /tiers info.</gray>"
