# CHRDK_Generator — сообщения модуля. Разметка MiniMessage, подстановки — %имя%.
#
# Файл обёрнут в секцию messages: — так модуль читается через общий Messages
# ядра (одна верхняя секция разворачивается в плоские ключи).
messages:
  # --- общее ---
  player-only: "<red>Эта команда доступна только игрокам.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  usage: "<yellow>/generator [take]</yellow>"
  admin-usage: "<yellow>/generatoradmin <reload></yellow>"
  reloaded: "<green>Конфиг CHRDK_Generator перезагружен.</green>"

  # --- генератор ---
  core-item-name: "<light_purple>Ядро генератора</light_purple>"
  core-item-lore:
    - "<gray>Поставьте в свой приват CHRDK_Claims.</gray>"
    - "<gray>Рядом с ядром нужны лава и вода.</gray>"
    - "<gray>Снятие: сломайте ядро.</gray>"
  craft-one-by-one: "<red>Ядро крафтится только по одному.</red>"
  place-no-id: "<red>У ядра нет идентификатора — оно не работает.</red>"
  place-already-installed: "<red>У вас уже стоит генератор.</red>"
  place-core-busy: "<red>Это ядро уже занято.</red>"
  place-claims-required: "<red>Для установки нужен приват CHRDK_Claims.</red>"
  place-not-your-claim: "<red>Генератор ставится только в свой приват.</red>"
  place-blocked: "<red>Здесь нет места для ядра.</red>"
  place-ok: "<green>Ядро установлено.</green>"
  break-protected: "<red>Ядро может сломать только владелец.</red>"
  break-ok: "<green>Ядро снято. Выдано из бункера: %bunker%.</green>"
  status-none: "<yellow>У вас нет генератора. Скрафтите ядро на верстаке.</yellow>"
  status-carried: "<yellow>Ядро у вас в руках — поставьте в свой приват.</yellow>"
  status-line: "<green>Генератор</green> <yellow>%tier_name%</yellow> <gray>(тир %tier%)</gray> <dark_gray>|</dark_gray> бункер <white>%bunker%</white>/<white>%capacity%</white> <dark_gray>|</dark_gray> цикл <white>%rate%</white>с <dark_gray>|</dark_gray> %state%"
  state-working: "<green>работает</green>"
  state-no-lava: "<red>нет лавы</red>"
  state-no-water: "<red>нет воды</red>"
  state-no-cells: "<red>нет ячеек</red>"
  state-unloaded: "<gray>чанк не загружен</gray>"
  take-not-ready: "<yellow>Снятие с подтверждением появится позже; пока снимите ядро, сломав его.</yellow>"
