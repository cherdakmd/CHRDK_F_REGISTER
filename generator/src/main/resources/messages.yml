# CHRDK_Generator — сообщения модуля. Разметка MiniMessage, подстановки — %имя%.
#
# Файл обёрнут в секцию messages: — так модуль читается через общий Messages
# ядра (одна верхняя секция разворачивается в плоские ключи).
messages:
  # --- общее ---
  player-only: "<red>Эта команда доступна только игрокам.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  usage: "<yellow>/generator [take | upgrade <tier|speed|capacity|luck|chunk>]</yellow>"
  admin-usage: "<yellow>/generatoradmin <reload|finance|recover|rebase-lost></yellow>"
  reloaded: "<green>Конфиг CHRDK_Generator перезагружен.</green>"
  payout-bank-credit: "<green>+%amount% ⛁ на банковский счёт · генератор</green>"
  container-title: "<dark_gray>Бункер генератора</dark_gray>"
  container-refresh: "<yellow>Обновить бункер</yellow>"
  container-fuel-help: "<gold>Топливо: нижний ряд. Загрузка — Shift-клик из инвентаря.</gold>"
  fuel-menu-title: "<dark_gray>Топливо генератора</dark_gray>"
  fuel-open: "<gold>Открыть топливо</gold>"
  fuel-back: "<gold>Вернуться к продукции</gold>"
  fuel-item-time: "<gray>Один предмет: %one%; весь стак: %total%.</gray>"
  fuel-item-remainder: "<gray>Тара или другой остаток, не топливо.</gray>"
  fuel-total-title: "<gold>Доступно до %time% работы</gold>"
  fuel-total-lore: "<gray>В том числе остаток горящего топлива: %active%.</gray>"
  fuel-help: "<yellow>Shift-клик по топливу в инвентаре загружает его; клик по ячейке забирает содержимое.</yellow>"
  fuel-total-conditions: "<gray>Нужны рабочая камера и место для продукции и тары; возможны остановки.</gray>"
  container-settings: "<gold>Управление генератором</gold>"
  container-close: "<red>Закрыть</red>"
  container-unavailable: "<red>Бункер временно недоступен. Обратитесь к администрации; данные генератора удалять нельзя.</red>"
  container-transfer-failed: "<yellow>Перенос не выполнен; проверьте авторизацию, свободное место и пустой курсор.</yellow>"
  container-fuel-rejected: "<yellow>Для загрузки используйте Shift-клик по обычному печному топливу. Проверьте место в ячейках топлива.</yellow>"
  container-not-empty: "<red>Сначала заберите ресурсы и топливо, освободите ячейку инвентаря и дождитесь выплат. При ошибке обратитесь к администрации.</red>"

  # --- генератор ---
  core-item-name: "<light_purple>Ядро генератора</light_purple>"
  core-item-lore:
    - "<gray>Поставьте в свой приват CHRDK_Claims.</gray>"
    - "<gray>Рядом с ядром нужны лава и вода.</gray>"
    - "<gray>Меню генератора — клик по ядру.</gray>"
    - "<gray>Снятие: сломайте ядро.</gray>"
  craft-one-by-one: "<red>Ядро крафтится только по одному.</red>"
  core-foreign: "<red>Это генератор игрока %owner%.</red>"
  place-slots-full: "<red>Все слоты генераторов заняты (доступно: %slots%): следующий открывается перерождением или платным рангом.</red>"
  menu-too-far: "<red>Меню генератора открывается рядом с ядром: на его чанке или в %range% блоках.</red>"
  command-too-far: "<red>Управлять генератором можно только рядом с ядром: на его чанке или в %range% блоках.</red>"
  place-no-id: "<red>У ядра нет идентификатора — оно не работает.</red>"
  place-already-installed: "<red>У вас уже стоит генератор.</red>"
  place-core-busy: "<red>Это ядро уже занято.</red>"
  place-claims-required: "<red>Для установки нужен приват CHRDK_Claims.</red>"
  place-not-your-claim: "<red>Генератор ставится только в свой приват.</red>"
  place-blocked: "<red>Здесь нет места для ядра.</red>"
  place-ok: "<green>Ядро установлено.</green>"
  break-protected: "<red>Ядро может сломать только владелец.</red>"
  break-ok: "<green>Ядро снято. Выдано из бункера: %bunker%.</green>"
  status-none: "<yellow>У вас нет генератора. Скрафтите ядро на верстаке.</yellow>"
  state-working: "<green>работает</green>"
  state-no-lava: "<red>нет лавы</red>"
  state-no-water: "<red>нет воды</red>"
  state-no-cells: "<red>нет ячеек</red>"
  state-unloaded: "<gray>чанк не загружен</gray>"
  state-carried: "<yellow>ядро переносится</yellow>"

  # --- меню /gen ---
  menu-title: "<dark_gray><bold>Генератор</bold>"
  menu-status: "<green>Статус: %state%"
  menu-status-lore:
    - "<gray>Камера: лава- и водоисточники по соседству с ядром.</gray>"
    - "<gray>Продукция капает в бункер; забор — кнопкой бункера.</gray>"
  menu-tier: "<yellow>Тир %tier%: %tier_name%"
  menu-tier-lore:
    - "<gray>Единиц за цикл: %units%.</gray>"
    - "<gray>С тира 5 шансуют деньги, с тира 7 — регулярно.</gray>"
  menu-bunker: "<gold>Бункер: %bunker% / %capacity% (%fill%%)"
  menu-bunker-lore:
    - "<gray>ЛКМ — открыть окно продукции и топлива.</gray>"
    - "<gray>Забирайте предметы по ячейкам.</gray>"
  menu-rebirth: "<light_purple>Перерождений: %count% <gray>(бонус +%bonus%%)</gray>"
  menu-rebirth-lore:
    - "<gray>Перерождение персонажа сбрасывает тиры и модули,</gray>"
    - "<gray>ядро и содержимое бункера остаются. Бонус растёт до +50%.</gray>"
  menu-upgrade-tier: "<green>Улучшить тир"
  menu-upgrade-lore:
    - "<gray>Эффект: %effect%</gray>"
    - "<gray>Цена: %cost%</gray>"
    - "<gray>ЛКМ — купить (деньги сжигаются).</gray>"
  menu-module: "<green>%module%: уровень %level%"
  menu-module-lore:
    - "<gray>Эффект: %effect%</gray>"
    - "<gray>Цена следующего: %cost%</gray>"
    - "<gray>Потолок: %max%. ЛКМ — купить.</gray>"
  menu-chunk: "<green>Модуль «Чанк»"
  menu-chunk-lore:
    - "<gray>Цена: %cost%</gray>"
    - "<gray>Чанк с ядром грузится всегда. ЛКМ — купить.</gray>"
  menu-take: "<red>Снять генератор"
  menu-take-lore:
    - "<gray>Ядро вернётся предметом, бункер выдастся.</gray>"
    - "<gray>ЛКМ дважды: подтверждение живёт 30 секунд.</gray>"
  menu-close: "<gray>Закрыть</gray>"

  hologram-text:
    - "<yellow>Генератор: тир %tier% — %tier_name%</yellow>"
    - "<gray>Бункер: %bunker%/%capacity% (%fill%%)</gray>"
    - "%state%"
  bunker-full: "<yellow>Бункер генератора заполнен (%bunker%/%capacity%): заберите продукцию.</yellow>"
  bunker-full-join: "<yellow>Пока вас не было, бункер генератора заполнился (%bunker%/%capacity%): заберите продукцию.</yellow>"
  auto-sold: "<green>Продукция продана автоматически: %units% ед. на %money% ₽.</green>"
  fuel-auto-refueled: "<green>Топливо закуплено автоматически: %price% ₽ за ведро лавы.</green>"
  fuel-auto-failed: "<red>Автозаправка не удалась (нужно %price% ₽): лава прогорела.</red>"

  # --- снятие и выдачи ---
  take-none: "<yellow>Генератор не установлен — снимать нечего.</yellow>"
  take-confirm: "<yellow>Повторите снятие в течение 30 секунд, чтобы снять генератор.</yellow>"
  take-ok: "<green>Генератор снят: выдано из бункера %bunker%, ядро возвращено.</green>"
  bunker-empty: "<yellow>Бункер пуст.</yellow>"
  bunker-withdrawn: "<green>Выдано из бункера: %bunker%.</green>"
  rebirth-done: "<light_purple>Генератор переродился (№%count%): содержимое сохранено, тиры и модули сброшены. Бонус производства: +%bonus%%.</light_purple>"

  # --- улучшения ---
  upgrade-name-tier: "Тир"
  upgrade-name-speed: "Скорость"
  upgrade-name-capacity: "Ёмкость"
  upgrade-name-luck: "Удача"
  upgrade-name-chunk: "Чанк"
  upgrade-none: "<red>Сначала установите генератор.</red>"
  upgrade-max: "<yellow>%what%: максимальный уровень.</yellow>"
  upgrade-no-resources: "<red>Не хватает ресурсов: %need%.</red>"
  upgrade-ok: "<green>%what% улучшен до уровня %level%.</green>"

  # --- платёжный протокол (PaidActions) ---
  finance.service-mode: "<red>Оплата требует авторизации, живого игрока в Survival/Adventure; NPC не допускаются.</red>"
  finance.service-wait: "<yellow>Платёж ожидает сверки. Новые сделки приостановлены. Администратору: /generatoradmin recover.</yellow>"
  finance.service-insufficient: "<red>Нужно %cost% в банке: сначала /bal. Улучшения оплачиваются только банком.</red>"
  finance.service-refused: "<red>Операция отклонена. Новое списание/возврат не выполнены.</red>"
  finance.service-checked: "<green>Безопасная сверка завершена. Это не принудительное подтверждение и не обход IO-карантина; проверьте /generatoradmin finance.</green>"
  finance.service-payment: "<yellow>Незавершённый платёж %id%, плательщик %payer%. Не удаляйте журнал.</yellow>"
  finance.service-action: "<yellow>Резерв %id%: payer=%payer%, actor=%actor%, цена=%price%, этап=%phase%, вид=%kind%, цель=%target%.</yellow>"
  finance.service-status: "<gray>Незавершённых услуг: %count%, блокировка оплаты: %paused%. EXECUTING требует проверки фактического исхода.</gray>"
  finance.service-refunding: "<yellow>Улучшение не куплено. Возврат %cost% учтён для /bal; при недоступном банке непогашенная часть сохранена.</yellow>"
