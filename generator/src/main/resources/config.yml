# CHRDK_Generator — личный генератор ресурсов (п.31).
#
# Игрок крафтит «ядро генератора», ставит его в своём привате и организует
# камеру с лавой и водой: пока оба блока на месте, генератор производит
# ресурсы по своему тиру. Продукция копится в бункере, забирается предметами.
# Прогресс (тир, модули, бункер) хранится в generator.json по UUID игрока.
#
# Принцип репозитория: никакого pay-to-win. Деньги за улучшения сжигаются
# (sink), выдача денег идёт под дневным лимитом, ранги влияют только на
# потолок лимита — не на производство.

general:
  # Главный выключатель. При false модуль не производит и не выдаёт ресурсы.
  enabled: true
  locale: ru

generator:
  # Базовый производственный цикл в секундах (модуль «Скорость» короче).
  cycle-seconds: 30
  # Базовая ёмкость бункера в условных единицах продукции (модуль «Ёмкость» больше).
  bunker-base: 256
  # Часы офлайн-накопления: потолок бункера считается как ёмкость × часы.
  offline-hours: 8
  # КПД офлайн-накопления (0.0–1.0). С модулем «Чанк» чанк грузится всегда.
  offline-efficiency: 0.5

  # Топливо: расход лавы. Выключено — лава и вода только условие работы.
  fuel:
    enabled: false
    # Сколько циклов даёт одно ведро лавы при включённом топливе.
    cycles-per-bucket: 256

  # Дневной лимит выдачи денег (источник наград generator-payouts):
  # итог = base + tier × per-tier + ступень ранга × per-rank-step,
  # зажат в 1…hard-max. Ранг участвует только здесь — не в производстве.
  payouts:
    daily-cap-base: 384
    daily-cap-per-tier: 64
    daily-cap-per-rank-step: 32
    daily-cap-hard-max: 4096

  # Бонус производства за перерождения, % с убывающей отдачей (как XP навыков):
  # min(cap, percent × (1 − decayⁿ) / (1 − decay)); 1-е перерождение +5%,
  # 10-е ≈ +32.6%, асимптота +50%. При перерождении тиры и модули сбрасываются.
  rebirth-percent-per-rebirth: 5.0
  rebirth-decay: 0.9
  rebirth-bonus-cap-percent: 50.0
