# CHRDK_Generator — личный генератор ресурсов (п.31).
#
# Игрок крафтит «ядро генератора», ставит его в своём привате и организует
# камеру с лавой и водой: пока оба блока на месте, генератор производит
# ресурсы по своему тиру. Продукция копится в бункере, забирается предметами.
# Прогресс (тир, модули, бункер) хранится в generator.json по UUID игрока.
#
# Принцип репозитория: никакого pay-to-win. Деньги за улучшения сжигаются
# (sink), выдача денег идёт под дневным лимитом, ранги влияют только на
# потолок лимита — не на производство.

general:
  # Главный выключатель. При false модуль не производит и не выдаёт ресурсы.
  enabled: true
  locale: ru

generator:
  # Базовый производственный цикл в секундах (модуль «Скорость» короче).
  cycle-seconds: 30
  # Базовая ёмкость бункера в условных единицах продукции (модуль «Ёмкость» больше).
  bunker-base: 256
  # Часы офлайн-накопления: потолок бункера считается как ёмкость × часы.
  offline-hours: 8
  # КПД офлайн-накопления (0.0–1.0). С модулем «Чанк» чанк грузится всегда.
  offline-efficiency: 0.5

  # Топливо: расход лавы. Выключено — лава и вода только условие работы.
  fuel:
    enabled: false
    # Сколько циклов даёт одно ведро лавы при включённом топливе.
    cycles-per-bucket: 256

  # Дневной лимит выдачи денег (источник наград generator-payouts):
  # итог = base + tier × per-tier + ступень ранга × per-rank-step,
  # зажат в 1…hard-max. Ранг участвует только здесь — не в производстве.
  payouts:
    daily-cap-base: 384
    daily-cap-per-tier: 64
    daily-cap-per-rank-step: 32
    daily-cap-hard-max: 4096

  # Бонус производства за перерождения, % с убывающей отдачей (как XP навыков):
  # min(cap, percent × (1 − decayⁿ) / (1 − decay)); 1-е перерождение +5%,
  # 10-е ≈ +32.6%, асимптота +50%. При перерождении тиры и модули сбрасываются.
  rebirth-percent-per-rebirth: 5.0
  rebirth-decay: 0.9
  rebirth-bonus-cap-percent: 50.0

  # Крафт ядра на верстаке: форма 3×3 (каждая строка — до 3 символов)
  # и ингредиенты-материалы. Выключено — ядро не крафтится вовсе.
  craft:
    enabled: true
    shape: [ABA, BCB, ABA]
    ingredients:
      A: IRON_INGOT
      B: COBBLESTONE
      C: DIAMOND

  # Тиры производства (ровно 7): название в меню, единиц за цикл и таблица
  # продукции — чем тир выше, тем больше ценностей и редкостей.
  tiers:
    - name: Исток
      units-per-cycle: 1
      drops:
        - {material: COBBLESTONE, weight: 6}
        - {material: CLAY_BALL, weight: 2}
        - {material: NETHERRACK, weight: 1}
    - name: Смесь
      units-per-cycle: 1
      drops:
        - {material: COBBLESTONE, weight: 4}
        - {material: CLAY_BALL, weight: 2}
        - {material: GRAVEL, weight: 1}
    - name: Руда
      units-per-cycle: 2
      drops:
        - {material: RAW_IRON, weight: 2}
        - {material: RAW_COPPER, weight: 2}
        - {material: COAL, weight: 1}
    - name: Жила
      units-per-cycle: 2
      drops:
        - {material: RAW_IRON, weight: 3}
        - {material: RAW_GOLD, weight: 2}
        - {material: REDSTONE, weight: 1}
    - name: Глубина
      units-per-cycle: 3
      money: {chance: 0.15, portion: 2}
      drops:
        - {material: RAW_GOLD, weight: 3}
        - {material: LAPIS_LAZULI, weight: 1}
        - {material: AMETHYST_SHARD, weight: 1}
    - name: Пучина
      units-per-cycle: 3
      money: {chance: 0.25, portion: 3}
      drops:
        - {material: DIAMOND, weight: 2}
        - {material: EMERALD, weight: 2}
        - {material: QUARTZ, weight: 1}
    - name: Сердце
      units-per-cycle: 4
      money: {chance: 1.0, portion: 4}
      drops:
        - {material: DIAMOND, weight: 3}
        - {material: NETHERITE_INGOT, weight: 2}
        - {material: NETHER_STAR, weight: 1, rare: true}
        - {material: END_CRYSTAL, weight: 1, rare: true}

  # Улучшения: деньги сжигаются (sink, только банк), ресурсы списываются
  # из инвентаря. Тиры — 6 шагов (переход 1→2 … 6→7): деньги растут
  # ступенями, ресурсы — ключевой материал открываемого тира.
  # Модули — 5 уровней: низкие стоят ресурсов, высшие — денег.
  upgrades:
    tiers:
      - {money: 5000, resources: [{material: COBBLESTONE, amount: 256}]}
      - {money: 25000, resources: [{material: IRON_INGOT, amount: 256}]}
      - {money: 60000, resources: [{material: GOLD_INGOT, amount: 256}]}
      - {money: 120000, resources: [{material: DIAMOND, amount: 64}]}
      - {money: 250000, resources: [{material: NETHERITE_INGOT, amount: 16}]}
      - {money: 500000, resources: [{material: NETHER_STAR, amount: 4}]}
    modules:
      - {money: 0, resources: [{material: IRON_INGOT, amount: 32}]}
      - {money: 0, resources: [{material: IRON_INGOT, amount: 64}]}
      - {money: 0, resources: [{material: DIAMOND, amount: 16}]}
      - {money: 25000, resources: []}
      - {money: 75000, resources: []}
    chunk: {money: 50000, resources: [{material: DIAMOND, amount: 32}]}
