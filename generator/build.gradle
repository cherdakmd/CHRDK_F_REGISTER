plugins {
    id 'java'
}

group = project.maven_group
version = project.plugin_version

base {
    archivesName = 'chrdk-generator'
}

repositories {
    mavenCentral()
    maven {
        name = 'purpurmc'
        url = 'https://repo.purpurmc.org/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    compileOnly "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    // Ядро CHRDK_F_REGISTER: публичный API и Messages.
    compileOnly project(':')
    // Приваты CHRDK_Claims: установка ядра только в свой чанк (soft-dep).
    compileOnly project(':claims')
    // Магазин алмазов CHRDK_DiamondShop: цены продажи для автопродажи продукции (soft-dep).
    compileOnly project(':diamond-shop')
    compileOnly "com.google.code.gson:gson:2.11.0"
    // PlaceholderAPI — мягкая интеграция: в рантайме плагина может не быть.
    // CI: официальный GitHub release той же версии, проверенный prepare_papi.py (compileOnly, не упаковка).
    compileOnly(rootProject.findProperty('chrdk.papiJar')
            ? files(rootProject.file(rootProject.property('chrdk.papiJar')))
            : "me.clip:placeholderapi:2.12.3")

    testImplementation "org.purpurmc.purpur:purpur-api:${project.purpur_api_version}"
    // Классы ядра нужно и тестам: хранилища пишут файлы через SafeJsonWriter.
    testImplementation project(':')
    testImplementation project(':claims')
    testImplementation project(':diamond-shop')
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def pluginVersion = project.version
    inputs.property "version", pluginVersion
    filteringCharset = 'UTF-8'
    filesMatching("plugin.yml") {
        expand "version": pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
    }
}
