# CHRDK_Treasures — лут-таблицы кладов (с версии 1.4.135).
#
# Здесь лежит обычная добыча: материалы, количества и веса. Находки с
# эффектами живут в каталоге (TreasureCatalog) и выпадают отдельным броском.
# Поле name превращает ванильный предмет в именную находку («Кровавый суп»,
# «Зависть пиглина») — такие предметы не входят в коллекцию, но приходят с
# собственным названием, как в оригинальных таблицах.
#
# Как читается запись:
#   material — имя материала Bukkit (COAL, IRON_INGOT, ...);
#   min/max  — сколько выпадет за один выбор, 1..64;
#   weight   — вес записи в пуле (чем больше, тем чаще);
#   unlock   — сколько блоков игрок должен добыть, чтобы запись стала доступна;
#   name     — необязательное особое имя предмета (в кавычках).
#
# Бросок берёт общий пул редкости (global) и пул региона (regions), причём
# региональные записи весят вдвое больше: клад должен пахнуть местом, где он
# найден. Записи с unlock выше прогресса игрока не участвуют в броске.
#
# Правки применяются после /treasuresadmin reload. Порядок записей не важен.

