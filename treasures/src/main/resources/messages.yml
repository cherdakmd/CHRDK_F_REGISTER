  treasure.dp-toxic-machete.desc: "Ядовитое мачете: сок болотных трав остаётся на лезвии после каждого удара."
  treasure.dp-warped-bow.name: "Искажённый лук"
  treasure.dp-warped-bow.desc: "Искажённый лук: в приседе стреляет не стрелой, а самим пространством."
  treasure.dp-hurricane-sword.name: "Клинок урагана"
  treasure.dp-hurricane-sword.desc: "Клинок урагана: взмах поднимает ветер, сбивающий врагов с ног."
  treasure.dp-giga-bore.name: "Гига-бур"
  treasure.dp-giga-bore.desc: "Гига-бур: прогрызает породу быстрее, чем кирка успевает нагреться."
  treasure.dp-badlands-helmet.name: "Шлем пустошей"
  treasure.dp-badlands-helmet.desc: "Шлем пустошей: в раскалённом воздухе болты летят дальше и точнее."
  treasure.dp-desert-chestplate.name: "Пустынный нагрудник"
  treasure.dp-desert-chestplate.desc: "Пустынный нагрудник: давит тех, кто уже еле держится на ногах."
  treasure.dp-dark-forest-chestplate.name: "Нагрудник тёмного леса"
  treasure.dp-dark-forest-chestplate.desc: "Нагрудник тёмного леса: топор в такой броне бьёт сокрушительнее."
  treasure.dp-mushroom-shield.name: "Грибной щит"
  treasure.dp-mushroom-shield.desc: "Грибной щит: споры затягивают раны, пока щит держит удар."
  treasure.dp-flower-helmet.name: "Цветочный шлем"
  treasure.dp-flower-helmet.desc: "Цветочный шлем: под солнцем лечит владельца и приносит удачу."
  treasure.dp-ice-shoes.name: "Ледяные ботинки"
  treasure.dp-ice-shoes.desc: "Ледяные ботинки: скольжение по льду больше не сбивает с шага."
  treasure.dp-jungle-shoes.name: "Ботинки джунглей"
  treasure.dp-jungle-shoes.desc: "Ботинки джунглей: лианы и буреломы будто сами расступаются."
  treasure.dp-swamp-chestplate.name: "Нагрудник трясины"
  treasure.dp-swamp-chestplate.desc: "Нагрудник трясины: болотные яды и слабость не берут владельца."
  treasure.dp-mountain-leggings.name: "Горные поножи"
  treasure.dp-mountain-leggings.desc: "Горные поножи: держат жар лавы и удар камнепада."
  treasure.dp-wind-chestplate.name: "Нагрудник ветра"
  treasure.dp-wind-chestplate.desc: "Нагрудник ветра: порывы не сбивают с ног, а только подгоняют."
  treasure.dp-ocean-chestplate.name: "Океанический нагрудник"
  treasure.dp-ocean-chestplate.desc: "Океанический нагрудник: под водой дышится так же легко, как на берегу."
  treasure.dp-dripstone-helmet.name: "Шлем капельников"
  treasure.dp-dripstone-helmet.desc: "Шлем капельников: сталактиты больше не застают врасплох."
  treasure.dp-lush-pants.name: "Штаны пышных пещер"
  treasure.dp-lush-pants.desc: "Штаны пышных пещер: среди цветов и мха раны затягиваются сами."
  treasure.dp-basalt-boots.name: "Базальтовые ботинки"
  treasure.dp-basalt-boots.desc: "Базальтовые ботинки: раскалённый камень не сбивает с ног."
  treasure.dp-crimson-chestplate.name: "Багровый нагрудник"
  treasure.dp-crimson-chestplate.desc: "Багровый нагрудник: грибной лес делится с владельцем силой и жизнью."
  treasure.dp-warped-helmet.name: "Искажённый шлем"
  treasure.dp-warped-helmet.desc: "Искажённый шлем: искажение ускоряет шаг и притупляет удары."
  treasure.dp-soul-helmet.name: "Шлем душ"
  treasure.dp-soul-helmet.desc: "Шлем душ: души держат владельца на краю гибели."
  treasure.dp-end-boots.name: "Ботинки края"
  treasure.dp-end-boots.desc: "Ботинки края: падение в бездну заканчивается мягко."
  treasure.dp-savanna-helmet.name: "Шлем саванны"
  treasure.dp-savanna-helmet.desc: "Шлем саванны: щедрая земля делится опытом и находками."
  treasure.dp-taiga-pants.name: "Штаны тайги"
  treasure.dp-taiga-pants.desc: "Штаны тайги: смолистый воздух лечит и придаёт ходу."
  treasure.dp-healing-flower.name: "Исцеляющий цветок"
  treasure.dp-healing-flower.desc: "Исцеляющий цветок: срывается в дорогу и лечит владельца по правому клику."
  treasure.dp-mountain-horn.name: "Горный рог"
  treasure.dp-mountain-horn.desc: "Горный рог: зов слышат союзники, а врагов он сбивает с ног."
  treasure.dp-sense-urgency.name: "Чувство тревоги"
  treasure.dp-sense-urgency.desc: "Чувство тревоги: подсказывает, где притаились враги, даже сквозь камень."
  treasure.dp-floor-spikes.name: "Шипы под ногами"
  treasure.dp-floor-spikes.desc: "Шипы под ногами: земля вокруг на время покрывается каменными иглами."
  treasure.dp-necromancy.name: "Некромантия"
  treasure.dp-necromancy.desc: "Некромантия: души павших на время возвращаются служить владельцу."

