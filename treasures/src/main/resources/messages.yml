# CHRDK_Treasures — тексты кладов: имена и описания находок
# (treasure.<ид>.name|desc), редкости (tier.*), регионы (region.*), витрина,
# уведомления и команды. Иды приходят из TreasureCatalog, здесь меняются
# только подписи. Значения экранируются ядром, разметка — MiniMessage.
messages:
  player-only: "<red>Эта команда только для игроков.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  treasures-disabled: "<red>Клады выключены в config.yml.</red>"
  unknown-subcommand: "<red>Неизвестная подкоманда «%sub%». Смотрите <yellow>/treasures help</yellow>.</red>"
  unknown-filter: "<red>Неизвестный фильтр «%filter%»: укажите редкость, регион или all.</red>"

  # -------------------------------- редкости --------------------------------
  tier.common: "<gray>обычный</gray>"
  tier.rare: "<aqua>редкий</aqua>"
  tier.epic: "<light_purple>эпический</light_purple>"
  tier.legendary: "<gold>легендарный</gold>"
  tier.mythical: "<gradient:#ff4d4d:#c400ff>мифический</gradient>"

  # ---------------------------------- звания ---------------------------------
  rank.novice: "<gray>Новичок</gray>"
  rank.seeker: "<white>Искатель</white>"
  rank.treasure_hunter: "<green>Кладоискатель</green>"
  rank.connoisseur: "<aqua>Знаток</aqua>"
  rank.master: "<light_purple>Мастер</light_purple>"
  rank.legend: "<gradient:#ff4d4d:#c400ff>Легенда</gradient>"

  # --------------------------------- регионы ---------------------------------
  region.plains: "<white>Равнины</white>"
  region.forest: "<white>Лес</white>"
  region.taiga: "<white>Тайга</white>"
  region.snow: "<white>Снега</white>"
  region.desert: "<white>Пустыня</white>"
  region.savanna: "<white>Саванна</white>"
  region.jungle: "<white>Джунгли</white>"
  region.swamp: "<white>Болото</white>"
  region.mountain: "<white>Горы</white>"
  region.ocean: "<white>Океан</white>"
  region.deep: "<white>Глубины</white>"
  region.deep_dark: "<white>Глубокая тьма</white>"
  region.nether: "<white>Нижний мир</white>"
  region.end: "<white>Край</white>"

  # ----------------------------- оформление находок ---------------------------
  item-name-common: "<white>%name%</white>"
  item-name-rare: "<aqua>%name%</aqua>"
  item-name-epic: "<light_purple>%name%</light_purple>"
  item-name-legendary: "<gold>%name%</gold>"
  item-name-mythical: "<gradient:#ff4d4d:#c400ff>%name%</gradient>"
  item-desc: "<gray><i>%text%</i></gray>"
  item-effect-attack-damage: "<gray>Урон в ближнем бою: <red>+%value%</red></gray>"
  item-effect-ranged-damage: "<gray>Урон из лука: <red>+%value%</red></gray>"
  item-effect-armor: "<gray>Броня: <blue>+%value%</blue></gray>"
  item-effect-armor-toughness: "<gray>Твёрдость брони: <blue>+%value%</blue></gray>"
  item-effect-max-health: "<gray>Здоровье: <red>+%value%</red></gray>"
  item-effect-movement-speed: "<gray>Скорость: <white>+%value%</white></gray>"
  item-effect-mining-speed: "<gray>Скорость копания: <yellow>+%value%</yellow></gray>"
  item-effect-luck: "<gray>Удача: <green>+%value%</green></gray>"
  item-effect-knockback-resistance: "<gray>Сопротивление отбрасыванию: <blue>+%value%</blue></gray>"
  item-effect-fall-reduction: "<gray>Урон от падения: <white>−%value%</white></gray>"
  item-effect-lifesteal: "<gray>Вампиризм: <dark_red>%value% нанесённого урона</dark_red></gray>"
  item-effect-flame: "<gray>Шанс поджога: <gold>%value%</gold></gray>"
  item-effect-xp-bonus: "<gray>Опыт за блок: <green>+%value%</green></gray>"
  item-effect-double-ore: "<gray>Шанс второй руды: <yellow>%value%</yellow></gray>"
  item-effect-regeneration: "<gray>Аура: <green>регенерация %value%</green></gray>"
  item-effect-water-breathing: "<gray>Аура: <aqua>дыхание под водой %value%</aqua></gray>"
  item-effect-fire-resistance: "<gray>Аура: <gold>огнестойкость %value%</gold></gray>"
  item-tier-common: "<dark_gray>Редкость: обычная</dark_gray>"
  item-tier-rare: "<dark_gray>Редкость: редкая</dark_gray>"
  item-tier-epic: "<dark_gray>Редкость: эпическая</dark_gray>"
  item-tier-legendary: "<dark_gray>Редкость: легендарная</dark_gray>"
  item-tier-mythical: "<dark_gray>Редкость: мифическая</dark_gray>"

  # --------------------------------- находки ---------------------------------
  treasure.plains-reap-hook.name: "Жатвенный крюк"
  treasure.plains-reap-hook.desc: "Крюк, которым на равнинах подцепляют снопы. В умелых руках работает и по мягкой земле."
  treasure.plains-herder-blade.name: "Клинок пастуха"
  treasure.plains-herder-blade.desc: "Короткий клинок пастуха: им отбиваются от волков и режут верёвки."
  treasure.plains-sheaf-edge.name: "Лезвие снопа"
  treasure.plains-sheaf-edge.desc: "Лезвие, закалённое в жатву. Собирает не только колосья, но и силу врагов."
  treasure.plains-golden-scythe.name: "Золотая коса"
  treasure.plains-golden-scythe.desc: "Коса из золота и стали. Предание говорит, что ею жали травы сами духи полей."
  treasure.forest-woodcutter.name: "Топор лесоруба"
  treasure.forest-woodcutter.desc: "Обычный топор лесоруба, который почему-то не тупится о сучья."
  treasure.forest-watch-helm.name: "Шлем лесного дозора"
  treasure.forest-watch-helm.desc: "Шлем дозорного: в нём слышно, как трещат ветки за сотню шагов."
  treasure.forest-lumber-axe.name: "Дровосечный колун"
  treasure.forest-lumber-axe.desc: "Колун, которым валят вековые дубы. Дерево будто само расступается."
  treasure.forest-root-guard.name: "Страж корней"
  treasure.forest-root-guard.desc: "Топор-оберег, вырезанный из корня древнего дуба. Лес считает его своим."
  treasure.taiga-resin-pick.name: "Смоляная кирка"
  treasure.taiga-resin-pick.desc: "Кирка, пропитанная смолой. Камень не липнет к острию."
  treasure.taiga-fur-boots.name: "Меховые сапоги"
  treasure.taiga-fur-boots.desc: "Сапоги на меху: по сугробам идёшь, не проваливаясь по колено."
  treasure.taiga-cloak.name: "Плащ тайги"
  treasure.taiga-cloak.desc: "Плащ из шкур тайги. В нём теплее и будто больше жизни."
  treasure.taiga-winter-axe.name: "Топор зимы"
  treasure.taiga-winter-axe.desc: "Топор, которым рубили лёд на реке. От удара тянет морозом."
  treasure.snow-snowshoes.name: "Снегоступы"
  treasure.snow-snowshoes.desc: "Снегоступы: вес распределён, и снег держит даже настом."
  treasure.snow-ice-pick.name: "Ледяная кирка"
  treasure.snow-ice-pick.desc: "Кирка из голубого льда. Не тает даже у костра."
  treasure.snow-blizzard-cloak.name: "Плащ снежной бури"
  treasure.snow-blizzard-cloak.desc: "Плащ, сшитый из ветра и снега. Буран обходит своего хозяина."
  treasure.snow-frost-blade.name: "Морозный клинок"
  treasure.snow-frost-blade.desc: "Клинок, выкованный в мороз. Рана от него долго не затягивается."
  treasure.desert-sand-pick.name: "Песчаная кирка"
  treasure.desert-sand-pick.desc: "Кирка, которой копают колодцы. Песок осыпается, но не засыпает."
  treasure.desert-nomad-bracers.name: "Наручи кочевника"
  treasure.desert-nomad-bracers.desc: "Наручи кочевника: лёгкие, но держат удар и не мешают идти."
  treasure.desert-sun-blade.name: "Клинок солнца"
  treasure.desert-sun-blade.desc: "Клинок, раскалённый в полдень. Оставляет на песке дымящийся след."
  treasure.desert-pharaoh-blade.name: "Клинок фараона"
  treasure.desert-pharaoh-blade.desc: "Клинок из усыпальницы: золото, лазурь и чужая удача."
  treasure.savanna-hunter-spear.name: "Копьё охотника"
  treasure.savanna-hunter-spear.desc: "Копьё охотника: древко из акации, наконечник из кости."
  treasure.savanna-runner-boots.name: "Сапоги бегуна"
  treasure.savanna-runner-boots.desc: "Сапоги, в которых можно бежать за антилопой до заката."
  treasure.savanna-garnet-cleaver.name: "Гранатовый тесак"
  treasure.savanna-garnet-cleaver.desc: "Тесак с гранатовой инкрустацией. Тяжёлый, но злой."
  treasure.savanna-fang.name: "Клык саванны"
  treasure.savanna-fang.desc: "Клинок-клык: им вождь саванны отмечал границы охотничьих угодий."
  treasure.jungle-machete.name: "Мачете джунглей"
  treasure.jungle-machete.desc: "Мачете, которым прорубают тропу сквозь лианы."
  treasure.jungle-vine-boots.name: "Сапоги лиан"
  treasure.jungle-vine-boots.desc: "Сапоги, оплетённые лианами. Ветки сами подставляют руку."
  treasure.jungle-serpent-blade.name: "Клинок змея"
  treasure.jungle-serpent-blade.desc: "Клинок с гравировкой змеи. Бьёт быстро, как бросок."
  treasure.jungle-jaguar-fang.name: "Клык ягуара"
  treasure.jungle-jaguar-fang.desc: "Клык ягуара на рукояти. Хищники джунглей не нападают первыми."
  treasure.swamp-mire-helm.name: "Шлем болотной топи"
  treasure.swamp-mire-helm.desc: "Шлем из болотной кожи. В нём можно дышать под водой и не видеть дна."
  treasure.swamp-bog-pick.name: "Болотная кирка"
  treasure.swamp-bog-pick.desc: "Кирка, которой достают торф и утопленное железо."
  treasure.swamp-tin-shell.name: "Оловянный панцирь"
  treasure.swamp-tin-shell.desc: "Панцирь из оловянных пластин: тяжёлый, зато держит топор."
  treasure.swamp-mire-blade.name: "Клинок трясины"
  treasure.swamp-mire-blade.desc: "Клинок, найденный в трясине. Болото отдало его неохотно."
  treasure.mountain-stonecutter.name: "Камнерез"
  treasure.mountain-stonecutter.desc: "Кирка камнереза: режет породу ровно, как масло."
  treasure.mountain-climb-boots.name: "Сапоги скалолаза"
  treasure.mountain-climb-boots.desc: "Сапоги скалолаза. Падение с уступа уже не приговор."
  treasure.mountain-prospector-pick.name: "Кирка старателя"
  treasure.mountain-prospector-pick.desc: "Кирка старателя: руда будто сама выпрыгивает из камня."
  treasure.mountain-peak-hammer.name: "Молот вершины"
  treasure.mountain-peak-hammer.desc: "Молот вершины. Пробивает жилы, о которых не знали карты."
  treasure.ocean-shell-helm.name: "Ракушечный шлем"
  treasure.ocean-shell-helm.desc: "Шлем из ракушек. Под водой слышно, как поют киты."
  treasure.ocean-harpoon.name: "Гарпун"
  treasure.ocean-harpoon.desc: "Гарпун из обломка корабельного киля."
  treasure.ocean-coral-plate.name: "Коралловый нагрудник"
  treasure.ocean-coral-plate.desc: "Нагрудник из коралла: лёгкий, но держит удар течения."
  treasure.ocean-spear.name: "Копьё океана"
  treasure.ocean-spear.desc: "Копьё океана. В воде двигается быстрее, чем в воздухе."
  treasure.deep-miner-pick.name: "Кирка глубинного шахтёра"
  treasure.deep-miner-pick.desc: "Кирка шахтёра, который копал глубже всех и не вернулся."
  treasure.deep-lantern-helm.name: "Шлем-фонарь"
  treasure.deep-lantern-helm.desc: "Шлем-фонарь: в самом тёмном штреке светло как днём."
  treasure.deep-abyss-pick.name: "Кирка бездны"
  treasure.deep-abyss-pick.desc: "Кирка из бездны: камень перед ней трескается сам."
  treasure.deep-core-drill.name: "Бур ядра"
  treasure.deep-core-drill.desc: "Бур, которым достают породу у самого ядра мира."
  treasure.deep-dark-sculk-leggings.name: "Скалковые поножи"
  treasure.deep-dark-sculk-leggings.desc: "Поножи, обмотанные скалком. Тише шаг — дольше жизнь."
  treasure.deep-dark-blade.name: "Клинок глубин"
  treasure.deep-dark-blade.desc: "Клинок из глубин. Хранитель не заметил, как его потерял."
  treasure.deep-dark-warden-plate.name: "Панцирь хранителя"
  treasure.deep-dark-warden-plate.desc: "Панцирь хранителя: тяжёлый, глухой и почти неуязвимый."
  treasure.deep-dark-echo-blade.name: "Эхо-клинок"
  treasure.deep-dark-echo-blade.desc: "Клинок, который помнит каждый удар и возвращает его обратно."
  treasure.nether-fire-helm.name: "Огненный шлем"
  treasure.nether-fire-helm.desc: "Шлем из огня Нижнего мира. В нём даже лава кажется тёплой."
  treasure.nether-basalt-cleaver.name: "Базальтовый тесак"
  treasure.nether-basalt-cleaver.desc: "Тесак из базальта: рубит и плоть, и камень."
  treasure.nether-lava-blade.name: "Лавовый клинок"
  treasure.nether-lava-blade.desc: "Клинок, закалённый в лаве. Раны от него тлеют."
  treasure.nether-flame-blade.name: "Пламенный клинок"
  treasure.nether-flame-blade.desc: "Пламенный клинок. Огонь идёт за ним, как собака на поводке."
  treasure.end-void-pick.name: "Кирка пустоты"
  treasure.end-void-pick.desc: "Кирка пустоты: края блоков расходятся без звука."
  treasure.end-shard-sword.name: "Осколочный меч"
  treasure.end-shard-sword.desc: "Меч из осколка хорового плода. Искрится и приносит удачу."
  treasure.end-chorus-plate.name: "Хоровой панцирь"
  treasure.end-chorus-plate.desc: "Панцирь из хоры: в нём будто больше жизни, чем должно быть."
  treasure.end-void-blade.name: "Клинок Края"
  treasure.end-void-blade.desc: "Клинок Края. Тот, кто им владеет, не боится пустоты."
  treasure.mythic-heart-of-depths.name: "Сердце глубин"
  treasure.mythic-heart-of-depths.desc: "Сердце глубин: в нём бьётся жар ядра, и руда идёт сама в руки."
  treasure.mythic-abyss-blade.name: "Клинок бездны"
  treasure.mythic-abyss-blade.desc: "Клинок бездны: им можно разрезать тишину."
  treasure.mythic-world-shell.name: "Панцирь мира"
  treasure.mythic-world-shell.desc: "Панцирь мира: выдержал бы удар метеора."
  treasure.mythic-wanderer-boots.name: "Сапоги странника"
  treasure.mythic-wanderer-boots.desc: "Сапоги странника: шаг — и уже на другом хребте."
  treasure.mythic-crown-of-abyss.name: "Корона бездны"
  treasure.mythic-crown-of-abyss.desc: "Корона бездны: под водой дышит, на суше лечит."
  treasure.mythic-bow-of-providence.name: "Лук провидения"
  treasure.mythic-bow-of-providence.desc: "Лук провидения: стрела сама находит слабое место."

  # ------------------------------- уведомления -------------------------------
  treasure-found-named: "<gold>Клад!</gold> %tier% <dark_gray>·</dark_gray> %name%"
  treasure-found-loot: "<gold>Клад!</gold> %tier% <gray>— добыча уже в инвентаре.</gray>"
  treasure-broadcast-named: "<gold>%player%</gold> <gray>нашёл</gray> %tier% <gray>находку</gray> %name%<gray>!</gray>"
  treasure-broadcast-loot: "<gold>%player%</gold> <gray>нашёл</gray> %tier% <gray>клад.</gray>"
  double-ore: "<gray>Двойная руда!</gray>"
  collection-milestone: "<gold>Коллекция: <white>%found%/%total%</white> находок! Награда — <aqua>%diamonds% алмазов</aqua>.</gold>"
  streak-bonus: "<gold>Серия %streak%!</gold> <gray>Бонусная добыча уже в инвентаре.</gray>"
  rank-up: "<gold>Новый ранг:</gold> %rank% <gray>· награда <aqua>%diamonds% алмазов</aqua></gray>"
  rank-up-broadcast: "<gold>%player%</gold> <gray>достиг звания</gray> %rank%<gray>!</gray>"
  title-found: "<gold>Клад!</gold> %tier%"
  title-found-named: "%name%"
  title-found-loot: "<gray>Добыча уже в инвентаре</gray>"
  actionbar-found: "%tier% <dark_gray>·</dark_gray> серия <white>%streak%</white> <dark_gray>·</dark_gray> коллекция <white>%found%/%total%</white>"

  # --------------------------------- витрина ---------------------------------
  menu-title: "<gradient:#f5c542:#b46a00>Коллекция кладов</gradient>"
  menu-region-name: "%region% <dark_gray>·</dark_gray> <white>%found%/%total%</white>"
  menu-region-lore: "<gray>Найдено находок: <white>%found% из %total%</white></gray>"
  menu-region-click: "<aqua>Клик — открыть регион</aqua>"
  menu-mythic-name: "<gradient:#ff4d4d:#c400ff>Мифические находки</gradient> <dark_gray>·</dark_gray> <white>%found%/%total%</white>"
  menu-mythic-lore: "<gray>Собрано: <white>%found% из %total%</white></gray>"
  menu-summary-name: "<gold>Кладоискатель</gold>"
  menu-summary-mined: "<gray>Добыто блоков: <white>%mined%</white></gray>"
  menu-summary-found: "<gray>Найдено кладов: <white>%found%</white></gray>"
  menu-summary-collection: "<gray>Коллекция: <white>%found%/%total%</white></gray>"
  menu-summary-rank: "<gray>Звание: %rank%</gray>"
  menu-summary-streak: "<gray>Серия: <white>%streak%</white> · рекорд: <white>%best%</white></gray>"
  menu-summary-next: "<gray>До следующей редкости: %hint%</gray>"
  menu-summary-next-none: "<green>Все редкости открыты.</green>"
  menu-top-name: "<gold>Топ кладоискателей</gold>"
  menu-top-lore: "<gray>Кто нашёл больше всех</gray>"
  menu-sounds-name: "<gold>Звуки находок</gold>"
  menu-particles-name: "<gold>Частицы находок</gold>"
  menu-announce-name: "<gold>Сообщения о находках</gold>"
  menu-toggle-on: "<green>Включено</green> <dark_gray>· клик — выключить</dark_gray>"
  menu-toggle-off: "<red>Выключено</red> <dark_gray>· клик — включить</dark_gray>"
  menu-close: "<red>Закрыть</red>"
  menu-back: "<yellow>Назад</yellow>"
  menu-locked-name: "<dark_gray>??? · %tier%</dark_gray>"
  menu-locked-lore: "<gray>Находка ещё не найдена. Ищите клады в подходящем биоме.</gray>"
  region-title: "<gold>%region%</gold>"
  mythic-title: "<gradient:#ff4d4d:#c400ff>Мифические находки</gradient>"
  item-found: "<dark_gray>Найдено: %count% раз(а)</dark_gray>"
  top-title: "<gold>Топ кладоискателей</gold>"
  top-empty: "<gray>Пока никто не нашёл ни одного клада.</gray>"
  top-entry-name: "<gold>%place%.</gold> <white>%name%</white>"
  top-entry-lore: "<gray>Кладов: <white>%found%</white> · коллекция: <white>%collection%/%total%</white></gray>"

  # --------------------------------- команды ---------------------------------
  help-header: "<gold>Клады · команды</gold>"
  help-menu: "<yellow>/treasures</yellow> <gray>— коллекция находок</gray>"
  help-list: "<yellow>/treasures list [редкость|регион|all]</yellow> <gray>— что уже найдено</gray>"
  help-stats: "<yellow>/treasures stats</yellow> <gray>— добыча, звание, серия и прогрессия</gray>"
  help-stats-other: "<yellow>/treasures stats <ник></yellow> <gray>— статистика другого игрока</gray>"
