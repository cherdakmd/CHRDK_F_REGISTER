  treasure.dp-jungle-razor.name: "Бритва джунглей"
  treasure.dp-jungle-razor.desc: "Бритва джунглей: лёгкая, быстрая и неожиданно злая."
  treasure.dp-dawn-blade.name: "Клинок рассвета"
