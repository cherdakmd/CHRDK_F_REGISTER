  treasure.dp-savanna-sandals.name: "Сандалии саванны"
  treasure.dp-savanna-sandals.desc: "Сандалии саванны: по горячей земле бегут не обжигаясь."
  treasure.dp-desert-veil.name: "Вуаль пустыни"
