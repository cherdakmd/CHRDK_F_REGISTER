name: CHRDK_Treasures
version: ${version}
main: ru.cherdakmd.chrdktreasures.TreasuresPlugin
api-version: '26.3'
description: "Русские клады: 5 редкостей, 14 биомных регионов, 196 находок (124 классические и 72 из арсенала Mine Treasure), 21 вид способностей по ПКМ, сеты и проклятия"
author: cherdakmd
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI]
commands:
  treasures:
    description: "Клады: витрина, список, статистика, топ, лут-таблицы и настройки"
    usage: "/treasures [menu|list [фильтр]|loot [фильтр]|set [регион]|stats [ник]|top|toggle <sounds|particles|announce>]"
  treasuresadmin:
    description: "Администрирование кладов"
    permission: chrdktreasures.admin
    usage: "/treasuresadmin <reload|info|give <ник> <ид>|reset <ник>|resetall confirm|chance <редкость> <процент|reset>|stats <ник>>"
permissions:
  chrdktreasures.use:
    description: "Открывать коллекцию, смотреть список, статистику и топ"
    default: true
  chrdktreasures.ability:
    description: "Применять активные способности находок по правому клику"
    default: true
  chrdktreasures.stats.others:
    description: "Смотреть статистику другого кладоискателя (/treasures stats <ник>)"
    default: true
  chrdktreasures.admin:
    description: "Выдача находок, сброс прогресса и reload"
    default: op
