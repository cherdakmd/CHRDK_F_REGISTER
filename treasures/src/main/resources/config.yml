# CHRDK_Treasures — русские клады: 5 редкостей, 14 биомных регионов и 62
# именных находки. Клад выпадает за добычу блока; редкость зависит от породы,
# глубины, биома и накопленной добычи игрока.
#
# Как считается шанс одного блока:
#   шанс = chance-percent редкости × множитель породы × (1 + бонус глубины)
# Значения chance-percent — в процентах (1.0 = один клад на 100 блоков этой
# породы при нулевой глубине). Итог проверяется от редкого к обычному, поэтому
# за один блок выпадает не больше одного клада.
#
# Прогрессия: редкие клады закрыты, пока игрок не добыл нужное число блоков
# (250 — редкий, 2 000 — эпический, 15 000 — легендарный). Мифический клад
# доступен сразу, но его шанс ничтожен — 0.0008 %.

general:
  locale: ru
  # Главный выключатель: false — клады не выпадают, витрина закрыта, ауры не
  # обновляются. Данные игроков сохраняются, при включении всё вернётся.
  enabled: true
  # Раз в сколько тиков пересобираются ауры находок (регенерация, дыхание,
  # огнестойкость). 20 тиков = 1 секунда; 20..200.
  aura-refresh-ticks: 60
  # Сколько строк в /treasures top и на экране топа (3..50).
  top-size: 10

# Шансы редкостей. chance-percent — вероятность клада этой редкости на один
# блок с множителем 1.0; item-chance — доля кладов, в которых лежит именная
# находка (остальное — ванильная добыча). 0 выключает редкость, не ломая
# прогрессию: её просто нельзя найти.
chances:
  common:
    chance-percent: 1.0
    item-chance: 0.45
  rare:
    chance-percent: 0.220
    item-chance: 0.55
  epic:
    chance-percent: 0.050
    item-chance: 0.70
  legendary:
    chance-percent: 0.008
    item-chance: 0.90
  mythical:
    chance-percent: 0.0008
    item-chance: 1.0

# Множитель шанса по породе. Секция полностью заменяет встроенный список:
# уберите строку — блок перестанет давать клады. 0 тоже выключает блок.
# Руда ценнее камня, незерит — самый «кладоносный».
blocks:
  STONE: 1.0
  COBBLESTONE: 1.0
  DEEPSLATE: 1.0
  COBBLED_DEEPSLATE: 1.1
  TUFF: 1.0
  GRANITE: 1.0
  DIORITE: 1.0
  ANDESITE: 1.0
  CALCITE: 1.0
  SMOOTH_BASALT: 1.0
  BASALT: 1.1
  NETHERRACK: 1.1
  BLACKSTONE: 1.2
  END_STONE: 1.2
  OBSIDIAN: 1.5
  CRYING_OBSIDIAN: 1.5
  COAL_ORE: 2.0
  DEEPSLATE_COAL_ORE: 2.0
  IRON_ORE: 2.0
  DEEPSLATE_IRON_ORE: 2.0
  COPPER_ORE: 2.0
  DEEPSLATE_COPPER_ORE: 2.0
  GOLD_ORE: 2.0
  DEEPSLATE_GOLD_ORE: 2.0
  REDSTONE_ORE: 2.0
  DEEPSLATE_REDSTONE_ORE: 2.0
  LAPIS_ORE: 2.0
  DEEPSLATE_LAPIS_ORE: 2.0
  DIAMOND_ORE: 2.0
  DEEPSLATE_DIAMOND_ORE: 2.0
  EMERALD_ORE: 2.0
  DEEPSLATE_EMERALD_ORE: 2.0
  NETHER_GOLD_ORE: 2.0
  NETHER_QUARTZ_ORE: 2.0
  ANCIENT_DEBRIS: 4.0

# Глубина: каждый блок ниже нуля добавляет per-block-bonus к множителю,
# но не больше max-bonus. 0.002 и 0.5 — на глубине −64 шанс выше на 12.8 %,
# на глубине −250 (моддинг) — на 50 % (потолок).
depth:
  per-block-bonus: 0.002
  max-bonus: 0.5

limits:
  # Сколько секунд помнить блок, поставленный игроком: сломанный в этом окне
  # блок не даёт ни клада, ни двойной руды. Защита от «поставь-сломай».
  placed-block-seconds: 300
  # Сколько поставленных блоков помнить на весь сервер (64..1000000).
  placed-block-max: 20000
  # Минимальная пауза между кладами одного игрока. 0 — без паузы; 3 секунды
  # не мешают играть, но не дают превратить шахту в конвейер.
  min-seconds-between-treasures: 3

# Награды за коллекцию: ключ — сколько уникальных находок собрано, diamonds —
# сколько алмазов выдать один раз. Ключи 1..62; после находки проверяются все
# вехи и выдаются только новые.
milestones:
  10:
    diamonds: 8
  25:
    diamonds: 24
  40:
    diamonds: 48
  62:
    diamonds: 96

feedback:
  # Объявлять легендарный клад всему серверу (в чат, с ником нашедшего).
  broadcast-legendary: true
  # Объявлять мифический клад всему серверу.
  broadcast-mythical: true
