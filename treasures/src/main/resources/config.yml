# CHRDK_Treasures — русские клады: 5 редкостей, 14 биомных регионов и 62
# именных находки. Клад выпадает за добычу блока; редкость зависит от породы,
# глубины, биома и накопленной добычи игрока.
#
# Как считается шанс одного блока:
#   шанс = проценты редкости из blocks.<блок>.<редкость> × (1 + бонус глубины)
# Если у блока записан один множитель, он умножает chance-percent редкости.
# Значения — в процентах (1.0 = один клад на 100 блоков при нулевой глубине).
# Итог проверяется от редкого к обычному: за блок выпадает не больше одного
# клада, а редкость закрыта, пока игрок не добыл нужное число блоков.
#
# Прогрессия: редкие клады закрыты, пока игрок не добыл нужное число блоков
# (250 — редкий, 2 000 — эпический, 15 000 — легендарный). Мифический клад
# доступен сразу, но его шанс ничтожен — 0.0008 %.
#
# Шансы можно менять командой /treasuresadmin chance <редкость> <процент>:
# она пишет отдельный chances.yml и не трогает комментарии этого файла.

general:
  locale: ru
  # Главный выключатель: false — клады не выпадают, витрина закрыта, ауры не
  # обновляются. Данные игроков сохраняются, при включении всё вернётся.
  enabled: true
  # Раз в сколько тиков пересобираются ауры находок (регенерация, дыхание,
  # огнестойкость). 20 тиков = 1 секунда; 20..200.
  aura-refresh-ticks: 60
  # Сколько строк в /treasures top и на экране топа (3..50).
  top-size: 10

# Шансы редкостей. chance-percent — вероятность клада этой редкости на один
# блок с множителем 1.0; item-chance — доля кладов, в которых лежит именная
# находка (остальное — ванильная добыча). 0 выключает редкость, не ломая
# прогрессию: её просто нельзя найти.
chances:
  common:
    chance-percent: 1.0
    item-chance: 0.45
  rare:
    chance-percent: 0.220
    item-chance: 0.55
  epic:
    chance-percent: 0.050
    item-chance: 0.70
  legendary:
    chance-percent: 0.008
    item-chance: 0.90
  mythical:
    chance-percent: 0.0008
    item-chance: 1.0

# Шанс клада на блок, проценты по редкостям — как в таблицах Mine Treasure.
# Каждая запись — секция из пяти редкостей; 1.0 значит «один клад этой
# редкости на 100 таких блоков при нулевой глубине». Проверка идёт от
# мифического к обычному, поэтому за блок выпадает не больше одного клада.
# Блока нет в списке — кладов он не даёт.
#
# Короткая запись числом (DIAMOND_ORE: 2.0) — старый формат: множитель к
# chances.<редкость>.chance-percent. Форматы можно смешивать.
#
# Секция полностью заменяет встроенный список. Уберите строку — блок
# перестанет давать клады.
blocks:
  # Камень и глубинные породы: база, на которой стоит вся таблица — 1 %
  # обычного клада на блок. Редкий вчетверо реже обычного, эпический —
  # в 31 раз реже, легендарный вдвое реже эпического, мифический — в 8 раз
  # реже эпического.
  STONE:
    common: 1
    rare: 0.25
    epic: 0.032
    legendary: 0.016
    mythical: 0.004
  COBBLESTONE:
    common: 1
    rare: 0.25
    epic: 0.032
    legendary: 0.016
    mythical: 0.004
  DEEPSLATE:
    common: 1.6
    rare: 0.4
    epic: 0.0512
    legendary: 0.0256
    mythical: 0.0064
  COBBLED_DEEPSLATE:
