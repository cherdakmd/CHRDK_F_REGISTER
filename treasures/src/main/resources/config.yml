# Глубина: каждый блок ниже нуля добавляет per-block-bonus к множителю,
# но не больше max-bonus. 0.002 и 0.5 — на глубине −64 шанс выше на 12.8 %,
# на глубине −250 (моддинг) — на 50 % (потолок).
depth:
  per-block-bonus: 0.002
  max-bonus: 0.5

limits:
  # Сколько секунд помнить блок, поставленный игроком: сломанный в этом окне
  # блок не даёт ни клада, ни двойной руды. Защита от «поставь-сломай».
  placed-block-seconds: 300
  # Сколько поставленных блоков помнить на весь сервер (64..1000000).
  placed-block-max: 20000
  # Минимальная пауза между кладами одного игрока. 0 — без паузы; 3 секунды
  # не мешают играть, но не дают превратить шахту в конвейер.
  min-seconds-between-treasures: 3

# Активные способности находок по правому клику. Способности есть у эпических,
# легендарных и мифических предметов; у лука и арбалета — только в приседе,
# чтобы обычный выстрел оставался обычным. Перезарядка задана в каталоге и
# считается отдельно по каждому предмету: потолок силы зашит в предмет, а не
# раскачивается игроком. false — предметы работают только пассивно.
# Арсенал Mine Treasure: 36 вещей, перенесённых из датапака и переписанных
# нативно. Они дополняют классический каталог, а не заменяют его: доля ниже
# задаёт, какая часть именных находок берётся из арсенала. 0 — только
# классика, 1 — только арсенал (не рекомендуется: коллекция обеднеет).
# Способности арсенала безопасны для мира: без разрушения блоков и поджогов,
# урон получают только враждебные мобы.
arsenal:
  share: 0.35

abilities:
  enabled: true

# Сетовые бонусы: 2 находки одного региона в инвентаре дают частичный бонус,
# 4 — полный (надевать их не обязательно: в сете есть кирки и клинки, четыре
# сразу на себя не надеть). Одновременно действует только один сет
# (сильнейший), поэтому ауры двух биомов не складываются. false — сеты не
# дают ничего.
sets:
  enabled: true

# Проклятия-расплаты: легендарные и мифические находки иногда накладывают на
# владельца временный дебафф (голод, слабость, замедление, слепота, свечение,
# левитация). Проклятие не ломает предмет, не отбирает находку и не может
# убить; шанс и повод заданы в каталоге. false — расплата отключена.
curses:
  enabled: true

# Награды за коллекцию: ключ — сколько уникальных находок собрано, diamonds —
# сколько алмазов выдать один раз. Ключи 1..196 (124 классические находки и
# 72 вещи арсенала); после находки проверяются все вехи и выдаются только
# новые.
milestones:
  20:
    diamonds: 8
  50:
    diamonds: 24
  80:
    diamonds: 48
  124:
    diamonds: 96
  160:
    diamonds: 128
  196:
    diamonds: 192

# Серия находок: клады, найденные подряд без паузы дольше window-seconds,
# продлевают серию. Каждая bonus-every-я находка серии даёт дополнительную
# порцию добычи (именные предметы в бонус не входят). 0 — бонусов нет.
streak:
  window-seconds: 600
  bonus-every: 5

# Склянки опыта (1.4.157). Опыт — самая частая награда клада: он не занимает
# место в экономике алмазов и всегда полезен. Выдаётся отдельным шагом поверх
# loot.yml, поэтому «часто» не зависит от того, обновился ли файл таблиц.
experience:
  # Выключить совсем — клад не даёт склянок (опыт останется только в строках
  # loot.yml, если они там есть).
  enabled: true
  # Сколько склянок даёт один клад каждой редкости. Значения 0..32.
  bottles:
    common:
      min: 1
      max: 2
    rare:
      min: 2
      max: 4
    epic:
      min: 3
      max: 6
    legendary:
      min: 5
      max: 9
    mythical:
      min: 8
      max: 14
  # Шанс, что склянок будет больше обычного (0..100). 25 — каждый четвёртый
  # клад приносит бонус.
  bonus-chance-percent: 25
  # Насколько больше при срабатывании бонуса: 100 — вдвое, 50 — в полтора раза.
  bonus-multiplier-percent: 100
  # Потолок склянок за один клад (1..64). Одна склянка — 3..11 опыта, так что
  # 32 склянки — это уже почти тридцать уровней, дальше начинается «бесплатно».
  max-per-treasure: 32

# Звания кладоискателя: пороги (0/5/15/35/75/150 находок) заданы в коде,
# здесь — награда в алмазах за достижение звания. Новичок награды не даёт.
ranks:
  seeker:
    diamonds: 4
  treasure_hunter:
    diamonds: 10
  connoisseur:
    diamonds: 20
  master:
    diamonds: 40
  legend:
    diamonds: 80

# Оформление находки. titles — заголовок на экране, actionbar — строка над
# хотбаром, fireworks — фейерверк. min-tier задаёт, с какой редкости
# включается эффект: epic и legendary по умолчанию.
effects:
  titles: true
  actionbar: true
  fireworks: true
  title-min-tier: epic
  firework-min-tier: legendary

feedback:
  # Объявлять легендарный клад всему серверу (в чат, с ником нашедшего).
  broadcast-legendary: true
  # Объявлять мифический клад всему серверу.
  broadcast-mythical: true
  # Объявлять всему серверу достижение звания «Легенда» (150 кладов).
  broadcast-legend: true
  # Писать в чат, что именно выпало: «Клад! Легендарный — Алмаз ×3, Золотой
  # слиток ×2». Имена обычных предметов берутся из языка клиента игрока.
  show-loot: true
  # Сколько предметов перечислять в одной строке (1..12); остальные
  # сворачиваются в «и ещё N».
  loot-details-max: 6
  # Дублировать каждую находку с составом в консоль сервера.
  log-finds: true
