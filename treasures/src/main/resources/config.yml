# Глубина: каждый блок ниже нуля добавляет per-block-bonus к множителю,
# но не больше max-bonus. 0.002 и 0.5 — на глубине −64 шанс выше на 12.8 %,
# на глубине −250 (моддинг) — на 50 % (потолок).
depth:
  per-block-bonus: 0.002
  max-bonus: 0.5

limits:
  # Сколько секунд помнить блок, поставленный игроком: сломанный в этом окне
  # блок не даёт ни клада, ни двойной руды. Защита от «поставь-сломай».
  placed-block-seconds: 300
  # Сколько поставленных блоков помнить на весь сервер (64..1000000).
  placed-block-max: 20000
  # Минимальная пауза между кладами одного игрока. 0 — без паузы; 3 секунды
  # не мешают играть, но не дают превратить шахту в конвейер.
  min-seconds-between-treasures: 3

# Награды за коллекцию: ключ — сколько уникальных находок собрано, diamonds —
# сколько алмазов выдать один раз. Ключи 1..62; после находки проверяются все
# вехи и выдаются только новые.
milestones:
  10:
    diamonds: 8
  25:
    diamonds: 24
  40:
    diamonds: 48
  62:
    diamonds: 96

# Серия находок: клады, найденные подряд без паузы дольше window-seconds,
# продлевают серию. Каждая bonus-every-я находка серии даёт дополнительную
# порцию добычи (именные предметы в бонус не входят). 0 — бонусов нет.
streak:
  window-seconds: 600
  bonus-every: 5

# Звания кладоискателя: пороги (0/5/15/35/75/150 находок) заданы в коде,
# здесь — награда в алмазах за достижение звания. Новичок награды не даёт.
ranks:
  seeker:
    diamonds: 4
  treasure_hunter:
    diamonds: 10
  connoisseur:
    diamonds: 20
  master:
    diamonds: 40
  legend:
    diamonds: 80

# Оформление находки. titles — заголовок на экране, actionbar — строка над
# хотбаром, fireworks — фейерверк. min-tier задаёт, с какой редкости
# включается эффект: epic и legendary по умолчанию.
effects:
  titles: true
  actionbar: true
  fireworks: true
  title-min-tier: epic
  firework-min-tier: legendary

feedback:
  # Объявлять легендарный клад всему серверу (в чат, с ником нашедшего).
  broadcast-legendary: true
  # Объявлять мифический клад всему серверу.
  broadcast-mythical: true
  # Объявлять всему серверу достижение звания «Легенда» (150 кладов).
  broadcast-legend: true
