# CHRDK_Treasures — русские клады: 5 редкостей, 14 биомных регионов и 196
# именных находок (124 классические и 72 из арсенала Mine Treasure). Клад
# выпадает за добычу блока; редкость зависит от породы, глубины, биома и
# накопленной добычи игрока.
#
# Как считается шанс одного блока:
#   шанс = проценты редкости из blocks.<блок>.<редкость> × (1 + бонус глубины)
# Если у блока записан один множитель, он умножает chance-percent редкости.
# Значения — в процентах (1.0 = один клад на 100 блоков при нулевой глубине).
# Итог проверяется от редкого к обычному: за блок выпадает не больше одного
# клада, а редкость закрыта, пока игрок не добыл нужное число блоков.
#
# Прогрессия: редкие клады закрыты, пока игрок не добыл нужное число блоков
# (250 — редкий, 2 000 — эпический, 15 000 — легендарный). Мифический клад
# доступен сразу, но его шанс ничтожен — 0.0016 %.
#
# Шансы можно менять командой /treasuresadmin chance <редкость> <процент>:
# она пишет отдельный chances.yml и не трогает комментарии этого файла.

general:
  locale: ru
  # Главный выключатель: false — клады не выпадают, витрина закрыта, ауры не
  # обновляются. Данные игроков сохраняются, при включении всё вернётся.
  enabled: true
  # Раз в сколько тиков пересобираются ауры находок (регенерация, дыхание,
  # огнестойкость). 20 тиков = 1 секунда; 20..200.
  aura-refresh-ticks: 60
  # Сколько строк в /treasures top и на экране топа (3..50).
  top-size: 10

# Шансы редкостей. chance-percent — вероятность клада этой редкости на один
# блок с множителем 1.0; item-chance — доля кладов, в которых лежит именная
# находка (остальное — ванильная добыча). 0 выключает редкость, не ломая
# прогрессию: её просто нельзя найти.
# 1.4.141: базовые шансы удвоены — находки выпадают вдвое чаще.
chances:
  common:
    chance-percent: 2.0
    item-chance: 0.45
  rare:
    chance-percent: 0.440
    item-chance: 0.55
  epic:
    chance-percent: 0.100
    item-chance: 0.70
  legendary:
    chance-percent: 0.016
    item-chance: 0.90
  mythical:
    chance-percent: 0.0016
    item-chance: 1.0

# Тир CHRDK_TierForge у найденной вещи (1.4.141). Шанс зависит от редкости
# самой находки: чем она реже, тем вероятнее тир. 100 — тир всегда, 0 —
# никогда. Если аддон тиров не установлен, находки выдаются как раньше.
tiers:
  enabled: true
  chance-percent:
    common: 20
    rare: 40
    epic: 60
    legendary: 80
    mythical: 100

# Клад-карты (1.4.153): к найденному кладу иногда прикладывается карта, которая
# ведёт в свой регион. Игрок копает в отмеченной зоне; каждый честный блок
# приближает тайник, а на закрывшем счётчик блоке открывается клад-тайник
# редкости карты. Обычный клад с этого блока уже не бросается — двойной
# награды за один удар нет.
#
# Карта не грузит незагруженные чанки: биом цели читается только у готового
# участка, иначе быстрый дроп карт заставлял бы сервер генерировать мир.
maps:
  # Главный выключатель карт. false — карты не выпадают и не выдаются,
  # /treasures map отвечает «выключено», уже выданные карты перестают копать.
  enabled: true
  # Шанс, что к найденному кладу приложится карта (0..100). Тайник из карты
  # новую карту не выдаёт: цепочки «карта из карты» нет.
  drop-chance-percent: 12
  # Сколько карт может быть активно у одного игрока (1..9). Сверх лимита
  # карты не выпадают, но уже выданные продолжают работать.
  max-active: 3
  # Сколько блоков нужно раскопать в зоне (3..64). Разброс обязателен:
  # одинаковая цифра превращает поиск в счётчик.
  digs-min: 8
  digs-max: 20
  # Радиус зоны вокруг точки тайника в блоках (8..64). Копать можно на любой
  # высоте: зона горизонтальная, пещера под точкой тоже считается.
  radius: 24
  # Срок жизни карты в минутах (0 — бессрочно; до 1440). Просроченная карта
  # сгорает при первом обращении и больше не считается.
  expire-minutes: 240
  # Множитель шанса именной находки в тайнике (0.5..3.0): 1.0 — как у
  # обычного клада этой редкости, 1.5 — в полтора раза выше.
  named-chance-multiplier: 1.5
  # Расстояние от игрока до тайника в блоках (32..4000).
  distance-min: 120
  distance-max: 480
  # Подсказка в экшен-баре: период в тиках (20 = 1 сек, 20..200) и дальность
  # (0 — показывать всегда; иначе подсказка молчит на дальних картах).
  hint-ticks: 40
  hint-distance: 256
  # Редкости тайников: веса, а не проценты — они нормализуются, поэтому можно
  # писать 45/34/15/5.5/0.5 или 9/6.8/3/1.1/0.1. Ноль убирает редкость из
  # выдачи, не ломая остальные.
  tier-chance-percent:
    common: 45
    rare: 34
    epic: 15
    legendary: 5.5
    mythical: 0.5

# Особые находки (1.4.166): в кладе иногда попадаются вещи из соседних аддонов —
# таинственная реликвия CHRDK_Artifacts и книга кастомной чары CHRDK_Enchants.
# Оба источника мягкие: аддона нет или он старой версии — находка просто не
# выпадает, клад выдаётся как обычно. Шансы заданы по редкости клада, поэтому
# обычный камень не приносит реликвию, а мифический клад без неё не бывает.
specials:
  # Главный выключатель. false — в кладе только ванильная добыча и именные
  # находки, как до 1.4.166.
  enabled: true
  artifacts:
    # Выдавать реликвии из CHRDK_Artifacts.
    enabled: true
    # Шанс реликвии на один клад этой редкости, проценты (0..100).
    chance-percent:
      common: 1.0
      rare: 3.0
      epic: 8.0
      legendary: 20.0
      mythical: 100.0
    # Доля проклятых реликвий среди найденных, проценты (0..100). Проклятая
    # реликвия полезна, но с расплатой — это часть «таинственности», а не
    # наказание: 100 — только проклятые, 0 — только светлые.
    cursed-chance-percent: 35
  enchantments:
    # Выдавать книги кастомных чар из CHRDK_Enchants.
    enabled: true
    # Шанс книги на один клад этой редкости, проценты (0..100).
    chance-percent:
      common: 5.0
      rare: 9.0
      epic: 16.0
      legendary: 30.0
      mythical: 60.0
    # Потолок уровня книги по редкости клада (1..5). Уровень бросается от I до
    # потолка и не может превысить максимум самой чары.
    max-level:
      common: 1
      rare: 1
      epic: 2
      legendary: 3
      mythical: 5
    # Доля книг с проклятием, проценты (0..100). Проклятия не выдаются, если
    # они выключены в самом аддоне чар: книга тогда будет светлой.
    curse-chance-percent: 10

# Осколки кладов (1.4.166): валюта находок и обменник за них.
#
# Осколки — не предмет, а счётчик в профиле кладоискателя: их нельзя потерять
# при смерти, утопить в лаве или забыть в бочке, которая истекла. Они копятся за
# каждый найденный клад (шанс и диапазон — по редкости) и тратятся в обменнике
# /treasures shards: именная находка нужной редкости, книга кастомных чар,
# реликвия или обычные ресурсы. Цена — в осколках, поэтому экономика кладов
# остаётся замкнутой: сколько нашёл, столько и обменял.
shards:
  # false — осколки не начисляются и кнопка обменника скрыта. Уже накопленный
  # баланс сохраняется: после включения осколки вернутся.
  enabled: true
  # Сколько осколков даёт клад каждой редкости: min..max включительно и шанс,
  # что осколки вообще выпадут (проценты 0..100). 0 в шансе — редкость не даёт
  # осколков. Обычный клад иногда приносит мелочь, мифический — всегда горсть.
  amount:
    common:
      min: 1
      max: 2
      chance-percent: 55.0
    rare:
      min: 2
      max: 4
      chance-percent: 75.0
    epic:
      min: 4
      max: 7
      chance-percent: 100.0
    legendary:
      min: 7
      max: 11
      chance-percent: 100.0
    mythical:
      min: 12
      max: 18
      chance-percent: 100.0
  # Обменник: до 21 предложения (сетка меню 7×3). Виды:
  #   named    — случайная именная находка редкости tier;
  #   artifact — светлая реликвия CHRDK_Artifacts;
  #   enchant  — светлая книга чары уровня level (1..5);
  #   item     — обычный материал material пачкой amount (имя — необязательное).
  # Цена cost — в осколках, больше нуля. Неизвестный вид, материал или нулевая
  # цена пропускаются с предупреждением в журнале, остальные предложения
  # продолжают работать.
  shop:
    - id: named-common
      type: named
      tier: common
      cost: 15
    - id: named-rare
      type: named
      tier: rare
      cost: 45
    - id: named-epic
      type: named
      tier: epic
      cost: 140
    - id: book-1
      type: enchant
      level: 1
      cost: 60
    - id: book-3
      type: enchant
      level: 3
      cost: 200
    - id: artifact
      type: artifact
      cost: 260
    - id: bottles
      type: item
      material: EXPERIENCE_BOTTLE
      amount: 8
      cost: 10

# Звание кладоискателя рядом с ником (1.4.166).
#
# Звание выдаётся за находки, а не покупается: «Легенда» в имени — заслуга.
# Ниже порога звание не показывается вовсе, иначе «Новичок» висел бы у всех
# подряд. Игрок может скрыть звание у себя: /treasures badge off (вернуть —
# auto, показать всегда — on). В чате звание добавляет NameTagProvider ядра,
# поэтому оно видно в общем чате, в личных сообщениях и в %player_tagged%.
rank-tag:
  # false — звания в имени нет ни в чате, ни в табе; выбор игроков сохраняется.
  enabled: true
  # Показывать ли звание тем, кто ещё не выбирал (auto). false — по умолчанию
  # скрыто, и игрок включает его сам: /treasures badge on.
  default: true
  # С какого звания показывать: novice, seeker, treasure_hunter, connoisseur,
  # master, legend. «seeker» — уже 5 находок: новичок звание не получает.
  min-rank: seeker
  # Таб-лист: аддон сам рисует имя «ник · звание», только если ядро не задаёт
  # tablist.player-name-format. Если ядро задаёт формат с %player_tagged% —
  # звание уже там, и аддон имена не трогает (дважды никто не пишет). Если
  # ником в табе управляет сторонний TAB-плагин, выключите tab.enabled и
  # поставьте в его конфиге %chrdktreasures_rank_name%. Уже занятое чужими
  # плагинами имя (титул кузни, метка стримера) аддон не перебивает: уступает.
  tab:
    enabled: true
    # Период обновления списка игроков, 20 тиков = 1 сек (20..1200).
    refresh-ticks: 60

# Клады-бочки (1.4.166): найденный клад появляется в мире настоящей бочкой, а
# не падает молча в инвентарь. На месте добытого блока встаёт бочка с добычей
# внутри, появление сопровождается частицами, звуком и хлопком крышки, а при
# открытии играет короткий «аккорд находки». Содержимое лежит в бочке, поэтому
# инвентарь не переполняется в самый неподходящий момент.
#
# Бочка — обычный контейнер: сломать её может только владелец (если включён
# owner-only), взрыв и воронки её не трогают, а после опустошения она тихо
# исчезает. Живёт бочка недолго — клад нужно забрать сразу; если не успели,
# она исчезает, а добыча высыпается на землю. Если бочку поставить некуда (нет
# воздуха над блоком, лимит бочек, бочки выключены), клад выдаётся в инвентарь
# как раньше — находка не пропадает.
# Анимация не заменяет заголовок и фейерверк из секции effects: она идёт поверх.
barrels:
  # Главный выключатель. false — клад выдаётся в инвентарь, как до 1.4.166.
  enabled: true
  # Открывать и ломать бочку может только нашедший (админ — всегда). false —
  # бочку может открыть любой, но добыча всё равно не «привязывается» к нему.
  owner-only: true
  # Срок жизни бочки в секундах (0 — бессрочно; до 3600). 15 секунд — клад
  # нужно забрать сразу; за 5 секунд до исчезновения игрок получает
  # предупреждение. Просроченная бочка исчезает с эффектом, а добыча высыпается
  # на землю: клад не сгорает.
  expire-seconds: 15
  # Сколько живых бочек может быть у одного игрока (1..20). Сверх лимита клад
  # выдаётся в инвентарь, а игрок получает подсказку забрать старую добычу.
  max-per-player: 3
  # Частицы, звуки и хлопок крышки при появлении и открытии. false — бочка
  # появляется молча (заголовки и фейерверк из effects остаются).
  animation: true
  # Через сколько тиков убирать опустевшую бочку (20 = 1 сек, 20..600). Пауза
  # нужна, чтобы случайно закрытый пустой инвентарь не «съел» бочку на глазах.
  remove-empty-ticks: 60
  # Что делать с добычей при истечении срока. true — высыпать её на землю у
  # места бочки (как из сломанного контейнера): не успел открыть — подбери;
  # false — бочка исчезает вместе с содержимым (жёсткий таймер, не
  # рекомендуется: клад пропадёт совсем).
  drop-on-expire: true
  # Бочка вмещает 27 стаков. Если добычи больше (серия, набор ранга, бонус
  # стрика), остаток по умолчанию уходит владельцу в инвентарь, а не лежит
  # сверху бочки: игрок всё равно забирает клад себе. false — остаток
  # высыпается у бочки на землю (полезно, если сервер запрещает выдачу
  # предметов в обход контейнера).
  overflow-to-owner: true

# Шанс клада на блок, проценты по редкостям — как в таблицах Mine Treasure.
# Каждая запись — секция из пяти редкостей; 1.0 значит «один клад этой
# редкости на 100 таких блоков при нулевой глубине». Проверка идёт от
# мифического к обычному, поэтому за блок выпадает не больше одного клада.
# Блока нет в списке — кладов он не даёт.
#
# Короткая запись числом (DIAMOND_ORE: 2.0) — старый формат: множитель к
# chances.<редкость>.chance-percent. Форматы можно смешивать.
#
# Секция полностью заменяет встроенный список. Уберите строку — блок
# перестанет давать клады.
blocks:
  # Камень и глубинные породы: база, на которой стоит вся таблица — 2 %
  # обычного клада на блок. Редкий вчетверо реже обычного, эпический —
  # в 31 раз реже, легендарный вдвое реже эпического, мифический — в 8 раз
  # реже эпического.
  STONE:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  COBBLESTONE:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  DEEPSLATE:
    common: 3.2
    rare: 0.8
    epic: 0.1024
    legendary: 0.0512
    mythical: 0.0128
  COBBLED_DEEPSLATE:
    common: 2.4
    rare: 0.6
    epic: 0.0768
    legendary: 0.0384
    mythical: 0.0096
  TUFF:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  SMOOTH_BASALT:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  BASALT:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  CALCITE:
    common: 1.5
    rare: 0.375
    epic: 0.048
    legendary: 0.024
    mythical: 0.006

  # Гранит и андезит беднее камня, диорит — наоборот: его гнёзда крупнее,
  # поэтому обычный клад выпадает чаще.
  GRANITE:
    common: 1.6
    rare: 0.4
    epic: 0.0512
    legendary: 0.0256
    mythical: 0.0064
  ANDESITE:
    common: 1.6
    rare: 0.4
    epic: 0.0512
    legendary: 0.0256
    mythical: 0.0064
  DIORITE:
    common: 3
    rare: 0.4
    epic: 0.096
    legendary: 0.048
    mythical: 0.012

  # Нижний мир и Энд: адский камень встречается сплошняком и потому беднее,
  # чернокамень и эндстоун ценятся выше камня.
  NETHERRACK:
    common: 1.5
    rare: 0.375
    epic: 0.048
    legendary: 0.024
    mythical: 0.006
  BLACKSTONE:
    common: 2
    rare: 0.5
    epic: 0.064
    legendary: 0.032
    mythical: 0.008
  END_STONE:
    common: 2.8
    rare: 0.7
    epic: 0.0896
    legendary: 0.0448
    mythical: 0.0112
  OBSIDIAN:
    common: 3
    rare: 0.75
    epic: 0.096
    legendary: 0.048
    mythical: 0.012
  CRYING_OBSIDIAN:
    common: 3
    rare: 0.75
    epic: 0.096
    legendary: 0.048
    mythical: 0.012

  # Руды: каждая даёт клад чаще камня, глубинные варианты — чуть чаще
  # обычных, потому что добывать их дольше.
  COAL_ORE:
    common: 2.8
    rare: 0.7
    epic: 0.0896
    legendary: 0.0448
    mythical: 0.0112
  DEEPSLATE_COAL_ORE:
    common: 3.2
    rare: 0.8
    epic: 0.1024
    legendary: 0.0512
    mythical: 0.0128
  IRON_ORE:
    common: 2.8
    rare: 0.7
    epic: 0.0896
    legendary: 0.0448
    mythical: 0.0112
  DEEPSLATE_IRON_ORE:
    common: 3.2
    rare: 0.8
    epic: 0.1024
    legendary: 0.0512
    mythical: 0.0128
  COPPER_ORE:
    common: 2.8
    rare: 0.7
    epic: 0.0896
    legendary: 0.0448
    mythical: 0.0112
  DEEPSLATE_COPPER_ORE:
