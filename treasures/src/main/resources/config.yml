    rare: 0.3
    epic: 0.0384
    legendary: 0.0192
    mythical: 0.0048
  TUFF:
    common: 1
    rare: 0.25
    epic: 0.032
    legendary: 0.016
    mythical: 0.004
  SMOOTH_BASALT:
    common: 1
