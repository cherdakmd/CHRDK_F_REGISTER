    legendary: 0.024
    mythical: 0.006

  # Гранит и андезит беднее камня, диорит — наоборот: его гнёзда крупнее,
  # поэтому обычный клад выпадает чаще.
  GRANITE:
    common: 1.6
    rare: 0.4
    epic: 0.0512
    legendary: 0.0256
    mythical: 0.0064
  ANDESITE:
