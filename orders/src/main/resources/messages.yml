# CHRDK_Orders — тексты доски заказов от ботов.
#
# Ключи без префикса: код обращается к ним как "list-row" и т.п.
# Разметка — MiniMessage, подстановки — %имя%.
orders:
  finance-wait: "<yellow>Сдача заказов ожидает сверки. Перезайдите позже; не повторяйте сдачу. Сохранённые деньги останутся к получению в /bal.</yellow>"
  finance-mode: "<red>Сдавать заказы можно после входа, в выживании или приключении, без NPC и с правом orders.</red>"
  finance-status: "<gray>Источник %source% · lineage %lineage% · исправен %healthy% · intent %pending% · конфликт %conflict% · получателей %count%</gray>"
  # ------------------------------- служебные --------------------------------
  no-permission: "<red>Недостаточно прав.</red>"
  player-only: "<red>Эта команда только для игроков.</red>"
  disabled: "<red>Доска заказов выключена в config.yml.</red>"
  unknown-subcommand: "<red>Неизвестная подкоманда «%sub%». Смотрите <yellow>/orders help</yellow>.</red>"

  # --------------------------------- справка --------------------------------
  help-header: "<gold>Доска заказов</gold> <dark_gray>·</dark_gray> <gray>боты просят принести предметы</gray>"
  help-list: "<yellow>/orders</yellow> <gray>или</gray> <yellow>/orders list</yellow> <gray>— заказы на доске</gray>"
  help-deliver: "<yellow>/orders deliver <номер></yellow> <gray>— сдать предметы из инвентаря</gray>"
  help-stats: "<yellow>/orders stats [ник]</yellow> <gray>— репутация, звание и сдачи</gray>"
  help-top: "<yellow>/orders top</yellow> <gray>— кто больше всех помог ботам</gray>"
  help-footer: "<gray>Сдаются только обычные предметы без имени и чар. Награда — через /bal. Offhand и броня не списываются.</gray>"

  # ------------------------------ доска в чате -------------------------------
  list-header: "<gold>Заказы</gold> <dark_gray>·</dark_gray> <gray>свободно:</gray> <white>%count%</white> <dark_gray>·</dark_gray> <gray>ваша репутация:</gray> <white>%reputation%</white> <gray>(%rank%)</gray>"
  list-row: "<gray>%num%.</gray> <white>%material%</white> <dark_gray>×%amount%</dark_gray> <dark_gray>·</dark_gray> <gray>для</gray> <white>%bot%</white> <dark_gray>·</dark_gray> <aqua>%reward%</aqua> <gray>алм.</gray> <dark_gray>·</dark_gray> <gray>осталось %time%</gray>"
  list-row-pass: "<gray>%num%.</gray> <white>%material%</white> <dark_gray>×%amount%</dark_gray> <dark_gray>·</dark_gray> <gray>для</gray> <white>%bot%</white> <dark_gray>·</dark_gray> <aqua>%reward%</aqua> <gray>алм. +</gray> <light_purple>%hours% ч. буста</light_purple> <dark_gray>·</dark_gray> <gray>осталось %time%</gray>"
  list-row-locked: "<gray>%num%.</gray> <dark_gray>%material% ×%amount% · для %bot% · нужна репутация %need%</dark_gray>"
  list-empty: "<gray>Пока пусто: боты ещё не придумали заказы. Заходите позже.</gray>"
  list-footer: "<gray>Сдать: <yellow>/orders deliver <номер></yellow> или клик в меню <yellow>/orders</yellow>.</gray>"

  # --------------------------------- сдача -----------------------------------
  delivered: "<green>Заказ выполнен:</green> <white>%material%</white> <dark_gray>×%amount%</dark_gray> <gray>для</gray> <white>%bot%</white> <dark_gray>·</dark_gray> <aqua>+%reward% алм. к получению через /bal</aqua>"
  delivered-line: "<gray>%bot%: «%line%»</gray>"
  delivered-pass: "<light_purple>Бот расщедрился: +%hours% ч. буста!</light_purple>"
  delivered-broadcast: "<gold>%player%</gold> <gray>выполнил заказ</gray> <white>%bot%</white> <gray>и получил</gray> <aqua>%reward% алм.</aqua>"
  not-enough: "<red>Нужно %need% × %material%, а в инвентаре %have%. Обычные, без имени и чар.</red>"
  locked: "<red>Бот не доверяет новичкам: нужна репутация %need%.</red>"
  order-expired: "<gray>Заказ уже неактуален: бот ушёл. На доске есть другие.</gray>"
  unknown-order: "<red>Заказа с номером «%id%» нет на доске.</red>"
  cooldown: "<red>Не так быстро: следующий заказ через %seconds% с.</red>"
  daily-limit: "<red>На сегодня хватит: лимит %limit% заказов в сутки.</red>"
  inventory-error: "<red>Не удалось сдать предметы: попробуйте ещё раз.</red>"

  # ---------------------------------- меню -----------------------------------
  menu-title: "<gold>Доска заказов</gold> <dark_gray>·</dark_gray> <gray>%count% свободно</gray>"
  menu-empty-name: "<gray>Заказов нет</gray>"
  menu-empty-lore: "<gray>Боты вернутся с новыми просьбами.</gray>"
  menu-order-bot: "<gray>Заказчик: <white>%bot%</white></gray>"
  menu-order-quote: "<dark_gray>«%line%»</dark_gray>"
  menu-order-need: "<gray>Принести: <white>%material% ×%amount%</white></gray>"
  menu-order-have: "<gray>В инвентаре: <white>%have%</white> из <white>%need%</white></gray>"
  menu-order-reward: "<gray>Награда: <aqua>%reward% алмазов через /bal</aqua></gray>"
  menu-order-pass: "<gray>Бонус: <light_purple>%hours% ч. буста</light_purple></gray>"
  menu-order-time: "<gray>Осталось: <white>%time%</white></gray>"
  menu-order-reputation: "<gray>Репутация за сдачу: <white>+%reputation%</white></gray>"
  menu-order-locked-reputation: "<red>Нужна репутация %need% (у вас %have%)</red>"
  menu-order-click: "<yellow>Нажми, чтобы сдать</yellow>"
  menu-order-click-locked: "<dark_gray>Пока недоступно</dark_gray>"
  menu-order-expired: "<dark_gray>Заказ истёк — обновите меню</dark_gray>"
  menu-info-name: "<gold>Ваш профиль</gold>"
  menu-info-lore: "<gray>Репутация: <white>%reputation%</white> <dark_gray>(%rank%)</dark_gray></gray>"
  menu-info-done: "<gray>Сдано заказов: <white>%completed%</white></gray>"
  menu-info-today: "<gray>Сегодня: <white>%today%</white> из <white>%limit%</white></gray>"
  menu-info-next: "<gray>До звания «%rank%»: <white>%left%</white> репутации</gray>"
  menu-info-max: "<green>Высшее звание у ботов достигнуто.</green>"
  menu-info-cooldown: "<gray>Пауза перед следующей сдачей: <white>%seconds% с</white></gray>"
  menu-close: "<red>Закрыть</red>"

  # -------------------------------- профиль ----------------------------------
  profile-title: "Заказы"
  profile-reputation: "<gray>Репутация: </gray><white>%reputation%</white> <dark_gray>·</dark_gray> %rank%"
  profile-completed: "<gray>Сдано заказов: </gray><white>%completed%</white>"
  profile-today: "<gray>Сегодня: </gray><white>%today%/%limit%</white>"

  # ------------------------------- статистика --------------------------------
  stats-header: "<gold>Заказы</gold> <dark_gray>·</dark_gray> <white>%player%</white>"
  stats-completed: "<gray>Сдано заказов: <white>%completed%</white></gray>"
  stats-reputation: "<gray>Репутация у ботов: <white>%reputation%</white></gray>"
  stats-rank: "<gray>Звание: %rank%</gray>"
  stats-rank-next: "<gray>До следующего звания: <white>%left%</white> репутации</gray>"
  stats-rank-max: "<green>Высшее звание достигнуто.</green>"
  stats-today: "<gray>Сегодня сдано: <white>%today%</white> из <white>%limit%</white></gray>"
  stats-footer: "<gray>Доска: <yellow>/orders</yellow> · рейтинг: <yellow>/orders top</yellow></gray>"

  # --------------------------------- рейтинг ---------------------------------
  top-header: "<gold>Помощники ботов</gold> <dark_gray>·</dark_gray> <gray>топ по сданным заказам</gray>"
  top-row: "<gray>%num%.</gray> <white>%player%</white> <dark_gray>·</dark_gray> <gray>%completed% заказов · репутация</gray> <white>%reputation%</white> <dark_gray>(%rank%)</dark_gray>"
  top-empty: "<gray>Пока никто не сдал ни одного заказа. Будьте первым.</gray>"

  # --------------------------------- звания ----------------------------------
  rank.novice: "<gray>Новичок</gray>"
  rank.trusted: "<white>Знакомый</white>"
  rank.regular: "<green>Надёжный</green>"
  rank.partner: "<aqua>Партнёр</aqua>"
  rank.master: "<gold>Мастер</gold>"

  # -------------------------------- админские --------------------------------
  admin-reloaded: "<green>Конфиг заказов перечитан.</green>"
  admin-spawned: "<green>Новый заказ: %material% ×%amount% для %bot%.</green>"
  admin-spawn-failed: "<red>Не удалось создать заказ: проверьте категории и материалы в config.yml.</red>"
  admin-cleared: "<green>Доска очищена: снято %count% заказов.</green>"
  admin-rep-given: "<green>%player%: репутация %reputation%.</green>"
  admin-player-not-found: "<red>Игрок не найден в сети.</red>"
  admin-unknown-category: "<red>Неизвестная категория «%id%».</red>"
  admin-bad-amount: "<red>Нужно целое число от 0 до 100000.</red>"
  admin-usage: "<yellow>/ordersadmin <reload|new [категория]|clear|give <ник> <репутация>|info|awards></yellow>"
  admin-info: "<gold>Заказы:</gold> <gray>на доске <white>%orders%</white> из <white>%size%</white>, категорий <white>%categories%</white>, ботов <white>%bots%</white>, игроков в базе <white>%players%</white>, сдач всего <white>%completed%</white>.</gray>"
