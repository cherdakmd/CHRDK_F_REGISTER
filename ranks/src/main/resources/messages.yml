ranks:
  "header": "<gold><bold>Звания за наигранное время</bold></gold>"
  "line": "%rank% <dark_gray>—</dark_gray> от <yellow>%hours%</yellow> ч."
  "your-rank": "<gray>Ваше звание: </gray>%rank% <dark_gray>|</dark_gray> наиграно: <aqua>%playtime%</aqua>"
  "next": "<gray>До звания %rank% осталось: <yellow>%left%</yellow>.</gray>"
  "top-rank": "<green>Вы достигли высшего звания — легенда сервера!</green>"
  "no-rank": "<gray>Звание пока не заработано — стаж копится каждую минуту в игре.</gray>"
  "player-line": "<gray>%player%: </gray>%rank%<gray>, наиграно </gray><aqua>%playtime%</aqua>"
  "earned-broadcast": "<gold>☆ %player% получает звание </gold>%rank%<gold> за наигранное время!</gold>"
  "earned-self": "<green>★ Новое звание: %rank%! Стаж — это сила.</green>"
  "not-found": "<red>Игрок %player% не найден в статистике стажа.</red>"
  "usage": "<yellow>Использование: /ranks [ник]</yellow>"
  "reloaded": "<green>Конфиг званий перечитан, лестниц: %count%.</green>"
  "set-ok": "<green>Стаж игрока %player% установлен: %playtime%.</green>"
  "hours-number": "<red>Часы должны быть неотрицательным числом.</red>"
  "usage-admin": "<yellow>Использование: /ranksadmin <reload | set <ник> <часы> | info></yellow>"
  "info": "<gray>В лестнице %count% званий, сортировка TAB: %sort%, тик: %tick% сек.</gray>"
  "state-on": "<green>включена</green>"
  "state-off": "<red>выключена</red>"
