ranks:
  # Сортировать TAB-список по стажу: чем дольше играет — тем выше в списке.
  # Реализовано командами scoreboard !rk-… (пин-закреп ядра !chrdk-pin остаётся выше).
  sort-tab: true
  # Как часто (в секундах) засчитывать наигранное время и обновлять команды.
  tick-seconds: 60
  # Широковещательное сообщение о получении нового звания.
  announce: true
  # Лестница званий СТРОГО сверху вниз (по убыванию порога часов).
  # hours — порог наигранных ЧАСОВ, id — машинный ид, name — имя (MiniMessage/&-коды),
  # commands — консольные команды-награды при вручении (%player% — ник).
  ladder:
    - hours: 500
      id: veteran
      name: "<gold>Ветеран</gold>"
      commands:
        - "say %player% стал Ветераном сервера!"
    - hours: 200
      id: oldtimer
      name: "<yellow>Старожил</yellow>"
      commands: []
    - hours: 50
      id: regular
      name: "<gray>Завсегдатай</gray>"
      commands: []
