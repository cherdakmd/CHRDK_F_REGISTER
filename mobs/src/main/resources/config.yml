# CHRDK_Mobs — тиры мобов. Масштабирование по расстоянию от спавна мира:
# чем дальше от спавна, тем сильнее естественные враги и щедрее награда
# за их убийство. Тир присваивается только враждебным мобам с естественным
# спавном (NATURAL/PATROL) при появлении: спавнеры, приручённые, призванные
# и событийные мобы остаются ванильными, не тируются и не награждаются.
# Боссы (Эндер-дракон, Визер) не масштабируются — их файты не трогаем.
# У каждого тира свои свойства: сила, число способностей особых мобов,
# награда деньгами и количество лута. С мобов падает необычный лут —
# эссенции навыков для прокачки персонажа и тематические сущности
# редких вариантов (проклятые, тлеющие, всратые, кринжовые).
general:
  locale: ru
  # Главный выключатель: false — мобы остаются ванильными, наград нет.
  enabled: true

# Мобы всегда опасны: суммарное снижение входящего урона плагинами (классы,
# навыки, Кузня, щиты) ограничено потолком, а с тира 6 он падает на per-tier-step
# за тир (до floor) — высшие тиры пробивают больше защиты. Броня и зачарования
# игрока работают как обычно, сверх потолка.
mitigation:
  cap: 0.5
  per-tier-step: 0.04
  floor: 0.3

tiers:
  # Границы тиров по горизонтальному расстоянию от спавна мира (блоки):
  # 9 границ = 10 тиров. Тир 1 — до первой границы (обычные мобы: без
  # надбавок и без подписи, но лут у них есть); тир 2 — между первой и
  # второй границами и так далее. Список должен расти; больше 20 границ
  # не нужно.
  distances: [500, 1200, 2200, 3500, 5200, 7200, 9600, 12500, 16000]
  # Подпись тира перед именем моба (для тиров 2+ и особых мобов),
  # например «Т3 · Зомби».
  name-prefix: true
  # Свойства каждого тира (1..10): множители здоровья и урона (базовые, без
  # прогресса и элиты), число способностей особых мобов (элит и вариантов),
  # награда в /bal за убийство (деньги, без предметов) и число предметов
  # лута (min..max). Тиры выше последней строки наследуют её свойства.
  #   loot-chance — шанс (0..1), что лут вообще выпадет; особым мобам
  #   (вариантам) тематический лут падает всегда, независимо от шанса.
  table:
    1:  {health: 1.0,  damage: 1.0,  abilities: [1, 2], reward: 0, loot: [1, 1], loot-chance: 0.15}
    2:  {health: 1.4,  damage: 1.15, abilities: [2, 2], reward: 1, loot: [1, 1], loot-chance: 0.15}
    3:  {health: 1.9,  damage: 1.3,  abilities: [2, 2], reward: 1, loot: [1, 1], loot-chance: 0.13}
    4:  {health: 2.5,  damage: 1.5,  abilities: [2, 3], reward: 2, loot: [1, 2], loot-chance: 0.13}
    5:  {health: 3.2,  damage: 1.75, abilities: [2, 3], reward: 2, loot: [1, 2], loot-chance: 0.11}
    6:  {health: 4.1,  damage: 2.0,  abilities: [3, 3], reward: 3, loot: [2, 2], loot-chance: 0.11}
    7:  {health: 5.2,  damage: 2.3,  abilities: [3, 3], reward: 3, loot: [2, 2], loot-chance: 0.09}
    8:  {health: 6.5,  damage: 2.7,  abilities: [3, 4], reward: 4, loot: [2, 3], loot-chance: 0.09}
    9:  {health: 8.0,  damage: 3.2,  abilities: [3, 4], reward: 4, loot: [3, 3], loot-chance: 0.08}
    10: {health: 10.0, damage: 3.8,  abilities: [4, 5], reward: 5, loot: [3, 3], loot-chance: 0.08}

progression:
  # Привязка к прокачке игрока: мощность моба закрепляется при появлении по
  # очкам прогресса ближайшего игрока в радиусе radius блоков (снапшот —
  # моб не подстраивается под каждого нового противника). Очки прогресса =
  # суммарный уровень навыков + престиж × prestige-weight (без навыков — 0,
  # моб остаётся без надбавки). Награда деньгами и лут прогрессией НЕ
  # масштабируются.
  enabled: true
  radius: 128
  # Надбавка за каждые 100 очков прогресса: здоровье ×(1 + health-per-100×очки/100),
  # урон ×(1 + damage-per-100×очки/100), общий потолок надбавки — max-bonus.
  health-per-100: 0.10
  damage-per-100: 0.05
  # Сколько уровней навыков «стоит» ступень престижа в очках прогресса.
  prestige-weight: 5
  max-bonus: 1.5

elite:
  # Изредка естественные мобы появляются элитными: усилены, с индивидуальным
  # именем и случайным набором способностей (число способностей задаёт тир).
  # Шанс — доля от 0 до 1; вариант и элита не встречаются на одном мобе.
  chance: 0.03
  # Множители элиты поверх тира и прогресса (минимум 1.0).
  health-multiplier: 2.0
  damage-multiplier: 1.5
  # Награда за убийство элиты — как за тир выше на reward-tiers ступеней
  # (элита тира 1 платит тоже).
  reward-tiers: 2
  # Сколько лишних предметов лута падает с элиты сверх количества тира.
  loot-bonus: 1
  # Имена-эпитеты для «★ <эпитет> · Имя».
  epithets: [Злобный, Грозный, Кровавый, Бешеный, Стальной,
             Костоломный, Безжалостный, Тёмный, Хищный, Голодный, Зловещий]

variants:
  # Редкие особые мобы любого тира со своей темой: проклятые, тлеющие,
  # всратые и кринжовые. Своя тема способностей, своё имя и тематический
  # лут (сущности с полезными эффектами) — он падает всегда, вопреки
  # loot-chance тира. Шанс — доля от 0 до 1 на моба,
  # тип выбирается случайно; мощность считается поверх тира и прогресса.
  chance: 0.012
  health-multiplier: 2.5
  damage-multiplier: 1.75

effects:
  # Частицы у особых мобов (по мотивам Infernal-Mobs): элиты и варианты
  # подсвечиваются частицами своей темы — элиты и проклятые потусторонним
  # вихрём, тлеющие огнём, всратые ведьмовской мглой, кринжовые золотым
  # сиянием. false — отключить подсветку совсем.
  particles: true

loot:
  # Опыт навыка (addXp) за использование лута: эссенции навыков и
  # тематические сущности вариантов. Сущности сверх опыта накладывают
  # полезный эффект (сопротивление, огнестойкость, регенерация, скорость).
  essence-xp: 40
  variant-xp: 60
