# CHRDK_Mobs — тексты тиров мобов.
messages:
  mob-name-prefix: "<gold>Т%tier%</gold> <dark_gray>·</dark_gray> <white>%name%</white>"
  mob-reward: "<gray>Тир %tier% · <white>%mob%</white>: <green>+%amount% ⛁</green> в /bal</gray>"
  mobtiers-header: "<gold>Тиры мобов</gold> <gray>— дальше от спавна мира враги сильнее и щедрее</gray>"
  mobtiers-line: "<gray>Тир %tier%: %range% · здоровье ×%health% · урон ×%damage% · награда %reward% ⛁</gray>"
  mobtiers-off: "<yellow>Тиры мобов выключены в конфиге.</yellow>"
  elite-name: "<gold>Т%tier%</gold> <dark_gray>·</dark_gray> <gold>★</gold> <red>%title%</red> <dark_gray>·</dark_gray> <white>%name%</white>"
  elite-reward: "<gray>★ Элита Т%tier% · <white>%mob%</white>: <green>+%amount% ⛁</green> в /bal</gray>"
  mobtiers-progression: "<gray>Прокачка: +%health%% здоровья и +%damage%% урона за 100 очков (уровни навыков + престиж ×%prestige%, до +%cap%%), игрок в %radius% блоках</gray>"
  mobtiers-elite: "<gray>Элита: шанс %chance%%, здоровья ×%health%, урона ×%damage%, %abilities% способностей, награда +%reward% тиров</gray>"
