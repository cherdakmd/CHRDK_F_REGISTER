# CHRDK_Mobs — версии схемы эталонных YAML.
# v2: пересчёт силы мобов под новые потолки прокачки (навыки и ветки — 150
#     уровней): прогрессия усилена (health-per-100 0.15, damage-per-100 0.10,
#     потолок надбавки max-bonus 2.5) и базовые множители здоровья/урона
#     тиров 5..10 подняты примерно на 20%. Баланс переписывается эталоном
#     (remove + дописывание): файлы владельцев получают новые значения
#     автоматически (backup, повторный старт идемпотентен).
# Игроки после пересчёта уровней заметно сильнее: мобы обязаны расти вместе
# с прогрессом, иначе дальние тиры теряют опасность.
config-version: 2
messages-version: 1
migrations:
  config:
    2:
      remove: [progression.health-per-100, progression.damage-per-100,
               progression.max-bonus, tiers.table]
