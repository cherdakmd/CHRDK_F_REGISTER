  transfer-usage: "<gray>/claim transfer <ник> — передать этот чанк игроку.</gray>"
  transfer-self: "<red>Нельзя передать чанк самому себе.</red>"
  transfer-unknown: "<red>Игрок %name% ещё не заходил на сервер.</red>"
  transfer-done: "<green>Чанк передан игроку %name%.</green>"
  transfer-received: "<aqua>Вам передан чанк [%x%, %z%] от %from%.</aqua>"
  transfer-given: "<yellow>Ваш чанк [%x%, %z%] передан игроку %name%.</yellow>"
  transfer-limit: "<red>У игрока %name% уже %limit% приватов — лимит исчерпан.</red>"
