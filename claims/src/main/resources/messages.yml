# CHRDK_Claims — тексты приватов.
claims:
  player-only: "<red>Команда доступна только игрокам.</red>"
  need-auth: "<red>Сначала войдите на сервер (/login).</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  unknown-sub: "<red>Неизвестная подкоманда. Смотрите /claim help.</red>"
  usage: "<gray>/claim — купить чанк · info · map · list · unclaim · add/remove <ник> [все] · deposit [n|все] · withdraw <n> · balance · sell <цена|снять> · sellback · buy · help</gray>"
  # покупка/продажа
  bought: "<green>Чанк приватизирован за %price% ⛁! Рента %upkeep% ⛁/сутки, оплачен до %paid%. Участники: /claim add <ник>.</green>"
  already-claimed: "<red>Этот чанк уже занят (%owner%). Границы — /claim map.</red>"
  already-yours: "<yellow>Этот чанк уже ваш.</yellow>"
  limit-reached: "<red>Лимит приватов исчерпан: %limit% чанков максимум%pass-hint%.</red>"
  pass-hint: " (с проходкой — больше)"
  not-enough: "<red>Не хватает алмазов: нужно %need% ⛁, есть %have% ⛁ (казна + инвентарь).</red>"
  spawn-margin: "<red>Ближе %margin% блоков к спавну приватить нельзя.</red>"
  change-to-treasury: "<gray>Сдача с алмазных блоков (%change% ⛁) зачислена в казну.</gray>"
  # информация
  info-header: "<gold>═══ Чанк [%x%, %z%] (%world%) ═══</gold>"
  info-free: "<gray>Свободен. Покупка: /claim — %price% ⛁, рента %upkeep% ⛁/сутки.</gray>"
  info-owner: "<gray>Владелец: <yellow>%owner%</yellow> · участников: %members-count%/%members-max%</gray>"
  info-paid: "<gray>Оплачен до: <aqua>%paid%</aqua>%debt%</gray>"
  # бес-теговые сегменты: вставляются через %placeholder% (теги экранировались бы)
  info-debt: " (долг %debt-days% сут.)"
  info-sale: "<gray>Продаётся за <yellow>%price% ⛁</yellow> — /claim buy.</gray>"
  info-members: "<gray>Участники: %members%</gray>"
  info-members-none: "<gray>Участников нет.</gray>"
  # отказ от привата
  unclaimed: "<yellow>Приват с чанка снят. Стройка больше не защищена.</yellow>"
  unclaim-not-yours: "<red>Вы не владелец этого чанка.</red>"
  unclaim-none: "<red>Здесь нет привата.</red>"
  # продажа игрокам
  sell-set: "<green>Чанк выставлен на продажу за %price% ⛁. Снять: /claim sell снять.</green>"
  sell-cleared: "<yellow>Чанк снят с продажи.</yellow>"
  sell-invalid: "<red>Цена — целое число от 1 до %max% (или «снять»).</red>"
  sell-not-yours: "<red>Вы не владелец этого чанка.</red>"
  buy-done: "<green>Вы купили приват у %seller% за %price% ⛁ (налог %tax% ⛁ удержан с продавца).</green>"
  buy-sold: "<aqua>Ваш чанк [%x%, %z%] куплен за %price% ⛁ покупателем %buyer%; зачислено %net% ⛁ (налог %tax% ⛁).</aqua>"
  # бес-теговый вариант для отложенной вести (минисообщения в заметках экранируются)
  buy-sold-notice: "ваш чанк [%x%, %z%] куплен за %price% ⛁ покупателем %buyer%; зачислено %net% ⛁ (налог %tax% ⛁)"
  buy-not-for-sale: "<red>Этот чанк не продаётся.</red>"
  # возврат серверу
  sellback-done: "<green>Сервер выкупил чанк за %reward% ⛁ (выдано предметами).</green>"
  # участники
  add-done: "<green>%name% теперь участник этого привата.</green>"
  add-all-done: "<green>%name% добавлен в %count% ваших приватов.</green>"
  add-already: "<yellow>%name% уже участник.</yellow>"
  add-full: "<red>В привате максимум %max% участников.</red>"
  add-self: "<yellow>Вы и так владелец.</yellow>"
  remove-done: "<yellow>%name% убран из участников этого привата.</yellow>"
  remove-all-done: "<yellow>%name% убран из %count% ваших приватов.</yellow>"
  remove-not-member: "<red>%name% не участник этого привата.</red>"
  remove-not-owner: "<red>Это не ваш приват.</red>"
  # казна
  deposit-done: "<green>В казну внесено %amount% ⛁. Баланс: %balance% ⛁.</green>"
  deposit-none: "<red>Нет алмазных предметов (алмазы, их руды или блоки).</red>"
  deposit-invalid: "<red>Количество — целое число от 1 до %max% или «все».</red>"
  withdraw-done: "<green>Из казны выдано %amount% ⛁ предметами. Баланс: %balance% ⛁.</green>"
  withdraw-not-enough: "<red>В казне всего %balance% ⛁.</red>"
  withdraw-invalid: "<red>Количество — целое число от 1 до %max%.</red>"
  balance-line: "<gold>Казна: <aqua>%treasury% ⛁</aqua></gold> <gray>· приватов %claims%/%limit% · рента %upkeep% ⛁/сут за чанк%debt%</gray>"
  balance-debt: " · есть долги!"
  # список и карта
  list-header: "<gold>═══ Ваши приваты (%count%/%limit%) ═══</gold>"
  list-line: "<gray>• %world% [%x%, %z%] — до %paid%%sale%</gray>"
  list-sale: " · продаётся за %price% ⛁"
  list-none: "<gray>Приватов нет. Зачем ждать — /claim!</gray>"
  list-other: "<gray>Приваты игрока %name% (%count%):</gray>"
  map-header: "<gold>═══ Карта приватов (чанк = знак) ═══</gold>"
  map-legend: "<gray>@ ваш · # чужой · $ продаётся · . свободен · X вы здесь</gray>"
  # защита
  denied-break: "<red>Чужой приват (%owner%): ломать нельзя.</red>"
  denied-place: "<red>Чужой приват (%owner%): ставить нельзя.</red>"
  denied-interact: "<red>Чужой приват (%owner%): использовать нельзя.</red>"
  denied-container: "<red>Чужой приват (%owner%): контейнер закрыт.</red>"
  denied-entity: "<red>Чужой приват (%owner%): существ/стойки трогать нельзя.</red>"
  denied-sign: "<red>Чужой приват (%owner%): табличку править нельзя.</red>"
  # вести и рента
  notices-join: "<yellow>По вашим приватам %count% вестей:</yellow>"
  notice-line: "<gray>• %text%</gray>"
  notice-debt: "чанк %where% не оплачен (долг %days% сут. из %grace%)"
  notice-lost: "чанк %where% освобождён за долги — приват снят"
  rent-paid-line: "<gray>Рента списана: %amount% ⛁ за приваты (казна: %balance% ⛁).</gray>"
  # админка
  admin-reloaded: "<green>Конфигурация приватов перечитана.</green>"
  admin-bypass-on: "<yellow>Обход приватов включён.</yellow>"
  admin-bypass-off: "<yellow>Обход приватов выключен.</yellow>"
  admin-deleted: "<green>Приват в этом чанке удалён (владелец был %owner%).</green>"
  admin-no-claim: "<red>В этом чанке привата нет.</red>"
  admin-deleteall-done: "<green>Удалено приватов игрока %name%: %count%.</green>"
  admin-player-not-found: "<red>Приватов у игрока %name% нет.</red>"
  admin-usage: "<yellow>/claimadmin reload | bypass | delete | deleteall <ник> | info <ник></yellow>"
