# 1.4.222: отдельной казны нет. Покупки/первые сутки аренды: /bal, затем обычные
# предметы из storage. Выручка/возврат/сдача — на /bal. Автооплата только /bal,
# включая офлайн. Старый treasury остаётся замороженным входом миграции с квитанцией
# в bank.json; не удалять/не переносить вручную. Снимок bank + claims нужен вместе.
# CHRDK_Claims — приваты чанков за алмазные предметы.
# Валюта — физические алмазы (DIAMOND/руды = 1, DIAMOND_BLOCK = 9), как в магазине
# и общих целях. Покупка списывает личный /bal, при нехватке добирает обычные предметы.
# Рента списывается с личного /bal каждые сутки по каждому чанку; после льготы чанк
# освобождается за долги (стройка остаётся в мире, защита снимается).
#
# Долг учитывается отдельно: пополнение /bal сначала гасит старые сутки, и только
# потом оплачивает новые — «переждать» долг бесплатно не получится.
# /claimadmin rent прогоняет ренту вручную, /claimadmin stats показывает экономику.

general:
  locale: ru
  # Покупать/пользоваться приватами могут только авторизованные игроки.
  require-auth: true
  # Часовой пояс дат в /claim info|list и /claimadmin (пусто — пояс сервера).
  timezone: "Europe/Moscow"
  # Радиус карты /claim map в чанках (2..8; 5 = 11×11).
  map-radius: 5
  # Длительность /claim borders и автопоказа всей связной территории (3..60 секунд).
  border-seconds: 10
  # При входе в свой приват подсветить весь смерженный участок, не каждый чанк отдельно.
  # Не зависит от enter-notice, notice-own и личного /claim notices.
  border-on-own-entry: true
  # Сообщать игрокам о списании ренты, долге и освобождении чанка.
  notify-rent: true
  # Уведомления о границах приватов (вход и выход).
  # Канал: actionbar — строка над хотбаром; chat — сообщение в чат; both — и туда, и туда.
  # По умолчанию both: строку действия перебивают другие модули (навыки, достижения,
  # артефакты), а сообщение о переходе границы теряться не должно.
  notice-mode: "both"
  # Сообщать при входе на приват (владелец, ваша роль, цена продажи).
  enter-notice: true
  # Сообщать при выходе из привата.
  leave-notice: true
  # Показывать уведомления и на собственных приватах (дата оплаты).
  notice-own: true
  # Показывать уведомления участникам приватов (с их ролью).
  notice-members: true
  # Уведомление приходит не только шагом, но и после телепорта, возрождения и
  # входа на сервер: игрок всегда знает, на чьей земле он оказался.
  # Не повторять уведомление об одном и том же чанке чаще, чем раз в N секунд
  # (0..60; 0 — без ограничения). Защищает от спама при беге вдоль границы.
  notice-cooldown-seconds: 2
  # Журнал операций claims-audit.log: покупки, казна, продажи, передача, админ-операции.
  # Файл ротируется при 2 МиБ (claims-audit.log.1), читается командой /claimadmin audit.
  audit-log: true

menu:
  # Графическое меню приватов: /claim menu или /claim tp без координат.
  # Карточки своих чанков с постраничной навигацией; клик — телепорт.
  enabled: true
  # Вкладка «на продажу»: чужие лоты можно осмотреть, не выкупая.
  show-for-sale: true

teleport:
  # Личный /bal первым, затем обычные алмазы/руда/блоки. Минимум 10; ранг не обнуляет цену.
  # Оплата только после разбега и безопасной точки. Отмена native TP — возврат в /bal.
  cost-diamonds: 20
  # Телепорт к приватам (/claim tp [x z] и клик по карточке в меню).
  enabled: true
  # Разбег: сколько секунд стоять на месте (0 — телепорт сразу, максимум 30).
  # Движение и урон отменяют телепорт — см. флаги ниже.
  warmup-seconds: 5
  # Кулдаун между телепортами к приватам, секунд (0 — без кулдауна, максимум 600).
  cooldown-seconds: 10
  # Радиус поиска безопасной площадки вокруг центра чанка (0..7 блоков).
  # Больше семи нельзя: центр смещён на 8 блоков от края, поиск не выйдет за приват.
  search-radius: 3
  # Отменять телепорт, если игрок сдвинулся или получил урон.
  cancel-on-move: true
  cancel-on-damage: true

pricing:
  # Цена покупки одного чанка (алмазов).
  chunk-price: 160
  # Рента за чанк в сутки (алмазов, сгорает — выводится из экономики).
  upkeep-per-day: 10
  # Сколько суток долга терпит система, прежде чем освободить чанк.
  grace-days: 3
  # Выкуп чанка сервером: доля цены покупки (%), выдаётся предметами.
  sellback-percent: 50
  # База выкупа ограничена старой ценой: возврат по умолчанию 8, не 80.
  # Ограничение применяется ДО множителя мира и процента; не индексировать с покупкой.
  sellback-base-cap: 16
  # Минимальная ставка новой аренды чанка за сутки. Оплаченный срок не меняется.
  # Старая аренда дешевле минимума завершится по окончании оплаченных суток, без переоценки.
  rental-min-per-day: 20

taxes:
  # Налог на сделку между игроками (%) — удерживается с продавца и сгорает.
  sale-tax-percent: 15

limits:
  # Лимит чанков по ступени донатного ранга (1.4.167):
  # [без ранга, I, II, III, IV, V]. Пустой список — старые правила ниже.
  rank-chunks: [24, 28, 34, 40, 44, 48]
  # Сколько чанков может держать игрок без ранга (совместимость).
  base-chunks: 24
  # Бонус к лимиту для обладателей ранга (совместимость).
  pass-bonus-chunks: 8
  # Максимум участников в одном привате.
  members-per-chunk: 8
  # Старый ключ совместимости: /claim withdraw теперь только подсказка.
  # Реальные ограничения снятия настраиваются в обычном банке Core.
  withdraw-max: 2304

worlds:
  # Радиус (в блоках) вокруг точки спавна мира, где приват запрещён (0 — выкл).
  spawn-margin: 64
  # Белый список миров: пусто — все миры. Можно указать "*".
  enabled: []
  # Чёрный список миров: главнее enabled (например, [world_nether, world_the_end]).
  disabled: []
  # Множители экономики по мирам (0.1..10): цена покупки чанка.
  # Пример: ресурсный мир дешевле — price-multiplier: {world_nether: 0.5}
  price-multiplier: {}
  # Множители ренты за сутки по мирам (0.1..10).
  # Пример: энд дороже — upkeep-multiplier: {world_the_end: 2.0}
  upkeep-multiplier: {}

protect:
  # Отменять PvP-урон на чужой территории (по умолчанию выкл — PvP разрешено).
  pvp: false
  # Огонь не распространяется и не жжёт блоки в приватах.
  fire: true
  # Взрывы (криперы, TNT, визер...) не ломают блоки в приватах.
  explosions: true
  # Жидкости не затекают извне на приват.
  fluids: true
  # Поршни не двигают блоки через границу чужого привата.
  pistons: true
  # Воронки не вытягивают предметы из чужих контейнеров и не засыпают чужие.
  hoppers: true
  # Двери/калитки/люки — только участникам.
  doors: true
  # Кнопки/рычаги/плиты/редстоун-блоки — только участникам (по умолчанию выкл).
  redstone: false
  # Верстаки и «портящиеся» блоки (наковальня, маяк, якорь, торт, свечи,
  # кафедра, компостер, TNT и т.п.) — только участникам.
  workstations: true
  # Мобы не гриферят (эндермены, разорители, визер и т.п.).
  mob-griefing: true
  # Животных, рамки, стойки и транспорт не тронуть чужакам (и лодки не поставить).
  entities: true

# 1.4.215: соседние по стороне свои чанки — одна территория, лимит/рента всё ещё по чанкам.
# Чужие владельцы: минимум один свободный чанк, в том числе по диагонали; старые не удаляются.
# /claim rent: отдельный чанк, алмазы/сутки с личного /bal арендатора, без досрочного отзыва оплаты.
# Оплаченные сутки защищены; серверная рента до их конца вносится заранее владельцем/из выручки.
# При нехватке средств аренда не начинается/не продлевается. Простой сервера не тарифицируется.
