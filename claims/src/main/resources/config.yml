# CHRDK_Claims — приваты чанков за алмазные предметы.
# Валюта — физические алмазы (DIAMOND/руды = 1, DIAMOND_BLOCK = 9), как в магазине
# и общих целях. Покупка списывает казну, при нехватке добирает предметы из инвентаря.
# Рента списывается из казны каждые сутки по каждому чанку; после льготы чанк
# освобождается за долги (стройка остаётся в мире, защита снимается).

general:
  locale: ru
  # Покупать/пользоваться приватами могут только авторизованные игроки.
  require-auth: true

pricing:
  # Цена покупки одного чанка (алмазов).
  chunk-price: 16
  # Рента за чанк в сутки (алмазов, сгорает — выводится из экономики).
  upkeep-per-day: 1
  # Сколько суток долга терпит система, прежде чем освободить чанк.
  grace-days: 3
  # Выкуп чанка сервером: доля цены покупки (%), выдаётся предметами.
  sellback-percent: 50

taxes:
  # Налог на сделку между игроками (%) — удерживается с продавца и сгорает.
  sale-tax-percent: 10

limits:
  # Сколько чанков может держать игрок без активной проходки.
  base-chunks: 24
  # Бонус к лимиту для обладателей активной проходки.
  pass-bonus-chunks: 8
  # Максимум участников в одном привате.
  members-per-chunk: 8
  # Максимум алмазов за одну команду /claim withdraw.
  withdraw-max: 2304

worlds:
  # Радиус (в блоках) вокруг точки спавна мира, где приват запрещён (0 — выкл).
  spawn-margin: 64

protect:
  # Отменять PvP-урон на чужой территории (по умолчанию выкл — PvP разрешено).
  pvp: false
  # Огонь не распространяется и не жжёт блоки в приватах.
  fire: true
  # Взрывы (криперы, TNT, визер...) не ломают блоки в приватах.
  explosions: true
  # Жидкости не затекают извне на приват.
  fluids: true
  # Поршни не двигают блоки через границу чужого привата.
  pistons: true
  # Воронки не вытягивают предметы из контейнеров в привате.
  hoppers: true
  # Двери/калитки/люки — только участникам.
  doors: true
  # Кнопки/рычаги/плиты/редстоун-блоки — только участникам (по умолчанию выкл).
  redstone: false
  # Мобы не гриферят (эндермены, разорители, визер и т.п.).
  mob-griefing: true
  # Животных, рамки, стойки и транспорт не тронуть чужакам.
  entities: true
