name: CHRDK_Claims
version: ${version}
main: ru.cherdakmd.chrdkclaims.ClaimsPlugin
api-version: '26.3'
description: "Приваты чанков с оплатой только с личного /bal: аренда, сделки, роли и защита территории (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  claim:
    description: "Территории: покупка, аренда чанков, меню и личный /bal"
    aliases: [parcel, land]
    usage: "/claim [menu [стр]|tp [x z]|info [x z]|map [радиус]|list [стр]|forsale [стр]|near [радиус]|borders|notices [on|off]|greeting [текст]|rent [offer <цена>|off|take <цена>|stop]|unclaim [all confirm]|add|remove <ник> [доступ|контейнеры|полный]|deposit|withdraw (переход к /bal)|balance|sell|sellback [confirm]|budget [1–30]|buy [x z]|transfer|help]"
  claimadmin:
    description: "Администрирование приватов: выдача, лимиты, перенос, рента, статистика"
    usage: "/claimadmin [reload|bypass|delete|deleteall|info|give|transfer|limit|chunks|transferall|purge|rent|stats|recovery]"
    permission: chrdkclaims.admin
permissions:
  chrdkclaims.use:
    description: "Пользоваться приватами и командой /claim"
    default: true
  chrdkclaims.menu:
    description: "Открывать меню приватов /claim menu"
    default: true
  chrdkclaims.teleport:
    description: "Телепортироваться к своим приватам и лотам на продажу"
    default: true
  chrdkclaims.notices:
    description: "Настраивать уведомления о входе и выходе из приватов"
    default: true
  chrdkclaims.admin:
    description: "Администрирование приватов"
    default: op
