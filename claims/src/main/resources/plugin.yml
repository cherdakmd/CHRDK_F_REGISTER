name: CHRDK_Claims
version: ${version}
main: ru.cherdakmd.chrdkclaims.ClaimsPlugin
api-version: '26.3'
description: "Приваты чанков за алмазы: покупка территории, рента из казны, налог на сделки, продажа и передача игрокам, полная защита территории (аддон CHRDK_Core)"
author: cherdakmd
depend: [CHRDK_Core]
commands:
  claim:
    description: "Приваты: купить чанк, члены, казна, продажа, карта"
    aliases: [parcel, land]
    usage: "/claim [info [x z]|map|list [стр]|forsale [стр]|borders|unclaim|add|remove <ник> [доступ|контейнеры|полный]|deposit|withdraw|balance|sell|sellback|buy [x z]|transfer|help]"
  claimadmin:
    description: "Администрирование приватов: выдача, лимиты, перенос, рента, статистика"
    usage: "/claimadmin [reload|bypass|delete|deleteall|info|give|transfer|limit|transferall|purge|rent|stats]"
    permission: chrdkclaims.admin
permissions:
  chrdkclaims.use:
    description: "Пользоваться приватами и командой /claim"
    default: true
  chrdkclaims.admin:
    description: "Администрирование приватов"
    default: op
