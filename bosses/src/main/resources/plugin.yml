name: CHRDK_Bosses
version: ${version}
main: ru.cherdakmd.chrdkbosses.BossesPlugin
api-version: '26.3'
description: Боссы с фазами и способностями, зоны опасности и награда по вкладу.
authors: [cherdakmd]
website: https://github.com/cherdakmd/CHRDK_F_REGISTER
depend: [CHRDK_Core]
softdepend: [PlaceholderAPI]
commands:
  boss:
    description: Меню боссов, список, подробности и зоны опасности.
    usage: /boss [menu|list|info|zones|where]
    aliases: [bosses, bossy, bosss]
    permission: chrdkbosses.use
  bossadmin:
    description: Управление боссами и зонами.
    usage: /bossadmin <spawn|stop|reload|info|cooldown|history|reset>
    aliases: [bossesadmin]
    permission: chrdkbosses.admin
permissions:
  chrdkbosses.use:
    description: Смотреть боссов, зоны и своё место в бою.
    default: true
  chrdkbosses.admin:
    description: Спавн и остановка боссов, сброс пауз, перезагрузка.
    default: op
