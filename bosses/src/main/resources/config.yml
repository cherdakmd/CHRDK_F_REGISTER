# CHRDK_Bosses — боссы с фазами и зоны опасности (1.4.162).
#
# Босс — это событие в мире, а не вечный моб: он появляется на арене, живёт
# ограниченное время и уходит, если его не убили. У босса есть фазы: на пороге
# здоровья он меняет поведение и получает новые способности, поэтому бой не
# сводится к «бей, пока не упадёт».
#
# Награда делится по нанесённому урону: опыт получают все, кто бил, трофей —
# лучший боец. Монет боссы не выдают: экономика охоты и магазинов остаётся
# отдельной, а босс не открывает второй источник валюты.
#
# Зона опасности — место, где мир сопротивляется: эффекты и капель урона в
# обмене на надбавку к опыту за мобов, убитых внутри. Урон зоны никогда не
# отнимает последние два сердца: убивать должен бой, а не география.

general:
  # Полностью выключает боссов и зоны. Команды и меню останутся, но всё будет
  # отвечать «выключено».
  enabled: true
  # Язык сообщений: ru или en (файл messages.yml).
  locale: ru
  # Выпускать боссов по таймеру самому. По умолчанию выключено: координаты
  # арен зависят от карты, и ставить босса в чужую базу нельзя. Включите после
  # того, как проверите точки в секции bosses.
  auto-spawn: false
  # Полоса здоровья босса над хотбаром для игроков на арене.
  bossbar: true
  # Короткие сообщения над хотбаром: вход в зону и надбавка к опыту.
  actionbar: true
  # Как часто проверять, не пора ли выпустить босса (10..300 секунд).
  check-seconds: 60

# Боссы. id (ключ секции) используется в командах и плейсхолдерах.
#
# health — в единицах здоровья: 1 сердце = 2. 240 = 120 сердец.
# arena.y: -1 — поставить на верхний блок площадки (авто).
# spawn-interval-seconds — пауза после смерти/ухода (300..86400).
# duration-seconds — сколько босс живёт без убийства (120..7200).
# min-players — сколько игроков онлайн нужно для авто-спавна.
# auto — может ли босс появляться по таймеру (ручной спавн работает всегда).
#
# phases: at — порог здоровья в процентах, с которого начинается фаза.
# Первая фаза всегда 100. abilities — что босс делает в этой фазе:
#   STOMP     — урон amount и отброс в радиусе radius;
#   SUMMON    — призвать amount штук entity вокруг (не больше 8);
#   FIRE_NOVA — поджечь игроков в радиусе на duration-seconds;
#   PULL      — притянуть игроков в радиусе к себе;
#   LEAP      — прыгнуть к случайному игроку;
#   CURSE     — наложить effect уровня amplifier на duration-seconds;
#   HEAL      — вылечиться на amount процентов от максимума (1..50);
#   ENRAGE    — ускориться на duration-seconds.
# cooldown-seconds — пауза между повторами способности (3..600).
bosses:
  stone_warden:
    name: "Каменный страж"
    description: "Древний голем, который сторожит карьер и не любит гостей."
    entity: IRON_GOLEM
    health: 240
    icon: IRON_BLOCK
    glow: true
    arena:
      world: "world"
      x: 0
      y: -1
      z: 0
      radius: 16
    phases:
      - at: 100
        name: "Стража"
        damage-multiplier: 1.0
        speed-multiplier: 1.0
        abilities:
          - { type: STOMP, cooldown-seconds: 14, radius: 6, amount: 5 }
          - { type: SUMMON, cooldown-seconds: 45, radius: 4, amount: 2, entity: SILVERFISH }
      - at: 60
        name: "Гнев камня"
        damage-multiplier: 1.25
        speed-multiplier: 1.1
        abilities:
          - { type: STOMP, cooldown-seconds: 10, radius: 7, amount: 7 }
          - { type: PULL, cooldown-seconds: 30, radius: 8 }
      - at: 30
        name: "Обвал"
        damage-multiplier: 1.5
        speed-multiplier: 1.25
        abilities:
          - { type: STOMP, cooldown-seconds: 8, radius: 8, amount: 9 }
          - { type: CURSE, cooldown-seconds: 40, radius: 8, effect: slowness, amplifier: 1, duration-seconds: 6 }
          - { type: ENRAGE, cooldown-seconds: 60, duration-seconds: 10, amplifier: 1 }
    reward:
      xp: 400
      items:
        IRON_INGOT: 12
        GOLDEN_APPLE: 2
      trophy: IRON_BLOCK
      trophy-name: "Сердце стража"
    spawn-interval-seconds: 3600
    duration-seconds: 1800
    min-players: 2
    auto: true

  frost_revenant:
    name: "Морозный выходец"
