# Зоны опасности. Радиус — от точки по горизонтали, высота проверяется тоже.
# danger: level 1..5 — только для текста и иконок; damage-per-second 0..4;
# xp-bonus-percent 0..50 — надбавка к опыту за мобов, убитых внутри зоны.
# effects: type — ид эффекта (slowness, weakness, poison, blindness...),
# duration-seconds 1..60, interval — как часто обновлять.
zones:
  ash_fields:
    name: "Пепельные поля"
    description: "Земля здесь ещё тёплая: воздух режет горло, зато добыча щедра."
    enabled: true
    world: "world"
    x: 400
    y: 70
    z: 0
    radius: 40
    level: 2
    icon: MAGMA_BLOCK
    damage-per-second: 1.0
    xp-bonus-percent: 15
    effect-interval-seconds: 6
    effects:
      - { type: slowness, amplifier: 0, duration-seconds: 8 }
      - { type: weakness, amplifier: 0, duration-seconds: 8 }

  frozen_hollow:
    name: "Мёрзлая низина"
    description: "Ветер здесь не стихает: тянет силу из ног и рук."
